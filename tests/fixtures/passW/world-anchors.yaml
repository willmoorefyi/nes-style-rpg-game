     ref: [84, -92], target: [152, 46]}
# the 31 pairs (anchor names); `distanceExempt` pairs skip the fit and the distance band, never the bearing band
pairs:
  - [cornelia, pravoka]
  - [cornelia, matoya]
  - [cornelia, temple]
  - [pravoka, elfheim]
  - [elfheim, marsh]
  - [elfheim, keep]
  - [keep, dwarf]
  - [dwarf, melmond]
  - [melmond, earth_cave]
  - [melmond, giant]
  - [melmond, sarda]
  - [melmond, crescent]
  - [cornelia, crescent]
  - [crescent, volcano]
  - [crescent, ice]
  - [ice, desert]
  - [desert, citadel]
  - [citadel, bahamut]
  - [desert, onrac]
  - [onrac, waterfall]
  - [onrac, caravan]
  - [caravan, gaia]
  - [gaia, mirage]
  - [gaia, lufenia]
  - [lufenia, melmond]
  - [cornelia, onrac]
  - [cornelia, gaia]
  - [cornelia, marsh]
  - [cornelia, sarda]
  - [cornelia, citadel]
  - [pravoka, matoya]
distanceExempt:
  - [cornelia, temple]
# 6.1 step 6: path length in the hop's mode (verifier BFS, docks included) <= factor x the Euclidean distance;
# airship hops are straight lines and have no detour check
detours:
  - {pair: [cornelia, pravoka], mode: walking, factor: 2.5, via: "over the bridge"}
  - {pair: [cornelia, matoya], mode: walking, factor: 2.5}
  - {pair: [pravoka, elfheim], mode: ship+walking, factor: 2.5, via: "dock to dock"}
  - {pair: [pravoka, dwarf], mode: ship+walking, factor: 2.5}
  - {pair: [elfheim, keep], mode: walking, factor: 2.5}
  - {pair: [elfheim, marsh], mode: walking, factor: 2.5}
  - {pair: [dwarf, melmond], mode: ship+walking, factor: 4.5, via: "through the canal (it lies north of the dwarves)"}
  - {pair: [melmond, earth_cave], mode: walking, factor: 2.5}
  - {pair: [melmond, giant], mode: walking, factor: 2.5}
  - {pair: [melmond, sarda], mode: walking, factor: 3.0, via: "through the tunnel"}
  - {pair: [melmond, crescent], mode: ship+walking, factor: 2.5}
  - {pair: [crescent, volcano], mode: canoe+walking, factor: 2.5}
  - {pair: [crescent, ice], mode: canoe+walking, factor: 2.5}
  - {pair: [ice, desert], mode: walking, factor: 2.5}
  - {pair: [onrac, waterfall], mode: canoe+walking, factor: 2.5}
