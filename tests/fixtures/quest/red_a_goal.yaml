# RED for (a): the ogre's cutscene gives a pebble, not the orb, so S1 never completes and the goal is unreachable.
extends: clean
items:
  - {id: key1, type: key}
  - {id: orb, type: key, consumed: true}
  - {id: pebble, type: key}
cutscenes:
  - id: boss_won
    steps:
      - {type: give_item, item: pebble}
      - {type: warp, map: town, entrance: gate}
  - id: crystal_scene
    steps:
      - {type: set_flag, flag: CAVE_LIT}
