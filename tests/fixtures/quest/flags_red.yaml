# RED for questFlags.test.ts: a map of tranche ELF-T (stage S6 owns elfx-*) sets its own flags (CHEST_ELF_T_1,
# ELF_T_DOOR, its milestone PRINCE_AWAKE) and three it must not: another tranche's local flag (CHEST_ERT_T_GOLD), its
# region's flag without its sub-letter (ELF_D_BELL) and another tranche's milestone (CANAL_OPEN).
extends: clean
items:
  - {id: key1, type: key}
  - {id: orb, type: key, consumed: true}
  - {id: gem, type: key}
cutscenes:
  - id: boss_won
    steps:
      - {type: give_item, item: orb}
      - {type: warp, map: town, entrance: gate}
  - id: crystal_scene
    steps:
      - {type: set_flag, flag: CAVE_LIT}
  - id: elf_wakes
    steps:
      - {type: set_flag, flag: PRINCE_AWAKE}
      - {type: set_flag, flag: CANAL_OPEN}
quest:
  stages:
    - {id: S6, tranche: ELF-T, after: [S1], grants: {flags: [PRINCE_AWAKE]}, maps: [elfx-*]}
    - {id: S7, tranche: ERT-O, after: [S6], grants: {flags: [CANAL_OPEN]}, maps: [dwarfx]}
maps:
  - id: elfx-hall
    grid:
      - "#######"
      - "#.....#"
      - "#######"
    npcs:
      - {id: chest_a, x: 1, y: 1, sprite: chest, chestItem: gem, chestFlag: CHEST_ELF_T_1}
      - {id: chest_b, x: 2, y: 1, sprite: chest, chestItem: gem, chestFlag: CHEST_ERT_T_GOLD}
      - {id: door, x: 3, y: 1, dialog: ["Open."], giftItem: gem, giftFlag: ELF_T_DOOR}
      - {id: bell, x: 4, y: 1, dialog: ["Ring."], giftItem: gem, giftFlag: ELF_D_BELL}
      - {id: prince, x: 5, y: 1, cutscene: {id: elf_wakes, onceFlag: PRINCE_AWAKE}}
