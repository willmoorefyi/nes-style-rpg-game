# The mini world (W1-I): the whole pass-W chain S0-S30 built in miniature on one 48x32 world map and nine rooms, so
# every gate-table row of docs/WORLD_PLAN.md 6.3 (GT-1 to GT-37, GT-5b) has its element (questMutate.test.ts). The
# coastlines are topology only. Stand-ins for field rules not in fieldRules.ts yet (W1-A, W1-B):
# - a patch's crossing (north_bridge, canal) is also gated by its flag on the patch cells; "forced on" clears both;
# - a river or lake crossing is a Bridge cell gated by the `canoe` item (the canoe cut finds it);
# - flight is a transition from the desert gated by AIRSHIP_RAISED (no airship spawn: it could not land), so the
#   stages after S17 need AIRSHIP_RAISED where quest.yaml says `airship`.
# Regions: P the peninsula (start, Garland, the King, the princess, the builder), the bridge (stub gate (9,3), gap
# (10-11,3)), M the mainland (Pravoka, Matoya), the Aldi sea (docks a1_pravoka, elf_port, ert_dwarf), S Elfland and
# the dwarves, the isthmus x 31 (cuts W_west .. W_east, the canal at y 11), the ocean (docks ert_melmond,
# fir_crescent, fir_ice), CS Crescent's shore and its ring x 37 (cut crescent_ring, river (37,5)), FL the volcano
# and desert lands (the flight stand-in at (42,1)), NW2's ice pocket east of FL's rock x 43 (cut ice_neck (43,5)):
# the Frost Shore x 44-45 rows 5-6 by the dock fir_ice (45,7), the R-ice stand-in (45,4) (cut ice_ring (44,4)), the
# Rime Hollow x 44-46 rows 1-3 with the Ice Cavern (44,2), L Melmond's plain, the western range y 17 (cut western_range, the giant's tunnel (42,17)), Sarda's
# coast, the lich's room, N the north (Citadel, Bahamut, Onrac, the waterfall, the caravan, the fairy, the shrine,
# Lufenia, the Mirage, the sky castle, the time gate) and the temple of the past.
