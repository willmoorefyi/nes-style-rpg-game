npcs:
- id: sage_elder
  sprite: sage_star
  x: 13
  y: 8
  dialog:
  - condition: CANOE_GIVEN
    text: ['Elder: The canoe is yours, and the rivers with it. One runs to the fire mountain, one to the frozen hollow.', Go to both in whatever
        order your courage likes. The crystals do not wait on our patience.]
  - condition: EARTH_CRYSTAL_LIT
    text: ['Elder: The earth breathes again. We felt it here, through the stones, the night its crystal woke.', 'Then you are the ones the Circle
        has waited for. Hear us, and take what we have kept.']
  - text: ['Elder: You have come far to stand in our ring. The Circle sees you, and is glad.', 'But the earth is rotting under the western lands,
        and while it rots we can give you nothing.', Heal the earth first. Light its crystal. Then come back across the causeway.]
  cutscene:
    id: fir_sages_canoe
    requiredFlags: [EARTH_CRYSTAL_LIT]
    onceFlag: CANOE_GIVEN
  tint: '#e8e0c8'
- id: sage_lukahn
  sprite: scholar
  x: 13
  y: 14
  dialog: ['Lukahn: Long ago I wrote down what the stones told me, and the town has copied it ever since.', '"When the four lights fail, four
      will walk out of the dark carrying them. Each fallen light they lift will show them the next."', '"And when the last is lifted, the road
      will turn back on itself, and at its end the one who broke the lights will be waiting."', 'I never knew what the last part meant. Looking
      at you, I begin to.']
  tint: '#f0f0ff'
- id: sage_west
  sprite: old_man
  x: 9
  y: 9
  dialog:
  - condition: CANOE_GIVEN
    text: [The canoe floats lighter than it did when I last paddled it. Perhaps it knows where it is going.]
  - condition: EARTH_CRYSTAL_LIT
    text: ['The earth is mended. Now the fire under the south swells, as if the land had to breathe out somewhere.']
  - text: ['Put your hand on the stone behind me. Cold, isn''t it? It used to be warm. The earth is dying under it.']
  tint: '#c0b8a8'
- id: sage_east
  sprite: sage_star
  x: 17
  y: 9
  dialog:
  - condition: CANOE_GIVEN
    text: ['Rivers are roads that move. You have the canoe; keep to the middle, where the current is honest.']
  - condition: EARTH_CRYSTAL_LIT
    text: ['Fire and frost lie side by side south of the ring. One crystal sleeps in each, I think. Or one in neither.']
  - text: [Under the western plain something drinks the earth's strength. We feel it as a chill in the stones.]
- id: sage_moss
  sprite: sage_earth
  x: 8
  y: 11
  dialog:
  - condition: CANOE_GIVEN
    text: [I have nothing to add. The elder said it all. That doesn't happen often; enjoy it.]
  - condition: EARTH_CRYSTAL_LIT
    text: [Last night the urn's water steamed on one side and froze on the other. We did not sleep.]
  - text: [Moss is dying on the stones. In three hundred years it has never died. I count the patches each dawn.]
- id: sage_tide
  sprite: pilgrim
  x: 18
  y: 11
  dialog:
  - condition: CANOE_GIVEN
    text: ['When you reach the fire, remember: it was here before the world, and it will be here after. Respect it.']
  - condition: EARTH_CRYSTAL_LIT
    text: [The lake has warmed by a finger's breadth along its south shore. The fire mountain is stirring.]
  - text: ['The lake''s level falls each year, and the fish grow fewer. The land beneath is thirsty and sick.']
- id: sage_reed
  sprite: sage_earth
  x: 10
  y: 13
  dialog:
  - condition: CANOE_GIVEN
    text: ['The frozen hollow keeps something that was never meant to be found. Go armed, and go warm.']
  - condition: EARTH_CRYSTAL_LIT
    text: [Frost has a voice in the south. It is not a kind one. Something in the ice is watching.]
  - text: [The roots of the trees on the western shore have gone soft as rope. The earth has a fever.]
- id: sage_ash
  sprite: sage_flame
  x: 16
  y: 13
  dialog:
  - condition: CANOE_GIVEN
    text: ['We have given away our oldest boat. I feel lighter. Sages should own less, I always said.']
  - condition: EARTH_CRYSTAL_LIT
    text: ['The fire crystal sleeps in the mountain''s heart, under a tyrant made of ash. So the stones say.']
  - text: [The earth crystal is dimming. The stones are certain. We are only less certain how long it has.]
- id: sage_north
  sprite: healer
  x: 4
  y: 10
  dialog:
  - condition: CANOE_GIVEN
    text: [From the islet's edge I watched you push off. The ripples are still reaching the far shore.]
  - condition: EARTH_CRYSTAL_LIT
    text: ['Look south over the water: smoke by day, a pale light by night. Two shrines are waking.']
  - text: [I watch the western sky. Each evening it is greyer. The earth's colour is leaving it.]
  tint: '#d8d0e8'
- id: sage_south
  sprite: old_man
  x: 22
  y: 10
  dialog:
  - condition: CANOE_GIVEN
    text: [A sage gave me a canoe when I was young. It took me here. Let it take you farther.]
  - condition: EARTH_CRYSTAL_LIT
    text: [The volcano's grumble crosses the lake at night. The stones hum back at it.]
  - text: ['The earth has been sick before. Never this sick. The stones remember everything, and they are afraid.']
- id: sage_shore
  sprite: pilgrim
  x: 6
  y: 16
  dialog:
  - condition: CANOE_GIVEN
    text: ['Rivers branch. If one way is shut, paddle another. That is the whole of my wisdom, and it took sixty years.']
  - condition: EARTH_CRYSTAL_LIT
    text: ['Pilgrims cross the causeway every day now, asking about fire. I tell them to ask you.']
  - text: ['We fast for the earth, and the earth goes on rotting. Still, it is something to do with our hands.']
  tint: '#b0a090'
- id: sage_lantern
  sprite: sage_flame
  x: 20
  y: 16
  dialog:
  - condition: CANOE_GIVEN
    text: ['Paddle well. Come back and tell us what the rivers said. We love a story, here.']
  - condition: EARTH_CRYSTAL_LIT
    text: ['I lit a lamp for the earth when its crystal shone. Now I light two more: one red, one white.']
  - text: ['I keep the lamp at the islet''s edge for the earth. While it burns, we have not given up.']
  tint: '#c8b490'
