npcs:
- id: melmond_quay_warden
  sprite: guard
  x: 41
  y: 21
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: ['Ships put in every day now. Every one of them leaves low in the water, full of our grain.']
  - text: ['Welcome to Melmond, if you can stand the smell of it. That''s the soil, souring.', You're the first ship through the dwarves' cut.
        I hope you didn't sail all this way to buy food.]
- id: melmond_cavern_hint
  sprite: old_man
  x: 24
  y: 19
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: ['I went down to the Cavern of Earth''s mouth this morning. Warm air breathes out of it now, like a sleeper''s.', 'Whatever you did
        down there, the ground felt it all the way up here.']
  - condition: VAMPIRE_DEFEATED
    text: ['The thing in the Cavern of Earth is dead, they say, but the cold under the badlands is still there.', 'Go deeper. Below the crypt,
        past a seal of stone, there is a frozen hall nobody has come back from.']
  - text: ['The rot comes up out of the Cavern of Earth, south-west of here, in the grey badlands.', 'Something lives in its upper halls that
        drinks the warmth out of the ground. A vampire, the old folk say.']
- id: melmond_giant_hint
  sprite: farmer
  x: 9
  y: 21
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: [My cousin came over the range through the giant's tunnel last week. Brought turnips. Turnips!]
  - text: ['West of town the range is a wall, with one tunnel through it. A giant lies across the tunnel and won''t budge.', 'He grumbles about
        his stomach. I''d say a giant that size only eats stones, and only the red, shiny kind.']
- id: melmond_well_keeper
  sprite: villager_f
  x: 22
  y: 17
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: ['Hear that? Water, down the well again! Sweet, too. I''d almost forgotten the taste.']
  - text: ['Thirty fathoms of rope, and the bucket comes up full of grey sand. My grandfather dug this well.', 'He said it would never run dry.
        He also said the moon was a turnip, mind.']
- id: melmond_oak_child
  sprite: villager
  x: 21
  y: 21
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: ['The old oak has a leaf! One leaf, right at the top. I''m going to name it.']
  - text: ['Mum says the big tree on the green isn''t dead, only sleeping. It''s been sleeping a long time.']
  wander: true
- id: melmond_fieldhand
  sprite: farmer
  x: 13
  y: 29
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: [Green from fence to fence! I planted on Monday and by Thursday I could hide in it.]
  - text: ['Plough it, seed it, water it, and the shoots come up grey and fall over.', It isn't the weather. Something is pulling the life out
        from under the roots.]
- id: melmond_vine_dresser
  sprite: villager_f
  x: 10
  y: 7
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: [The vines are budding along every row. We'll press wine this autumn after all!]
  - text: ['These vines are older than the town. Their bark peels off in your hand now, like paper.']
- id: melmond_shore_fisher
  sprite: villager
  x: 40
  y: 9
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: ['The fish are back in the shallows, fat and silly. The sea knew before we did.']
  - text: [Nets come up empty all along this shore. Even the fish keep away from the land now.]
- id: melmond_carter
  sprite: burgher
  x: 34
  y: 20
  dialog:
  - condition: VAMPIRE_DEFEATED
    text: ['A wraith of a thing came screaming out of the badlands two nights back, and none since.', 'If you did that, I''ll carry your packs
        to the Cavern for free. Well, for half.']
  - text: ['I haul grain to the quay. There''s no grain, so I haul my own empty cart up and down.', Nobody takes the badlands road after dark.
        Things walk there that cast no shadow.]
  wander: true
- id: melmond_mill_lad
  sprite: thief
  x: 36
  y: 11
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: [The sails turned on their own this morning! Master Hobb says the earth's breathing again.]
  - text: [The windmill leans a hand's width further every year. The ground under it is going soft., Master Hobb won't let me grind. There's nothing
        to grind anyway.]
- id: melmond_stall_widow
  sprite: vendor_f
  x: 26
  y: 23
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: ['Fresh beans, fresh greens, fresh everything! I''m opening the stall again tomorrow.']
  - text: [I sold vegetables from this stall for thirty years. Now I sell the stall's shade. Nobody's buying.]
- id: melmond_doctor_pupil
  sprite: mage
  x: 24
  y: 13
  dialog:
  - condition: LUFENIAN_LEARNED
    text: [The Doctor reads the sky-folk's script as easily as you read a menu now., 'He says their village is on a mesa in the far north-east,
        reachable only by air.']
  - text: ['I sweep for Doctor Unne, the scholar on the hill lane. He studies tongues nobody speaks.', 'He lost his best work at sea, years ago.
        A stone tablet. He still dreams about it.']
- id: melmond_pond_elder
  sprite: old_man
  x: 28
  y: 32
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: [The pond is filling from the springs again. Give it a season and my grandson can swim in it.]
  - text: [When I was a boy this millpond turned the wheel all summer. Look at it. A puddle with ideas.]
- id: melmond_dwarf_trader
  sprite: burgher
  x: 42
  y: 18
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: ['Melmond grain for dwarf iron, a fair trade at last. Nerrick sends his regards.']
  - text: [Nerrick's canal brought me here with a hold full of picks and spades., Turns out nobody needs a spade for soil that's turned to dust.]
  tint: '#b08860'
- id: melmond_wayfarer
  sprite: monk
  x: 27
  y: 30
  dialog:
  - condition: EARTH_CRYSTAL_LIT
    text: [I felt the crystal wake from the road. It was like a held breath let go., 'The earth is whole. Three more lights to go, they say: fire,
        water and wind.']
  - text: [I came to pray at the earth shrine in the badlands. Its roof has fallen in. Roots have split the altar., A crystal of earth sleeps
        somewhere under this land. I would like to see it wake before I die.]
  wander: true
inspect:
- x: 14
  y: 11
  text: ['The farmstead is shut up, its shutters nailed. A note is tacked to the wall, its ink run by the rain.', '"Gone to my sister''s on the
      isthmus. The ground here won''t take a seed. Feed the cat if you see her. - Orla"']
- x: 27
  y: 18
  text: ['The sign reads: "MELMOND. Harbour road east to the quay."', 'Under it, in fresh chalk: "Hill lane north: the Doctor, the mill. Field
      lane south: the Inn, the healer."']
