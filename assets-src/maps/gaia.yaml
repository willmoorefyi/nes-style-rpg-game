npcs:
- id: gaia_gate_warden
  sprite: guard
  x: 16
  y: 43
  dialog:
  - condition: FAIRY_FREED
    text: ['Feel that on your face? That''s the bowl breathing again. I''d stopped noticing I was holding my own breath.']
  - text: ['You came by air? Nobody walks up here. The passes are worse than the drop.', Welcome to Gaia. Take the switchbacks slowly; the town's
        built one terrace on the next.]
- id: gaia_water_hauler
  sprite: villager_f
  x: 35
  y: 40
  dialog:
  - condition: FAIRY_FREED
    text: [The spring is running down the court's channel again. I'm leaving this bucket on the rope for the gorge spirits.]
  - text: ['Three hundred feet of rope, and the bucket comes up half spilled. That''s our water now.', 'When the spring at the top still ran,
        I never once carried water. I didn''t know how heavy it was.']
- id: gaia_dune_trader
  sprite: burgher
  x: 39
  y: 43
  dialog:
  - condition: FAIRY_FREED
    text: ['The fairy''s free? Good. I traded with that caravan for years and never once thought to look in their bottles.']
  - condition: item:fairy_bottle
    text: ['A bottle from the dune caravan, and it''s warm? Don''t open it down here! Take it up to the spring at the top.']
  - text: ['The dune caravan came over our pass a year back. Rugs, salt, glassware. They camp in the western desert now.', 'Since they left, the
        sails haven''t turned once. I''ve wondered what they carried off besides our coin.']
- id: gaia_mirage_hint
  sprite: old_man
  x: 30
  y: 43
  dialog:
  - condition: FAIRY_FREED
    text: ['With the wind back I can hear the Mirage Tower again on still nights, humming like a glass rubbed with a wet finger.']
  - text: ['South-west of the bowl, out in the sands, stands the Mirage Tower. Some days you see it, some days you don''t.', Its door has no handle
        and no lock. They say the sky-folk ring it open with a chime.]
- id: gaia_child
  sprite: villager
  x: 22
  y: 43
  dialog:
  - condition: FAIRY_FREED
    text: [My paper kite flew! It flew right up past the mill terrace and got stuck on the spinner's roof!]
  - text: [I made a paper kite. Grandad says I'll have to run very fast for it to fly. I ran and ran.]
  wander: true
- id: gaia_sail_mender
  sprite: farmer
  x: 4
  y: 40
  dialog:
  - condition: FAIRY_FREED
    text: ['The sails are full and pulling! I''ve three tears to mend already. Wonderful, wonderful tears.']
  - text: [I mend the canvas on the sails. A sail that never turns never tears., 'I''ve mended every sail in Gaia twice over, just to keep my
        hands busy.']
- id: gaia_mill_lad
  sprite: thief
  x: 14
  y: 25
  dialog:
  - condition: FAIRY_FREED
    text: ['The millstones are grinding! Master Brann sang. I didn''t know he could. He can''t, actually.']
  - text: [I'm the windmiller's lad. I oil the gears every morning in case today's the day., It's never the day.]
- id: gaia_ropewalker
  sprite: burgher
  x: 24
  y: 32
  dialog:
  - condition: FAIRY_FREED
    text: ['The footbridges hum when the gusts come through. I''ll be out on them all week, tightening knots.']
  - text: ['Every bridge in town is my family''s rope. Hemp from the lowlands, plaited on the walk behind our house.', 'Mind, they sway less now
        there''s no wind. That''s the only good thing about it.']
- id: gaia_lufenia_hint
  sprite: mage
  x: 33
  y: 32
  dialog:
  - condition: FAIRY_FREED
    text: [Now the wind is home I mean to fly south to Lufenia myself. If I can find someone who reads their tongue.]
  - text: ['Due south, on a mesa ringed with cliffs, live the sky-folk of Lufenia. Their speech is like nothing on earth.', 'A doctor in Melmond
        spent his life on it, I''m told. Without him their words are only music.']
- id: gaia_herb_picker
  sprite: villager_f
  x: 45
  y: 27
  dialog:
  - condition: FAIRY_FREED
    text: [The mountain thyme is waking up on the ledges. The wind carries its seed; it was waiting too.]
  - text: ['I pick herbs on the ledges. Without the wind the seed doesn''t travel, and the ledges are going bare.']
- id: gaia_old_soldier
  sprite: knight
  x: 6
  y: 32
  dialog:
  - condition: FAIRY_FREED
    text: [I stood watch on that stair forty years. Never once did it feel as good as this breeze.]
  - text: [Nothing has come up the stairs to fight in a year. Not even weather., A town that can't hear the wind can't hear what's coming. I keep
        my sword by the bed.]
- id: gaia_shepherd_boy
  sprite: villager
  x: 44
  y: 16
  dialog:
  - condition: FAIRY_FREED
    text: [Father's taking the flock up to the high grass again tomorrow. The wind keeps the flies off them.]
  - text: [The fold's empty. Father drove the sheep down to the lower bowl; the grass up here went brown with no rain.]
- id: gaia_honey_seller
  sprite: vendor_f
  x: 21
  y: 21
  dialog:
  - condition: FAIRY_FREED
    text: [The bees are out over the whole bowl! I'll have honey to sell by the next moon.]
  - text: ['The bees won''t fly in dead air. They sit in the hives and hum, sulking.', 'I''d sell you honey, but they''ve eaten most of it themselves.']
- id: gaia_weaver_girl
  sprite: villager_f
  x: 14
  y: 15
  dialog:
  - condition: FAIRY_FREED
    text: [We hang the wool out to dry in the wind again. It used to take a morning; then it took a week.]
  - text: ['The spinner''s teaching me the long wheel. You need a dry wind for good wool, she says.']
- id: gaia_wind_watcher
  sprite: monk
  x: 38
  y: 21
  dialog:
  - condition: FAIRY_FREED
    text: [The fairy's breath is back in the bowl. It goes in at the spring and out over every sail. Listen.]
  - condition: item:fairy_bottle
    text: ['That bottle hums. Can you feel it? Something inside it knows where it is. Climb to the spring.']
  - text: ['We say the wind is the breath of the spring''s fairy. A little winged thing, no bigger than your thumb.', 'When the spring went dry,
        she was gone. Nobody saw her go.']
- id: gaia_spring_pilgrim
  sprite: monk
  x: 21
  y: 7
  dialog:
  - condition: FAIRY_FREED
    text: [Water in the channel and wind in the court. I'll go home and tell them the mountain is well.]
  - text: [I walked up from the lowlands to pray at the spring. I found a dry channel and a cold grotto., I'll pray anyway. It's a long walk back.]
  tint: '#c8d8f0'
- id: gaia_vane_keeper
  sprite: old_man
  x: 19
  y: 5
  dialog:
  - condition: FAIRY_FREED
    text: ['The wooden arrow spins on its spindle into the wind, then swings back the other way, as if it cannot decide where to point first.',
      Ha! Look at it go. I've oiled that arrow every day for a year for this.]
  - text: ['I keep the weather vane. Every morning I oil it, and every morning it points the same way.', The spring is through the grotto behind
        the court. The warden sits by it day and night.]
- id: gaia_court_child
  sprite: villager
  x: 30
  y: 4
  dialog:
  - condition: FAIRY_FREED
    text: [The channel's full of water! I put a leaf boat in at the top and it got all the way to the end!]
  - text: [I sail leaf boats down the dry channel. You have to push them. It isn't the same.]
  wander: true
- id: gaia_mill_watcher
  sprite: farmer
  x: 41
  y: 7
  dialog:
  - condition: FAIRY_FREED
    text: [Both high mills are turning! From here you can see every sail in the bowl going round.]
  - text: [From this ledge you can see every windmill in Gaia. I count them each evening. They're all still there. All still.]
inspect:
- x: 19
  y: 43
  text: ['The sign reads: "GAIA. Four terraces, one way up. Mind the bridges in a gust."', 'Below, in older paint: "Gate terrace: the Inn, items,
      arms, armour. Mill terrace: the magic shops. Loom terrace: the healer. Top: the spring."']
- x: 20
  y: 5
  text:
  - condition: FAIRY_FREED
    text: ['The wooden arrow spins on its spindle into the wind, then swings back the other way, as if it cannot decide where to point first.']
  - text: ['A tall post topped with a wooden arrow: the town''s weather vane. Its spindle is clean and oiled.', 'It points at nothing in particular,
        and it has pointed there for a year.']
- x: 30
  y: 18
  text: ['The tall house is shuttered. A slate hangs on the door, chalked in a careful hand:', '"Wind-reader''s house. No wind to read. Gone down
      the mountain to look for it. - Ilse"']
- x: 35
  y: 39
  text: ['A stone well-head on the lip of the gorge. Its windlass rope runs down to the torrent far below, and a dripping bucket hangs from it.',
    'Somebody has scratched a tally on the post: one stroke for every bucket hauled since the spring went dry.']
