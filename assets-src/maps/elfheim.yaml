npcs:
- id: elfheim_gate_warden
  sprite: guard
  x: 23
  y: 45
  dialog:
  - condition: PRINCE_AWAKE
    text: [The prince walks his own halls again. Elfheim's gate is yours for as long as the hedges grow.]
  - text: ['A ship out of the Aldi, and humans on it. The hedge let you in, so I will too. Welcome to Elfheim.', 'Keep to the lanes. The hedges
        are older than the houses, and they remember who broke a branch.']
  tint: '#cfe8c2'
- id: elfheim_gate_sentry
  sprite: guard
  x: 28
  y: 44
  dialog:
  - condition: PRINCE_AWAKE
    text: [I let Astos through this gate once. I've had a long sleep's worth of nights to be sorry for it.]
  - text: [Nothing on four legs gets through the ring. The hedge closes on wolves like a fist., 'On two legs it''s harder to tell. Astos came
        in through this very gate, smiling.']
  tint: '#cfe8c2'
- id: elfheim_rise_guard_w
  sprite: guard
  x: 22
  y: 14
  dialog:
  - condition: PRINCE_AWAKE
    text: ['Did you hear him laugh this morning? The whole rise heard it. I''d forgotten the sound.']
  - condition: item:herb
    text: ['You smell of something bitter and green. Is that a witch''s herb? Go up to the prince, quickly!']
  - text: [The castle is open to guests. The prince's chamber is up the stair to the west of the hall., 'Speak softly in there. He has slept since
        the dark elf''s visit, and nothing we do will wake him.']
  tint: '#cfe8c2'
- id: elfheim_rise_guard_e
  sprite: guard
  x: 29
  y: 14
  dialog:
  - condition: PRINCE_AWAKE
    text: ['The prince has given you his key? Then the vault under the hall is yours to open. He trusts you.']
  - text: ['Below the hall lies our vault. Its door was sealed with the prince''s own key, and the key sleeps with him.']
  tint: '#cfe8c2'
- id: elfheim_matoya_hint
  sprite: old_man
  x: 21
  y: 27
  dialog:
  - condition: PRINCE_AWAKE
    text: ['Matoya''s herb, under his nose, and up he sat. Every healer in Elfheim is sulking. I am delighted.']
  - condition: item:crystal_eye
    text: ['That glassy thing in your pack... is that Matoya''s crystal eye? Take it back to her cave, north of Cornelia. A grateful witch might
        part with her herb.']
  - text: [Our healers have tried every leaf in the wood on the prince. A dark elf's sleep doesn't care for leaves., 'Only one herb would do it,
        and only one witch grows it: Matoya, in her cave north of Cornelia''s bridge.', But they say Matoya is blind and cross these days. Somebody
        stole her crystal eye.]
  tint: '#e4e9d6'
- id: elfheim_marsh_hint
  sprite: white_mage
  x: 31
  y: 28
  dialog:
  - condition: PRINCE_AWAKE
    text: ['The fens smell of peat and rot, but I''ll go back to the Marsh Cave''s edge to gather moss now. It''s safe enough with the prince
        awake.']
  - condition: ASTOS_DEFEATED
    text: ['The king at the keep was Astos all along? The same dark elf who cursed our prince. No wonder he wanted that crown so badly.']
  - condition: MARSH_GUARD_DEFEATED
    text: ['You brought a crown out of the Marsh Cave? Then the king of the Western Keep is waiting for you, up the long arm to the north-west.']
  - text: ['The king of the Western Keep, up the long arm to the north-west, lost his crown in the fens.', 'Whatever took it crawled into the
        Marsh Cave, south-west of here past the dead trees. Few who go in climb out again. Fewer climb out with anything.']
  tint: '#cfe8c2'
- id: elfheim_gardener
  sprite: farmer
  x: 3
  y: 18
  dialog:
  - condition: PRINCE_AWAKE
    text: ['My garden''s gone to seed while I wasn''t looking. Funny how nothing matters, and then everything does.']
  - text: ['Sleepwort, wake-me-not, goldenroot... I grew them all for the prince. Not one did anything.']
  tint: '#cfe8c2'
- id: elfheim_hedge_trimmer
  sprite: monk
  x: 46
  y: 15
  dialog:
  - condition: PRINCE_AWAKE
    text: [The hedges stopped growing the moment the prince woke. Gave my shears a rest at last.]
  - text: ['Every day the ring grows a hand thicker. The hedges are grieving, the old ones say. I just trim them.']
  tint: '#cfe8c2'
  wander: true
- id: elfheim_stream_child
  sprite: villager
  x: 13
  y: 25
  dialog:
  - condition: PRINCE_AWAKE
    text: [The prince came down to the stream and raced me! He didn't let me win. I think he's better now.]
  - text: [I float bark boats from the spring to the pond. The prince used to race me. He always let me win.]
  tint: '#cfe8c2'
  wander: true
- id: elfheim_fisher
  sprite: villager
  x: 39
  y: 39
  dialog:
  - text: [There's one old pike in this pond that's never been caught. I'm in no hurry. Elves live a long time.]
  tint: '#e4e9d6'
- id: elfheim_weaver
  sprite: villager_f
  x: 35
  y: 25
  dialog:
  - condition: PRINCE_AWAKE
    text: ['He asked for his riding cloak the moment he woke. I''m on the third start, and this one I''ll finish.']
  - text: ['I wove the prince''s coverlet in a single night after the curse. Green and silver, his colours.', When he wakes I'll weave him a cloak
        for riding. I've started it twice.]
  tint: '#cfe8c2'
  wander: true
- id: elfheim_lamplighter
  sprite: villager
  x: 28
  y: 41
  dialog:
  - text: [I light the street lamps at dusk and put them out at dawn. Some nights I forget which is which.]
  tint: '#cfe8c2'
  wander: true
- id: elfheim_trader
  sprite: merchant
  x: 23
  y: 39
  dialog:
  - condition: PRINCE_AWAKE
    text: ['The elves are buying again now their prince is up. I''ll be rich, or at least less poor.']
  - text: ['I''m from Pravoka, would you believe? Came over on a fishing boat before the pirates shut the harbour.', 'Elfheim''s mithril is the
        best on the Aldi. The elves won''t haggle, though. It takes the fun out of it.']
- id: elfheim_elder
  sprite: old_man
  x: 11
  y: 39
  dialog:
  - condition: PRINCE_AWAKE
    text: ['The harps are back in the hall. I''m too old to dance, but I tap my stick.']
  - text: ['When I was young, the castle''s lamps burned all night and the hall rang with harps.', 'Since the curse they burn all night still,
        but no one plays. We keep a light so he can find his way back.']
  tint: '#e4e9d6'
- id: elfheim_dwarf_peddler
  sprite: master
  x: 44
  y: 35
  dialog:
  - condition: PRINCE_AWAKE
    text: ['Your prince keeps a cask of blasting powder in his vault, they tell me. Nerrick would trade his beard for it. Take it to the dwarves''
        hall, north across the strait.']
  - text: ['Don''t stare, lad, dwarves travel too. I''m here for elven rope. The foreman back home has a mad plan.', Nerrick wants to blast a
        canal through the isthmus and let the sea through. All he lacks is the powder.]
  tint: '#d2b48c'
- id: elfheim_scout
