# Temple of Fiends (original layout). legend: W wall top, F wall face, - floor, % rubble
# TF-1: no void (x) cells: the temple sits in solid rock (W, the dark wall top), so no flat black shows in its
# corners or beside the entry corridor. Void and wall top block alike, so the collision is unchanged.
id: temple-of-fiends
name: Temple of Fiends
kits: [temple, castle, interior, town]
music: dungeon
# TF-2: the wall tops and the floor came from one cracked slab texture and read as one surface. The wall tops are a
# darkened copy and the walkable floor (and its rubble) a lightened one; the faces are lifted too, so they stay apart
# from the brighter floor. `contrast` keeps wall tops and floor apart (map_checks.py).
materials:
  floor_stone: {from: temple_floor, shade: 1.3}
  rubble: {from: temple_rubble, shade: 1.3}
  in_wall_top: {from: temple_wall_top, shade: 0.35}
  in_wall_face: {from: temple_wall_face, shade: 1.2}
contrast: [{a: W, b: "-", min: 0.2}]
ground: |
  WWWWWWWWWWWWWWWWWWWWWWWW
  WWWWWWWWWWWWWWWWWWWWWWWW
  WWWFFFFFFFFFFFFFFFFFFWWW
  WWW------------------WWW
