inspect:
- x: 168
  y: 151
  text: [Here lies Erdrick.]
- x: 169
  y: 151
  text: [Here lies Erdrick.]
- x: 146
  y: 165
  text: [The pier runs out into the bay. No ship calls at Cornelia while pirates rule the seas.]
- x: 180
  y: 140
  text: ['Travellers have stacked stones on this saddle, one for each safe crossing.', 'Someone has scratched an arrow on the topmost stone. It
      points down the slope, east, to the harbour.']
- x: 122
  y: 190
  text: ['A waystone, split by frost. Its runes point north along the moor.', 'Under the moss: "The king''s road. Let none who serve a false crown
      pass."']
- x: 75
  y: 182
  text: ['A shrine to the earth, its roof fallen in. Grey roots have split the altar stone.', 'Someone has scratched a line under the carved crystal:
      "It will wake again."']
- x: 76
  y: 182
  text: ['A shrine to the earth, its roof fallen in. Grey roots have split the altar stone.', 'Someone has scratched a line under the carved crystal:
      "It will wake again."']
- x: 152
  y: 69
  text: ['A hut of driftwood and whale rib, lashed shut with tarred rope. A slate hangs on the door:', '"Gone fishing for the big one. If the
      dragons ask, I still owe them nothing. - Oddo"']
- x: 70
  y: 44
  text: ['A cairn of pale river stones. Scratched into the top one: a small boat nosing up a line of water that falls from a cliff.']
- x: 50
  y: 57
  text: ['Words burned into the post: SWEET WATER HERE. THE CAMP TRADES FAIR. NO CREDIT.']
- x: 225
  y: 52
  text: [A cairn of flat stones in the throat of the pass., The prayer ribbons tied to it hang dead straight. Nothing has stirred them in a long
      while.]
- x: 188
  y: 70
  text: ['Half a bronze dial juts from the sand, its numbers worn smooth.', 'Its shadow-pin points at the tower, though the sun is behind you.']
npcs:
- id: chest_tomb
  sprite: chest
  x: 171
  y: 151
  chestItem: iron_shield
  chestFlag: CHEST_ERDRICK_TOMB
  dialog: [You found an Iron Shield!]
- id: bridge_worker_w
  sprite: farmer
  x: 146
  y: 141
  showIf: INTRO_COMPLETE
  dialog:
  - condition: BRIDGE_BUILT
    text: [Every stone in that span came off the old quarry road. It'll outlast the lot of us., North of the strait the land climbs. Keep to the
        open ground and you'll see the coast soon enough.]
  - condition: item:lute
    text: [The King's own warriors! Then the span's waiting on nobody. Stand back a moment.]
  - text: ['Nearly there. But the princess sent word from the castle: she has a gift for you before you cross.', 'Go and see her, and the span
        will be ready when you''re back.']
  requiredItem: lute
  cutscene: {id: a1_bridge_finished, requiredFlag: INTRO_COMPLETE, onceFlag: BRIDGE_BUILT}
- id: bridge_worker_e
  sprite: villager
  x: 149
  y: 141
  showIf: INTRO_COMPLETE
  dialog:
  - condition: BRIDGE_BUILT
    text: [We worked by lantern three nights running. The King wanted you on your way., 'They say a harbour town lies east of the mainland''s
        hills, under a lighthouse.']
  - text: ['The King''s orders: the north bridge before the harvest. Mind the scaffolding!']
- id: fir_hull_hatch
  sprite: chest
  tint: '#9a7a52'
  x: 194
  y: 206
  requiredItem: levistone
  hideIf: AIRSHIP_RAISED
  cutscene: {id: fir_airship_rises, onceFlag: AIRSHIP_RAISED}
  dialog:
  - condition: item:levistone
    text: [The levistone hums against the hatch. Sand begins to trickle upward around the buried keel...]
  - text: ['A brass hatch juts from the dune. Scratched beside the latch: "She sleeps till the floatstone wakes her."', 'There is a socket beside
        it, shaped for a stone that weighs less than nothing.']
vehicles:
- {type: ship, x: 186, y: 146, requiredFlag: BIKKE_DEFEATED}
