npcs:
- id: castle_door_guard_w
  sprite: guard
  x: 29
  y: 19
  dialog: [The castle of Cornelia. The King receives travellers in the throne room upstairs.]
- id: castle_door_guard_e
  sprite: guard
  x: 31
  y: 19
  dialog:
  - condition: PRINCESS_RESCUED
    text: [The princess is home! The whole kingdom rejoices.]
  - text: ['Since Garland took the princess, the King has not slept.']
- id: inner_gate_guard
  sprite: guard
  x: 28
  y: 33
  dialog: [Beyond this gate are the castle gardens. Mind the moat!]
- id: guard
  sprite: guard
  x: 33
  y: 50
  wander: true
  dialog:
  - condition: PRINCESS_RESCUED
    text: [The princess is safe., 'Thank you, Warriors of Light!']
  - text: [The princess has been kidnapped!, 'Garland took her to the Temple of Fiends, north-west of here.']
- id: south_gate_guard
  sprite: guard
  x: 28
  y: 66
  dialog: ['Welcome to Cornelia, the royal city.', The castle stands at the top of the high street.]
- id: old_man
  sprite: old_man
  x: 26
  y: 44
  wander: true
  dialog:
  - condition: BRIDGE_BUILT
    text: [The bridge to the north is complete., Seek the four crystals across the land.]
  - text: [The four crystals have gone dark., Only the Warriors of Light can restore them.]
- id: villager
  sprite: villager
  x: 34
  y: 45
  wander: true
  dialog: [Buy spells early. They make a huge difference in the first dungeon!]
- id: market_vendor_w
  sprite: merchant
  x: 24
  y: 41
  dialog: [Fresh apples from the royal orchard!, '...Sorry, these are not for adventurers.']
- id: market_vendor_e
  sprite: merchant
  x: 37
  y: 41
  dialog: ['Bread and cheese, the finest in Cornelia!']
- id: townswoman
  sprite: villager_f
  x: 44
  y: 49
  wander: true
  dialog: [The river runs right through the city., My grandmother says it once flooded the market square!]
- id: gardener
  sprite: villager
  x: 5
  y: 23
  wander: true
  dialog: [I tend the royal orchard., The princess loved to read under these trees.]
- id: mage_student
  sprite: mage
  x: 9
  y: 55
  wander: true
  dialog: ['White magic heals, black magic harms.', A wise party carries both.]
- id: fisher
  sprite: old_man
  x: 38
  y: 62
  dialog: [The fish bite best where the river bends.]
- id: east_gate_guard
  sprite: guard
  x: 56
  y: 46
