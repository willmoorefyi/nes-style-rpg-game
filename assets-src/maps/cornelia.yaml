npcs:
- id: castle_door_guard_w
  sprite: guard
  x: 28
  y: 22
  dialog: [The castle of Cornelia. The King receives travellers in the throne room upstairs.]
- id: castle_door_guard_e
  sprite: guard
  x: 32
  y: 22
  dialog:
  - condition: PRINCESS_RESCUED
    text: [Her Highness rode in through this very gate., I will tell my grandchildren I stood guard that day!]
  - text: ['I keep watch on the castle gate, day and night.', No one has crossed this bridge unseen since Garland rode out.]
- id: inner_gate_guard
  sprite: guard
  x: 28
  y: 33
  dialog: [Beyond this gate are the castle gardens. Mind the moat!]
- id: guard
  sprite: villager
  x: 33
  y: 50
  wander: true
  dialog:
  - condition: PRINCESS_RESCUED
    text: [The princess is safe., 'Thank you, Warriors of Light!']
  - text: [The princess has been kidnapped!, 'Garland took her to the Temple of Fiends, north-west of here.']
- id: cornelia_dancer
  sprite: dancer
  x: 35
  y: 50
  dialog:
  - condition: PRINCESS_RESCUED
    text: ['Arylon: The princess is home! I''ll dance till my shoes wear through.']
  - text: ['Arylon: I''m Arylon, and I dance. The square needs a little joy while the princess is gone.']
- id: south_gate_guard
  sprite: guard
  x: 28
  y: 66
  dialog: ['Welcome to Cornelia, the royal city.', The castle stands at the top of the high street.]
- id: old_man
  sprite: old_man
  x: 26
  y: 44
  wander: true
  dialog:
  - condition: INTRO_COMPLETE
    text: [They say the King's builders are mending the bridge to the north., Seek the four crystals across the land.]
  - text: [The four crystals have gone dark., Only the Warriors of Light can restore them.]
- id: villager
  sprite: burgher
  x: 34
  y: 45
  wander: true
  dialog:
  - condition: GARLAND_DEFEATED
    text: [You beat Garland! Keep buying spells early. Whatever waits past the bridge won't be easier.]
  - text: [Buy spells early. Garland is no easy foe!]
- id: market_vendor_w
  sprite: vendor_f
  x: 24
  y: 41
  dialog:
  - condition: INTRO_COMPLETE
    text: ['Apples from the royal orchard! Half price today, for the princess is home.', 'They say the King has builders out at the north bridge.
        Trade will come back, you''ll see.']
  - condition: PRINCESS_RESCUED
    text: ['Apples from the royal orchard! Half price today, for the princess is home.', 'Now if only someone would mend the north bridge. Trade
        would come back, you''ll see.']
  - text: ['Apples from the royal orchard! Dear this week, I''m sorry to say.', 'The carters won''t use the roads. Wolves, right up to the walls,
        and in daylight too.', 'Since the princess was taken, nobody has the heart to haggle.']
- id: market_vendor_e
  sprite: farmer
  x: 37
  y: 41
  dialog:
  - condition: PRINCESS_RESCUED
    text: ['Bread and cheese, the finest in Cornelia! Folk are buying again, now Her Highness is safe.', Once the north bridge is mended I'll
        take my cheeses across. They fetch double over there.]
  - text: ['Bread and cheese, the finest in Cornelia!', 'With the north bridge broken, nothing comes in from across the water. Flour costs a fortune.',
      'And with the princess gone, who has an appetite?']
- id: townswoman
  sprite: young_woman
  x: 44
  y: 49
  wander: true
  dialog: [The river runs right through the city., My grandmother says it once flooded the market square!]
- id: gardener
  sprite: townsman
  x: 5
  y: 23
  wander: true
  dialog: [I tend the royal orchard., The princess loved to read under these trees.]
- id: mage_student
  sprite: mage
  x: 9
  y: 55
  wander: true
  dialog: ['White magic heals, black magic harms.', A wise party carries both.]
- id: fisher
  sprite: sailor
  x: 38
  y: 64
  dialog: [The fish bite best where the river bends.]
- id: east_gate_guard
  sprite: guard
  x: 56
  y: 46
  dialog: [The east road crosses the river and ends at an old tomb below the mountains.]
- id: postern_guard
  sprite: guard
  x: 8
  y: 3
  dialog: [This postern lets the gardeners out to the fields., Watch for wolves past the orchard.]
- id: garden_maid
  sprite: villager_f
  x: 42
  y: 25
  wander: true
  dialog:
  - condition: PRINCESS_RESCUED
    text: [Her Highness is home at last! I will cut her the first roses.]
  - text: [I tend the roses for Her Highness., I hope she comes home before they fade.]
inspect:
- x: 32
  y: 66
  text: ['The sign reads: "CORNELIA, the royal city."', 'North, up the high street: the Inn (first lane on the left), then the Market Square,
      and the Castle at the top.', 'Magic Quarter: from the Market Square, west along the road, then south down the lane.']
