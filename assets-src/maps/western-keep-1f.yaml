  sprite: burgher
  tint: '#b7a46a'
  x: 15
  y: 19
  dialog:
  - condition: ASTOS_DEFEATED
    text: [The man on the throne was never our king. I bowed to him for a season. I won't forget it.]
  - condition: MARSH_GUARD_DEFEATED
    text: [The king rode south-west to the fens and came back laughing at nothing., 'He lost his crown there, he says. He will see no one who
        comes without it.']
