npcs:
- id: onrac_gate_watch
  sprite: guard
  x: 25
  y: 3
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [The wind has turned warm off the sea. First time in my life I've stood this watch without gloves.]
  - text: ['Onrac. Come in, warm yourselves. You didn''t walk here, I''d wager. Nobody walks here.', Mind the quay steps. They ice over at noon
        and stay iced till spring.]
- id: onrac_waterfall_hint
  sprite: old_man
  x: 21
  y: 19
  dialog:
  - condition: CUBE_GIVEN
    text: [You've been behind the waterfall! And came back with a box that hums. I'd not keep it near my bed.]
  - text: [North of town the river climbs into the peaks to a great waterfall. There is a cave behind it., 'No path reaches it. Only a canoe,
        paddled up the gorge against the current, gets you there.', My grandmother saw a man of iron standing in that cave. She never went back
        to ask his name.]
- id: onrac_caravan_hint
  sprite: burgher
  x: 8
  y: 24
  dialog:
  - condition: FAIRY_FREED
    text: ['The caravan''s bottle, set free at last? Then the trader sold you the best bargain of his life.']
  - text: ['Traders camp in the dunes far to the west. A caravan, with tents round a rock in the sand.', Their master keeps a bottle he won't
        name. Something glows in it. He wants a fortune for it., Pay it. A caravan man only asks a fortune for a thing that's worth two.]
- id: onrac_fairy_lore
  sprite: monk
  x: 20
  y: 22
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [The sea gave back its crystal's light. I felt the tide go out of my chest like a held breath.]
  - condition: item:oxyale
    text: [You carry the fairy's air. Every drowned soul under the harbour will feel you coming down.]
  - text: ['There are fairies who live in springs and breathe a water that is also air. Oxyale, it''s called.', One of them was caught in a bottle
        long ago and carried off. Gaia's spring has been dry since.]
- id: onrac_bell_child
  sprite: villager
  x: 25
  y: 21
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [The bell rang by itself last night! Three times! Grandad says that means the city is sleeping.]
  - text: [Grandad rings the sea bell at dusk. He says it's so the drowned people know what time it is.]
  wander: true
- id: onrac_rack_wife
  sprite: villager_f
  x: 9
  y: 17
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: ['The cod are running again, thick as porridge. These racks won''t hold the half of them.']
  - text: ['Cod on the racks, a frost on the cod. The wind dries it, the cold keeps it. Onrac in a sentence.', The shoals have thinned every year
        since the sea went wrong. We dry what we can.]
  wander: true
- id: onrac_tar_boiler
  sprite: farmer
  x: 14
  y: 4
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [The pitch flows in this warm wind. I'll tar every hull in the harbour by the week's end.]
  - text: ['Pine tar, boiled thick. Every plank in this town drinks a pot of it a year, or the sea drinks it.', Don't lean on the pot. I've had
        two apprentices and both were careless.]
- id: onrac_net_lad
  sprite: thief
  x: 18
  y: 32
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [My net came up so heavy I thought I'd caught the sunken city. It was only fish! Hundreds!]
  - text: [We fish the shallows only. Past the sea-stacks the water turns black and the nets come back torn.]
  wander: true
- id: onrac_harbour_master
  sprite: guard
  x: 33
  y: 32
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [Ships are putting in from every coast. I've had to learn how to say 'no berth' in four tongues.]
  - text: [Harbour's half empty. The deep water out past the stacks drags ships down and nothing comes back., Your airship is the only safe vessel
        I've logged all year. I've written it under 'birds'.]
- id: onrac_ice_trader
  sprite: merchant
  x: 8
  y: 32
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [No ice to cut this week! The harbour's soft as soup. I may have to sell fish like everybody else.]
  - text: ['I cut ice off the north pools and sell it south. Down there they put it in drinks. Can you imagine?']
- id: onrac_widow
  sprite: villager_f
  x: 21
  y: 33
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [The sea is quiet now. I think he can rest. I think I can too.]
  - text: [My husband went out past the stacks after the bell's twin. It's said a second bell lies down there., That was nine winters ago. I come
        here at the turn of the tide. You'd think I'd stop.]
- id: onrac_mermaid_tale
  sprite: villager_f
  x: 30
  y: 41
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [The singing under the pier has changed. It sounds like they're laughing now.]
  - text: [On still nights you can hear singing under this pier. My mother called them the sea-folk., 'She said they live in the deep shrine''s
        upper halls and know every way through it. Ask them, if you ever get down there.']
- id: onrac_fisher
  sprite: farmer
  x: 13
  y: 39
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [Look at the water! Clear down to the weed. I can see my own lost anchor.]
  - text: ['The cold out here gets into your teeth. Bite on something, it helps. I bite my pipe.']
- id: onrac_lookout
  sprite: old_man
  x: 42
  y: 4
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [From up here the sound was always grey. Now it's blue as a jay. I'd forgotten it could be.]
  - text: [I watch the sea for the town. Mostly I watch weather. Lately the weather watches back., There's a dark patch out in the sound that
        never ices over. That's where the city went down.]
- id: onrac_shipwright
  sprite: master
  x: 36
  y: 24
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [She came back with barnacles on her barnacles. Best dive a hull of mine ever made.]
  - condition: item:oxyale
    text: ['That''s oxyale in your lungs, I can smell it, like snow and lightning. Board her! The gangway''s yours.']
  - text: [The iron fish in the basin is mine. Twelve years riveting. She'll go down to the drowned shrine under the harbour., 'But her crew must
        breathe down there, and no lungs can. Not without oxyale, the fairy''s air.']
- id: onrac_dock_hand
  sprite: farmer
  x: 45
  y: 22
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: [We're scraping her hull now she's back. The weed on her is a colour I've never seen.]
  - text: ['Pump, caulk, pump, caulk. The master keeps the sea-gate shut till she''s ready to dive.']
  wander: true
- id: onrac_sailor
  sprite: burgher
  x: 45
  y: 30
  dialog:
  - condition: WATER_CRYSTAL_LIT
    text: ['My ship''s fitting out for the south. With the sea calm, I''ll be home before the ice.']
  - text: ['Stranded. My captain won''t sail past the stacks, and I won''t swim. So here I sit, eating cod.']
inspect:
- x: 22
  y: 4
  text: ['The sign reads: "ONRAC. Mind the ice on the quay steps."', 'Under it, scratched with a knife: "Bell Road south to the harbour. Tar Lane
      east to the dry dock."']
- x: 27
  y: 19
  text: [A green-black bell hangs in the tower's open arch. Its bronze is crusted with barnacles that no one has scraped., 'Letters run round
      its lip in a script nobody here can read. It came up in a net, the year the city sank.']
keyItemGates:
- x: 38
  y: 27
  requiredItem: oxyale
  permanent: false
  message:
  - condition: item:fairy_bottle
    text: ['The shipwright calls from the walkway: "That bottle! Something inside it is knocking to get out."', '"Take it to Gaia''s spring and
        open it there. Bring me back the air of the deep, and she sails."']
  - text: ['The shipwright bars the gangway: "Not without air for the deep, friend. My hull holds, your lungs won''t."', '"They say the fairies
        of Gaia''s spring breathe a living air, oxyale. Bring me that and we dive."']
