# EF2 (pass EF2, docs/ENEMY_FEEDBACK_PLAN.md EF-F as revised after the EF debriefs, user approval 2026-11-24): the
# prompts, every variation and the picks of monster_br2.py. One render per pose: the idle by SD 3.5 text-to-image (no
# old-sprite guide), then attack / hurt / kneel by SD 3.5 image-to-image from the new idle's figure warped about its
# feet (`warp`: rot +leans toward the heroes, sx / sy, shear, dx / dy px). At most 5 variations per pose. `pick` names
# the variation of each pose that the cut uses. The user's references are mood only and never sent. Prompts are short
# and positive only (EF lesson: "sprite sheet" / "not chibi" in a prompt draw exactly that).
style: >-
  Pixel art enemy for a 16-bit JRPG battle screen, dark fantasy, crisp black outline, cel shading lit from the top
  left, one single full-body figure in side view facing right, standing on the ground, centred.
background: Flat solid magenta background.
style2: >-
  Pixel art enemy for a 16-bit JRPG battle screen, dark fantasy, crisp black outline, cel shading lit from the top
  left, one single full-body figure in side view facing right, centred, the whole figure inside the picture.
style3: >-
  Pixel art enemy for a 16-bit JRPG battle screen, crisp black outline, cel shading lit from the top left, one single
  full-body human figure in side view facing right, centred, the whole figure inside the picture.
style4: >-
  Pixel art enemy sprite for a 16-bit JRPG battle screen: a bold readable silhouette, sturdy heroic proportions about
  six heads tall with big clear hands and face, strong light-dark contrast and a few large clear shapes in rich
  colours, crisp black outline, cel shading lit from the top left; one single full-body figure in side view facing
  right, filling the picture height.
background2: The background is flat solid pure magenta (#FF00FF) everywhere, empty, nothing else.
negative: >-
  chibi, cute, cartoon, comic, big head, smiling, sprite sheet, several figures, text, watermark, frame, border,
  floor, cast shadow, scenery, blurry, photo, 3d render, purple, violet, pink clothing
negative2: >-
  chibi, cute, cartoon, comic, big head, smiling, sprite sheet, several figures, text, watermark, frame, border,
  floor, ground, cast shadow, scenery, gradient, blurry, photo, 3d render
