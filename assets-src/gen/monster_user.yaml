# EF-H (docs/ENEMY_FEEDBACK_PLAN.md EF-H): user-rendered sprite sheets, imported by gen/monster_user.py. Each recipe
# names the tracked render (`file`, relative to assets-src/gen/, with its sha256), the four poses in row order (always
# idle, attack, hurt, kneel), `flip` (mirror the row first when the render faces left), the size band, and the
# provenance: the tool the user rendered it in, the date, the author and the sha256 of the reference pack it was
# made from (`refs`; `unknown` when it predates the pack route).
dark_wizard:
  file: user_art/dark_wizard/sheet_2026-11-25.png
  sha256: d9c750afc1872133733ae156e06dace91659b4a9fc9f3af67d35cbd76523072a
  poses: [idle, attack, hurt, kneel]
  flip: false
  size: large
  tool: ChatGPT (interactive)
  rendered: "2026-11-25"
  author: user
  refs: unknown
  refs_note: >-
    the user rendered it from the EF4 / EF5 images they had (bedrock4/ and bedrock5/ under ~/temp/ff-game/ef/), before
    the reference-pack route existed, so no idle_master / poses_reference sha256 is recorded
pirate:
  file: user_art/pirate/sheet_2026-11-25.png
  sha256: 4a45f35c8c3e80314dedeed186a5f0337c844f4e4852b58064fc14af7b17335a
  poses: [idle, attack, hurt, kneel]
  flip: false
  size: large
  tool: ChatGPT (interactive)
  rendered: "2026-11-25"
  author: user
  refs:
    pack: ~/temp/ff-game/ef/user_packs/pirate/
    idle_master_sha256: 26ce4a3321f6bdabab7a0651cd2d7b925e43ff78d8ce142f9440c12fc6131c98
    poses_reference_sha256: c47b4a8ac4591a3eac650cd36d00698ebacc2c6523520451e3f3d490f90ce47a
    prompt_sha256: 4bd7c3fe759c5de129dcfe56d3e9f20fd639e9e8f197de8e26cf7d540723f90a
  refs_note: >-
    the user's 80 px render (~/temp/pirate_sprite_sheet_80px.png, 468x96, idle 80 px, feet row 90), approved by the
    user with its size: the idle is below the large band, so s = 1.0 and the height is reported, never refused
  # monster_user_palette: the face's skin, the cutlass, the hat's pale gold and the grey beard keep their own slots
  # within the 16 (the plain house palette pulled the skin onto the gold trim, the blade onto two greys, the beard onto
  # the navy); boxes are sheet px [x0, y0, x1, y1), per pose (the faces, the blades)
  reserve:
    - name: skin
      select: skin
      slots: 1
      max_err: 20
      boxes: [[51, 20, 63, 30], [168, 19, 181, 31], [278, 21, 289, 31], [412, 45, 426, 57]]
    - name: steel
      select: steel
      slots: 3
      max_err: 20
      boxes: [[40, 18, 86, 56], [186, 18, 232, 40], [276, 16, 326, 56], [424, 48, 442, 92]]
    - name: gold
      select: gold
      slots: 1
      max_err: 20
    - name: beard
      select: grey
      slots: 1
      max_err: 16
      boxes: [[51, 20, 63, 30], [168, 19, 181, 31], [278, 21, 289, 31], [412, 45, 426, 57]]
