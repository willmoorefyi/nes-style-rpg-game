# Character prompts for the AI sprite pipeline (assets-src/gen/generate.py).
# `prompt` describes costume only; `battle_gear` / `field_gear` describe what is held in each context.
# The shared style, poses and negatives come from spec.py.
# `seeds` are tried in order; put the approved seed first so rebuilds are identical.
# `locked: true` = approved and frozen (only cached requests allowed). `sheets: [field]` = NPC, no battle sheet.
# `prompt_rev` (per sheet) pins the rollout prompt wording an approved sheet was made with (default: latest, 2).
# `face` overrides the default face rule (masked or faceless characters).
# `robed: true` draws the pose guide with a long robe/dress instead of separate legs.
# Rollout characters (everyone except the knight) also send the knight's approved sheet as a house-style
# reference (spec.HOUSE_REFS). Their `identity_ref` (own approved battle sheet) only exists after battle approval.
# Rollout order and checkpoints: docs/ART_ROLLOUT.md.
- id: knight
  locked: true
  prompt: >-
    young knight with short blond hair, polished silver plate armor with gold trim, blue tabard and blue cape,
    round steel helmet with an open face and a tall white horsehair crest on top,
    brown leather gloves and boots
  battle_gear: holding a longsword in one hand
  field_gear: empty hands, arms at the sides
  seeds: [1234]
  # Approved sheets sent to Gemini (8x nearest) as identity references for field sheets. Single-direction sheets
  # use only the first entry; the full 3x3 field sheet uses all of them.
  identity_ref:
    - assets-src/gen/approved/knight/battle.png
    - assets-src/gen/approved/knight/field_down.png

# ───────── base classes ─────────
- id: warrior
  prompt_rev: {battle: 1}   # battle approved before the face / no-mannequin rules; keeps its cache key
  prompt: >-
    young warrior with spiky dark brown hair, red tunic under a steel breastplate and pauldrons with grey trim,
    dark trousers, brown leather boots and gloves, round steel shield on the back
  battle_gear: holding a broad sword in one hand
  field_gear: empty hands, arms at the sides
  seeds: [1234]
  identity_ref: [assets-src/gen/approved/warrior/battle.png]
- id: thief
  prompt: >-
    nimble young thief with messy blond hair and a red bandana, green sleeveless tunic with a brown leather belt
    and pouches, dark trousers, soft brown boots
  battle_gear: holding a short dagger in one hand
  field_gear: empty hands, arms at the sides
  seeds: [1234]
  identity_ref: [assets-src/gen/approved/thief/battle.png]
- id: monk
  prompt: >-
    tan-skinned martial artist with short black hair and a white headband, orange sleeveless gi with a white
    belt, orange wide trousers, simple brown sandals, bare muscular arms with cloth hand wraps
  battle_gear: bare fists raised, no weapon
  field_gear: empty hands, arms at the sides
  seeds: [1234]
  identity_ref: [assets-src/gen/approved/monk/battle.png]
- id: white_mage
  robed: true
  prompt: >-
    gentle white mage in a long white hooded robe with red triangle trim along the hem and sleeves,
    short brown hair visible under the hood, brown shoes
  battle_gear: holding a wooden staff with a gold top in one hand
  field_gear: empty hands, arms at the sides
  seeds: [1234]
  identity_ref: [assets-src/gen/approved/white_mage/battle.png]
- id: black_mage
  robed: true
  face: >-
    this character has NO visible face: only darkness under the hat brim with two glowing yellow eyes, in every
    cell including hurt and knocked down. Never draw skin, a nose or a mouth.
  prompt: >-
    small black mage in a long dark blue robe with gold trim, tall pointed wide-brimmed dark blue hat,
    the face hidden in shadow with only two glowing yellow eyes, brown shoes
  battle_gear: holding a short gold rod in one hand
  field_gear: empty hands, arms at the sides
  seeds: [1234]
  identity_ref: [assets-src/gen/approved/black_mage/battle.png]
- id: red_mage
  prompt: >-
    dashing red mage with blond hair, long red coat with white trim over white trousers, wide-brimmed red hat
    with a long white feather, brown boots
  battle_gear: holding a thin rapier in one hand
  field_gear: empty hands, arms at the sides
  seeds: [1234]
  identity_ref: [assets-src/gen/approved/red_mage/battle.png]
