- id: crazy_horse
  # "Crazy Horse" (004): pass V redesign (docs/REDESIGN_PLAN.md 3.1): a gaunt otherworldly horse from another plane,
  # lesser than a nightmare (the piebald wild horse is archived as crazy_horse_v1, docs/RETIRED_SPRITES.md)
  size: large
  body: quadruped
  motion: >-
    Use a clear diagonal line of action through the whole body but keep the hind hooves on the ground and the body low
    (no leap, no rearing up): thrust the head toward the heroes with the neck bent so the head stays well inside its
    own cell; the smoke mane and tail move with the motion, kept close to the body.
  prompt: >-
    a gaunt, otherworldly horse from another plane, seen from the side: an ash-grey hide stretched tight over a bony
    frame, a ridge of short bone spines along the neck and the back, deep cracks across the flanks and neck glowing a
    sickly yellow-green from inside, a long narrow skull-like head with two burning yellow-green eyes, a mane and tail
    of drifting black smoke edged with small yellow-green embers (drawn as part of the body, with dark outlines), thin
    long legs ending in dark iron hooves; the whole horse, tail tip to muzzle, sits in the middle of its own cell with
    empty space on both sides; palette of ash grey, charcoal, bone white and sickly yellow-green
  attack: >-
    a lunging strike toward the heroes: the head thrust forward and down with the long jaw open, the forelegs lifted
    only a little and striking forward, the hind hooves on the ground, the smoke mane streaming back close to the neck;
    no rearing up; the whole horse well inside the middle cell
  hurt: >-
    knocked back, all four hooves on the ground, the head tossed up a little, the glowing cracks flaring brighter, one
    foreleg buckling; no taller than its idle height
  face: the narrow skull-like head with two burning yellow-green eyes, each a clear bright spot, is readable
  extra_negative: >-
    a rider, a saddle, a bridle, white or brown patches, a horn, wings, blue fire, violet, purple, pink, magenta,
    rearing up
  seeds: [1234]
  retired_as: crazy_horse_v2
