- id: chaos
  # "Chaos" (128), the final boss: an ORIGINAL primordial titan (plan 4.2, binding D13); it must not reproduce any
  # published Chaos art
  size: boss
  per_pose: true
  design_ref: false
  body: biped
  # the biped line ("strong diagonal ..., twist the torso") turned him to a side or three-quarter profile and dropped
  # arms in R56-R58 (the multi-arm pause); only the poses not yet approved get this line (orchestrator, 2026-11-15)
  motion:
    cast: &chaos_motion >-
      Keep the frontal view of Image 3, chest and face toward the viewer, and a symmetric, composed posture, never
      turned to a side or three-quarter profile; all four arms stay separately visible and apart from the body, the
      upper arm and the lower arm on the left side of the image and the upper arm and the lower arm on the right side
      of the image, none hidden behind the body, merged or crossed; the movement is in the arms, the wings and the head,
      and the wings move with the motion.
    hurt: *chaos_motion
    attack_raise: *chaos_motion
  prompt: >-
    Chaos, a colossal primordial titan of cracked black obsidian standing on two thick legs, a massive muscular
    humanoid body; exactly four arms, two on each side: on the left side of the image an upper arm and a lower arm, on
    the right side of the image an upper arm and a lower arm, each ending in a huge clawed stone hand; great tattered
    wings of shadow-flame (smoke-black membranes edged with purple flame) half raised behind the shoulders, their tips
    well below the top of the grey box; a heavy horned crown of obsidian growing from the head with two great curved
    horns; a stern face of cracked stone with two burning white eyes; glowing seams run through the cracks of the body
    in four colours: frost cyan, ember orange, abyss teal and storm white; palette of obsidian black, deep purple and
    the four seam colours
  action_prompt: >-
    Chaos, exactly as in Image 3: the same colossal titan of cracked black obsidian on two thick legs, exactly four
    arms (two on each side) with huge clawed stone hands, the same tattered wings of shadow-flame, the horned obsidian
    crown, the cracked stone face with two burning white eyes, and the glowing seams in frost cyan, ember orange, abyss
    teal and storm white
  attack: >-
    a crushing double blow, seen in the same front view as Image 3 (chest and face toward the viewer, never in side
    profile), the body leaning toward the heroes on the right over a planted front leg, both wings flaring. Exactly
    four arms, all four clearly visible and separate: on the right side of the image, the upper arm and the lower arm
    both swing down in front of the body, their two fists smashing down together low toward the heroes; on the left
    side of the image, the upper arm is thrown back up behind the shoulder and the lower arm is braced at the hip, both
    clearly visible beside the body; at the same pixel size as in Image 3
  cast: >-
    channelling, a mirror-symmetric pose clearly different from Image 3, every hand in a new place: the two upper
