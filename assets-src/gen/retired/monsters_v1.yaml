    the left side and one on the right side; a glowing sphere of swirling energy in the four seam colours (cyan,
    orange, teal and white) floats in front of his chest, touching his body; the wings lifted higher and spread wider
    than in Image 3, the legs planted wider apart, the seams blazing; exactly four arms, all four clearly visible and
    apart from the body; the raised hands and wing tips well below the top of the grey box, at the same pixel size as
    in Image 3
  hurt: >-
    struck, a pose clearly different from Image 3, every hand in a new place: the chest arched back and the head
    thrown back with the face tilted up, the glowing seams flaring brighter; on the left side of the image the upper
    arm flung up and out above the shoulder and the lower arm flung out low and wide, on the right side of the image
    the upper arm flung out at shoulder height and the lower arm hanging down and back, all four clawed hands splayed
    open; the wings drooping and faltering; the knees bent; exactly four arms, all four clearly visible and apart from
