           text: "a long wooden shop counter seen from the front in three-quarter view, as wide as the box: a polished light-brown top and a darker panelled front, with rounded ends at the left and right."}
        - {name: plant, source: [808, 22, 972, 238], at: [3, 0], tiles: [1, 1], wrap: prop,
           text: "a green leafy potted plant in a round clay pot."}
        - {name: bookshelf, source: [25, 280, 235, 640], at: [0, 1], tiles: [1, 2], wrap: prop, parts: [[bookshelf_top], [bookshelf_bottom]],
           text: "a tall wooden bookshelf standing against a wall, seen from the front, full of colourful books on four shelves."}
        - {name: bed, at: [1, 1], tiles: [1, 2], wrap: prop, parts: [[bed_top], [bed_bottom]],
           text: "a single inn bed seen from above in three-quarter view, head at the top: wooden frame, white pillow and a red blanket."}
        - {name: weapon_rack, source: [530, 290, 752, 448], at: [2, 1], tiles: [1, 1], wrap: prop, align: center,
           text: "a wooden wall rack holding two crossed swords and an axe, hanging on a wall."}
        - {name: potion_shelf, source: [780, 312, 992, 432], at: [3, 1], tiles: [1, 1], wrap: prop, align: center,
           text: "a small wooden wall shelf holding green, red and blue potion bottles."}
        - {name: armor_stand, source: [558, 498, 708, 766], at: [2, 2], tiles: [1, 1], wrap: prop,
           text: "a wooden armour stand displaying a silver breastplate and helmet."}
        - {name: window_in, source: [820, 553, 957, 702], at: [3, 2], tiles: [1, 1], wrap: prop, align: center,
           text: "a small square wooden-framed window with four light-blue panes, seen from inside on a wall."}
        - {name: orb_white, source: [72, 822, 182, 1016], at: [0, 3], tiles: [1, 1], wrap: prop,
           text: "a small stone pedestal holding a glowing white crystal orb."}
        - {name: orb_black, source: [332, 822, 442, 1016], at: [1, 3], tiles: [1, 1], wrap: prop,
           text: "a small dark stone pedestal holding a glowing purple crystal orb."}
        - {name: table, source: [548, 822, 722, 1016], at: [2, 3], tiles: [1, 1], wrap: prop,
           text: "a small round wooden table with a candle on it."}

- id: castle
  kind: kit
  sheets:
    hall:
      # castle keep, modular like the town house (4x4 on a 1:1 guide, prompt rev 2)
      seed: 1234
      refs: [town/house, town/walls]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 248
      grid_lines: false
      prompt_rev: 2
      prefab: castle_hall    # review fix: roof overhang and a door wider than a tile; stamped whole as the keep
      cells:
        - [roof_ridge_l@castle, roof_ridge_m@castle, roof_ridge_m@castle, roof_ridge_r@castle]
        - [roof_eave_l@castle, roof_eave_m@castle, roof_eave_m@castle, roof_eave_r@castle]
        - [wall_up_l@castle, wall_up_window@castle, wall_door_top@castle, wall_up_r@castle]
        - [wall_lo_l@castle, wall_lo_plain@castle, wall_door_bottom@castle, wall_lo_r@castle]
      derive:
        wall_up_plain@castle: { from: wall_up_window@castle }
      prompt: >
        the main hall of a royal castle seen straight from the front (the south side). Show only the front: the
        left and right sides are straight vertical edges, with no side wall visible and no roof overhang past the
        sides. The top half is the roof: dark blue-grey slate roof tiles in neat horizontal courses sloping toward
        the viewer, with a ridge line along the very top and the lower edge ending in a dark eave with a thin shadow
        line under it (no gable, no tower, no flag). The bottom half is the front wall: large pale grey dressed stone
        blocks with dark joints and a darker base course along the bottom. A tall arched wooden double door with
        iron studs and a stone arch stands in the right-centre of the wall, from about the middle of the wall down
        to the bottom edge; a tall narrow arched window with blue glass sits in the upper part of the wall left of
        the door; the rest of the wall is plain stone.
    props:
      kind: swatches
      seed: 1234
      refs: [town/house, town/walls]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 200
      gap_px: 24
      margin_px: 56
      labels: absolute
      scale: pitch
      swatches:
        - {name: tower, at: [0, 0], tiles: [2, 3], source: [40, 5, 216, 446], wrap: prop,
           parts: [[tower_0_0, tower_0_1], [tower_1_0, tower_1_1], [tower_2_0, tower_2_1]],
           text: "a round castle tower of pale grey dressed stone seen in three-quarter view, with a tall pointed dark blue-grey slate cone roof, a small arched window and a little red pennant on top; it fills the box."}
        - {name: throne, at: [2, 0], tiles: [2, 2], source: [625, 25, 958, 378], wrap: prop, parts: [[throne_0_0, throne_0_1], [throne_1_0, throne_1_1]],
           text: "a royal throne seen from the front in three-quarter view: a tall gilded golden chair with red velvet cushions standing on a low two-step stone dais."}
        - {name: pillar, at: [2, 2], tiles: [1, 2], source: [598, 392, 712, 703], wrap: prop, parts: [[pillar_top], [pillar_bottom]],
           text: "a round pale stone column with a carved capital and a square base, as tall as the box."}
        - {name: knight_statue, at: [3, 2], tiles: [1, 2], source: [832, 402, 966, 716], wrap: prop, parts: [[statue_top], [statue_bottom]],
           text: "a grey stone statue of an armoured knight holding a sword point-down, on a square plinth, as tall as the box."}
        - {name: banner, at: [0, 3], tiles: [1, 1], source: [58, 770, 200, 1004], key_border: true, key_mode: v1, wrap: prop, align: center,
           text: "a long red cloth banner hanging on a wall with a golden crown emblem and a gold fringe at the bottom."}
        - {name: torch, at: [1, 3], tiles: [1, 1], source: [352, 770, 446, 980], key_border: true, key_mode: v1, wrap: prop, align: center,
           text: "an iron wall sconce holding a burning torch with a bright orange flame."}

    masonry:
      # castle rebuild (2026-11-13): keep walls, slate roof, marble hall floor, castle inner wall
      kind: swatches
      seed: 1234
      refs: [castle/hall, town/walls]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 200
      gap_px: 24
      margin_px: 56
      labels: absolute
      swatches:
        - {name: castle_face, source: [0, 0, 472, 296], keep_aspect: true, at: [0, 0], tiles: [2, 2], wrap: x,
