# Tile kits for the map compiler (docs/ART_TILES_PLAN.md). Each sheet is one paid image: a complete object drawn on
# a tile grid and sliced into the named 48x48 parts below (rows top to bottom). `refs` lists approved sheets of this
# kit sent as extra style references.
- id: town
  kind: kit
  sheets:
    house:
      # rev 2.2 (user, option 2): 4x4 tiles on a 1:1 guide so Gemini's ~6 px pixels give ~41 native px per tile;
      # no grid lines on the guide (the 5:4 pilot copied them). wall_up_plain is derived offline from the window cell.
      seed: 1234
      refs: []
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 248
      grid_lines: false
      cells:
        - [roof_ridge_l, roof_ridge_m, roof_ridge_m, roof_ridge_r]
        - [roof_eave_l, roof_eave_m, roof_eave_m, roof_eave_r]
        - [wall_up_l, wall_up_window, wall_door_top, wall_up_r]
        - [wall_lo_l, wall_lo_plain, wall_door_bottom, wall_lo_r]
      derive:
        wall_up_plain: { from: wall_up_window }
      prompt_rev: 2
      prompt: >
        a small European-style village cottage seen straight from the front (the south side). Show only the front:
        the left and right sides of the building are straight vertical edges, with no side wall visible and no roof
        overhang past the sides. The top half is the roof: red-orange clay roof tiles in neat horizontal courses
        sloping toward the viewer, with the ridge line along the very top and the lower edge ending in a dark eave
        with a thin shadow line under it (no gable, no chimney, no dormer, no sign). The bottom half is the front
        wall: warm cream plaster with a darker base course along the bottom and slightly darker corners at the left
        and right. A wooden plank door with a dark frame stands in the right-centre of the wall, from about the
        middle of the wall down to the bottom edge; a small four-pane window with a wooden frame sits in the upper
        part of the wall left of the door; the rest of the wall is plain.
    ground:
      # checkpoint B: seamless ground materials, 2x2 map tiles (96 native px) per swatch, made seamless offline
      kind: materials
      seed: 1234
      refs: [house]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 236
      swatch_tiles: 2
      layout:
        - [grass, cobble]
        - [dirt, water]
      materials:
        grass: >
          short lush meadow grass in two or three close greens, small scattered tufts and a few tiny lighter
          blades, evenly spread with no flowers, rocks or paths.
        cobble: >
          a town street of rounded grey cobblestones of mixed sizes, packed closely with thin dark gaps between them,
          a few slightly bluish or warmer stones, evenly spread.
        dirt: >
          packed light-brown earth of a country path, with tiny pebbles and faint darker specks, evenly spread.
        water: >
          calm blue river water with small light ripple marks and a few highlights, evenly spread, no foam edges and
          no shore.
    walls:
      # checkpoint C: town wall, river rim, bridge deck, culvert and arrow slit
      kind: swatches
      seed: 1234
      refs: [house, ground]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 220
      gap_px: 24
      margin_px: 24
      swatches:
        - name: wall_top
          at: [0, 0]
          tiles: [2, 2]
          crop: [0.0, 0.14, 1.0, 0.84]             # review fix: drop the coping / end caps the model added
          wrap: both
          text: >
            the top of a thick grey stone town wall seen from above: the walkway along the top of the wall, paved
            with large flat light-grey stone slabs with thin dark joints, evenly spread, no battlements, no edges.
        - name: rim
          at: [2, 0]
          tiles: [2, 2]
          crop: [0.0, 0.14, 1.0, 1.0]             # review fix: drop the coping / end caps the model added
          wrap: both
          text: >
            mossy grey stone blocks of a river embankment seen from above: small squared stones with dark joints and
            a little green moss in some joints, evenly spread.
        - name: wall_face
          at: [0, 2]
          tiles: [2, 1]
          crop: [0.02, 0.0, 0.97, 1.0]             # review fix: drop the coping / end caps the model added
          match_scale: wall_slit  # review fix: drawn too short for 2 tiles; keep the slit piece's pixel scale
          wrap: x
          text: >
            the outer front face of the same grey stone town wall seen from the front: courses of large grey stone
            blocks with dark mortar, a slightly lighter coping course along the top edge and a darker, shadowed base
            course along the bottom edge; no openings.
        - name: culvert
          at: [2, 2]
          tiles: [1, 1]
          crop: [0.03, 0.0, 0.97, 1.0]   # review fix: drop the piece's end-cap outlines
          wrap: none
          text: >
            the same wall face (same stone courses, coping and base) with a dark semicircular stone arch opening at
            the bottom centre, about half the box wide, where blue river water flows out under the wall.
        - name: wall_slit
          at: [3, 2]
          tiles: [1, 1]
          crop: [0.03, 0.0, 0.97, 1.0]   # review fix: drop the piece's end-cap outlines
          wrap: none
          text: >
            the same wall face (same stone courses, coping and base) with one narrow dark vertical arrow slit in the
            centre.
        - name: bridge_h
          at: [0, 3]
          tiles: [2, 1]
          crop: [0.02, 0.0, 0.98, 1.0]             # review fix: drop the coping / end caps the model added
          wrap: x
          rotate: bridge_v
          text: >
            the deck of a small stone footbridge seen from above, for walking left to right: pale stone paving
            running across, with a low stone parapet along the top edge and another along the bottom edge.
    props:
      # checkpoint D: props stand on the bottom edge of their cells; magenta becomes transparent
      kind: swatches
      seed: 1234
      refs: [house, ground]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 200
      gap_px: 24
      margin_px: 56
      scale: pitch           # one native px per drawn pixel (5.12 raw px), like the house
      swatches:
        - name: tree
          at: [0, 0]
          tiles: [1, 2]
          source: [0, 0, 280, 400]   # review fix: drawn outside its box
          wrap: prop
          parts: [[tree_crown], [tree_trunk]]
          text: >
            a dark-green conifer (fir) tree seen in three-quarter view: a tall layered cone of needles in two or
            three greens with darker shading on the right, and a short brown trunk at the bottom centre.
        - name: fountain
          at: [1, 0]
          tiles: [2, 2]
          source: [330, 30, 700, 350]   # review fix: drawn outside its box
          wrap: prop
          parts: [[fountain_00, fountain_01], [fountain_10, fountain_11]]
          text: >
            a round town-square fountain of pale grey stone seen in three-quarter view: a low round basin full of
            blue water with a small central pillar and a little spout of water, filling most of the box.
        - name: bush
          at: [3, 0]
          tiles: [1, 1]
          source: [760, 140, 1020, 390]   # review fix: drawn outside its box
          wrap: prop
          text: >
            a round leafy green bush, about as wide as the box, with lighter leaves on the upper left.
        - name: well
          at: [3, 2]
          tiles: [1, 1]
          skip: true             # review: not drawn; placeholder until checkpoint E
          wrap: prop
          text: >
            a small round stone well with a little wooden roof on two posts and a bucket, about as wide as the box.
        - name: fence_h
          at: [0, 2]
          tiles: [1, 1]
          source: [0, 530, 270, 680]   # review fix: drawn outside its box
          wrap: prop
          text: >
            one section of a white wooden picket fence running left to right: two horizontal rails that touch
            both the left and the right edge of the box (so sections join into a long fence), with three pointed
            pickets, in the lower half of the box.
        - name: fence_v
          at: [1, 2]
          tiles: [1, 1]
          source: [440, 400, 490, 680]   # review fix: drawn outside its box
          wrap: prop
          text: >
            one section of the same white picket fence running away from the viewer (top to bottom): a narrow
            vertical run of rails and pickets in the centre of the box, touching the top and bottom edges.
        - name: fence_post
          at: [2, 2]
          tiles: [1, 1]
          source: [600, 470, 680, 680]   # review fix: drawn outside its box
          wrap: prop
          text: >
            a single square white wooden fence post with a pointed cap, in the lower part of the box.
        - name: flowers
          at: [3, 3]
          tiles: [1, 1]
          source: [760, 550, 1020, 680]   # review fix: drawn outside its box
          wrap: prop
          text: >
            a small low patch of flowers: red, yellow and white blossoms among green leaves, covering the lower
            half of the box.
        - name: barrel
          at: [0, 3]
          tiles: [1, 1]
          source: [40, 760, 230, 1010]   # review fix: drawn outside its box
          wrap: prop
          text: >
            a wooden barrel with dark iron hoops, standing upright, a bit narrower than the box.
        - name: crate
          at: [1, 3]
          tiles: [1, 1]
          source: [400, 755, 610, 1020]   # review fix: drawn outside its box
          wrap: prop
          text: >
            a wooden crate of light planks with darker corner boards, a bit narrower than the box.
        - name: signpost
          at: [2, 3]
          tiles: [1, 1]
          source: [775, 745, 1010, 1010]   # review fix: drawn outside its box
          wrap: prop
          text: >
            a wooden signpost: one post with a blank wooden board pointing right, as tall as the box.
    inn:
      # checkpoint E1: second building style (timber frame over stone, two storeys) for the inn; same 1:1 rules as
      # the house (prompt rev 2, no guide lines); 4:5 guide so five rows fit at ~45 native px per tile
      seed: 1234
      refs: [house]
      aspect: "4:5"
      guide: [1024, 1280]
      tile_px: 240
      grid_lines: false
      prompt_rev: 2
      prefab: inn            # review fix: braces and symmetric windows are not modular; stamp the drawing whole
      cells:
        - [roof_ridge_l@timber, roof_ridge_m@timber, roof_ridge_m@timber, roof_ridge_r@timber]
        - [roof_eave_l@timber, roof_eave_m@timber, roof_eave_m@timber, roof_eave_r@timber]
        - [wall_up2_l@timber, wall_up2_window@timber, wall_up2_window@timber, wall_up2_r@timber]
        - [wall_up_l@timber, wall_up_window@timber, wall_door_top@timber, wall_up_r@timber]
        - [wall_lo_l@timber, wall_lo_plain@timber, wall_door_bottom@timber, wall_lo_r@timber]
      derive:
        wall_up_plain@timber: { from: wall_up_window@timber }
        wall_up2_plain@timber: { from: wall_up2_window@timber }
      prompt: >
        a two-storey village inn seen straight from the front (the south side). Show only the front: the left and
        right sides are straight vertical edges, with no side wall visible and no roof overhang past the sides. The
        top two fifths are the roof: dark brown-red clay roof tiles in neat horizontal courses sloping toward the
        viewer, with the ridge line along the very top and the lower edge ending in a dark eave with a thin shadow
        line under it (no gable, no chimney, no dormer, no sign). Below the roof, the upper storey is a white plaster
        wall framed by dark brown timber beams (half-timbered), with two small wooden-framed windows, one in the
        middle-left and one in the middle-right. The ground floor is grey fieldstone masonry: a wooden double-plank
        door with a stone frame stands right of centre, from about the middle of the ground floor down to the bottom
        edge; a small window sits left of the door in the upper part of the ground floor; the rest is plain stone,
        with a darker base course along the bottom.
    signs:
      # checkpoint E2: shop sign boards (hung centred on the eave above the door), the well, a roof chimney
      kind: swatches
      seed: 1234
      refs: [house, props]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 200
      gap_px: 40
      margin_px: 52
      scale: pitch
      swatches:
        - {name: sign_weapon, at: [0, 0], tiles: [1, 1], wrap: prop, align: center,
           text: "a small hanging wooden shop sign board with a dark frame, showing a simple silver sword icon; no letters."}
        - {name: sign_armor, at: [1, 0], tiles: [1, 1], wrap: prop, align: center,
           text: "the same kind of wooden sign board, showing a simple blue-and-silver shield icon; no letters."}
        - {name: sign_item, at: [2, 0], tiles: [1, 1], wrap: prop, align: center,
           text: "the same kind of wooden sign board, showing a simple green potion bottle icon; no letters."}
        - {name: sign_white_magic, at: [3, 0], tiles: [1, 1], wrap: prop, align: center,
           text: "the same kind of wooden sign board, showing a simple white glowing orb icon on a pale board; no letters."}
        - {name: sign_black_magic, at: [0, 2], tiles: [1, 1], source: [20, 595, 235, 815], wrap: prop, align: center,
           text: "the same kind of wooden sign board, showing a simple dark purple orb icon on a dark board; no letters."}
        - {name: sign_inn, at: [1, 2], tiles: [1, 1], source: [275, 595, 490, 815], wrap: prop, align: center,
           text: "the same kind of wooden sign board, showing a simple bed icon with a red blanket; no letters."}
        - {name: well, at: [2, 2], tiles: [1, 1], source: [545, 575, 735, 850], wrap: prop,
           text: "a small round grey stone well with a little wooden roof on two posts and a bucket hanging inside, as wide as the box."}
        - {name: chimney, at: [3, 2], tiles: [1, 1], source: [810, 590, 985, 868], wrap: prop,
           text: "a short square red-brick chimney seen in three-quarter view, standing on a roof, about half as wide as the box."}

    market:
      # town rebuild (2026-11-13): park tree, market stall, street lamp, bench, hedge, vegetable bed, lily pads
      kind: swatches
      seed: 1234
      refs: [house, props]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 200
      gap_px: 24
      margin_px: 56
      labels: absolute
      scale: pitch
      swatches:
        - {name: oak, source: [4, 28, 500, 656], key_border: true, at: [0, 0], tiles: [2, 3], wrap: prop, parts: [[oak_0_0, oak_0_1], [oak_1_0, oak_1_1], [oak_2_0, oak_2_1]],
           text: "a big round leafy oak tree seen in three-quarter view: a wide bushy crown in three greens lit from the upper left with darker shade underneath, and a thick brown trunk with roots at the bottom centre; it fills the box."}
        - {name: stall, fill: true, source: [616, 20, 956, 376], key_border: true, at: [2, 0], tiles: [2, 2], wrap: prop, parts: [[stall_0_0, stall_0_1], [stall_1_0, stall_1_1]],
           text: "a market stall seen from the front in three-quarter view: a wooden counter table under a red-and-white striped cloth awning on four wooden poles, with baskets of red apples, bread loaves and green vegetables on the table; it fills the box."}
        - {name: lamp, source: [580, 404, 728, 696], key_border: true, at: [2, 2], tiles: [1, 2], wrap: prop, parts: [[lamp_top], [lamp_bottom]],
           text: "a black iron street lamp post with a warm glowing yellow lantern at the top, as tall as the box."}
        - {name: bench, source: [768, 456, 1012, 664], key_border: true, at: [3, 2], tiles: [1, 1], wrap: prop,
           text: "a wooden park bench with iron legs seen from the front."}
        - {name: hedge, source: [4, 728, 308, 1016], key_border: true, at: [0, 3], tiles: [1, 1], wrap: prop,
           text: "one section of a neatly clipped dark-green box hedge running left to right, in the lower two thirds of the box, touching both the left and the right edge of the box (so sections join into a long hedge)."}
        - {name: crops, source: [376, 728, 668, 984], key_border: true, at: [1, 3], tiles: [1, 1], wrap: prop,
           text: "a small square vegetable bed of dark brown soil with two rows of round green cabbages, filling the box."}
        - {name: lilies, source: [764, 728, 1012, 968], key_border: true, at: [3, 3], tiles: [1, 1], wrap: prop,
           text: "two floating green lily pads and one small pink water-lily flower, with no water drawn around them."}

- id: interior
  kind: kit
  sheets:
    rooms:
      # interiors: floors, carpet, walls (shops, inn, castle)
      kind: swatches
      seed: 1234
      refs: [town/house, town/ground]
      aspect: "1:1"
      guide: [1024, 1024]
      tile_px: 200
      gap_px: 24
      margin_px: 56
      labels: absolute
      swatches:
        - {name: floor, at: [0, 0], tiles: [2, 2], wrap: both,
           text: "a warm wooden plank floor of a shop seen from above: long honey-brown boards running left to right with thin dark gaps and a few knots, evenly spread."}
        - {name: floor_stone, at: [2, 0], tiles: [2, 2], wrap: both,
           text: "a castle hall floor seen from above: large square pale grey flagstones with thin dark joints, evenly spread."}
        - {name: carpet, crop: [0.05, 0.0, 0.95, 1.0], at: [0, 2], tiles: [2, 2], wrap: both,
           text: "a rich red carpet seen from above with a subtle darker woven pattern, evenly spread, no border."}
        - {name: in_wall_face, at: [2, 2], tiles: [2, 1], wrap: x,
           text: "the inside back wall of a cosy shop seen from the front: warm beige plaster above a dark wooden wainscot panel along the bottom edge, with a thin wooden rail along the top edge; no windows, no shelves."}
        - {name: in_wall_top, derive_material: {from: floor, shade: 0.45}, at: [2, 3], tiles: [2, 1], wrap: x,
           text: "the dark top edge of a thick interior wall seen from above: dark brown wooden beam with a slightly lighter top face, evenly repeating left to right."}
    furniture:
