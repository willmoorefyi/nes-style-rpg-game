    recolor: {light: [112, 62, 36], glow: [112, 62, 36], warm: [112, 62, 36]}
    recolor_v4: {light: [104, 58, 34], glow: [104, 58, 34], warm: [104, 58, 34], bright: [104, 58, 34], flat: true}
    size: large
    body: quadruped
    canvas: wide
    subject: >-
      a huge living war horse gone mad on a violent rampage, terrifying and dangerous: a heavily muscled dark bay
      hide covered in old scars and fresh cuts, veins standing out, foam at the mouth, flared red nostrils, wild
      rolling bloodshot eyes showing the whites, ears pinned flat back, bared teeth in an open screaming mouth, a long
      wild tangled black mane and tail whipping, a broken leather bridle with a snapped rein trailing from the jaw,
      heavy iron-shod hooves; a living flesh-and-blood animal, not undead.
    poses:
      idle: standing side-on, the head low and tossing, one forehoof pawing the ground, snorting
      attack: >-
        lunging forward to the right with the head thrust out to bite and the forelegs striking forward, lifted only
        a little, the mouth wide open screaming
      hurt: flinching back, the head thrown up and back, stumbling with the hind legs buckling
      kneel: >-
        dazed and exhausted, collapsed onto its knees with the forelegs folded under it, the head drooping low, the
        sides heaving
    negative: >-
      skeleton, skull, bones, ribs showing, undead, zombie, smoke, glowing cracks, rider, saddle, horn, wings,
      unicorn, pony, rearing straight up
    short: >-
      huge mad war horse on a rampage, a living animal with a muscular dark bay hide covered in scars and cuts, black
      legs, a wild tangled black mane and tail, wild bloodshot eyes, flared nostrils, bared teeth, foam at the mouth,
      a broken leather bridle with a snapped rein
    short_wild: >-
      huge mad wild stallion on a rampage, a living animal with a muscular dark bay hide covered in scars and cuts,
      black legs, a wild tangled black mane and tail, wild bloodshot eyes, flared nostrils, bared teeth, foam at the
      mouth, a broken leather bridle with a snapped rein
    poses4:
      idle: standing side-on, head low and tossing, one forehoof pawing
      attack: lunging forward, head thrust out, mouth open screaming, forelegs striking
      hurt: flinching back, head thrown up, hind legs buckling
      kneel: collapsed on its knees, forelegs folded under it, head drooping
