  vampire_lord:
    retired: vampire_lord_v1
    size: small
    body: biped
    canvas: square
    subject: >-
      an ancient towering vampire lord, far older and grander than a common vampire: tall and gaunt, a long lined
      grey-white face with hollow cheeks, burning red eyes under heavy brows and long fangs, long straight white hair
      falling past the shoulders, a tall black collar with sharp points rising behind the head like a crown, a long
      regal black coat with dark crimson and gold trim and a gold chain clasp at the chest, a vast black cape with a
      crimson lining shaped like bat wings, joined along both arms to the wrists, long bony clawed fingers.
    poses:
      idle: standing tall and imperious, the arms half spread so the bat-wing cape opens
      attack: >-
        sweeping forward to the right, one clawed hand reaching out to grasp, the bat-wing cape spread wide under
