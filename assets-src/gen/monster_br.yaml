  dark_wizard:
    retired: dark_wizard_v1
    recolor: {light: [40, 38, 46], warm: [104, 128, 92]}
    size: small
    body: biped
    canvas: square
    subject: >-
      a sinister, evil dark sorcerer of a corrupted elf-orc kind: gaunt and hunched, sickly grey-green skin tight over
      a skull-like face, long pointed ears, a hooked nose, a lipless mouth of small sharp teeth, two burning
      yellow-green eyes glowing from the deep shadow of a ragged black hood, a long tattered black robe hanging in
      rags with dark green trim, bony clawed hands, a tall staff of blackened twisted wood topped with a horned animal
      skull; a faint dark green aura clings close round his body.
    poses:
      idle: standing hunched, leaning on the skull staff, the free clawed hand raised with the fingers curled
      attack: >-
        leaning in and thrusting the skull staff forward to the right, its eye sockets glowing green, the free hand
        clawing forward
      hurt: knocked back, recoiling with the hood half thrown back and one arm up, the staff held upright
      kneel: >-
        dazed, collapsed down on one knee, slumped over the staff planted beside him, the head hanging
    short: >-
      evil dark sorcerer, a gaunt hunched elf-orc with sickly grey-green skin, a skull-like face, long pointed ears,
      burning yellow-green eyes in the shadow of a ragged black hood, a tattered black robe with dark green trim, bony
      clawed hands and a tall blackened staff topped with a horned skull
    poses4:
      idle: standing hunched, leaning on his staff, free claw raised
      attack: thrusting the skull staff forward, free claw reaching out
      hurt: knocked back, one arm up, the staff upright
      kneel: kneeling on one knee, slumped over his planted staff, head hanging
    negative: pointed hat, wizard hat, star pattern, white beard, long beard, crown, sword, bright spell effects, flames
