# EF-F (docs/ENEMY_FEEDBACK_PLAN.md F2, F3): the prompts and every variation of the five Bedrock regenerations, read by
# monster_br.py. One Stable Image Ultra image-to-image render per variation (the 2x2 magenta guide, monster_br.guide):
# idle top left, attack top right, hurt bottom left, kneel (the dazed key) bottom right. At most 5 variations per
# sprite. A variation's `flip` mirrors cells drawn facing left (0-3, idle attack hurt kneel); `add` / `negative`
# extend the sprite's prompt. The user's reference images (~/temp/ff-game/ef/refs/) are mood only and never sent.
style: >-
  A 16-bit era Japanese RPG enemy battle sprite sheet in detailed pixel art: a crisp dark outline round the figure,
  a limited palette, clean shading lit from the top left, the full body in side view, a serious, dark and menacing
  tone, realistic proportions, not cartoonish, not cute, not chibi.
style2: >-
  Detailed 16-bit era Japanese RPG pixel art of one enemy character for a battle screen: a crisp dark outline round
  the figure, a limited palette, clean shading lit from the top left, side view, a serious, dark and menacing tone,
  realistic proportions, not cartoonish, not cute, not chibi.
grid2: >-
  The same one character drawn four times, once in each quarter of the picture, each copy whole and alone, drawn
  over the dark grey shape in its quarter and filling it, always facing right with the face and chest turned to the
  right side of the picture:
grid3: >-
  The same one character drawn four times, once in each quarter of the picture, each copy whole and alone, redrawn
  over the figure in its quarter with its pose and size, always facing right with the face and chest turned to the
  right side of the picture:
style4: >-
  Pixel art, 16-bit JRPG enemy battle sprites, dark fantasy, crisp black outline, cel shading lit from the top left,
  side view, full body.
background4: Flat solid magenta background.
negative4: >-
  chibi, cute, cartoon, comic, smiling, big head, text, watermark, frame, grid lines, floor, shadow, scenery, blurry,
  3d render, photo, extra characters
background: >-
  The background is one flat solid magenta (#FF00FF) colour everywhere, with no floor, no cast shadow, no scenery,
  no text and no frame lines between the poses; each figure stands alone with empty magenta round it.
negative: >-
  text, letters, watermark, signature, grid lines, panel borders, frames, floor, ground shadow, scenery, gradient
  background, photo, 3d render, blurry, cartoon, chibi, cute, comic, smiling, extra characters, duplicate figures in
  one pose, cropped figure, cut off feet, pink clothing, magenta clothing
sprites:
  pirate:
    retired: pirate_v1
    size: small
    body: biped
    canvas: square
    subject: >-
      a menacing, battle-hardened sea cutthroat: a lean weathered man with a scarred face, cruel narrowed eyes and a
      cruel grin of crooked teeth, a dark stubbled jaw, a faded dark red bandana under a battered black tricorn hat,
      a gold hoop earring, a long tattered dark brown leather coat over a stained off-white shirt, a wide black belt
      with a brass buckle and a pistol tucked in it, dark breeches and tall worn black boots, a heavy curved steel
      cutlass in his hand.
    poses:
      idle: standing in a low guarded fighting stance, knees bent, the cutlass held forward and low, ready to strike
      attack: >-
        lunging forward to the right with a wide slashing cut of the cutlass, the front knee deeply bent, the coat
        tails swinging behind
      hurt: staggering backward, flinching with the head thrown back and the free arm up, the cutlass still in hand
      kneel: >-
        dazed and beaten, down on one knee and slumped forward, one hand on the ground, the cutlass lowered, the head
        hanging
    negative: parrot, peg leg, hook hand, eyepatch, blue coat, cartoon pirate
    variations:
      - {n: 1, seed: 7101, strength: 0.85, guide: 1, note: "Ultra image-to-image confirmed (image + strength, served stability.stable-image-ultra-v1:1); failed: the grey guide boxes kept as panels, one figure only (top right)"}
      - {n: 2, seed: 7101, strength: 0.85, guide: 1, model: sd35, note: "model bake-off round 1 on SD 3.5 Large: failed as v1 (grey panels, one noisy figure)"}
      - {n: 3, seed: 7101, strength: 0.93, note: "bake-off round 2 (Ultra): guide rev 2 (key-magenta boxes), strength 0.93; failed: a flat magenta image, no figure"}
      - {n: 4, seed: 7101, strength: 0.93, model: sd35, note: "bake-off round 2 (SD 3.5 Large): failed as v3 (a flat magenta image: a flat init keeps flat at 0.93)"}
      - {n: 5, seed: 7105, route: fallback, control: 0.7, note: "F3 fallback (the 2x2 layout failed twice): Ultra text-to-image idle, Control Structure attack / hurt / kneel on the pirate_v1 silhouettes; failed: the idle drew a fleet of pirate ships, the three structure poses whole sheets of dozens of small blue soldiers ('sprite sheet' in the style text), the silhouettes ignored"}
  vampire:
    retired: vampire_v2
    size: small
    body: biped
    canvas: square
    subject: >-
      a menacing young vampire noble, a lean predator: deathly pale grey-white skin, a sharp gaunt face with feral
      glowing red eyes and long white fangs bared in a snarl, black hair slicked back to a widow's peak, pointed ears,
      long clawed fingers, a tall stiff black collar, a fitted black and deep crimson aristocratic coat with silver
      buttons, a long black cape with a blood-red lining.
    poses:
      idle: standing tall and still, leaning slightly forward, one clawed hand raised, the cape wrapped close
      attack: lunging forward to the right with both clawed hands slashing, fangs bared, the cape flaring behind
      hurt: recoiling backward, shielding the face with the cape, hissing
      kneel: >-
        dazed and weakened, down on one knee with the head bowed, one clawed hand on the ground, the cape pooled
        round him
    negative: white hair, bat wings, crown, old man, beard, cartoon fangs, bats
    variations:
      - {n: 1, seed: 7201, strength: 0.85, guide: 3, text: 2, note: "main route rev 3: Ultra over the vampire_v2 silhouettes, no 'sheet' wording; layout, magenta and facing work, but the grey silhouettes leak (a grey armoured boy, a grey ghoul, no vampire), 0.85 too low for the prompt"}
      - {n: 2, seed: 7202, strength: 0.88, guide: 4, text: 3, note: "guide rev 4: the vampire_v2 poses in their own colours (the same young noble design concept), strength 0.88; failed: Ultra drew flat black silhouettes with orange runes (a horned knight, no vampire)"}
      - {n: 3, seed: 7203, strength: 0.6, model: structure, guide: 4, text: 3, note: "F3 fallback (the 2x2 Ultra layout failed twice): Control Structure on the old poses, all four in one call (one identity), control 0.6; failed: the layout ignored (one large armoured boy with a staff and a ghoul behind him on a grey ground; TOWN_THEMES: control-structure ignores layouts)"}
