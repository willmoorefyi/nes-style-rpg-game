      hurt: reeling backward, both arms raised before the face with the bat-wing cape folded across the body
      kneel: dazed, sunk on one knee with the head bowed, the white hair hanging, the cape draped over the ground
    short: >-
      ancient vampire lord with a gaunt pale grey face, red eyes, fangs, long straight white hair, a tall pointed
      black collar, a black coat with crimson trim, a black bat-wing cape on his arms and long claws
    poses4:
      idle: standing tall, arms half spread, cape open
      attack: lunging forward, one clawed hand reaching out
      hurt: reeling back, arms raised before his face
      kneel: kneeling on one knee, head bowed, exhausted
    negative: young face, black hair, crown on the head, bats, real wings on the back
