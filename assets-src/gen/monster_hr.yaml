# kneel posed from the master by rigid parts and cloth warps (no AI; gen/monster_hr_puppet.py, `puppet`); G3: every
# image (the idle master too) repainted by SD 3.5 Large image-to-image at low strength (gen/monster_hr_br.py,
# `variations`, pass EF4, purpose ef4_pose); G4: the large cut, held for the user's size decision (`pick`).
# Coordinates: `prep` polygons and landmarks are on the source raw (896x1088, before any flip); `puppet` coordinates
# are on the 1024x1024 master. The EF3 rows of monster_br3.yaml stay as recorded (its `pick.idle` unchanged).
