# EF3 (pass EF3, user approval 2026-11-24 after the EF2 debrief): the four humanoids again with monster_br2.py --pass EF3,
# at the LARGE size (128 px cell, figure 96-120 px) and with stocky, broad, heroic-proportion designs (big head and
# hands, short legs) in bright readable colours with strong value contrast (deep saturated hues with bright trim, no
# near-black costumes) and large clear face features; still menacing, not cartoon. Same route as EF2: the idle by
# SD 3.5 text-to-image, attack / hurt / kneel by image-to-image from the new idle warped about its feet. At most 5
# variations per pose. Sets are prepared, not approved (the user decides the size first).
style: unused
background: unused
negative: unused
background2: The background is flat solid pure magenta (#FF00FF) everywhere, empty, nothing else.
negative2: >-
  chibi, cute, cartoon, comic, smiling, sprite sheet, several figures, text, watermark, frame, border, floor, ground,
  cast shadow, scenery, gradient, blurry, photo, 3d render, cropped, close-up, portrait
style5: >-
  Pixel art enemy for a 16-bit JRPG battle screen: a stocky, broad, heroic-proportion figure with a big head, big
  hands and short sturdy legs, large clear face features, bright readable colours with strong light-dark contrast,
  deep saturated colours with bright trim, crisp black outline, cel shading lit from the top left; one single
  full-body figure in side view facing right, the whole figure inside the picture with empty space round it.
style6: >-
  Stocky heroic proportions with a big head and big hands, bright saturated colours with bright trim and strong
  contrast, 16-bit JRPG pixel art enemy, crisp black outline, cel shading, side view facing right, full body.
sprites:
  pirate:
    size: large
    key_thresh: 22
    hue: 20
    over: 1.15
    min_piece: 30
    holes: 400
    subject: >-
      A menacing pirate cutthroat: a weathered scarred human face with a cruel grin, a big jaw and stubble, a bright
      red bandana under a black tricorn hat with gold trim, gold earrings, a deep crimson long coat with gold buttons
      and trim, a white shirt, a broad brown belt with a brass buckle, black boots, a heavy curved steel cutlass.
    poses:
      idle: a low guarded fighting stance, knees bent, the cutlass held forward, ready to strike
      attack: lunging forward with a wide slash of the cutlass, the front knee deeply bent
      hurt: staggering backward, flinching, the free arm thrown up
      kneel: beaten down on one knee, slumped, head hanging, the cutlass lowered
    negative: parrot, eyepatch, peg leg, skull, skeleton, undead
    variations:
      idle:
        - {n: 1, seed: 10101, text: 5, aspect: "4:5", note: "a stocky readable brute in a red bandana and vest with bracers, menacing, but frontal and without the tricorn, coat or cutlass"}
