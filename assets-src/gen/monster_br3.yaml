        - {n: 3, seed: 10103, text: 6, aspect: "4:5", subject: "A pirate cutthroat holding a big curved steel cutlass, wearing a black tricorn hat with gold trim and a long crimson coat with gold buttons, a scarred grinning human face, a red bandana, gold earrings, black boots.", negative: "bare chest, muscle vest, hulk, brute, skull, skeleton, demon, horns", note: "follows the costume (tricorn, crimson coat, big cutlass, a strong low stance) and cuts well at 128 px, but the face is a skull and the style an illustration, not pixel art"}
        - {n: 4, seed: 10103, text: 6, aspect: "4:5", subject: "A pirate cutthroat holding a big curved steel cutlass, wearing a black tricorn hat with gold trim and a long crimson coat with gold buttons, a scarred grinning human face, a red bandana, gold earrings, black boots.", add: "He is a living human man: a tanned weathered human face with a black beard and a cruel grin, human eyes.", negative: "bare chest, muscle vest, hulk, brute, skull, skeleton, demon, horns, mask, undead", note: "picked: a menacing grinning bearded human cutthroat, black tricorn, crimson coat, a big cutlass and a second blade; a photographic render on a teal gradient page (key_thresh 40 + hue 20)"}
