# FW-S (docs/REDESIGN_PLAN.md 2.2, D-V1 S1): per-sheet integer display scale, screen px per art px, written into the
# atlas sheet's `scale` field (BattleArt uses entry.scale ?? meta.scale). Approved PNGs, rigs and locks are untouched:
# frames are generated, checked and locked at native size; the GPU draws each art px as a scale x scale block.
# Format: {<sprite id>: 3}. Allowed values 2 and 3; an id that is not an atlas sheet is refused (monster_atlas.load_scale).
# EF-A1 (docs/ENEMY_FEEDBACK_PLAN.md; the user's 2026-11-24 request overrides D-V1 S1's integer-only rule): an entry may
# also be {scale: S, tex: T, smooth: [despur]}: S in {2, 2.5, 3} screen px per native art px, T = S (a hi-res texture
# from gen/monster_hires.py, drawn 1:1 from a `filter: linear` page) or T = 1 with an integer S (today's texture),
# `smooth: [despur]` a native spur / notch clean-up first. The approved PNGs, rigs and locks stay untouched.
# Empty: every sheet at the atlas scale 2 (the JSON has no `scale` field per sheet). The integrator fills the entries (V4).
# V4 (docs/REDESIGN_PLAN.md 2.3, 2.4; D-V1 S1, D-V2, D-V3): 23 sheets at 3 screen px per art px.
# tier L, small -> large (FF1 large class):
