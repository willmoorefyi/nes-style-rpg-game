# Monster prompts for the AI sprite pipeline (assets-src/gen/generate.py, monster.py; docs/ART_MONSTERS_PLAN.md).
# One Gemini request per monster type -> idle | attack | hurt. `id` = the enemy's `sprite` name in enemies.yaml.
# `size` picks the band (small 80 / large 128 / boss 176 px cells). `prompt` describes the look (keep it true to the
# legacy sprite, which is also sent as the design reference); `attack` / `hurt` describe those two poses.
# `floating: true` keeps one shared vertical offset (no ground line). `face` overrides the default readable-face rule.
# `variants` (palette swaps, no extra images): [{id: <sprite>, map: {"#rrggbb": "#rrggbb"}} | {id, hue: <deg>, sat: <x>, val: <x>}]
# `seeds` are tried in order; put the approved seed first.
# FW-9 (docs/ROSTER_PLAN.md 4.3; each changes the request text only when set, so approved keys never move):
# `body` (biped | robed | quadruped | bird | floating | swimmer | serpent | rooted | naga | arthropod | blob) replaces the
# fixed biped MOVEMENT wording with that body's motion and ground line (monster.BODY_LINES); `base` (e.g. "the broken
# stone altar under her lowest coil") is drawn as part of the creature; `idle_negative` is avoided in the idle pose only
# (boss_idle's Avoid list; the idle cell of a 3-pose sheet). `motion` (needs `body`) replaces that body's movement
# line: a string for every action pose, or {pose: text} for only the poses it names (approved poses keep their keys).
- id: goblin
  size: small
  prompt_rev: 1     # approved before the action wording; keeps its cache key
  prompt: >-
    small hunched green goblin with long pointed ears, a big hooked nose, yellow eyes and a toothy grin, wearing a
    ragged brown leather vest and a rope belt, bare green arms and feet, holding a short rusty dagger
  attack: lunging forward and stabbing with the dagger held out toward the heroes
  hurt: knocked back, flinching with eyes squeezed shut and the dagger arm thrown back
  seeds: [1234]
  # the gr_imp palette swap (T4 1.1) is gone: Goblin Guard has its own sheet (ROSTER_PLAN 3.1 rule 3, ROSTER_LOG R81)
- id: wolf
  size: small
  prompt_rev: 2     # approved with the legacy sprite as design reference; keeps its cache key
  prompt: >-
    lean grey wolf on four legs with shaggy fur, a darker grey back, pointed ears, yellow eyes and bared white fangs
  attack: springing through the air at the heroes, body stretched long, front paws reaching and jaws wide open to bite
  hurt: yelping as it is knocked sideways, legs scrambling, head twisted back and ears flat
  seeds: [1234]
  # the gr_wolf palette swap (T4 1.1) is gone: Warg Wolf has its own sheet (ROSTER_PLAN 3.1 rule 3, ROSTER_LOG R86)
- id: skeleton
  size: small
  prompt: >-
    undead skeleton warrior, a full human skeleton with yellowed off-white bones, visible ribcage, spine and pelvis,
    a skull with a toothed jaw and glowing red pinpoints in the eye sockets, a tattered dark red loincloth on a frayed
    belt, a dented round iron shield strapped to one forearm, holding a chipped iron sword
  attack: lunging forward on one bony leg with a big overhead sword slash, ribcage twisted into the swing
  hurt: blasted backward, skull snapping back, bones rattling apart at the joints, sword arm flung wide
  face: the skull's face is two glowing red eye sockets and a toothed jaw, readable in every cell
  seeds: [1234]
- id: pirate
  size: small
  prompt_rev: 2     # approved with the legacy sprite as design reference; keeps its cache key
  prompt: >-
    stocky pirate with a black tricorn hat, an eyepatch, a short dark beard, a blue coat with a red sash, brown boots,
    holding a curved cutlass
  attack: lunging forward with a wide cutlass slash, coat tails flying, free arm thrown back for balance
  hurt: reeling backward off balance, hat knocked askew, one arm flailing, grimacing
  seeds: [1234]
- id: mummy
  size: small
  prompt_rev: 2     # approved with the legacy sprite as design reference; keeps its cache key
  prompt: >-
    hunched mummy wrapped in dirty tan bandages with loose trailing strips, glowing orange eyes in a dark gap between
    the wrappings, arms reaching forward
  attack: lurching far forward, both bandaged arms stretched out to grab, loose wrappings streaming behind
  hurt: knocked back and doubled over, head lolling, loose bandages whipping around it
  face: only two glowing orange eyes show in a dark gap between the bandages, readable in every cell
  seeds: [1234]
- id: cockatrice
  size: small
  prompt_rev: 2     # approved with the legacy sprite as design reference; keeps its cache key
  prompt: >-
    cockatrice: a large rooster-like bird with a red comb and wattle, iridescent green and purple body feathers, a
    teal snake-like tail, yellow beak and yellow scaly legs
  attack: darting forward with neck fully stretched to peck, wings flared wide, tail lashing
  hurt: tumbling backward with feathers bursting loose, wings flailing, beak open in a squawk
  seeds: [1234]
- id: vampire
  size: small
  prompt_rev: 2     # approved with the legacy sprite as design reference; keeps its cache key
  prompt: >-
    pale vampire with slicked-back black hair, red eyes and small fangs, a high-collared black cape with a red lining,
    a dark red vest, reaching out with a clawed hand
  attack: swooping forward low with the cape spread like wings and a clawed hand raking at the heroes
  hurt: recoiling sharply, twisting away behind the raised cape, hissing with fangs bared
