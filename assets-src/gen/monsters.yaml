- id: ogre
  size: large
  prompt_rev: 1     # approved before the action wording; keeps its cache key
  prompt: >-
    huge muscular tan-skinned ogre with a small crown-like crest of brown hair, small angry red eyes, two tusks, a
    big belly, a brown loincloth with a gold belt buckle, holding a spiked wooden club
  attack: swinging the spiked club down in a heavy overhead smash toward the heroes
  hurt: rocking back on its heels, roaring, club arm thrown back
  seeds: [1234]
- id: troll
  size: large
  prompt: >-
    hulking green-skinned troll with a hunched back and a big belly, very long arms ending in clawed hands, short
    bowed legs, warty mottled skin, a row of dark green spikes along its head and spine, small yellow eyes, a wide
    mouth with two upward tusks, a ragged brown loincloth on a rope belt, holding a crude wooden mallet
  attack: lunging forward on one huge leg and swinging the mallet in a wide sideways sweep, whole body twisting
  hurt: rocked backward, hunched over with an arm thrown up to shield its face, snarling
  seeds: [1234]
- id: dragon
  size: large
  prompt: >-
    red dragon on four powerful clawed legs, crimson scales with darker red plating along the back, large bat-like
    wings with dark red membranes, two backward-curving ivory horns, a row of pale bone spikes from head to tail, a
    ridged cream belly, yellow slit eyes, a long jaw full of sharp teeth, a long tail ending in a spade tip
  attack: lunging its long neck forward in a fierce bite, wings thrown up high, tail whipping behind
  hurt: rearing back in pain, neck twisted away, wings half folded and flinching
  seeds: [1234]
- id: garland
  # FF1-homage knight boss; our own design (from the legacy sprite), one image per pose like the lich
  size: boss
  per_pose: true
  design_ref: false
  prompt: >-
    a towering dark knight in heavy midnight-blue plate armour with gold trim, a full helm crowned with two large
    curved ivory horns, two glowing red eyes in the visor slit, broad layered pauldrons, a long dark red cape, and a
    broad steel greatsword held in both hands, standing tall and menacing
  action_prompt: >-
    a towering dark knight in heavy midnight-blue plate armour with gold trim, a full helm crowned with two large
    curved ivory horns, two glowing red eyes in the visor slit, broad layered pauldrons, a long dark red cape, wielding
    a broad steel greatsword
  attack: >-
    a crushing charge: he steps far forward on his front leg toward the heroes and brings the greatsword down in a huge
    diagonal two-handed slash, torso twisted into the blow, cape flying out behind him
  cast: >-
    a dark spell stance: he plants the greatsword point-down in front of him with one hand and thrusts the other hand
    high, crackling crimson energy gathering in the open palm, cape billowing upward
  hurt: >-
    knocked back by a heavy blow: staggering with one knee buckling, torso twisted away from the heroes, one arm thrown
    up, the greatsword dragging low, cape flung forward
  # pass F (docs/FEEDBACK_PLAN_2026-11-14.md 3.7): the heavy attack's raised hold; the idle already fills the cell
  # height, so the raise must fit by crouching (same sprite size as Image 3), not by growing taller
  attack_raise: >-
    the wind-up of a crushing overhead blow, seen in the same three-quarter front view as Image 3 (body and helm turned
    toward the viewer and the heroes on the right, never his back): the full-size horned helm exactly as in Image 3,
    both large curved ivory horns, the visor slit with two glowing red eyes facing the viewer; the large layered
    gold-trimmed pauldrons as big as in Image 3; both hands gripping the greatsword raised high above the helm, the
    blade angled back over his shoulder, the greatsword the same length and the same broad width as in Image 3; chest
    open toward the heroes, front foot planted forward, cape lifting behind him; he sinks into a deep crouch with both
    knees bent so that the whole figure, horns and raised blade included, stays inside the grey box at exactly the same
    pixel size as in Image 3 (the raised blade's tip is the highest point, well below the top of the image)
  face: the face is hidden by the horned helm; two glowing red eyes in the visor slit are readable
  extra_negative: a bare face, a skull, a shield, a second weapon
  seeds: [1234]
  sheet_seeds: {boss_attack: 1235, boss_attack_raise: 1235}   # boss_attack 1234: a stiff crouch with the guide box painted
  # between the legs; boss_attack_raise 1234 (ACT1_LOG #28): back view, small helm, short thin sword (retry #31)
- id: lich
  # "the Rime Sovereign": original frost-undead knight-king boss (no legacy design reference; one image per pose)
  size: boss
  per_pose: true
  design_ref: false
  haze: true        # the mist at his feet is blended into the magenta key; clean it as background
  prompt: >-
    the Rime Sovereign, a towering gaunt undead knight-king in tall layered blackened-iron plate armour with frost
    creeping over every edge, broad swept-back pauldrons shaped like frozen wings, a long tattered grey-blue mantle
    hanging from the shoulders; no helmet: a bare cracked skull with a crown of jagged icicles growing out of the bone
    and a thin rim of old tarnished gold, two pale cyan pinpoints of light deep in the eye sockets; he holds a long
    two-handed glaive whose blade is clouded blue ice with faint cyan rune light running down the dark haft; cold mist
    pools around his armoured boots and a few small ice shards hover near him; palette of blackened iron, frost white,
    glacier blue and cyan glow with a single accent of tarnished gold
  action_prompt: >-
    the Rime Sovereign, a towering gaunt undead knight-king in tall layered blackened-iron plate armour with frost
    creeping over every edge, broad swept-back pauldrons shaped like frozen wings, a long tattered grey-blue mantle
    hanging from the shoulders; no helmet: a bare cracked skull with a crown of jagged icicles growing out of the bone
    and a thin rim of old tarnished gold, two pale cyan pinpoints of light deep in the eye sockets; he wields a long
    two-handed glaive whose blade is clouded blue ice with faint cyan rune light running down the dark haft; palette of
    blackened iron, frost white, glacier blue and cyan glow with a single accent of tarnished gold
  attack: >-
    a ferocious lunging two-handed glaive slash: he steps far forward onto his front leg toward the heroes, back leg
    stretched out behind, torso twisted hard into the swing, the glaive sweeping in a huge arc from high behind his
    head down toward the heroes, mantle and pauldron edges whipping back with the motion, a short frost trail behind
    the blade
  cast: >-
    a towering spell-casting stance: he rears up to full height, chest thrust out and skull tilted back, one gauntleted
    arm thrust high overhead with a large crystal of freezing cyan magic forming above the open palm, the other arm
    swinging the glaive out wide to the side, feet planted wide apart, mantle billowing upward in a magical wind
  hurt: >-
    violently knocked back by a heavy blow: torso bent and twisted away from the heroes, one arm thrown up across his
    face, knees buckling, the glaive dipping toward the ground, cracks and small ice shards bursting from his chest
    armour, mantle flung forward around him
  # pass F 3.7: the heavy attack's raised hold (fits the cell by crouching, as garland's)
  attack_raise: >-
    the wind-up of an overhead glaive strike: both gauntlets lifting the glaive high above his crowned skull, the long
    haft held diagonally with the blade swept back high behind his head; it is exactly the glaive of Image 3, as long as
    in Image 3 (its dark haft nearly spans the image), with the same slim curved blade of clouded blue ice, the thin cyan
    rune line inlaid along the blade, and the small spearhead point at its tip; no frost trail, smear or motion arc on
    the blade. The skull face as crisp and readable as in Image 3 (cracked bone, two pale cyan eye lights, a toothed
    jaw) and the tall crown of jagged icicles as in Image 3; mantle lifting; he sinks into a deep crouch with both knees
    bent so that the whole figure, icicle crown and raised glaive included, stays inside the grey box at exactly the
    same pixel size as in Image 3 (the raised blade is the highest point, well below the top of the image)
  face: the skull face with two pale cyan eye lights and a toothed jaw is readable
  extra_negative: a helmet or mask covering the skull, a sword, skulls on the shoulders, a throne, a second weapon
  seeds: [1234]
  sheet_seeds: {boss_attack_raise: 1236}   # 1234 painted the guide's ground line across both boots (ACT1_LOG #29);
  # 1235 (#30) drew a broad flat cleaver without the rune inlay or spearhead and a muddy skull (retry #32)
# ── pass R, G1: the New Fiends (docs/ROSTER_PLAN.md 4.1; lore: the bestiary spec's "New Fiends"). Original designs, one
# image per pose like the lich; boss_idle first, every later pose sends it as the identity image. FW-9 fields:
# `body` picks the per-body motion line, `base` the base-is-the-creature sentence, `idle_negative` is avoided in
# boss_idle only (so the disguise holds there and the action poses may reveal what it bans).
- id: ashen_queen
  # "the Ashen Queen", Fiend of Fire: a sun priestess who entered the sacred flame and took her god's shape
  size: boss
  per_pose: true
  design_ref: false
  body: naga
  base: the broken stone altar under her lowest coil
  prompt: >-
    the Ashen Queen, a towering six-armed sun priestess transformed by sacred fire; the upper body is a tall, graceful
    humanoid torso of blackened, cracked stone-like skin with molten orange-gold light glowing through the fissures;
    exactly six arms, three on each side: the upper pair raised holding a small radiant sun disc between them, the
    middle pair in open blessing and offering gestures, the lower pair holding a curved ceremonial bronze blade (near
    side) and a smoking censer on a chain (far side); a radiant crown of gold rays frames a cracked white ceremonial
    mask; no legs: below the waist a vast serpentine tail of charcoal scales with ember-lit undersides, coiled around a
    broken stone altar on the ground; palette of charcoal, ember orange, white-gold, bronze and ash grey
  action_prompt: >-
    the Ashen Queen, a towering six-armed sun priestess transformed by sacred fire, exactly as in Image 3: the tall
    humanoid torso of blackened, cracked stone-like skin with molten orange-gold light in the fissures; exactly six
    arms, three on each side, with the small radiant sun disc, the curved ceremonial bronze blade and the smoking censer
    on a chain; the radiant crown of gold rays and the cracked white ceremonial mask; no legs: the vast serpentine tail
    of charcoal scales with ember-lit undersides coiled around the broken stone altar; palette of charcoal, ember
    orange, white-gold, bronze and ash grey
  # approved boss_attack is seed 1234 with this text (ROSTER_LOG R2, R5: best of 3). The two retries asked for the blade
  # leading the sweep: 1235 "the lower arm that holds the curved bronze blade in Image 3 sweeps across her body so the
  # blade slashes far out in front of her toward the heroes ..." (R3: grey box background, four arms, props swapped);
  # 1236 "... every prop stays in the same hand as in Image 3 ... sweeps it across the front of her body ..." (R4: an
  # idle stance with the blade held flat across the waist, no lunge)
  attack: >-
    lunging forward on the coiled tail toward the heroes, the three near-side arms striking in one sweeping blow with
    the bronze blade leading, the three far-side arms thrown back, the tail coil tightening around the altar
  cast: >-
    a sacred fire rite: she rises tall on the coiled tail, all six arms spread in a ritual formation, the sun disc
    between the upper hands blazing white-gold, small sparks rising around her hands; the bronze blade stays in the
    lower left hand and the censer in the lower right hand, as in Image 3
  hurt: >-
    struck hard: recoiling back over the coil, away from the heroes to the left, the crack in the mask flaring
    brighter, the arms flung outward out of rhythm, the censer chain swinging; she still has exactly six arms, all six
    clearly visible: three on the left side of the image (the upper one with the sun disc, the middle one open, the
    lower one with the bronze blade) and three on the right side of the image (the upper one open, the middle one open,
    the lower one with the censer on its chain), as in Image 3
  # boss_attack_raise 1235 (R14) text: "... all six arms raised high overhead together, every one of the six hands
  # lifted above the top of the radiant crown, the arms forming a tall V of three on each side ..." (a near copy of the
  # idle); 1236 names every hand by image side (the wording that fixed the props in R8 / R10 / R21) and sinks the mask
  attack_raise: >-
    the wind-up of a crushing sunfire blow, in the same front view as Image 3 (torso and mask toward the viewer, never
    her back): she sinks low into her coil, the torso lowered so that the mask sits near the middle of the image, and
    lifts all six arms straight up above the radiant crown. On the left side of the image: the upper hand holds the sun
    disc high above the crown, the middle hand is open above the crown, the lower hand grips the bronze blade raised
    high above the crown. On the right side of the image: the upper hand is open above the crown, the middle hand is
    open above the crown, the lower hand holds the censer chain up above the crown with the censer hanging from it.
    Exactly six arms in a tall V, three on each side, all six clearly visible; the mask and crown exactly as in Image 3;
    the tail coiled low and tight around the altar. This pose must look clearly different from Image 3: the mask much
    lower and every hand above the crown. The whole figure, raised hands included, stays inside the grey box at exactly
    the same pixel size as in Image 3 (the raised blade is the highest point, well below the top of the image)
  face: the cracked white ceremonial mask with two burning slits is readable; no human face shows
  extra_negative: legs, feet, four arms, eight arms, a second blade, a throne, wings
  seeds: [1234]
  sheet_seeds: {boss_cast: 1236, boss_hurt: 1235, boss_attack_raise: 1236}   # boss_cast 1234 (ROSTER_LOG R6): props swapped sides, frayed tail tip; 1235 (R7,
  # with a long per-hand prop clause): magenta hole and fringe, five arms, muddy palette; boss_hurt 1234 (R9): five arms;
  # 1235 (R10, approved as best of 3): pink key fringe on the smoke, forked tail tip; 1236 (R11, + "only a thin wisp
  # of smoke from the censer"): clean but no recoil; boss_attack_raise 1234 (R13): guide box painted, arms not raised;
  # 1235 (R14): a near copy of the idle; 1236 (R33): an exact copy of the idle. No boss_attack_raise is approved
  # (deferred, ROSTER_LOG R34)
- id: drowned_sovereign
  # "the Drowned Sovereign", Fiend of Water: an ancient king in impossibly flowing robes; the idle is the disguise,
  # every action pose opens the robes on the abyssal creature beneath
  size: boss
  per_pose: true
  design_ref: false
  body: robed
  idle_negative: tentacles, suckers, fins, fish features
  prompt: >-
    the Drowned Sovereign, an ancient, composed human king crowned with tarnished gold set with pearls, an aged regal
    face with calm pale eyes and wet grey hair; he wears magnificent ceremonial robes of deep abyssal teal and
    pearl-white with gold embroidery; the robes are impossibly long and flowing, their hems drifting outward and upward
    as if under water and pooling wide on the ground, hiding his whole body; one pale hand extends from a wide sleeve
    holding a coral sceptre, the other is hidden; nothing inhuman is visible
  action_prompt: >-
    the Drowned Sovereign, exactly as in Image 3: the same tarnished gold crown set with pearls, the aged regal face
    with pale eyes and wet grey hair, the same impossibly long pearl-white and abyssal-teal ceremonial robes with gold
    embroidery, their hems pooling wide on the ground, and the coral sceptre; the robes are able to part and open,
    revealing dark teal tentacles with pale suckers beneath
  attack: >-
    the robes part at the front and three dark teal tentacles with pale suckers lash out far toward the heroes; the
    crown, face and robe outline stay as in Image 3: the same deep abyssal-teal outer robe with wide sleeves over the
    pearl-white inner robe, the hems pooling wide on the ground, at the same size as in Image 3
  cast: >-
    an abyssal spell: the robes open wide like a fan and six dark teal tentacles spread in a circular ritual formation
    behind him, their tips glowing a deep abyssal blue; he raises the coral sceptre; the crown, face and robes stay as in
    Image 3: the same deep abyssal-teal outer robe with wide sleeves over the pearl-white inner robe, the hems pooling wide on the ground, the coral-red sceptre, at the same size as in Image 3
  hurt: >-
    knocked back: dark teal tentacles erupt defensively from under the robe around him, face grimacing, the crown
    tilted askew but still sitting on his head, touching it; the coral-red sceptre still in the same hand as in Image 3
    (the hand on the right side of the image); the robes stay as in Image 3: the same deep abyssal-teal outer robe with wide sleeves over the pearl-white inner robe, the hems pooling wide on the ground, the coral-red sceptre, at the same size as in Image 3
  attack_raise: >-
    the wind-up of his heaviest blow, the most revealing pose, seen in the same three-quarter front view as Image 3
    (face and crown toward the viewer and the heroes on the right, never his back): the front of the robes flung wide
    open from the collar to the hem, showing the writhing tentacle mass inside where his body should be; a mass
    of dark teal tentacles with pale suckers and a glimpse of something enormous folded beneath rising high behind him,
    the coral-red sceptre raised high in the same hand as in Image 3; the crown on his head and the face exactly as in
    Image 3 (a crisp, readable aged face in profile with pale eyes, a clear nose and brow), the abyssal-teal outer robe with wide sleeves
    over the pearl-white inner robe as in Image 3; he sinks low into the pooled robes so that the
    whole figure, raised tentacles included, stays inside the grey box at exactly the same pixel size as in Image 3
    (the highest tentacle tip well below the top of the image)
  face: the aged human face under the crown, with calm pale eyes, is readable
  extra_negative: a second crown, a throne, a fish tail
  seeds: [1234]
  sheet_seeds: {boss_attack: 1236, boss_hurt: 1235, boss_attack_raise: 1235}   # boss_attack 1234 (ROSTER_LOG R16): guide ground line painted pink under the hem;
  # 1235 (R17, the text without the robe anchor sentence): teal outer robe lost, smaller; boss_hurt 1234 (R20):
  # the crown flew off, the sceptre switched hands; boss_attack_raise 1234 (R22): muddy face, robes closed
- id: hollow_seraph
  # "the Hollow Seraph", Fiend of Wind: an empty celestial guardian of white armour, mechanical wings and a broken
  # halo; her composure stays intact even when hurt
  size: boss
  per_pose: true
  design_ref: false
  floating: true
  body: floating
  # the floating line ("tilt the whole body along a strong diagonal ...") hid or bunched wings in R26-R31; only the
  # poses not yet approved get this line (attack and cast keep their approved keys)
  motion:
    hurt: &seraph_motion >-
      Keep the front or three-quarter front view of Image 3 and a symmetric, composed posture, the armour upright or
      tilted only slightly; all six wings stay separately visible with their brass joints, three on the left side of
      the image and three on the right side of the image, none hidden behind the armour or bunched together; the
      movement is in the wings, gauntlets and halo, and trailing parts lag behind the motion.
    attack_raise: *seraph_motion
  prompt: >-
    the Hollow Seraph, a hovering hollow suit of elegant white and pale-gold armour with no body inside, the open helm
    showing only darkness; a fractured golden halo floats above the helm; exactly six articulated mechanical wings,
    three on each side, of overlapping metallic feathers in white steel with brass joints, half spread, the highest
    wing tips well below the top of the grey box; thin hanging greaves, no feet on the ground, nothing below the
    greaves (no wind, no debris, no shadow); palette of white steel, pale gold, brass, storm grey and a cold white-blue
    glow
  action_prompt: >-
    the Hollow Seraph, exactly as in Image 3: a hovering hollow suit of elegant white and pale-gold armour with no body
    inside, the open helm showing only darkness, the fractured golden halo floating above the helm, exactly six
    articulated mechanical wings, three on each side, of overlapping metallic feathers in white steel with brass joints,
    thin hanging greaves; palette of white steel, pale gold, brass, storm grey and a cold white-blue glow
  attack: >-
    a cutting wing strike: the six wings swing forward in a wide arc toward the heroes on the right, the three near
    wings fanned out in front of the armour and the three far wings fanned out behind it, all six separately visible
    with their brass joints, their sharp metal feather tips pointing toward the heroes, the armour leaning forward;
    exactly six wings, as in Image 3, at exactly the same pixel size as in Image 3; the fractured halo in its two broken arcs above the helm, as in Image 3; no wind
    streaks, no effects; the whole figure well below the top of the grey box
  # approved boss_cast is seed 1234 with this text (ROSTER_LOG R29, R32: best of 3); the retries (R30 "seen from the
  # front like Image 3 ... symmetric like a fan", R31 "the same front-facing hovering posture as Image 3 ... every wing
  # lifted higher") both came back with four wings
  cast: >-
    a storm rite: the six wings raised and spread wide to the sides, both gauntlets lifted, the halo crackling with
    short white-blue lightning drawn on the two broken halo arcs themselves; exactly six wings, three growing from each
    shoulder, all six separately visible, as in Image 3; no other effects; the whole figure, wing tips and halo
    included, at the same pixel size as in Image 3 and well below the top of the grey box
  hurt: >-
    a sharp jolt: bright cracks across the breastplate, the two broken halo arcs knocked askew above the helm, the
    whole armour tilted back by about fifteen degrees, the helm with its visor bars around the dark opening exactly as
    in Image 3; the three wings on the left side of the image and the three wings on the right
    side of the image all stay visible, the lowest wing on each side faltering downward with its feathers splayed, the
    upper wings flaring; the posture stays upright and controlled, her composure intact; no cape, cloth or ribbon
    anywhere (Image 3 has none)
  # approved boss_attack_raise is seed 1234 with this text (ROSTER_LOG R38, R41: best of 3). The retries asked for "seen
  # squarely from the front like Image 3, ... mirror-symmetric ... all six wings folded upward and inward behind her"
  # (1235, R39: six wings but cream palette, hood, skirt, smaller) and added "the same white steel and pale-gold armour
  # colours ..., the same helm with its visor bars ..., as tall as in Image 3" (1236, R40: magenta key patches, no halo)
