  tier: base
  partner: berserker
  battle_sheet: ~/temp/heroes/barbarian_berserker_sprite_sheet.png
  row: 0
  cell: [80, 80]
  body_box: null
  poses: [ready, victory]
  weapon_view: null
  stand_in: warrior
  look: >-
    a young northern barbarian warrior, about 20: a stocky, muscular build; shaggy copper-orange hair to the
    shoulders under a dented iron helmet with two short curved cream horns; a clean-shaven, eager young face; bare
    chest crossed by a leather strap, a grey wolf-fur mantle on the shoulders; brown leather breeches, grey fur cuffs
