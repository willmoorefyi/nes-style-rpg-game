# Pass CFP (docs/CLASS_FIELD_PACKS_PLAN.md): the ChatGPT walk-sheet packs of the hero classes that have a battle sheet
# but no field (overworld) sheet yet. gen/class_field_pack.py builds one pack per entry; the user renders the sheet in
# ChatGPT and gen/field_user.py imports it. To add a class, add its entry (and its partner's) below and run
#   python3 -I assets-src/gen/class_field_pack.py <id> [<partner>]
# Keys: name, tier (base | enhanced), partner (the other class of the pair, naming this one back), battle_sheet (~
# expanded; relative = from assets-src/gen), row (0 = base, 1 = enhanced), cell [w, h] of the battle sheet, body_box
# [x0, y0, x1, y1] inside the cell (exclusive end) or null, poses (design poses: ready attack cast hurt down victory
# kneel), weapon_view (a pose whose whole cell is also shown, or null), stand_in (a hero with an approved 3 x 3 field
# sheet: the pose / grid reference), look (the character as it reads at field size), carry (how the weapon is carried
# while walking; it must stay inside the 48 x 96 cell and touch the body).
defaults:
  walk_reference: boy          # approved/<id>/field.png: the foot-alternation reference (the user-approved PT boy)
  height: 88                   # drawn px, head (or helmet) top near row 6, soles on row 93
  max_height: 92               # field_user.py's adult band is 84-92 (whole figure, weapon included)
  max_width: 46                # field_user.py MAX_W

