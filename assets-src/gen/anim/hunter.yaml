# round 1 (image review: the ready / attack blend put the bow over the face and doubled it): atk_mid is the attack
# key leaned 1 px back with the string hand 2 px forward (drawing), atk_follow the attack key with the string hand
# released 9 px back past the ear (round 2) (tools: /tmp scratch, key + delta - the generic target).
# tweaks (round 0): cast_rise is the cast key's body and legs with the raised hand a few px low (the plain lerp
# cracked the legs and dropped the leaves); atk_follow keeps the bow upright after the shot (the generic follow-through swings a held weapon
# down and forward, which lays a bow flat); cast_gather keeps the near hand and its bow at the ready place.
