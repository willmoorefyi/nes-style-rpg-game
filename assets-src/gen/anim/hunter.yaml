# Puppet animation joints for the hunter (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11). Native px
# on approved/hunter/battle.png cells (80x80, the user's render, every pose faces left; n = near/viewer-side limb, f = far
# limb). tip = the bow (held in the near hand in ready and attack; in the cast key the far hand holds it low and it
# is not a weapon part, the cast frames keep the key's body). part_boxes ([x0, y0, x1, y1), half-open): the bow and
# the arrow, wider than a bone's reach. Marked on 10x gridded cells.
robed: false
keep_specks: true
# plan 5 review fallback (image review round 3 still ITERATE: the dotted string breaks in the wind-ups and the
# follow-through shows no release): these in-betweens are left to their source keys (ready, ready, attack)
alias_frames: [atk_wind1, atk_wind2, atk_follow]   # plan 13 (A3): the dotted bow string survives the cut
attack_hand: n
cast_hand: n
front_far_arm: {ready: true, attack: true, cast: true}
