# Puppet animation joints for the paladin (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/paladin/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the sword in the near hand (ready, attack); the cast key holds it low in the other hand (no weapon part), its sparkle rides with the raised forearm; the kite shield and the cape ride with the torso. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
# Marked on 10x gridded cells.
robed: false
attack_hand: n
cast_hand: n
keep_specks: true   # plan 13 (A3): the 1 px sparkle dots of the cast survive the cut
# round 2 (image review: the separate sparkle gains an outline ring whenever its forearm moves, so it flickers):
# cast_rise / cast_release are left to the cast key (the plan 5 alias); idle_b / cast_gather keep the hips (no knee seam)
alias_frames: [atk_wind1, atk_wind2, cast_rise, cast_release]   # round 3 still ITERATE on the wind-ups (a forearm sliver, the weapon over the face): fallback
front_far_arm: {ready: true, attack: true, cast: true}
