    dy: 1
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-5, -1], neck: [-3, -1], chest: [-2, 0], sh_n: [-2, -2], el_n: [-3, 0], hand_n: [-5, 2], sh_f: [-4, 1], el_f: [-4, 10], hand_f: [3, 17], knee_f: [6, 0], foot_f: [6, 0]}
