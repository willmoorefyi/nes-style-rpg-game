                               # rigid lean, so no forearm / chest seam), stick arm 28 lower (t 0.80)
    t: 0.80
    moves: []
    tweaks: {crown: [7, 3], neck: [4, 2], chest: [3, 1], sh_n: [3, 2], el_n: [3, 3], hand_n: [-1, 10], sh_f: [5, 0], el_f: [4, 7], hand_f: [10, 12]}
