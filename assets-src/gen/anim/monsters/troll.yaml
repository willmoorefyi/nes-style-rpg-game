    tweaks: {crown: [4, 0], neck: [2, 0], chest: [1, 0], sh_n: [2, 1], el_n: [5, -1], hand_n: [11, -3]}
  hurt_in1:                    # recoil 3, hunch 8 forward, head 6 down, near arm 24 up to guard; the mallet stays put
