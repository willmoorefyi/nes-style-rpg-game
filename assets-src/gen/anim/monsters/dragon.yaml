sprite: dragon
body: quadruped
facing: right
sampler: nearest
breath: true
# Pass V redesign (R320): a tall upright red fire dragon on its thick hind legs, the S-curved neck and horned head
# high, the forelegs raised in front of the chest, bat wings folded behind the shoulders, the tail curled on the ground.
# The attack (ranged, in place) is the neck arched forward and down with the jaws open; the hurt is the head knocked
# back and down, the forelegs drawn in. Every in-between is a translation-only copy of its source key (moves: []):
# the upper body (spine, wings, forelegs) as one group, the tail still on the ground, the neck and head a little further; the hind knees and
# feet pinned; the folded wings are one rigid part on the withers. The key switches carry the pose change. Distinct
# from white_dragon's lean-back bite: the red dragon draws itself up and back for an inhale, the wings lifting.
