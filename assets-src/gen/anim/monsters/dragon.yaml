sprite: dragon
body: quadruped
facing: right
sampler: nearest
breath: true
# Wings: the folded idle wing is one rigid part (wing_i) on the withers; attack / hurt wings use their own root joints
# (wr_n / wr_f, not joined to the body, so the art gap between wing and neck is not crack-filled or counted as a seam)
# and every wing move is an explicit tweak (a rotation about the root, <= 30 deg). The idle wing has no attack / hurt
# counterpart, so frames cut from idle keep it folded and frames cut from attack keep the raised wings.
# Continuity: idle -> attack moves the centroid 19.9 px up (cap 10 per step), so atk_mid and atk_follow sit at the
# centroid midpoint: body 8 px lower, near wing 24 deg down, tail swung 24 deg down, far wing nearly unrotated.
# Hurt: hurt_in1 rears 30% toward hurt with the hip lifting toward the hurt hip (hind paws planted); hurt_in2 pitches
# the upright body 30% back toward idle and drops it 10 px (hips 6, knees 3, so the hind legs stay long enough to
# read; tail tip planted on the plain), the whole frame 4 px back (the recoil side); its neck and head keep the hurt
# angle (they turned apart and left a ghost horn, E6).
# The between-legs belly band of idle rides the body, the near haunch of hurt is thigh_n (E6 belly patches).
