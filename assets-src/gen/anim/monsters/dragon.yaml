frames:
  atk_wind1:                  # anticipation: wings start to lift, head drawn back, body leans 1 px back
    t: 0.0
    dy: 0
    moves: []
    tweaks: {wtip_i: [3, -8], head: [-2, -1], snout: [-2, -1], hip: [-1, 0], back: [-1, 0], chest: [-1, 0], neck: [-1, 0], tail0: [-1, 0], tail1: [-1, 0], tail2: [-1, 0], tail3: [-1, 0], tail_tip: [-1, 0]}
  atk_wind2:                  # coil: wings lifted 24 deg, head reared back, body 2 px back (t only sets the bbox lerp; motion is tweaks)
    t: 0.1
    dy: 0
    moves: []
    tweaks: {wtip_i: [8, -15], neck: [-3, -1], head: [-4, -2], snout: [-4, -2], hip: [-2, 0], back: [-2, 0], chest: [-2, 0], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail3: [-2, 0], tail_tip: [-2, 0]}
  atk_mid:                    # the pass: body 8 px lower, wings half raised, tail swung down, near hind paw planted
    t: 0.35
    sampler: rotsprite        # the turned wings: nearest left spurs and specks along wing_f's edge
    pins: [knee_n, foot_n, toe_n]
    moves: [back, chest, neck, head, snout, hip_f, knee_f, foot_f, toe_f]
    tweaks: {foot_n: [3, 0], toe_n: [3, 0], knee_n: [3, 0], hip: [2, 8], back: [2, 8], chest: [2, 8], neck: [2, 8], head: [2, 8], snout: [2, 8], tail0: [2, 8], tail1: [2, 14], tail2: [-4, 18], tail3: [-9, 17], tail_tip: [-12, 12], wr_n: [2, 8], wt_n: [-15, 28], wr_f: [2, 8], wt_f: [10, 8], sh_n: [2, 8], el_n: [2, 8], paw_n: [2, 7], ftoe_n: [2, 7], sh_f: [2, 8], el_f: [2, 8], paw_f: [2, 8], ftoe_f: [2, 8], hip_n: [2, 8], hip_f: [2, 8], knee_f: [2, 5], foot_f: [2, 3], toe_f: [2, 3]}
  atk_follow:                 # downstroke after the bite: body drops 8 px, wings beat down, tail swings down
    t: 0.68
    sampler: rotsprite        # edge roughness of the turned wings (F6 +5.28 with nearest)
    pins: [knee_n, foot_n, toe_n]
    moves: [back, chest, neck, head, snout, hip_f, knee_f, foot_f, toe_f]
    tweaks: {knee_n: [1, 2], hip: [2, 8], back: [2, 8], chest: [2, 8], neck: [2, 8], head: [2, 8], snout: [2, 8], tail0: [2, 8], tail1: [2, 14], tail2: [-4, 18], tail3: [-9, 17], tail_tip: [-12, 12], wr_n: [2, 8], wt_n: [-15, 28], wr_f: [2, 11], wt_f: [8, 11], sh_n: [2, 8], el_n: [2, 8], paw_n: [2, 7], ftoe_n: [2, 7], sh_f: [2, 8], el_f: [2, 8], paw_f: [2, 8], ftoe_f: [2, 8], hip_n: [2, 8], hip_f: [2, 8], knee_f: [2, 5], foot_f: [2, 3], toe_f: [2, 3]}
  atk_recover:                # settle: wings still lifted 30 deg, spine 30% toward the lunge
    t: 0.3
    moves: [back, chest, neck, head, snout]
    tweaks: {wtip_i: [11, -18], hip: [-2, 0], back: [-2, 0], chest: [-2, 0], neck: [-2, 0], head: [-2, 0], snout: [-2, 0], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail3: [-2, 0], tail_tip: [-2, 0]}
  hurt_in1:                   # rear starts: hip lifts toward the hurt hip, spine pitched up, wings flung up, hind paws planted
    t: 0.3
    pins: [foot_n, foot_f]
    moves: [hip, back, chest, neck, head, snout, knee_n, knee_f]
    tweaks: {wtip_i: [9, -14]}
  hurt_in2:                   # nearly recoiled: upright body pitched 30% back down and dropped toward the plain, tail tip on the ground
    t: 0.3
    pins: []
    moves: [back, chest]      # neck and head keep the hurt angle (only the tweaks move them)
    tweaks: {hip: [-4, 10], back: [-4, 10], chest: [-4, 10], neck: [-4, 10], head: [-4, 10], snout: [-4, 10], tail0: [-4, 10], wr_n: [0, 14], wt_n: [0, 14], sh_n: [-4, 10], el_n: [-4, 10], paw_n: [-4, 10], ftoe_n: [-4, 10], hip_n: [-4, 6], hip_f: [-4, 6], knee_n: [-4, 3], knee_f: [-4, 3], foot_n: [-4, 0], foot_f: [-4, 2], toe_n: [-4, 0], toe_f: [-4, 2], tail1: [-4, 5], tail2: [-4, 0], tail3: [-4, 0], tail_tip: [-4, 0]}
holds: []
paint:                         # outline ink: a 1 px neck/head crack (follow)
  - {frame: atk_follow, xy: [[91, 83]], rgb: [6, 4, 10]}
