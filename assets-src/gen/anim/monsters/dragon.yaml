parts:
  uwing_n: {remove: true}
  fwing_n: {remove: true}
  uwing_f: {remove: true}
  fwing_f: {remove: true}
  wing_i: {bone: [chest, wtip_i], radius: 8.0, in: [idle]}     # the folded idle wing rides the withers
  wing_n: {bone: [wr_n, wt_n], radius: 8.0}
  wing_f: {bone: [wr_f, wt_f], radius: 8.0}
  tail: {chain: [tail0, tail1, tail2, tail3, tail_tip]}
  body: {width: 16}            # warp half-width in cell px (not scaled); auto (29.5) carried belly pixels far off the spine
