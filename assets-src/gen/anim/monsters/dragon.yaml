    t: 0.0
    moves: []
    dy: 0
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {hip: [-1, 0], back: [-1, 0], chest: [-1, 0], neck: [-2, -1], head: [-2, -1], snout: [-2, -1], wtip: [-1, -1], sh_n: [-1, 0], el_n: [-1, 0], paw_n: [-1, 0], ftoe_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0], paw_f: [-1, 0], ftoe_f: [-1, 0], hip_n: [-1, 0], hip_f: [-1, 0]}
