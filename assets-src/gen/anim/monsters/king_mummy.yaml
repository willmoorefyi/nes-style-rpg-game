sprite: king_mummy
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/king_mummy/monster_large.png,
# backend: user; 128x128 cells, the idle 92 px tall). The old rig is archived as anim/monsters/_retired/king_mummy_v1.yaml.
# The pirate's recipe: the bandaged torso with the hip at the kilt, the arms and the crook ride the torso (arm and
# weapon parts removed), so every in-between is a rigid lean or shift of its source key's upper body about the hip
# (tweaks under `moves: []`: each upper joint rotated about `hip`, rounded to whole px).
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [58, 35]
    neck: [58, 52]
    chest: [58, 62]
    hip: [58, 95]
    sh_n: [66, 62]
    el_n: [72, 70]
    hand_n: [78, 68]
    sh_f: [48, 60]
    el_f: [46, 74]
    hand_f: [46, 86]
    hip_n: [62, 97]
    knee_n: [64, 106]
    foot_n: [66, 118]
    toe_n: [68, 121]
    hip_f: [52, 97]
    knee_f: [50, 106]
    foot_f: [48, 118]
    toe_f: [48, 121]
  attack:
    crown: [64, 36]
    neck: [66, 50]
    chest: [62, 62]
    hip: [60, 93]
    sh_n: [70, 58]
    el_n: [78, 64]
    hand_n: [84, 58]
    sh_f: [56, 62]
    el_f: [66, 70]
    hand_f: [84, 64]
    hip_n: [70, 95]
    knee_n: [80, 100]
    foot_n: [80, 116]
    toe_n: [84, 121]
    hip_f: [52, 95]
    knee_f: [40, 104]
    foot_f: [30, 116]
    toe_f: [26, 121]
  hurt:
    crown: [40, 38]
    neck: [44, 52]
    chest: [50, 64]
    hip: [56, 94]
    sh_n: [62, 60]
    el_n: [68, 64]
    hand_n: [74, 64]
    sh_f: [40, 62]
    el_f: [28, 68]
    hand_f: [24, 58]
    hip_n: [62, 96]
    knee_n: [66, 104]
    foot_n: [70, 118]
    toe_n: [76, 121]
    hip_f: [50, 96]
    knee_f: [44, 104]
    foot_f: [40, 118]
    toe_f: [38, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}
  farm_n: {remove: true}
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 10.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                  # draw back: the idle's upper body 3 px back (a shift: a lean swings the crook's hook into the head)
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-3, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-3, 0], hand_n: [-3, 0], sh_f: [-3, 0], el_f: [-3, 0], hand_f: [-3, 0]}
  atk_wind2:                  # gather: 2 deg and 2 px forward, 1 down, into the spring (the keys sit far apart)
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [4, 1], neck: [4, 1], chest: [3, 1], sh_n: [3, 1], el_n: [3, 1], hand_n: [3, 2], sh_f: [3, 1], el_f: [3, 1], hand_f: [2, 0]}
  atk_mid:                  # the lunge key's upper body 5 px short of it (a shift: a lean tore the crook)
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-5, 0], neck: [-5, 0], chest: [-5, 0], sh_n: [-5, 0], el_n: [-5, 0], hand_n: [-5, 0], sh_f: [-5, 0], el_f: [-5, 0], hand_f: [-5, 0]}
  atk_follow:                  # the lunge key, 2 px short
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
  atk_recover:                  # the idle's upper body 5 px toward the lunge, on the way back (a shift)
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [5, 0], neck: [5, 0], chest: [5, 0], sh_n: [5, 0], el_n: [5, 0], hand_n: [5, 0], sh_f: [5, 0], el_f: [5, 0], hand_f: [5, 0]}
  hurt_in1:                  # flinch: the idle thrown back 4 deg, 2 px back
    moves: []
    tweaks: {crown: [-6, 0], neck: [-5, 0], chest: [-4, 0], sh_n: [-4, 0], el_n: [-4, -1], hand_n: [-4, -1], sh_f: [-4, 1], el_f: [-3, 1], hand_f: [-3, 1]}
  hurt_in2:                  # the hurt key's upper body 3 px forward on the way to the idle (a shift: a lean closes the crook arm into a hole)
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [3, 0], neck: [3, 0], chest: [3, 0], sh_n: [3, 0], el_n: [3, 0], hand_n: [3, 0], sh_f: [3, 0], el_f: [3, 0], hand_f: [3, 0]}
  daze:                  # slump: the idle's upper body 1 px back (a shift); the recipe's head nudge cancelled (it closed the gap to the crook)
    moves: []
    dy: 0
    tweaks: {crown: [-3, -2], neck: [-3, -2], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  daze_b:                  # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-3, -1], neck: [-3, -2], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
masks: {}
holds: []
paint:
  - {frame: atk_recover, xy: [[57, 93]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[61, 70], [61, 71], [61, 72], [61, 73], [62, 73]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[57, 94]], rgb: [6, 4, 10]}
# pass KT: the approved kneel key (approved/king_mummy/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
