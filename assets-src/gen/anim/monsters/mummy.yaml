parts:
  weapon: {remove: true}
  # loose bandage streamers (attack, hurt): mesh-warped strips on their own root joints, hung from the chest / hip by
  # pixel-less anchor parts, so each streamer joins the torso only (the crack fill never bridges two streamer tips)
  anc1: {bone: {attack: [chest, sa1_0], hurt: [chest, sh1_0]}, radius: 0.01}
  anc2: {bone: {attack: [chest, sa2_0], hurt: [chest, sh2_0]}, radius: 0.01}
  anc3: {bone: {attack: [hip, sa3_0], hurt: [hip, sh3_0]}, radius: 0.01}
  anc4: {bone: {hurt: [hip, sh4_0]}, radius: 0.01}
  str1: {kind: cloth, bone: {attack: [sa1_0, sa1_1, sa1_2], hurt: [sh1_0, sh1_1, sh1_2]}, radius: 3.0, width: auto}
  str2: {kind: cloth, bone: {attack: [sa2_0, sa2_1, sa2_2], hurt: [sh2_0, sh2_1, sh2_2]}, radius: 3.0, width: auto}
  str3: {kind: cloth, bone: {attack: [sa3_0, sa3_1, sa3_2], hurt: [sh3_0, sh3_1, sh3_2]}, radius: 3.0, width: auto}
  str4: {kind: cloth, bone: {hurt: [sh4_0, sh4_1, sh4_2]}, radius: 3.0, width: auto}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  kneel_in1:
    tweaks: {foot_f: [0, 1], toe_f: [0, 1]}
  kneel_in2:
    tweaks: {knee_f: [0, 1], toe_f: [0, 1]}
  atk_wind1:                   # half of wind2
    moves: []
    tweaks: {crown: [-1, 0], neck: [-1, 0], el_n: [-1, 0], hand_n: [-2, 0]}
  atk_wind2:                   # crouch (dy 2) and draw back: head translated back (no head / torso rotation), near arm pulled in
    moves: []
    tweaks: {crown: [-2, 0], neck: [-2, 0], el_n: [-2, 0], hand_n: [-4, 1]}
  atk_mid:                     # legs held at the attack pose and shifted 1/3 back; arms keep their reach angles
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {knee_n: [3, 0], foot_n: [3, 0], knee_f: [3, 0], foot_f: [3, 0]}
    moves: [neck, chest, hip, crown, hip_n, hip_f, toe_n, toe_f]
  atk_follow:
    tweaks: {hand_n: [-2, 0], el_n: [-1, 0]}
  hurt_in1:                    # flinch: upper body drops 1, head knocked 3 forward / 2 down by translation (no head / torso
    moves: [sh_n, el_n, hand_n]  # rotation in an idle-sourced frame), near arm 35% toward the hurt guard
    dy: 1
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [3, 2], neck: [3, 2], chest: [1, 0]}
  hurt_in2:                    # head tilts back up a little about the neck (the neck stays: lifting it uncovers the back)
    t: 0.25
    moves: [crown, sh_n, el_n, hand_n]
    pins: [knee_n, foot_n, knee_f, foot_f]
  daze:                        # review fix: the boxing guard drops (near fist 6 px, far fist 4 px down), head 3 px down
    tweaks: {crown: [0, 1], neck: [0, 1], el_n: [-1, 2], hand_n: [-2, 6], sh_f: [0, 1], el_f: [0, 2], hand_f: [0, 4]}
  daze_b:                      # the sway's low point: the torso 1 px lower (recipe dy), the head kept at daze height
    tweaks: {crown: [0, 1], el_n: [-1, 2], hand_n: [-2, 6], sh_f: [0, 1], el_f: [0, 2], hand_f: [0, 4]}
z:
  idle: [uarm_f, farm_f, thigh_f, shin_f, ft_f, torso, thigh_n, shin_n, ft_n, head, uarm_n, farm_n]
  attack: [str1, str2, str3, thigh_f, shin_f, ft_f, torso, thigh_n, shin_n, ft_n, head, uarm_n, farm_n]
  hurt: [str1, str2, str3, str4, thigh_f, shin_f, ft_f, torso, thigh_n, shin_n, ft_n, uarm_n, farm_n, head]
