  - {frame: daze_b, xy: [[31, 39], [32, 39], [34, 39]], rgb: [115, 90, 90]}
  # pass K (K2-B): kneel frames: 1 px cracks and pockets closed with outline ink, outline ink where folded parts lost it, pixels below the feet row cleared
  - {frame: kneel_in1, xy: [[33, 38], [34, 60]], rgb: [198, 181, 156]}
  - {frame: kneel_in1, xy: [[27, 43]], rgb: [66, 57, 66]}
  - {frame: kneel_in1, xy: [[18, 63], [41, 60], [39, 62], [44, 62]], rgb: [6, 4, 10]}
  - {frame: kneel_in2, xy: [[40, 47]], rgb: [148, 132, 107]}
  - {frame: kneel_in2, xy: [[40, 48], [40, 49], [40, 50], [42, 52], [25, 72], [19, 59], [20, 59], [21, 60], [22, 60], [23, 60], [22, 61], [24, 61], [21, 62], [24, 63]], rgb: [6, 4, 10]}
  - {frame: kneel_in2, xy: [[41, 51]], rgb: [132, 115, 99]}
  - {frame: kneel_in2, xy: [[52, 76], [53, 76], [54, 76], [55, 76]], rgb: [6, 4, 10]}
  - {frame: kneel_in2, xy: [[20, 75]], rgb: [6, 4, 10]}
# pass K (K2-B): biped template, long legs (knee_forward, short_legs), head bowed further (deep_bow); K2-B it2: the far knee set down in front of its hip socket so the rear shin folds close under the body (a compact drop, not a stride); head bowed
kneel:
  variant: [knee_forward, short_legs, deep_bow]
  tweaks: {knee_f: [19, 2], foot_f: [19, 1], toe_f: [19, 0], sh_n: [0, 2], sh_f: [0, 2], neck: [0, 2], crown: [0, 2]}
  paint:
    - {xy: [[29, 46], [29, 47], [30, 47], [29, 48], [30, 48]], rgb: [181, 165, 140]}
    - {xy: [[37, 53], [37, 56], [35, 67]], rgb: [6, 4, 10]}
    - {xy: [[24, 73]], rgb: [115, 90, 90]}
