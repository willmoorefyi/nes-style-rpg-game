frames:
  atk_wind1:                   # crouch starts: spine tips nose-down, head sinks; the tail rides the body and starts to lift
    dy: 1
    moves: [back, chest]
    tweaks: {neck: [-1, 0], head: [-1, 0], snout: [-1, 0], tail2: [0, -1], tail_tip: [0, -2]}
  atk_wind2:                   # coil: chest and head low, head pulled back, tail lifting
    dy: 2
    moves: [back, chest]
    tweaks: {neck: [-2, 0], head: [-3, 0], snout: [-3, 0], tail1: [0, -1], tail2: [0, -2], tail_tip: [-1, -5]}
  atk_mid:                     # the pass: near hind paw part-way back toward idle, far forepaw part-way back; tail kept
    pins: [foot_n, foot_f, knee_n, paw_f, el_f, paw_n, el_n]
    moves: [back, chest, hip_n, knee_n, hip_f, knee_f]
    tweaks: {foot_n: [5, 0], knee_n: [5, 0], paw_f: [-2, 0], el_f: [-2, 0], paw_n: [-5, 0], el_n: [-5, 0]}
  atk_follow:                  # follow-through: spine and tail overshoot the lunge (head and forelegs keep the bite)
    t: 1.10
    moves: [back, chest, tail0, tail1, tail2, tail_tip]
  hurt_in1:                    # flinch: spine pitched up and back toward the hurt hunch; paws rigid on the ground
    pins: [paw_n, paw_f, foot_n, foot_f, ftoe_n, ftoe_f, toe_n, toe_f, knee_n, el_n]
  hurt_in2:                    # back out of the hunch; the far forearm held so the elbow does not flip
    pins: [paw_n, paw_f, foot_n, foot_f, ftoe_n, ftoe_f, toe_n, toe_f, el_f]
  daze:                        # head and neck hang, nose dipped, tail lowered; forelegs planted
    t: 0.0
    moves: [back, chest, neck, head, snout, tail0, tail1, tail2, tail_tip]
    tweaks: {neck: [1, 1], head: [0, 1], snout: [0, 3], tail1: [0, 1], tail2: [0, 2], tail_tip: [1, 2]}
  daze_b:                      # the sway's low point: head 1 px lower
    t: 0.0
    moves: [back, chest, neck, head, snout, tail0, tail1, tail2, tail_tip]
    tweaks: {neck: [1, 1], head: [0, 1], snout: [0, 4], tail1: [0, 1], tail2: [0, 2], tail_tip: [1, 2]}
masks:
  head:                        # the whole ear ring and the open lower jaw are head (not neck, not the far foreleg)
    attack: [[80, 40], [92, 39], [101, 45], [114, 51], [114, 63], [100, 64], [100, 74], [86, 74], [86, 60], [80, 56]]
