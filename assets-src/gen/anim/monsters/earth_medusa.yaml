    el_f: [38, 50]
    hand_f: [34, 40]
    tail0: [44, 100]
    tail1: [43, 94]
    tail2: [43, 88]
    tail_tip: [45, 84]
parts:
  weapon: {remove: true}
frames:
  atk_wind1:            # the upper body drawn back 4 px
    moves: []
    dy: 0
    t: -0.1
    tweaks: {hip: [-1, 0], chest: [-3, 0], neck: [-4, 0], crown: [-4, 0], sh_n: [-3, 0], el_n: [-4, 0], hand_n: [-4, 0], sh_f: [-3, 0], el_f: [-4, 0], hand_f: [-4, 0]}
  atk_wind2:            # back 6, down 1: the head furthest back, the claws drawn in
    moves: []
    dy: 0
    t: -0.15
    tweaks: {hip: [-2, 0], chest: [-4, 1], neck: [-6, 1], crown: [-6, 1], sh_n: [-4, 1], el_n: [-6, 1], hand_n: [-6, 1], sh_f: [-4, 1], el_f: [-6, 1], hand_f: [-6, 1]}
  atk_mid:              # the reach key pulled 8 back toward the wind-up
    moves: []
    dy: 0
    t: 0.0
    tweaks: {hip: [-3, 0], chest: [-6, 0], neck: [-8, 0], crown: [-8, 0], sh_n: [-6, 0], el_n: [-8, 0], hand_n: [-8, 0], sh_f: [-6, 0], el_f: [-8, 0], hand_f: [-8, 0]}
  atk_follow:           # the reach key, 1 past
    moves: []
    dy: 0
    tweaks: {chest: [1, 0], neck: [1, 0], crown: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
  atk_recover:          # the idle, the upper body 4 forward (coming back from the reach)
    moves: []
    dy: 0
    tweaks: {hip: [1, 0], chest: [2, 0], neck: [4, 0], crown: [4, 0], sh_n: [2, 0], el_n: [4, 0], hand_n: [4, 0], sh_f: [2, 0], el_f: [4, 0], hand_f: [4, 0]}
  hurt_in1:             # flinch: the idle's upper body thrown 3 back, the head 4 back and 1 up
    moves: []
    dy: 0
    tweaks: {hip: [-1, 0], chest: [-2, 0], neck: [-3, 0], crown: [-4, -1], sh_n: [-2, 0], el_n: [-3, -1], hand_n: [-3, -1], sh_f: [-2, 0], el_f: [-3, -1], hand_f: [-3, -1]}
  hurt_in2:             # the hurt key, the upper body 3 forward and 1 down on the way back
    moves: []
    dy: 0
    tweaks: {hip: [1, 0], chest: [2, 1], neck: [3, 1], crown: [3, 1], sh_n: [2, 1], el_n: [3, 1], hand_n: [3, 1], sh_f: [2, 1], el_f: [3, 1], hand_f: [3, 1]}
  daze:                 # slump: the head and arms 2 down
    moves: []
    dy: 0
    tweaks: {neck: [1, 2], crown: [1, 2], el_n: [0, 1], hand_n: [0, 2], el_f: [0, 1], hand_f: [0, 2]}
  daze_b:               # the head 3 down
    moves: []
    dy: 0
    tweaks: {neck: [1, 3], crown: [1, 3], el_n: [0, 2], hand_n: [0, 3], el_f: [0, 2], hand_f: [0, 3]}
masks:
  coil:                        # the resting coil below the rising body: static (pinned)
    idle: [[0, 99], [128, 99], [128, 128], [0, 128]]
    attack: [[0, 99], [128, 99], [128, 128], [0, 128]]
    hurt: [[0, 99], [128, 99], [128, 128], [0, 128]]
holds: []
paint: []
# pass KT: the approved kneel key (approved/earth_medusa/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
