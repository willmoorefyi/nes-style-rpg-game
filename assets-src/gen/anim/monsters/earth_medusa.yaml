parts:
  weapon: {remove: true}
  tail: {remove: true}         # no free tail: the tail end lies in the coil
frames:
  # stone, heavier than the medusa: the upper body leans back as one block, the far arm (half) lagging; every
  # frame translates (the keys' arms are 60-120 deg apart, over the 30 deg cap at t 0.35)
  atk_wind1:
    moves: []
    tweaks: {hip: [-2, 0], chest: [-3, 0], neck: [-3, 0], crown: [-4, 0], sh_n: [-3, 0], el_n: [-4, 0], hand_n: [-6, 0], sh_f: [-3, 0], el_f: [-3, 0], hand_f: [-2, 0]}
  atk_wind2:                   # the near claw drawn back past the chest
    moves: []
    dy: 1
    tweaks: {hip: [-3, 0], chest: [-6, 1], neck: [-7, 1], crown: [-8, 1], sh_n: [-6, 1], el_n: [-8, 1], hand_n: [-11, 1], sh_f: [-6, 1], el_f: [-6, 1], hand_f: [-6, 1]}
  atk_mid:                     # the reach pulled back toward the wind-up (t kept low: the coil is fixed per key)
    t: 0.2
    moves: []
    tweaks: {hip: [-2, 0], chest: [-4, 1], neck: [-4, 1], crown: [-4, 1], sh_n: [-4, 1], el_n: [-6, 1], hand_n: [-8, 1], sh_f: [-4, 1], el_f: [-6, 1], hand_f: [-8, 1]}
  atk_follow:
    moves: []
    tweaks: {chest: [1, 0], neck: [1, 0], crown: [1, 0], sh_n: [1, 0], el_n: [2, 0], hand_n: [3, 0], sh_f: [1, 0], el_f: [2, 0], hand_f: [3, 0]}
  atk_recover:                 # the head eases toward the attack (the chest held: moving it slid the far forearm's
                               # pale armband under the far upper arm)
    moves: [crown, neck]
  hurt_in1:                    # flinch: thrown back and up; translated (interpolating the body toward the hurt key
                               # swings it forward, the hurt column leaning right from the coil)
    moves: []
    tweaks: {hip: [-3, 0], chest: [-6, 0], neck: [-8, -1], crown: [-8, -1], sh_n: [-6, 0], el_n: [-6, -2], hand_n: [-6, -4], sh_f: [-6, 0], el_f: [-6, 0], hand_f: [-6, 0]}
  hurt_in2:                    # the body halfway back toward idle, the head held back (no forward wobble)
    moves: [chest, hip, s1]
    tweaks: {hip: [1, 0], chest: [3, 0], neck: [-3, 0], crown: [-3, 0], sh_n: [3, 0], el_n: [3, 0], hand_n: [3, 0], sh_f: [3, 0], el_f: [3, 0], hand_f: [3, 0]}
  daze:                        # a heavy nod: the head drops forward, the near hand sags (the far arm stays:
                               # moving it opened a hole in the torso)
    tweaks: {crown: [3, 0], neck: [2, 0], el_n: [0, 3], hand_n: [0, 4]}
    moves: []
  daze_b:
    tweaks: {crown: [5, 0], neck: [4, 0], el_n: [0, 5], hand_n: [0, 6]}
    moves: []
masks:
  coil:                        # the resting coil below the rising body: static (pinned)
    idle: [[0, 58], [80, 58], [80, 80], [0, 80]]
    attack: [[0, 58], [80, 58], [80, 80], [0, 80]]
    hurt: [[0, 56], [80, 56], [80, 80], [0, 80]]
