sprite: earth_medusa
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/earth_medusa/monster_large.png,
# backend: user; 128x128 cells, the idle 92 px tall). The old rig is archived as anim/monsters/_retired/earth_medusa_v1.yaml.
# medusa's naga recipe (her sibling, the same body plan): the resting coil is static (pinned by its mask), the column
# and the upper body (head, stone hair snakes, arms) move as one group by whole-px translations of its source key
# (tweaks under `moves: []`); the wind-up draws back a little deeper than medusa's.
body: naga                     # two arms on a serpent tail coiled on the ground (unarmed)
facing: right
sampler: nearest
breath: true
attack_hand: [n, f]            # both clawed hands reach toward the heroes
keyframes:
  idle:
    c_f: [42, 112]
    c_n: [86, 110]
    s0: [72, 100]
    s1: [62, 84]
    hip: [60, 72]
    chest: [62, 64]
    neck: [66, 54]
    crown: [64, 32]
    sh_n: [72, 60]
    el_n: [76, 68]
    hand_n: [82, 62]
    sh_f: [56, 60]
    el_f: [52, 70]
    hand_f: [62, 72]
    tail0: [46, 100]
    tail1: [45, 94]
    tail2: [46, 88]
    tail_tip: [47, 84]
  attack:
    c_f: [42, 112]
    c_n: [86, 110]
    s0: [74, 100]
    s1: [62, 86]
    hip: [64, 72]
    chest: [72, 68]
    neck: [84, 62]
