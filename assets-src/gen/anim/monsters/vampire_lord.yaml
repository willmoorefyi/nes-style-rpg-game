sprite: vampire_lord
# EF-H (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/vampire_lord/monster_large.png, backend:
# user; 132x128 cells, the idle 91 px tall). The old rig is archived as anim/monsters/_retired/vampire_lord_v1.yaml.
# dark_wizard's recipe: the floor-length robe is the torso with the hip at its hem, the arms and the bat-wing cape
# ride the torso (arm parts removed; the wings rise from the shoulders and move with the upper body, so they stay
# one piece), so every in-between is a rigid lean of its source key's upper body about the hip, written as tweaks
# under `moves: []`. The attack key draws 1.67x the idle's area, so its swap step takes monster_check.ATTACK_SWAP_IOU
# (EF-H integrator ruling, open for the user's veto).
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [66, 35]
    neck: [66, 48]
    chest: [66, 58]
    hip: [66, 112]
    sh_n: [74, 52]
    el_n: [76, 66]
    hand_n: [77, 79]
    sh_f: [58, 52]
    el_f: [56, 66]
    hand_f: [57, 79]
    hip_n: [72, 112]
    knee_n: [74, 116]
    foot_n: [76, 119]
    toe_n: [80, 121]
    hip_f: [60, 112]
    knee_f: [58, 116]
    foot_f: [57, 119]
    toe_f: [54, 121]
  attack:
    crown: [68, 37]
    neck: [68, 50]
    chest: [66, 60]
    hip: [64, 110]
    sh_n: [76, 54]
    el_n: [92, 52]
    hand_n: [110, 50]
    sh_f: [56, 56]
    el_f: [44, 72]
    hand_f: [30, 80]
    hip_n: [74, 110]
    knee_n: [80, 114]
    foot_n: [82, 119]
    toe_n: [87, 121]
    hip_f: [54, 110]
    knee_f: [48, 114]
    foot_f: [46, 119]
    toe_f: [42, 121]
  hurt:
    crown: [56, 40]
    neck: [60, 52]
    chest: [62, 62]
    hip: [66, 112]
    sh_n: [72, 58]
    el_n: [80, 68]
    hand_n: [90, 72]
    sh_f: [56, 58]
    el_f: [52, 70]
    hand_f: [54, 80]
    hip_n: [72, 112]
    knee_n: [74, 116]
    foot_n: [76, 119]
    toe_n: [80, 121]
    hip_f: [58, 112]
    knee_f: [56, 116]
    foot_f: [55, 119]
    toe_f: [52, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}       # the arms are robe sleeves and ride the torso and head (every move is a rigid lean of
  farm_n: {remove: true}       # the whole upper body, the wings and the magic included)
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 13.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:                        # every in-between: its source key's upper body leaned rigidly about the hip (each
                               # upper joint rotated about `hip`, rounded to whole px), knees and feet pinned
  atk_wind1:                  # draw back 1.5 deg
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-1, 0], sh_n: [-2, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-2, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  atk_wind2:                  # draw back 3 deg
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-2, 0], hand_n: [-2, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-2, 1]}
  atk_mid:                    # the casting key 2 deg less extended
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-3, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, -1], hand_n: [-2, -2], sh_f: [-2, 0], el_f: [-1, 1], hand_f: [-1, 1]}
  atk_follow:                 # settle: 1 deg back
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-1, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], hand_n: [-1, -1], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 1]}
  atk_recover:                # back to the idle through the draw-back (as wind1)
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-1, 0], sh_n: [-2, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-2, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  hurt_in1:                   # flinch: the idle thrown back 3 deg
    moves: []
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-2, 0], hand_n: [-2, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-2, 1]}
  hurt_in2:                   # the hurt key 4 deg less thrown back, on the way to the idle
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [5, -1], neck: [4, 0], chest: [3, 0], sh_n: [4, 1], el_n: [3, 1], hand_n: [3, 2], sh_f: [4, -1], el_f: [3, -1], hand_f: [2, -1]}
  daze:                       # slump toward the hurt: the idle 1.5 deg back
    moves: []
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-1, 0], sh_n: [-2, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-2, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  daze_b:                     # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-2, 1], neck: [-2, 1], chest: [-1, 0], sh_n: [-2, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-2, 0], el_f: [-1, 0], hand_f: [-1, 0]}
masks: {}
holds: []
paint: []
# pass KT: the approved kneel key (approved/vampire_lord/kneel.png, the user sheet's 4th pose) and the bridge frames
# (kneel_bridge.py)
kneel:
  source: ai
