sprite: fire_lizard
# EF-H batch 2 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/fire_lizard/monster_large.png,
# backend: user; 224x128 cells, the idle 93 px tall). The old rig is archived as anim/monsters/_retired/fire_lizard_v1.yaml.
# Translation-first (NEW_MONSTER_GUIDE.md hard sheets): every in-between is its source key with the head, jaw and
# frill moved as one group by whole-px tweaks (`moves: []`); body, tail and legs stay put, feet pinned.
body: quadruped
facing: right
sampler: nearest
breath: true
keyframes:
  idle:
    hip: [75, 90]
    back: [110, 82]
    chest: [140, 88]
    neck: [165, 72]
    head: [190, 62]
    snout: [212, 66]
    tail0: [50, 88]
    tail1: [25, 72]
    tail2: [20, 50]
    tail_tip: [65, 42]
    sh_n: [155, 92]
    el_n: [165, 104]
    paw_n: [178, 116]
    ftoe_n: [186, 121]
    hip_n: [80, 95]
    knee_n: [60, 108]
    foot_n: [55, 117]
    toe_n: [50, 121]
    hip_f: [95, 98]
    knee_f: [100, 110]
    foot_f: [98, 118]
    toe_f: [96, 121]
  attack:
    hip: [75, 92]
    back: [110, 84]
    chest: [140, 92]
    neck: [165, 78]
    head: [200, 68]
    snout: [215, 72]
    tail0: [45, 90]
    tail1: [15, 70]
    tail2: [15, 45]
    tail_tip: [65, 42]
    sh_n: [150, 96]
    el_n: [165, 108]
    paw_n: [182, 117]
    ftoe_n: [195, 121]
    hip_n: [75, 98]
    knee_n: [55, 110]
    foot_n: [40, 117]
    toe_n: [35, 121]
