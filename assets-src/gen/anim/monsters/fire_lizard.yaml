    hip: [80, 92]
    back: [105, 80]
    chest: [135, 90]
    neck: [155, 75]
    head: [180, 68]
    snout: [200, 72]
    tail0: [55, 90]
    tail1: [35, 70]
    tail2: [40, 45]
    tail_tip: [85, 45]
    sh_n: [150, 98]
    el_n: [165, 108]
    paw_n: [180, 116]
    ftoe_n: [190, 121]
    hip_n: [80, 98]
    knee_n: [65, 110]
    foot_n: [60, 117]
    toe_n: [55, 121]
