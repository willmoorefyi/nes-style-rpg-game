frames:
  atk_follow:   # the settle (t 0.75): all feet and the near elbow planted
    moves: [back, chest, neck, head, snout]
    pins: [paw_n, el_n, paw_f, foot_n, foot_f]
    t: 0.75
    tweaks: {tail2: [0, 1], tail3: [0, 2]}
  atk_mid:   # the pass (t 0.25): near forepaw and elbow planted, the lower foreleg 1 px toward idle
    moves: [back, chest, neck, head, snout]
    pins: [paw_n, el_n, foot_n]
    t: 0.25
    tweaks: {el_n: [1, 0], ftoe_n: [1, 0], paw_n: [1, 0], tail2: [0, 1], tail3: [0, 2]}
  atk_recover:   # 30% toward the bite
    moves: [back, chest, neck, head, snout]
    t: 0.3
  atk_wind1:   # anticipation: head drawn back and up, spine 1 px back
    dy: 0
    moves: []
    t: 0.0
    tweaks: {back: [-1, 0], chest: [-1, 0], head: [-2, 0], hip: [-1, 0], neck: [-1, 0], snout: [-2, -1], tail0: [-1, 0], tail1: [-1, 0], tail2: [-1, 0], tail3: [-1, 0], tail_tip: [-1, 0]}
  atk_wind2:   # coil: head reared back, spine 2 px back and 1 down
    dy: 1
    moves: []
    t: 0.0
    tweaks: {back: [-2, 0], chest: [-2, 0], head: [-4, 0], hip: [-2, 0], neck: [-2, 0], snout: [-4, -2], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail3: [-2, 0], tail_tip: [-2, 0]}
  daze:   # head and snout hang (the neck stays put)
    dy: 0
    moves: [back, chest, head, snout]
    t: 0.0
    tweaks: {head: [-1, 1], snout: [-2, 2]}
  daze_b:
    dy: 0
    moves: [back, chest, head, snout]
    t: 0.0
    tweaks: {head: [-1, 1], snout: [-2, 3]}
  hurt_in1:   # the flinch starts: head jerks back and up
    moves: [hip, back, chest]
    t: 0.2
    tweaks: {head: [-3, -2], neck: [-1, -1], snout: [-3, -2]}
    pins: [paw_n, paw_f, foot_n, foot_f, el_f, sh_f]
  hurt_in2:   # 30% back toward idle; legs, elbows and the far shoulder planted
    moves: [back, chest, neck, head, snout]
    pins: [paw_n, paw_f, foot_n, foot_f, el_f, sh_f]
    t: 0.3
    tweaks: {back: [-1, 0], chest: [-1, 0], head: [-1, 0], hip: [-1, 0], neck: [-1, 0], snout: [-1, 0], tail0: [-1, 0], tail1: [-1, 0], tail2: [-1, 0], tail3: [-1, 0], tail_tip: [-1, 0]}
