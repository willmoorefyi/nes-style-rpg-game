frames:
  atk_wind1:                  # the head and frill draw back 4, up 1
    moves: []
    dy: 0
    tweaks: {neck: [-4, -1], head: [-4, -1], snout: [-4, -1]}
  atk_wind2:                  # back 7, up 1
    moves: []
    dy: 0
    tweaks: {neck: [-7, -1], head: [-7, -1], snout: [-7, -1]}
  atk_mid:                  # the bite key, the head 2 short of it
    moves: []
    dy: 0
    t: 0.0
    tweaks: {neck: [-2, 0], head: [-2, 0], snout: [-2, 0]}
  atk_follow:                  # the bite key, 1 past
    moves: []
    dy: 0
    tweaks: {neck: [1, 0], head: [1, 0], snout: [1, 0]}
  atk_recover:                  # the idle, the head 2 back (as wind1)
    moves: []
    dy: 0
    tweaks: {neck: [-2, 0], head: [-2, 0], snout: [-2, 0]}
  hurt_in1:                  # flinch: the idle's head 3 back, 1 up
    moves: []
    dy: 0
    tweaks: {neck: [-3, -1], head: [-3, -1], snout: [-3, -1]}
  hurt_in2:                  # the hurt key, the head 2 forward on the way back
    moves: []
    dy: 0
    tweaks: {neck: [2, 0], head: [2, 0], snout: [2, 0]}
  daze:                  # slump: the head 2 down
    moves: []
    dy: 0
    tweaks: {neck: [0, 2], head: [0, 2], snout: [0, 2]}
  daze_b:                  # the head 3 down
    moves: []
    dy: 0
    tweaks: {neck: [0, 3], head: [0, 3], snout: [0, 3]}
holds: []
paint:                         # pockets and 1 px cracks the translations open, filled with the neighbours' colour
  - {frame: atk_wind2, xy: [[143, 45]], rgb: [6, 4, 10]}
# pass KT: the approved kneel key (approved/fire_lizard/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
  bridge: {keep_bot: 0.3}       # the default squash thinned kneel_in1's outline (second ring 0.76 vs 0.84)
