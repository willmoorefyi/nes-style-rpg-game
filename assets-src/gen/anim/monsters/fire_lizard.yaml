    attack: [[166, 50], [185, 52], [200, 58], [216, 60], [216, 78], [206, 78], [204, 108], [188, 108], [176, 103], [168, 92]]
    hurt: [[166, 48], [195, 52], [211, 64], [211, 86], [195, 92], [166, 94]]
