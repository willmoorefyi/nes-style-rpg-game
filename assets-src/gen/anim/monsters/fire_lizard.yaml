breath: true
# Frilled orange fire lizard, low sprawl. The tail curls round behind the body in every key (a loose loop in idle and
# attack, a tight loop pulled right in hurt) and never interpolates cleanly, so it stays out of every `moves` set and
# rides the body. The far hind leg is hidden behind the near one (its parts are removed). The frill rides the chest and
# neck warps; the head is masked per key (the attack's open lower jaw is head, the far forepaw under it is not).
