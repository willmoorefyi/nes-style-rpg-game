sprite: dragon_zombie
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H amendment A): the user-rendered sheet (approved/dragon_zombie/
# monster_large.png, backend: user, the tall frame: 210x200 cells, feet row 192, the idle 114 rows). The old rig is
# archived as anim/monsters/_retired/dragon_zombie_v1.yaml. Translation-first (NEW_MONSTER_GUIDE.md hard sheets: the
# three keys draw the wings folded, raised and hunched): every in-between is its source key with the neck, skull and
# jaw moved as one group by whole-px tweaks (`moves: []`); body, wings, tail and legs stay put, feet pinned.
