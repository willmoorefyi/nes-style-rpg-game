parts:
  uwing_n: {remove: true}
  fwing_n: {remove: true}
  uwing_f: {remove: true}
  fwing_f: {remove: true}
  tail: {chain: [tail0, tail1, tail2, tail3, tail_tip]}
frames:
  atk_wind1:               # the neck and skull draw back 3, up 1
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dy: 0
    tweaks: {neck: [-3, -1], head: [-3, -1], snout: [-3, -1]}
  atk_wind2:               # the body 2 back and 1 down (the crouch before the lunge), the skull 5 back
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dx: -2
    dy: 1
    tweaks: {neck: [-5, 0], head: [-5, 0], snout: [-5, 0]}
  atk_mid:                 # the bite key, the body 4 back toward the coil, the skull 6 back and 2 up of it
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dx: 4
    dy: 0
    t: 0.0
    tweaks: {neck: [-6, -2], head: [-6, -2], snout: [-6, -2]}
  atk_follow:              # the bite key, the body 6 back toward the idle, the skull 2 back (settling)
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dx: 6
    dy: 0
    tweaks: {neck: [-2, 0], head: [-2, 0], snout: [-2, 0]}
  atk_recover:             # the idle, the skull 3 back and 1 up (as wind1)
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dy: 0
    tweaks: {neck: [-3, -1], head: [-3, -1], snout: [-3, -1]}
  hurt_in1:                # flinch: the idle's skull 3 back, 2 up, the body 4 down toward the hunch
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dy: 4
    tweaks: {neck: [-3, -2], head: [-3, -2], snout: [-3, -2]}
  hurt_in2:                # the hurt key, the skull 3 forward and 2 down, the body 4 up on the way back
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dy: -4
    tweaks: {neck: [3, 2], head: [3, 2], snout: [3, 2]}
  daze:                       # slump: the skull 2 down
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dy: 0
    tweaks: {neck: [0, 2], head: [0, 2], snout: [0, 2]}
  daze_b:                     # the skull 3 down
    moves: []
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f, knee_n, knee_f]
    dy: 0
    tweaks: {neck: [0, 3], head: [0, 3], snout: [0, 3]}
holds: []
paint:                         # pockets and 1 px cracks the translations open, inked
  - {frame: atk_mid, xy: [[66, 162], [67, 162], [65, 163], [66, 163], [65, 164], [64, 165]], rgb: [6, 4, 10]}
  - {frame: hurt_in2, xy: [[50, 158], [54, 159], [53, 160], [90, 177], [91, 177], [93, 176]], rgb: [6, 4, 10]}
# pass KT: the approved kneel key (approved/dragon_zombie/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
  bridge: {keep_top: 0.1}       # the default 0.28 opened a fourth hole in kneel_in1
