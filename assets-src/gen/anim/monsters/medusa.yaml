sprite: medusa
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/medusa/monster_large.png, backend:
# user; 128x128 cells, the idle 92 px tall). The old rig is archived as anim/monsters/_retired/medusa_v1.yaml.
# The old rig's naga recipe: the resting coil is static (pinned by its mask), the column and the upper body (head, hair
# snakes, arms) move as one group by whole-px translations of its source key (tweaks under `moves: []`).
body: naga                     # two arms on a serpent tail coiled on the ground (unarmed)
facing: right
sampler: nearest
breath: true
attack_hand: [n, f]            # both clawed hands reach toward the heroes
keyframes:
  idle:
    c_f: [40, 110]
    c_n: [85, 110]
    s0: [72, 100]
    s1: [68, 82]
    hip: [64, 70]
    chest: [64, 62]
    neck: [65, 54]
    crown: [64, 32]
    sh_n: [72, 60]
    el_n: [76, 64]
    hand_n: [80, 60]
    sh_f: [58, 60]
    el_f: [54, 66]
    hand_f: [62, 66]
    tail0: [46, 100]
    tail1: [45, 94]
    tail2: [46, 88]
    tail_tip: [47, 84]
  attack:
    c_f: [40, 110]
    c_n: [85, 110]
    s0: [72, 100]
    s1: [62, 82]
    hip: [62, 72]
    chest: [68, 66]
    neck: [72, 62]
    crown: [76, 42]
    sh_n: [74, 66]
    el_n: [88, 66]
    hand_n: [100, 64]
    sh_f: [68, 68]
    el_f: [80, 72]
    hand_f: [90, 74]
    tail0: [44, 100]
    tail1: [43, 94]
    tail2: [43, 88]
    tail_tip: [44, 84]
  hurt:
    c_f: [35, 110]
    c_n: [85, 110]
    s0: [72, 100]
    s1: [62, 82]
    hip: [60, 70]
    chest: [56, 62]
    neck: [52, 56]
    crown: [48, 32]
    sh_n: [62, 60]
    el_n: [72, 56]
    hand_n: [82, 50]
    sh_f: [46, 58]
    el_f: [36, 52]
    hand_f: [28, 44]
    tail0: [44, 100]
    tail1: [43, 94]
    tail2: [43, 88]
    tail_tip: [45, 84]
parts:
  weapon: {remove: true}
frames:
  atk_wind1:                   # the upper body drawn back 3 px
    moves: []
    dy: 0
    tweaks: {hip: [-1, 0], chest: [-2, 0], neck: [-3, 0], crown: [-3, 0], sh_n: [-2, 0], el_n: [-3, 0], hand_n: [-3, 0], sh_f: [-2, 0], el_f: [-3, 0], hand_f: [-3, 0]}
  atk_wind2:                   # back 6, down 1: the head furthest back, the claws drawn in
    moves: []
    dy: 0
    tweaks: {hip: [-2, 0], chest: [-4, 1], neck: [-6, 1], crown: [-6, 1], sh_n: [-4, 1], el_n: [-6, 1], hand_n: [-6, 1], sh_f: [-4, 1], el_f: [-6, 1], hand_f: [-6, 1]}
  atk_mid:                     # the reach key pulled 5 back toward the wind-up
    moves: []
    dy: 0
    t: 0.0
    tweaks: {hip: [-2, 0], chest: [-3, 0], neck: [-5, 0], crown: [-5, 0], sh_n: [-3, 0], el_n: [-5, 0], hand_n: [-5, 0], sh_f: [-3, 0], el_f: [-5, 0], hand_f: [-5, 0]}
  atk_follow:                  # the reach key, 1 past
    moves: []
    dy: 0
    tweaks: {chest: [1, 0], neck: [1, 0], crown: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
  atk_recover:                 # the idle, the upper body 2 forward (coming back from the reach)
    moves: []
    dy: 0
    tweaks: {chest: [1, 0], neck: [2, 0], crown: [2, 0], sh_n: [1, 0], el_n: [2, 0], hand_n: [2, 0], sh_f: [1, 0], el_f: [2, 0], hand_f: [2, 0]}
  hurt_in1:                    # flinch: the idle's upper body thrown 3 back, the head 4 back and 1 up
    moves: []
    dy: 0
    tweaks: {hip: [-1, 0], chest: [-2, 0], neck: [-3, 0], crown: [-4, -1], sh_n: [-2, 0], el_n: [-3, -1], hand_n: [-3, -1], sh_f: [-2, 0], el_f: [-3, -1], hand_f: [-3, -1]}
  hurt_in2:                    # the hurt key, the upper body 3 forward and 1 down on the way back
    moves: []
    dy: 0
    tweaks: {hip: [1, 0], chest: [2, 1], neck: [3, 1], crown: [3, 1], sh_n: [2, 1], el_n: [3, 1], hand_n: [3, 1], sh_f: [2, 1], el_f: [3, 1], hand_f: [3, 1]}
  daze:                        # slump: the head and arms 2 down
    moves: []
    dy: 0
    tweaks: {neck: [1, 1], crown: [1, 2], el_n: [0, 1], hand_n: [0, 2], el_f: [0, 1], hand_f: [0, 2]}
  daze_b:                      # the head 3 down
    moves: []
    dy: 0
    tweaks: {neck: [1, 2], crown: [1, 3], el_n: [0, 2], hand_n: [0, 3], el_f: [0, 2], hand_f: [0, 3]}
masks:
  coil:                        # the resting coil below the rising body: static (pinned)
    idle: [[0, 99], [128, 99], [128, 128], [0, 128]]
    attack: [[0, 99], [128, 99], [128, 128], [0, 128]]
    hurt: [[0, 99], [128, 99], [128, 128], [0, 128]]
holds: []
paint:                         # 1 px cracks where the shifted column leaves its key, closed with outline ink
  - {frame: atk_wind2, xy: [[54, 76], [55, 78]], rgb: [6, 4, 10]}
  - {frame: atk_follow, xy: [[53, 89]], rgb: [6, 4, 10]}
  - {frame: kneel_in2, xy: [[66, 80], [66, 81], [66, 82], [66, 83], [66, 84]], rgb: [6, 4, 10]}   # a 1 px seam the stretch opened in the coil
# pass KT: the approved kneel key (approved/medusa/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
  bridge: {keep_top: 0.4}       # the head and hair snakes kept row for row (the default opened a 7th coil hole in kneel_in2)
