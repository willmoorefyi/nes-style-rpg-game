frames:
  atk_wind1:                   # settle: skull forward 1, shield pushed out; sword arm unchanged (crisp)
    moves: [crown, neck]
    tweaks: {crown: [1, 0], neck: [1, 0], el_f: [0, 0], hand_f: [0, 0], tip: [-1, 0], el_n: [2, -1], hand_n: [2, -1]}
  atk_wind2:                   # the swing starts (t +0.30 toward the strike, not away: the sword flips ~180 deg between idle
                               # and attack, so a pull-back cannot meet the wind2->mid IoU): elbow lifts, blade tips up, skull forward
    t: 0.30
    moves: [crown, neck, chest, sh_f, el_f]
    tweaks: {crown: [2, 0], neck: [2, 0], hand_f: [-2, -1], tip: [-5, 4], el_n: [0, -1], hand_n: [0, -1]}
  atk_mid:                     # torso keeps the attack lean (thin bones tear when the ribcage rotates); legs shifted, not
                               # rotated; sword arm 6 deg back toward the wind-up (rigid); skull 3 px back
    t: 0.35
    pins: [knee_n, foot_n, knee_f, foot_f]
    moves: [neck, crown, sh_f]
    tweaks: {knee_f: [1, 0], foot_f: [2, 0], crown: [-3, 0], neck: [-3, 0], el_f: [-1, 1], hand_f: [-1, 2], tip: [-2, 2], el_n: [-1, -1], hand_n: [-1, -1]}
  atk_follow:                  # a settle (28% back toward idle, torso fixed) rather than an overshoot: follow->recover IoU
    {t: 0.72, moves: [crown, neck, sh_f, knee_n, knee_f], tweaks: {crown: [-4, -1], neck: [-4, -1], el_f: [-1, 1], hand_f: [-1, 2], tip: [-2, 3], el_n: [0, -1], hand_n: [0, -1]}}
  atk_recover:                 # sword arm still raised 10 deg, shield 2 px lower
    t: 0.35
    moves: [crown, neck, chest, hip, sh_n, el_n, hand_n, sh_f]
    tweaks: {crown: [1, 1], neck: [1, 1], el_f: [-2, -1], hand_f: [-4, -2], tip: [-5, 1], el_n: [-1, 2], hand_n: [-1, 2]}
  hurt_in1:                    # flinch: skull snaps back 6 px and tilts, ribcage tilts, shield jerks up 6 px
    moves: [chest]
    tweaks: {crown: [-9, 0], neck: [-6, 0], chest: [0, -2], el_n: [0, -6], hand_n: [0, -6], el_f: [1, 1], hand_f: [2, 1], tip: [3, -3]}
  hurt_in2:                    # skull, ribcage and shield settle toward idle; sword arm 13 deg lower
    moves: [chest]
    tweaks: {crown: [5, 1], neck: [5, 1], chest: [2, 1], el_n: [-1, 4], hand_n: [-1, 4], el_f: [0, 3], hand_f: [0, 5], tip: [9, 10]}
  daze:                       # pass F 5a: head and chest only (the shared move swings the sword arm into the pelvis)
    moves: [crown, neck, chest]
  daze_b:
    moves: [crown, neck, chest]
