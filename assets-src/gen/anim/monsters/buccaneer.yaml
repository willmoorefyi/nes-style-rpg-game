sprite: buccaneer
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/buccaneer/monster_large.png,
# backend: user; 128x128 cells, the idle 85 px tall). The old rig is archived as anim/monsters/_retired/buccaneer_v1.yaml.
# The pirate's recipe: the shirt torso with the hip at the belt, the arms, the axe and the hook ride the torso (arm and
# weapon parts removed), so every in-between is a rigid lean of its source key's upper body about the hip (tweaks
# under `moves: []`: each upper joint rotated about `hip`, rounded to whole px).
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [70, 41]
    neck: [70, 56]
    chest: [68, 64]
    hip: [66, 80]
    sh_n: [80, 62]
    el_n: [84, 72]
    hand_n: [88, 66]
    sh_f: [54, 62]
    el_f: [50, 76]
    hand_f: [46, 88]
    hip_n: [72, 82]
    knee_n: [76, 100]
    foot_n: [78, 116]
    toe_n: [82, 121]
    hip_f: [58, 82]
    knee_f: [56, 100]
    foot_f: [52, 116]
    toe_f: [50, 121]
  attack:
    crown: [68, 42]
    neck: [66, 56]
    chest: [64, 66]
    hip: [64, 82]
    sh_n: [70, 64]
    el_n: [80, 72]
    hand_n: [88, 70]
    sh_f: [50, 64]
    el_f: [42, 70]
    hand_f: [48, 76]
    hip_n: [70, 84]
    knee_n: [80, 100]
    foot_n: [84, 116]
    toe_n: [90, 121]
    hip_f: [56, 84]
    knee_f: [48, 100]
    foot_f: [42, 116]
    toe_f: [38, 121]
  hurt:
    crown: [48, 40]
    neck: [52, 54]
    chest: [58, 64]
    hip: [64, 80]
    sh_n: [72, 58]
    el_n: [82, 52]
    hand_n: [92, 44]
    sh_f: [44, 66]
    el_f: [34, 80]
    hand_f: [24, 94]
    hip_n: [72, 84]
    knee_n: [80, 100]
    foot_n: [82, 116]
    toe_n: [86, 121]
    hip_f: [58, 84]
    knee_f: [52, 100]
    foot_f: [46, 116]
    toe_f: [44, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}
  farm_n: {remove: true}
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 14.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                  # draw back 4 deg, the upper body 2 px back
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-5, 0], neck: [-4, 0], chest: [-3, 0], sh_n: [-3, -1], el_n: [-3, -1], hand_n: [-3, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-1, 1]}
  atk_wind2:                  # draw back 5 deg, 3 px back and 1 up (the axe kept clear of the knee), the axe cocked
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-6, -1], neck: [-5, -1], chest: [-4, -1], sh_n: [-5, -2], el_n: [-4, -3], hand_n: [-4, -3], sh_f: [-5, 0], el_f: [-3, 0], hand_f: [-2, 1]}
  atk_mid:                  # the strike key 2 deg short of it and 1 px back (toward the wind)
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-1, -1], hand_n: [-1, -1], sh_f: [-2, 0], el_f: [-1, 1], hand_f: [-1, 1]}
  atk_follow:                  # settle: 1 deg on
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [1, 0]}
  atk_recover:                  # back to the idle through the draw-back (as wind1)
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-5, 0], neck: [-4, 0], chest: [-3, 0], sh_n: [-3, -1], el_n: [-3, -1], hand_n: [-3, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-1, 1]}
  hurt_in1:                  # flinch: the idle's upper body 2 px back (a shift: a lean swings the low axe into the knee)
    moves: []
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
  hurt_in2:                  # the hurt key 4 deg less thrown back, on the way to the idle
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [3, -1], neck: [2, -1], chest: [1, 0], sh_n: [2, 1], el_n: [2, 1], hand_n: [2, 2], sh_f: [1, -1], el_f: [0, -2], hand_f: [-1, -3]}
  daze:                  # slump: the idle's upper body 2 px back (a shift, as hurt_in1)
    moves: []
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
  daze_b:                  # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-2, 1], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
masks: {}
holds: []
paint:
  - {frame: atk_wind1, xy: [[55, 72]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[55, 71], [54, 72], [55, 72], [56, 72], [55, 73]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[55, 72]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[55, 72]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[56, 71], [56, 72], [57, 72], [56, 73], [57, 73]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[57, 73]], rgb: [6, 4, 10]}
  - {frame: daze, xy: [[56, 71], [56, 72], [57, 72], [56, 73], [57, 73]], rgb: [6, 4, 10]}
  - {frame: daze, xy: [[57, 73]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[56, 71], [56, 72], [57, 72], [56, 73], [57, 73]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[57, 73]], rgb: [6, 4, 10]}
  - {frame: atk_wind1, xy: [[55, 73]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[56, 81], [55, 82], [56, 82], [55, 83], [54, 84], [55, 84], [54, 85], [54, 86], [54, 87]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[46, 95]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[55, 73]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[56, 81], [55, 82], [56, 82], [55, 83], [55, 84]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[53, 85]], rgb: [6, 4, 10]}
  - {frame: daze, xy: [[56, 81], [55, 82], [56, 82], [55, 83], [55, 84]], rgb: [6, 4, 10]}
  - {frame: daze, xy: [[53, 85]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[56, 81], [55, 82], [56, 82], [55, 83], [55, 84]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[53, 85]], rgb: [6, 4, 10]}
  - {frame: atk_wind1, xy: [[66, 95]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[46, 96], [45, 97], [46, 97], [47, 97], [45, 98], [46, 98]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[46, 96]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[66, 95]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[49, 95]], rgb: [6, 4, 10]}
