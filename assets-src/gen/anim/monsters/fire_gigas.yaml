    moves: []
    t: 0.0
    dy: 2
    tweaks: {crown: [-6, 0], neck: [-3, 0], chest: [-2, 0], sh_n: [-4, -1], el_n: [-3, -3], hand_n: [-4, -3], tip: [-6, 1], sh_f: [-4, 2], el_f: [-2, 2], hand_f: [-1, 2]}
  atk_wind2:                   # coil: lean back 6 (the hammer head drops behind the back), hammer hand 2 up, crouched 4 lower
    moves: []
    t: 0.0
    dy: 4
    tweaks: {crown: [-9, 1], neck: [-5, 0], chest: [-4, 1], sh_n: [-6, -2], el_n: [-5, -4], hand_n: [-6, -5], tip: [-9, 1], sh_f: [-6, 3], el_f: [-4, 3], hand_f: [-2, 2]}
  atk_mid:                     # the downswing: the attack upper body (hammer included) leaned back 12 about the hip and 4 higher; the back leg 8 in, the front foot 2 back
    moves: []
    dy: -4
    pins: [knee_n, foot_n, knee_f, foot_f]
    sampler: rotsprite
    tweaks: {crown: [-18, -1], neck: [-9, -3], chest: [-8, 0], sh_n: [-9, -4], el_n: [-6, -5], hand_n: [-3, -5], tip: [1, -8], sh_f: [-11, 2], el_f: [-6, 1], hand_f: [-4, -4], knee_f: [8, 0], foot_f: [8, 0], knee_n: [2, 0], foot_n: [2, 0]}
