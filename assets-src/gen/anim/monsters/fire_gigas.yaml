    dy: 1
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], tip: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
