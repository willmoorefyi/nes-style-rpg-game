    tweaks: {crown: [-12, 1], neck: [-7, 0], chest: [-5, 1], sh_n: [-8, -2], el_n: [-6, -3], hand_n: [-8, -3], tip: [-11, 4], sh_f: [-8, 3], el_f: [-5, 4], hand_f: [-3, 3]}
  hurt_in2:                    # the hurt pose 4 forward (translated)
