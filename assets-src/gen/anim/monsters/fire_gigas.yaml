    moves: []
    t: 0.8
    dy: -3
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-4, -1], neck: [-2, -1], chest: [-2, 0], sh_n: [-2, -1], el_n: [-1, -1], hand_n: [-1, -1], tip: [0, -2], sh_f: [-3, 0], el_f: [-2, 0], hand_f: [-1, -1]}
  atk_recover:                 # upper body and hammer 2 forward and 5 lower (still crouched from the slam) (translated)
    moves: []
    dy: 5
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], tip: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0]}
