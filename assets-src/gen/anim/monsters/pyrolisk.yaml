sprite: pyrolisk
body: bird
facing: right
sampler: nearest
breath: true
# The cockatrice recipe: the idle wing is folded into the body; only attack and hurt mark wsh/wel/wtip, so frames cut
# from attack / hurt keep their raised wings. The lizard tail is never interpolated (keyframe coils differ by far
# more than the chain cap); it rides the body shift. The attack body sits about 12 px behind idle, so the upper body
# joints shift together by tweak while the legs stay planted.
keyframes:
  idle:
    hip: [58, 56]
    chest: [70, 42]
    neck: [70, 30]
    head: [70, 16]
    beak: [86, 24]
    tail0: [44, 58]
    tail1: [30, 62]
    tail2: [20, 52]
    tail3: [22, 38]
    tail_tip: [20, 27]
    hip_n: [50, 61]
    knee_n: [50, 66]
    foot_n: [50, 72]
    toe_n: [58, 76]
    hip_f: [64, 61]
    knee_f: [67, 66]
    foot_f: [70, 72]
    toe_f: [80, 75]
  attack:
    hip: [46, 54]
    chest: [58, 44]
    neck: [68, 38]
    head: [80, 32]
    beak: [100, 37]
    tail0: [38, 56]
    tail1: [20, 56]
    tail2: [8, 48]
    tail3: [8, 38]
    tail_tip: [12, 30]
    wsh_n: [55, 42]
    wel_n: [58, 28]
    wtip_n: [60, 10]
    wsh_f: [46, 42]
    wel_f: [38, 28]
    wtip_f: [33, 12]
    hip_n: [37, 61]
    knee_n: [37, 66]
    foot_n: [37, 72]
    toe_n: [45, 76]
    hip_f: [52, 61]
    knee_f: [55, 66]
    foot_f: [59, 71]
    toe_f: [69, 76]
  hurt:
    hip: [52, 55]
    chest: [62, 42]
    neck: [70, 30]
    head: [76, 18]
    beak: [86, 16]
    tail0: [44, 58]
    tail1: [30, 64]
    tail2: [20, 58]
    tail3: [22, 46]
    tail_tip: [30, 52]
    wsh_n: [58, 40]
    wel_n: [56, 25]
    wtip_n: [55, 8]
    wsh_f: [50, 40]
    wel_f: [40, 28]
    wtip_f: [32, 16]
    hip_n: [42, 61]
    knee_n: [42, 66]
    foot_n: [42, 72]
    toe_n: [50, 76]
    hip_f: [57, 61]
    knee_f: [60, 66]
    foot_f: [62, 71]
    toe_f: [73, 75]
parts:
  uwing_n: {remove: true}
  fwing_n: {remove: true}
  uwing_f: {remove: true}
  fwing_f: {remove: true}
  wing_n: {bone: [wsh_n, wtip_n], radius: 8.0}
  wing_f: {bone: [wsh_f, wtip_f], radius: 8.0}
  tail: {chain: [tail0, tail1, tail2, tail3, tail_tip]}
masks:                         # whole feet (the back claw sat nearer the body bone)
  toes_n:
    idle: [[43, 71], [61, 71], [61, 78], [43, 78]]
    attack: [[31, 70], [49, 70], [49, 78], [31, 78]]
    hurt: [[35, 70], [54, 70], [54, 78], [35, 78]]
  toes_f:
    idle: [[63, 70], [87, 70], [87, 78], [63, 78]]
    attack: [[50, 70], [72, 70], [72, 78], [50, 78]]
    hurt: [[55, 69], [77, 69], [77, 78], [55, 78]]
z:
  attack: [wing_f, thigh_f, shin_f, toes_f, tail, body, thigh_n, shin_n, toes_n, wing_n, neck, head]
  hurt: [wing_f, thigh_f, shin_f, toes_f, tail, body, thigh_n, shin_n, toes_n, wing_n, neck, head]
frames:
  atk_wind1:
    t: -0.2
    pins: [foot_n, foot_f]
    moves: []                  # translation only: the turned neck warp tore the throat under the beak
    tweaks: {hip: [-2, 0], chest: [-2, 0], neck: [-3, 0], head: [-3, 0], beak: [-3, 0], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail3: [-2, 0], tail_tip: [-2, 0]}
  atk_wind2:
    t: -0.3
    dy: 1
    pins: [foot_n, foot_f]
    moves: []
    tweaks: {hip: [-4, 0], chest: [-4, 0], neck: [-5, 0], head: [-5, 0], beak: [-5, 0], tail0: [-4, 0], tail1: [-4, 0], tail2: [-4, 0], tail3: [-4, 0], tail_tip: [-4, 0]}
  atk_mid:
    t: 0.25
    pins: [hip_n, knee_n, foot_n, toe_n, hip_f, knee_f, foot_f, toe_f]
    moves: [hip, chest, head, beak]
    tweaks: {hip_n: [3, 0], knee_n: [3, 0], foot_n: [3, 0], toe_n: [3, 0], hip_f: [3, 0], knee_f: [3, 0], foot_f: [3, 0], toe_f: [3, 0]}
  atk_follow:
    t: 0.7
    pins: [hip_n, knee_n, foot_n, toe_n, hip_f, knee_f, foot_f, toe_f]
    moves: [hip, chest, neck, head, beak]
  atk_recover:
    t: 0.22
    pins: [foot_n, foot_f]
    moves: []
    tweaks: {hip: [-3, 0], chest: [-3, 0], neck: [-3, 0], head: [-3, 0], beak: [-3, 0], tail0: [-3, 0], tail1: [-3, 0], tail2: [-3, 0], tail3: [-3, 0], tail_tip: [-3, 0]}
  hurt_in1:
    moves: [hip, chest, neck, head, beak, hip_n, knee_n, hip_f, knee_f]
  hurt_in2:                    # translation only: a 13 deg turn of the open-beaked head shredded the face
    pins: [hip_n, knee_n, foot_n, toe_n, hip_f, knee_f, foot_f, toe_f]
    moves: []
    tweaks: {hip: [2, 0], chest: [2, 0], neck: [1, 1], head: [1, 2], beak: [1, 2], tail0: [2, 0], tail1: [2, 0], tail2: [2, 0], tail3: [2, 0], tail_tip: [2, 0], wsh_n: [2, 0], wel_n: [2, 1], wtip_n: [3, 3], wsh_f: [2, 0], wel_f: [3, 1], wtip_f: [4, 3]}
holds: []
paint:                         # 1 px joint crack (near thigh under the shifted belly) closed with outline ink
  - {frame: atk_follow, xy: [[43, 64]], rgb: [6, 4, 10]}
