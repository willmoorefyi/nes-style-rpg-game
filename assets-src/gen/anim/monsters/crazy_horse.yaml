# Pass V8 redesign (R321): an ash-grey otherworldly steed with a bare horse-skull head (a glowing yellow-green eye), the
# ribs showing, a tall ridge of bone spines, blazing yellow-green cracks and smoke legs (no hooves). The attack is a
# low lunge with the skull thrust down and the jaw open; the hurt is a sit-back onto the haunches, the head up. Every
# in-between is a translation-only copy of its source key (moves: []), every leg (the lowest points of the smoke
# columns as feet and toes) pinned; the key switches carry the pose change.
