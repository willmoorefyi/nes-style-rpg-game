    tweaks: {crown: [-8, 0], neck: [-8, 0], chest: [-8, 0], hip: [-8, 0], sh_n: [-8, 0], el_n: [-8, 0], hand_n: [-8, 0], sh_f: [-8, 0], el_f: [-8, 0], hand_f: [-8, 0], hip_n: [-8, 0], hip_f: [-8, 0], knee_n: [-8, -2], knee_f: [-8, -2]}
  cast_gather:
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [0, 0], neck: [0, 0], chest: [0, 0], hip: [0, 0], sh_n: [0, 0], el_n: [0, 0], hand_n: [0, 0], sh_f: [0, 0], el_f: [0, 0], hand_f: [0, 0], hip_n: [0, 0], hip_f: [0, 0]}
