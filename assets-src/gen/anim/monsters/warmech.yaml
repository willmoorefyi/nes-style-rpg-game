frames:
  atk_wind1:   # the hull, head and both arms 6 px toward the switch and 1 down, the knees 5; feet planted
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [6, 1], neck: [6, 1], chest: [6, 1], hip: [6, 1], sh_n: [6, 1], el_n: [6, 1], hand_n: [6, 1], sh_f: [6, 1], el_f: [6, 0], hand_f: [6, 0], hip_n: [6, 1], hip_f: [6, 1], knee_n: [6, 1], knee_f: [6, 1]}
  atk_wind2:   # the coil: the hull 12 px forward and 3 down, the knees 10 (shins keep their length)
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [11, 2], neck: [11, 2], chest: [11, 2], hip: [11, 2], sh_n: [11, 2], el_n: [11, 2], hand_n: [11, 2], sh_f: [11, 2], el_f: [11, -1], hand_f: [11, -1], hip_n: [11, 2], hip_f: [11, 2], knee_n: [11, 2], knee_f: [11, 2]}
  atk_mid:   # the attack 12 px back toward the wind and 2 up over the planted lunge
    t: 0
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [-12, -2], neck: [-12, -2], chest: [-12, -2], hip: [-12, -2], sh_n: [-12, -2], el_n: [-12, -2], hand_n: [-12, -2], sh_f: [-12, -2], el_f: [-12, -2], hand_f: [-12, -2], hip_n: [-12, -2], hip_f: [-12, -2], knee_f: [-3, -2], knee_n: [-6, 1]}
  atk_follow:   # the attack hull 12 px back and 3 up (1 above the mid)
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [-12, -3], neck: [-12, -3], chest: [-12, -3], hip: [-12, -3], sh_n: [-12, -3], el_n: [-12, -3], hand_n: [-12, -3], sh_f: [-12, -3], el_f: [-12, -3], hand_f: [-12, -3], hip_n: [-12, -3], hip_f: [-12, -3], knee_f: [-3, -2], knee_n: [-6, 1]}
  atk_recover:   # the idle hull 12 px forward and 3 down
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [11, 2], neck: [11, 2], chest: [11, 2], hip: [11, 2], sh_n: [11, 2], el_n: [11, 2], hand_n: [11, 2], sh_f: [11, 2], el_f: [11, -1], hand_f: [11, -1], hip_n: [11, 2], hip_f: [11, 2], knee_n: [11, 2], knee_f: [11, 2]}
  hurt_in1:   # the idle hull 8 px toward the hurt
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [8, 0], neck: [8, 0], chest: [8, 0], hip: [8, 0], sh_n: [8, 0], el_n: [8, 0], hand_n: [8, 0], sh_f: [8, 0], el_f: [8, 0], hand_f: [8, 0], hip_n: [8, 0], hip_f: [8, 0], knee_n: [7, 0], knee_f: [7, 1]}
  hurt_in2:   # the hurt hull 8 px back toward idle
    moves: []
