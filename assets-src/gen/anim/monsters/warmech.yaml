# Warmech (T-K, docs/ROSTER_FIX_PLAN_2.md 5): the boss war machine, per-pose (232 x 200 padded cell). Preset mechanical,
# translation-first: in every in-between the hull, head, both arms and both thighs move as one rigid unit (`tweaks`,
# `moves: []`) over planted clawed feet (`ft_*` masks, pinned), and only the shins turn (<= 14 deg) to reach the knees.
# The 40 px lunge stride lives in the key switches (a key-switch offset d = (-23, -4) to (-24, -5): idle-sourced frames
# forward 11-12 px and 2 down, attack-sourced ones 12 px back and 2-3 up). The claw rides 3 px higher than the hull in
# the forward frames (it would close the pocket on the far shin). Daze: the default recipe slump (legs pinned), the
# claw lifted 3 px in daze_b for the same pocket. `fixmeasure.py switch warmech <seq> --rig` (IoU / step vs need / cap):
#   attack: idle->wind1 0.804 / 5.4, wind1->wind2 0.827 / 4.6, wind2->mid 0.447 / 17.7, mid->attack 0.740 / 10.6,
#           attack->follow 0.742 / 10.9, follow->recover 0.444 / 18.0, recover->idle 0.702 / 9.8 (vs 0.333 / 19.1)
#   hurt:   idle->in1 0.771 / 6.8, in1->in2 0.535 / 10.4, in2->hurt 0.730 / 6.6 (vs 0.436 / 15.0)
#   cast:   gather->rise 0.761 / 6.2, the rest >= 0.96 / <= 0.7 (vs 0.550 / 15.0)
#   daze:   idle->daze 0.895 / 3.1, daze->daze_b 0.917 / 1.8 (vs 0.436 / 15.0)
sprite: warmech
body: biped
preset: mechanical             # riveted bronze plates: rigid parts, nearest sampling, every bone turns <= 15 deg
facing: right
sampler: nearest
breath: true
planted: foot_f
attack_hand: n                 # the cannon arm (the claw swings under only in the approved attack key)
