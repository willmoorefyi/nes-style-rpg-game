  atk_recover: {moves: [body, head, fang, abd, abd_end]}
  hurt_in1: {moves: [body, head, fang, abd, abd_end]}
  hurt_in2: {moves: [head, fang]}   # the curled hurt legs stay put (moving the body dipped a leg below the plain)
