sprite: iron_golem
body: biped
preset: mechanical             # riveted iron plates: rigid parts, nearest sampling, every bone turns <= 15 deg
facing: right
sampler: nearest
breath: true
planted: foot_n
attack_hand: f                 # the image-right arm smashes down; the image-left arm is cocked up behind
keyframes:
  idle:
    crown: [65, 40]
    neck: [65, 50]
    chest: [65, 65]
    hip: [62, 92]
    sh_n: [35, 55]
    el_n: [30, 75]
    hand_n: [35, 90]
    sh_f: [88, 58]
    el_f: [92, 72]
    hand_f: [95, 88]
    hip_n: [75, 95]
    knee_n: [78, 104]
    foot_n: [80, 113]
    toe_n: [86, 118]
    hip_f: [52, 95]
    knee_f: [48, 104]
    foot_f: [45, 113]
    toe_f: [48, 118]
  attack:
    crown: [79, 45]
    neck: [76, 56]
    chest: [68, 68]
    hip: [62, 92]
    sh_n: [52, 48]
    el_n: [38, 45]
    hand_n: [28, 62]
    sh_f: [88, 62]
    el_f: [90, 82]
    hand_f: [92, 105]
    hip_n: [70, 95]
    knee_n: [72, 104]
    foot_n: [74, 113]
    toe_n: [80, 118]
    hip_f: [50, 92]
    knee_f: [40, 100]
    foot_f: [30, 112]
    toe_f: [25, 117]
    crk: [108, 116]
  hurt:
    crown: [56, 40]
    neck: [57, 50]
    chest: [62, 65]
    hip: [62, 92]
    sh_n: [40, 55]
    el_n: [35, 70]
    hand_n: [45, 62]
    sh_f: [80, 58]
    el_f: [85, 70]
    hand_f: [95, 58]
    hip_n: [75, 95]
    knee_n: [80, 104]
    foot_n: [82, 113]
    toe_n: [88, 118]
    hip_f: [50, 95]
    knee_f: [42, 104]
    foot_f: [35, 113]
    toe_f: [32, 118]
parts:
  weapon: {remove: true}
  head: {radius: 10.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
  crack:                       # the rubble crack under the smashing fist: exists only at the contact key
    bone: [hand_f, crk]
    radius: 2.0
    in: [attack]
frames:                        # translations written as tweaks (moves []); the smashing arm is the far (image-right) one
  atk_wind1:                   # lean back 3, the smashing fist 3 up
    moves: []
    t: -0.05
    dy: 1
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-2, 0], hand_n: [-1, -1], sh_f: [-3, -1], el_f: [-3, -2], hand_f: [-3, -2]}
  atk_wind2:                   # coil: lean back 5, the smashing fist 7 up, head 3 more, body 2 lower
    moves: []
    t: -0.1
    dy: 2
    tweaks: {crown: [-7, -1], neck: [-7, -1], chest: [-5, 0], sh_n: [-4, 0], el_n: [-2, 0], hand_n: [-1, -1], sh_f: [-5, -3], el_f: [-5, -4], hand_f: [-5, -5]}
  atk_mid:                     # the smash comes in: the upper body leaned back, the smashing arm already on the ground
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-8, -2], neck: [-6, -2], chest: [-5, -1], sh_n: [-5, -2], el_n: [-5, -2], hand_n: [-5, -2], sh_f: [-2, -1], hip_f: [2, 0], knee_f: [4, 0], foot_f: [4, 0]}
  atk_follow:                  # settle: the upper body 3 back
    moves: []
    t: 0.8
    tweaks: {crown: [-3, -1], neck: [-2, -1], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-1, 0]}
  atk_recover:                 # upper body 2 forward and 2 lower (translated)
    moves: []
    dy: 2
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0]}
  hurt_in1:                    # recoil: lean back 5, head 3 further back, fists 4 up
    moves: []
    tweaks: {crown: [-7, -1], neck: [-7, -1], chest: [-5, -1], sh_n: [-6, -3], el_n: [-6, -3], hand_n: [-6, -3], sh_f: [-5, -2], el_f: [-5, -3], hand_f: [-5, -4]}
  hurt_in2:                    # the hurt pose 4 forward (translated), the head 2 more
    moves: []
    tweaks: {crown: [7, 0], neck: [6, 0], chest: [6, 0], sh_n: [6, 0], el_n: [6, 0], hand_n: [6, 0], sh_f: [6, 0], el_f: [6, 0], hand_f: [6, 0]}
  daze:                        # slump: the upper body 1 forward and 2 lower, the head 1 forward and 1 lower more
    moves: []
    dy: 2
    tweaks: {crown: [1, 1], neck: [1, 1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
  daze_b:
    moves: []
    dy: 3
    tweaks: {crown: [1, 1], neck: [1, 1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
  kneel_in1:                   # pass K: the far boot lifts as its shin folds back (it stays above the feet row)
    tweaks: {foot_f: [0, -2], toe_f: [0, -2]}
  kneel_in2:
    tweaks: {foot_f: [0, -2], toe_f: [0, -2]}
masks:                         # the whole arms (pauldron, forearm and chained fist) off the torso and thighs
  uarm_n:
    idle: [[30, 44], [52, 44], [52, 64], [46, 66], [28, 66], [30, 52]]
  farm_n:
    idle: [[18, 64], [46, 64], [48, 80], [47, 96], [44, 101], [40, 104], [32, 104], [18, 90]]
    attack: [[14, 46], [42, 44], [46, 60], [44, 84], [16, 84]]
  uarm_f:
    idle: [[78, 48], [93, 48], [96, 68], [80, 70], [78, 60]]
  farm_f:
    idle: [[80, 68], [96, 66], [106, 80], [106, 99], [82, 99], [80, 85]]
holds: []
paint:                         # pockets the translations close off, filled with their neighbours (wind1 under the near
                               # fist, atk_mid inside the cocked arm); 1 px seams at the smashing shoulder and the crotch inked
  - {frame: atk_wind1, rgb: [33, 24, 41], xy: [[47, 100]]}
  - {frame: atk_wind1, rgb: [41, 41, 49], xy: [[48, 99]]}
  - {frame: atk_wind1, rgb: [49, 57, 66], xy: [[48, 100]]}
  - {frame: atk_wind1, rgb: [66, 74, 82], xy: [[49, 99]]}
  - {frame: atk_mid, rgb: [33, 24, 41], xy: [[41, 67], [41, 69], [80, 77]]}
  - {frame: atk_mid, rgb: [49, 8, 49], xy: [[41, 66]]}
  - {frame: atk_mid, rgb: [49, 57, 66], xy: [[41, 68]]}
  - {frame: hurt_in2, rgb: [33, 24, 41], xy: [[73, 101]]}

  # pass K: kneel_in2: the pocket between the near fist and the folding knee and the cracks along the folding legs filled with their neighbours; 1 px under the feet row cleared
  - {frame: kneel_in2, xy: [[80, 61], [82, 61], [81, 100], [82, 100], [83, 100], [82, 101], [83, 101], [84, 101], [85, 101], [82, 102], [83, 102], [84, 102], [85, 102], [86, 102], [82, 103], [83, 103], [84, 103], [83, 104], [46, 110], [45, 111], [46, 111], [44, 112], [45, 112], [43, 113], [44, 113]], rgb: [49, 57, 66]}
  - {frame: kneel_in2, xy: [[81, 98], [82, 98], [81, 99], [82, 99], [30, 107], [31, 107], [31, 108], [44, 111], [42, 112], [43, 112], [41, 113], [42, 113]], rgb: [6, 4, 10]}
  - {frame: kneel_in2, xy: [[87, 100], [88, 100], [89, 100], [90, 100], [91, 100], [86, 101], [87, 101], [88, 101], [89, 101], [90, 101], [91, 101], [87, 102], [88, 102], [90, 102], [91, 102], [92, 102], [91, 103], [92, 103]], rgb: [66, 74, 82]}
  - {frame: kneel_in2, xy: [[47, 108]], rgb: [107, 115, 123]}
  - {frame: kneel_in2, xy: [[77, 123]], rgb: null}
  # pass K: the glow fades over the kneel: kneel_in1 one ramp step down (kneel_in2 takes the kneel key's two steps), kneel_b the dimmest
  - {frame: kneel_in1, xy: [[67, 47], [67, 48], [67, 75], [70, 75], [67, 76], [70, 76], [74, 76], [67, 77], [70, 77], [73, 77], [74, 77], [64, 78], [67, 78], [70, 78], [73, 78], [74, 78], [64, 79], [67, 79], [70, 79], [73, 79], [74, 79], [67, 80], [70, 80], [67, 81], [70, 81]], rgb: [189, 115, 49]}
  - {frame: kneel_in1, xy: [[73, 49], [67, 74], [70, 74], [71, 75], [74, 75], [71, 77], [76, 77], [71, 78], [76, 78], [64, 80], [73, 80], [74, 80], [73, 81], [67, 82], [70, 82]], rgb: [165, 115, 49]}
  - {frame: kneel_in1, xy: [[71, 76]], rgb: [165, 115, 49]}
  - {frame: kneel_in1, xy: [[66, 47], [66, 48], [68, 48], [73, 48], [74, 74], [76, 74], [76, 75], [64, 76], [65, 76], [73, 76], [76, 76], [64, 77], [65, 77], [65, 78], [65, 79], [71, 79], [76, 79], [65, 80], [76, 80], [74, 81], [73, 82]], rgb: [123, 66, 41]}
  - {frame: kneel_b, xy: [[68, 59], [68, 60], [68, 61], [67, 85], [70, 85], [67, 86], [70, 86], [74, 86], [67, 87], [70, 87], [73, 87], [74, 87], [64, 88], [67, 88], [70, 88], [73, 88], [74, 88], [64, 89], [67, 89], [70, 89], [73, 89], [74, 89], [67, 90], [70, 90], [67, 91], [70, 91]], rgb: [123, 66, 41]}
# pass K (docs/KNEEL_PLAN.md K2-0, iteration 2): the golem kneels (variant mech_kneel): the far knee on the ground, its
# shin folded back flat, the near foot planted, the head bowed toward the chest and the pauldrons sagging; the eye and
# furnace glow fade over the transition (kneel paint plus kneel_in1 / kneel_in2 / kneel_b frame paint)
kneel:
  variant: mech_kneel
  tweaks: {neck: [0, 2], crown: [2, 4], sh_n: [0, 2], sh_f: [0, 2]}
  paint:
    # the pocket between the near arm and the barrel and the 1 px cracks at the folded legs closed; the outline the rotated legs thinned thickened inward
    - {xy: [[43, 82], [44, 82], [26, 108], [27, 108], [27, 109], [28, 109], [30, 109], [89, 115]], rgb: [6, 4, 10]}
    - {xy: [[42, 83], [43, 83], [44, 83], [42, 84], [43, 84], [44, 84], [41, 85], [42, 85], [43, 85], [41, 86], [42, 86], [43, 86], [44, 86], [42, 87], [43, 87], [44, 87], [43, 88], [44, 88]], rgb: [49, 57, 66]}
    - {xy: [[95, 88], [97, 91], [99, 94], [99, 97], [25, 98], [100, 98], [101, 99], [102, 101], [27, 104], [27, 105], [102, 105], [27, 106], [63, 107], [64, 107], [65, 107], [66, 107], [67, 107], [59, 108], [69, 108]], rgb: [41, 41, 49]}
    - {xy: [[78, 120], [80, 120]], rgb: [6, 4, 10]}
    # the glow at half: eyes and furnace grille two ramp steps down (kneel_in1 one step, kneel_b one more: 100 / 75 / 50 / 40 %)
    - {xy: [[68, 58], [68, 59], [68, 60], [67, 84], [70, 84], [67, 85], [70, 85], [74, 85], [67, 86], [70, 86], [73, 86], [74, 86], [64, 87], [67, 87], [70, 87], [73, 87], [74, 87], [64, 88], [67, 88], [70, 88], [73, 88], [74, 88], [67, 89], [70, 89], [67, 90], [70, 90]], rgb: [165, 115, 49]}
    - {xy: [[73, 61], [67, 83], [70, 83], [71, 84], [74, 84], [71, 86], [76, 86], [71, 87], [76, 87], [64, 89], [73, 89], [74, 89], [73, 90], [67, 91], [70, 91]], rgb: [123, 66, 41]}
    - {xy: [[71, 85]], rgb: [123, 66, 41]}
    - {xy: [[67, 58], [67, 59], [69, 60], [74, 60], [74, 83], [76, 83], [76, 84], [64, 85], [65, 85], [73, 85], [76, 85], [64, 86], [65, 86], [65, 87], [65, 88], [71, 88], [76, 88], [65, 89], [76, 89], [74, 90], [73, 91]], rgb: [123, 66, 41]}
