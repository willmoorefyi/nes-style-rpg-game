sprite: ghoul
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
# crouched ghoul: the hip is the rump on the left, the chest the shoulders behind the head. idle: the near arm (right
# limb) claws the ground, the far arm hides behind it (its joints sit inside the near arm, whose masks win); the far
# leg is the middle limb, the near leg the bent one on the left
keyframes:
  idle:
    crown: [63, 10]
    neck: [57, 28]
    chest: [52, 30]
    hip: [38, 36]
    sh_n: [60, 32]
    el_n: [64, 47]
    hand_n: [71, 63]
    sh_f: [62, 34]
    el_f: [65, 48]
    hand_f: [71, 62]
    hip_n: [34, 42]
    knee_n: [31, 57]
    foot_n: [20, 69]
    toe_n: [18, 75]
    hip_f: [42, 38]
    knee_f: [46, 50]
    foot_f: [51, 66]
    toe_f: [55, 75]
  attack:
    crown: [64, 6]
    neck: [60, 25]
    chest: [52, 24]
    hip: [36, 35]
    sh_n: [58, 30]
    el_n: [70, 37]
    hand_n: [84, 44]
    sh_f: [62, 20]
    el_f: [72, 10]
    hand_f: [84, 10]
    hip_n: [32, 40]
    knee_n: [24, 50]
    foot_n: [9, 66]
    toe_n: [7, 74]
    hip_f: [42, 42]
    knee_f: [55, 50]
    foot_f: [42, 66]
    toe_f: [52, 73]
  hurt:
    crown: [54, 8]
    neck: [52, 27]
    chest: [45, 30]
    hip: [36, 45]
    sh_n: [47, 33]
    el_n: [58, 34]
    hand_n: [68, 24]
    sh_f: [52, 24]
    el_f: [60, 22]
    hand_f: [68, 18]
    hip_n: [34, 48]
    knee_n: [42, 60]
    foot_n: [26, 69]
    toe_n: [24, 75]
    hip_f: [45, 46]
    knee_f: [58, 52]
    foot_f: [50, 68]
    toe_f: [56, 75]
parts:
  weapon: {remove: true}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                  # head pulls back, claws stay on the ground (no body drop: the ground claws would sink)
    dy: 0
    moves: [crown, neck, chest]
    tweaks: {crown: [-1, 0], neck: [-1, 0]}
  atk_wind2:                   # the spring starts (t +0.28 toward the leap): idle pixels, rump and shoulders rising
    t: 0.28
    moves: all
    pins: [foot_n, foot_f]
    dy: -1
  atk_mid:                     # the far arm rides the shoulders (its own swing is over the cap)
    t: 0.35
    dy: 3                      # the leap's body height carried down toward the crouch (centroid continuity)
    moves: [crown, neck, chest, hip, sh_n, el_n, hand_n, hip_n, knee_n, foot_n, hip_f, knee_f, toe_n]
    tweaks: {hand_f: [-2, 1], el_f: [-1, 0]}
  atk_follow:                  # a settle (35% back toward idle), feet on the attack spots
    t: 0.65
    dy: 3
    moves: [crown, neck, chest, sh_n, el_n, hand_n, hip, hip_n, knee_n, hip_f, knee_f]
    tweaks: {hand_f: [-2, 1], el_f: [-1, 0]}
  atk_recover:                 # landing: hips and knees 35% toward the leap, feet and claws planted on idle
    t: 0.35
    moves: [crown, neck, chest, hip, hip_n, knee_n, hip_f, knee_f]
    pins: [foot_f, foot_n]
    dy: -2
  hurt_in1:                    # flinch: head snaps back (translated), claws lift; the body stays (the gap under the hump stays open)
    moves: [hip_n, knee_n, hip_f, knee_f]
    tweaks: {crown: [-3, 1], neck: [-2, 1], el_n: [0, -2], hand_n: [0, -3]}
  hurt_in2:                    # the arms stay up in front of the face (they ride the shoulders); the far thigh keeps its
    moves: [crown, neck, chest, hip, hip_n, knee_n]   # hurt pose, so the gap under the belly stays open (no ink blob)
    tweaks: {hip_f: [0, 3]}
  daze:                        # head and shoulders slump; the ground claw stays put (no arm swing across the gap)
    moves: [crown, neck, chest]
  daze_b:
    moves: [crown, neck, chest]
z:
  idle: [uarm_f, farm_f, thigh_f, shin_f, ft_f, torso, thigh_n, shin_n, ft_n, head, uarm_n, farm_n]
masks:
  uarm_n:
    idle: [[55, 29], [67, 29], [69, 47], [60, 48], [56, 36]]
  farm_n:
    idle: [[60, 48], [69, 47], [80, 60], [81, 76], [62, 76], [61, 60]]
holds: []
paint:                         # 1 px seams between moved parts (hip / thigh, shoulder / arm), outline ink
  - {frame: atk_follow, xy: [[46, 52]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[55, 36]], rgb: [6, 4, 10]}
  - {frame: hurt_in2, xy: [[43, 38]], rgb: [6, 4, 10]}
# pass KT (docs/KNEEL_TWEEN_PLAN.md): the approved AI kneel key (approved/<id>/kneel.png) and the bridge
# frames (kneel_bridge.py)
kneel:
  source: ai
