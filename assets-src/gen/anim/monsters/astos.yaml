# Astos (T-K, docs/ROSTER_FIX_PLAN_2.md 5): the boss dark-elf king, per-pose (200 x 200 cell). Partial rig: FW-Q
# `alias: [attack]` (allowlisted; the attack key's centroid jumps (-9, 27) against a 15.0 cap, no translation bridges it),
# so the attack in-betweens resolve to the keys. Hurt and cast are translation-only (`moves: []`): the upper body moves
# as one piece over pinned knees and feet, the staff foot (`st_b`) planted where it stands on the ground. The flung cape
# (hurt `flare`) and the spread mantle (cast `spread`) are rigid parts on their own roots, folded in behind the robe in
# the key-sourced frame (16 / 26 px; the cast fold must clear the shaft, or the mantle pixels hidden under it open a
# strip). Daze: the default recipe slump (dy, head tweak; translations only, legs and staff pinned, the staff fist held
# on the shaft). `fixmeasure.py switch astos <seq> --rig` (IoU / step vs need / cap):
#   hurt:  idle->in1 0.874 / 1.7, in1->in2 0.507 / 3.1, in2->hurt 0.820 / 7.4 (vs 0.486 / 15.0)
#   cast:  idle->gather 0.904 / 0.7, gather->rise 0.590 / 4.3, rise->cast 0.751 / 8.0, cast->release 0.960 / 0.5 (vs 0.518 / 15.0)
#   daze:  idle->daze 0.899 / 2.8, daze->daze_b 0.933 / 1.7 (vs 0.486 / 15.0)
#   attack: aliased (pre-check: no translation within the cap)
