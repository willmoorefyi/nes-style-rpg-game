frames:
  # The spear runs behind the body and across the near shin (idle): turning it opens holes in the leg it covered, so the
  # spear barely tilts and never leaves its fist. The shield is its own rigid part on the near fist (fist -> centre keeps
  # one angle), so it only translates between the near side (idle, attack) and the chest (hurt).
  atk_wind1:                   # half of wind2
    moves: [crown, neck, chest]
    tweaks: {crown: [-2, 0], neck: [-1, 0], el_n: [-1, -1], hand_n: [-2, -1], shc: [-2, -1], tip: [0, -1]}
  atk_wind2:                   # coil: torso down 2, head back, shield drawn up and back 3, spear point tipped up 2 px
    moves: [crown, neck, chest]
    tweaks: {crown: [-3, 0], neck: [-2, 0], el_n: [-2, -2], hand_n: [-3, -3], shc: [-3, -3], tip: [0, -2]}
  atk_mid:                     # head, shield and spear keep the thrust; torso a third back; legs pinned and shifted toward
    t: 0.35                    # idle (not rotated)
    pins: [knee_n, foot_n, knee_f, foot_f]
    moves: [chest, hip, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f, toe_n, toe_f]
    tweaks: {knee_f: [5, 0], foot_f: [7, 0], knee_n: [2, 0], foot_n: [3, 0]}
  atk_follow:                  # a settle: the head comes back 28 % (the arms, shield and spear hold the thrust)
    t: 0.72
    moves: [crown, neck]
  atk_recover:                 # head 30 % toward the strike, body at idle
    t: 0.30
    moves: [crown, neck]
  hurt_in1:                    # flinch: head knocked back 4 (translated), shield jerked toward the chest; spear arm held
    moves: []                  # tweaks only: the torso does not warp (the coral plate keeps its lines)
    tweaks: {crown: [-4, 1], neck: [-3, 1], sh_n: [-4, -2], el_n: [-6, -2], hand_n: [-7, -3], shc: [-7, -3]}
  hurt_in2:                    # from hurt: head and shield translated back toward idle (no head turn: the crest and the
    moves: [chest]             # far pauldron stay whole)
    tweaks: {crown: [4, -1], neck: [4, -1], sh_n: [5, 1], el_n: [5, 1], hand_n: [5, 1], shc: [5, 1], sh_f: [-1, 1]}
  daze:                        # head and chest slump only (the spear stays over the shin)
    moves: [crown, neck, chest]
  daze_b:
    moves: [crown, neck, chest]
