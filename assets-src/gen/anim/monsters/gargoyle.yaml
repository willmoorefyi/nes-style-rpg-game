# Gargoyle (pass R batch A, FW-5 prototype: biped wings). A crouching stone gargoyle with two bat wings behind the
# shoulders. body: biped with the FW-5 wing joints wsh -> wel -> wtip (uwing_*, fwing_*: drawn behind the body,
# present only where marked); the wing joints join the wind / follow / cast sets, so the wings lift with the wind-up
# toward the attack key's raised wings. The near wing shows only as the peak behind the head.
