    crown: [43, 4]
    neck: [43, 25]
    chest: [42, 34]
    hip: [42, 52]
    sh_n: [49, 29]
    el_n: [53, 36]
    hand_n: [58, 28]
    sh_f: [34, 30]
    el_f: [28, 40]
    hand_f: [27, 51]
    hip_n: [48, 58]
