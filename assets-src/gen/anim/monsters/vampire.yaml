    foot_n: [49, 72]
    toe_n: [54, 74]
    hip_f: [32, 58]
    knee_f: [28, 66]
    foot_f: [26, 72]
    toe_f: [30, 74]
  attack:
    crown: [53, 12]
    neck: [53, 33]
    chest: [46, 41]
    hip: [40, 54]
    sh_n: [50, 36]
    el_n: [48, 42]
    hand_n: [43, 39]
    sh_f: [40, 34]
    el_f: [34, 40]
    hand_f: [30, 44]
    hip_n: [46, 56]
