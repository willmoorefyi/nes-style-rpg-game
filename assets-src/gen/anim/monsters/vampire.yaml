parts:
  weapon: {remove: true}
  cape:                        # closed cape (idle-sourced frames): mesh warp, hem pinned while the collar moves
    kind: cloth
    bone: {idle: [neck, cv_0, cv_1, cv_2, cv_3]}
    radius: 8.0
  wing:                        # spread cape (attack-sourced frames): kept whole, rides the neck
    bone: {attack: [ca_0, ca_1, ca_2]}
    radius: 9.0
  drape:                       # raised cape (hurt-sourced frames): kept whole, rides the neck
    bone: {hurt: [neck, ch_0, ch_1, ch_2, ch_3]}
    radius: 9.0
  slash:
    kind: fx
    bone: [hand_n, slash_t]
    radius: 3.0
    in: [attack]
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                   # half of wind2
    moves: [sh_n, el_n, hand_n]
    pins: [knee_n, foot_n, knee_f, foot_f, cv_2, cv_3]
    tweaks: {crown: [1, 0], neck: [1, 0], cv_0: [1, 0], sh_n: [-1, 0], el_n: [-2, 0], hand_n: [-3, 0]}
  atk_wind2:                   # pounce coil: crouch 2 px, head pushed forward, claw drawn back to the chest, cape closed (hem pinned)
    moves: [sh_n, el_n, hand_n]
    pins: [knee_n, foot_n, knee_f, foot_f, cv_2, cv_3]
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [1, 0], cv_0: [2, 0], cv_1: [-1, 0], sh_n: [-3, 0], el_n: [-4, 0], hand_n: [-6, 0], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  atk_mid:                     # legs held at the attack pose and shifted 1/3 back (feet lerp), not rotated
    t: 0.35
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {knee_n: [3, 0], foot_n: [3, 0], knee_f: [3, 0], foot_f: [3, 0], ca_0: [4, 6], ca_1: [2, 10], ca_2: [-1, 14]}
    moves: [neck, chest, hip, crown, sh_n, hip_n, hip_f, knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    # E10: el_n / hand_n stay on the attack pose (moving them toward wind2 turned the forearm into a smear beside the slash)
    # tweaks ca_*: the wing is still opening: 15 deg less spread and 4/6 px lower, behind the body
  atk_follow:                  # claw and head follow through; the wing settles (15 deg down, 4/6 px lower)
    moves: [crown, sh_n, el_n, hand_n, slash_t]
    tweaks: {ca_0: [4, 6], ca_1: [2, 10], ca_2: [-1, 14]}
  atk_recover:                 # landing from the swoop: head a little forward and low (E5: a small slide, so the arm and torso keep the face, collar and buttons), claw reaching, cape closed
    t: 0.35
    dy: 1
    moves: [sh_n, el_n, hand_n]
    pins: [knee_n, foot_n, knee_f, foot_f, cv_2, cv_3]
    tweaks: {crown: [2, 1], neck: [2, 1], cv_0: [2, 1], sh_n: [1, 0], el_n: [1, 0], hand_n: [2, 0]}
  hurt_in1:                    # flinch: body up 1, head snaps back, claw arm jerks up toward the cape
    dy: -1
    moves: [crown, neck]
    pins: [knee_n, foot_n, knee_f, foot_f, cv_2, cv_3]
    tweaks: {crown: [-1, -1], neck: [-1, -1], chest: [-1, 0], cv_0: [-1, -2], cv_1: [0, -2], sh_n: [0, -1], el_n: [0, -4], hand_n: [0, -7], sh_f: [-1, 1], el_f: [-1, 1], hand_f: [-1, 1]}
  hurt_in2:                    # head and chest come back first; hips and drape stay
    t: 0.25
    moves: [crown, neck]
    pins: [knee_n, foot_n, knee_f, foot_f]
  daze:                        # review fix: the head translated, not turned (the toward-hurt move turned it and smeared the
    moves: [chest]             # eye and mouth): crown and neck share one offset, so daze_b's face is daze's 1 px lower
    tweaks: {crown: [0, 1], neck: [0, 1]}
  daze_b:
    moves: [chest]
    tweaks: {crown: [0, 1], neck: [0, 1]}
z:
  idle: [cape, uarm_f, farm_f, thigh_f, shin_f, ft_f, torso, thigh_n, shin_n, ft_n, head, uarm_n, farm_n]
  attack: [wing, thigh_f, shin_f, ft_f, torso, thigh_n, shin_n, ft_n, head, uarm_n, farm_n, slash]
  hurt: [thigh_f, shin_f, ft_f, torso, thigh_n, shin_n, ft_n, head, drape]
masks:
  head:
    idle: [[38, 3], [57, 3], [57, 32], [38, 32]]
  farm_f:
    idle: [[15, 47], [30, 47], [31, 54], [27, 60], [18, 60], [15, 56]]
  slash:
    attack: [[29, 54], [34, 56], [40, 59], [48, 61], [58, 62], [66, 59], [70, 54], [72, 46], [76, 45], [77, 52], [75, 59], [70, 63], [62, 66], [52, 67], [42, 66], [35, 62], [30, 59]]
  ft_n:
    idle: [[44, 70], [63, 70], [63, 78], [44, 78]]
    attack: [[33, 70], [52, 70], [52, 78], [33, 78]]
    hurt: [[44, 70], [66, 70], [66, 78], [44, 78]]
  ft_f:
    idle: [[22, 70], [35, 70], [35, 78], [22, 78]]
    attack: [[6, 70], [29, 70], [29, 78], [6, 78]]
    hurt: [[19, 70], [35, 70], [35, 78], [19, 78]]
holds: []
paint:                       # 1-2 px cracks enclosed by outline ink, closed with ink
  - {frame: atk_mid, xy: [[41, 31], [42, 31], [42, 32], [42, 33], [42, 34]], rgb: [6, 4, 10]}
  - {frame: hurt_in2, xy: [[44, 66], [45, 66], [46, 66], [45, 67], [46, 67]], rgb: [6, 4, 10]}
  - {frame: atk_mid, xy: [[37, 21]], rgb: [6, 4, 10]}       # E10: an isolated collar-trim pixel left beside the hood
  - {frame: hurt_in1, xy: [[29, 36], [28, 37], [29, 37], [27, 41], [26, 42], [27, 42], [26, 43]], rgb: [6, 4, 10]}
  # V.1 follow-up: the collar spike stood apart from the head (the wing settles 4/6 px lower); join it with ink
  - {frame: atk_mid, xy: [[37, 25], [38, 25], [35, 26], [36, 26], [37, 26], [38, 26], [39, 26], [36, 27], [37, 27], [38, 27], [39, 27], [37, 28], [38, 28], [39, 28], [38, 29], [39, 29], [38, 30], [40, 30]], rgb: [6, 4, 10]}
  - {frame: atk_follow, xy: [[36, 25], [37, 25], [39, 25], [35, 26], [36, 26], [37, 26], [38, 26], [36, 27], [37, 27], [38, 27], [39, 27], [37, 28], [38, 28], [39, 28], [40, 28], [38, 29], [39, 29], [40, 29], [38, 30], [40, 30], [41, 30], [41, 31]], rgb: [6, 4, 10]}
  # V.1 follow-up: a 1 px background row under the cape's left outline (dy 1) left a stray line; close it as in idle
  - {frame: atk_recover, xy: [[15, 47], [16, 47], [17, 47], [18, 47], [19, 47], [20, 47], [21, 47]], rgb: [6, 4, 10]}
  # zero-nit pass: a 1 px background hole in the black hair beside the ear (atk_follow), closed with the ink; two
  # isolated red pixels inside the dark-purple lapel (atk_recover), repainted with the lapel colour
  - {frame: atk_follow, xy: [[42, 34]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[37, 36], [39, 38]], rgb: [74, 66, 99]}
  # daze: the 1 px cape pinhole the slump opens, outline ink
  - {frame: daze, xy: [[31, 51]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[31, 52]], rgb: [6, 4, 10]}
