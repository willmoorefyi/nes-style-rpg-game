  weapon: {remove: true}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                 # the whole upper body and cape 2 back and 1 down: the swoop gathers; knees 1 back
    t: 0
    moves: []
    dy: 1
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0], hip: [-2, 0], hip_n: [-2, 0], hip_f: [-2, 0], knee_n: [-1, 0], knee_f: [-1, 0]}
  atk_wind2:                 # the coil: the upper body and cape 3 back and 2 down; knees 2 and feet 1 back
    t: 0
    moves: []
    dy: 2
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [-3, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-3, 0], hand_n: [-3, 0], sh_f: [-3, 0], el_f: [-3, 0], hand_f: [-3, 0], hip: [-3, 0], hip_n: [-3, 0], hip_f: [-3, 0], knee_n: [-2, 0], knee_f: [-2, 0], foot_n: [-1, 0], foot_f: [-1, 0], toe_n: [-1, 0], toe_f: [-1, 0]}
  atk_mid:                   # the swoop key 2 px short (toward the idle) as one piece; knees and feet 2 back
    t: 0
    moves: []
    dy: 0
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0], hip: [-2, 0], hip_n: [-2, 0], hip_f: [-2, 0], knee_n: [-2, 0], knee_f: [-2, 0], foot_n: [-2, 0], foot_f: [-2, 0], toe_n: [-2, 0], toe_f: [-2, 0]}
  atk_follow:                # the swoop key 2 px further through and 1 lower (overshoot); knees and feet 1 on
    t: 1.0
    moves: []
    dy: 1
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0], hip: [2, 0], hip_n: [2, 0], hip_f: [2, 0], knee_n: [1, 0], knee_f: [1, 0], foot_n: [1, 0], foot_f: [1, 0], toe_n: [1, 0], toe_f: [1, 0]}
  atk_recover:               # the idle 2 px forward and 1 down (settling after the swoop); knees and feet 1 forward
    t: 0
    moves: []
    dy: 1
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0], hip: [2, 0], hip_n: [2, 0], hip_f: [2, 0], knee_n: [1, 0], knee_f: [1, 0], foot_n: [1, 0], foot_f: [1, 0], toe_n: [1, 0], toe_f: [1, 0]}
  hurt_in1:                  # flinch: the whole upper body and cape 3 back (translated, feet planted); knees 1
    t: 0
    moves: []
    dy: 0
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [-3, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-3, 0], hand_n: [-3, 0], sh_f: [-3, 0], el_f: [-3, 0], hand_f: [-3, 0], hip: [-3, 0], hip_n: [-3, 0], hip_f: [-3, 0], knee_n: [-1, 0], knee_f: [-1, 0]}
  hurt_in2:                  # from the hurt: the upper body and cape 2 toward the idle
    t: 0
    moves: []
    dy: 0
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0], hip: [2, 0], hip_n: [2, 0], hip_f: [2, 0]}
  daze:                      # slump: the head nods 1 down, translated
    moves: []
    dy: 0
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [0, 1], neck: [0, 1]}
  daze_b:                    # the slump 1 px lower (breath)
    moves: []
    dy: 1
    pins: [knee_n, knee_f, foot_n, foot_f, toe_n, toe_f]
    tweaks: {crown: [0, 1], neck: [0, 1]}
masks:
  head:                        # the face, hair and the tall collar move as one piece (the collar is not split off the torso)
    idle: [[24, 2], [54, 2], [54, 26], [24, 26]]
  torso:                       # the whole cape, both arms and the coat down to the hem are one piece: every in-between
    # moves them together, so no seam can open inside the cape (review 1: shoulder and hem cracks)
    idle: [[12, 27], [68, 27], [68, 67], [36, 67], [36, 69], [12, 69]]
    attack: [[2, 27], [42, 27], [42, 34], [68, 34], [68, 67], [2, 67]]
    hurt: [[8, 28], [60, 28], [60, 67], [8, 67]]
  ft_n:
    idle: [[41, 70], [57, 70], [57, 77], [41, 77]]
    attack: [[40, 69], [57, 69], [57, 77], [40, 77]]
    hurt: [[37, 69], [55, 69], [55, 77], [37, 77]]
  ft_f:
