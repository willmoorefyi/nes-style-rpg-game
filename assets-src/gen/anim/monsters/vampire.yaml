# Vampire v2 (pass V R296, docs/REDESIGN_PLAN.md 3.1): a young noble vampire, pale grey-blue face with red eyes,
# slicked black hair, a tall black collar, a black cape with a deep red lining kept close, one claw raised before the
# chest. The keys are far apart (the attack is a low forward swoop with the claw raking across the chest, the hurt a
# twist away behind the closed cape), so every in-between is a translation-only copy of its source key (moves: []):
# the upper body, cape and hips move as one piece, the knees by about half and the feet by at most 1 px (2 in
# atk_mid); the motion lives in the key switch. No fx part (the v1 `slash` is not re-declared).
# fixmeasure.py switch (no rig): attack need 0.550 cap 6.0 d (0, 0), IoU 0.616; hurt d (4, 0), IoU 0.705.
# Image review 2: SHIP WITH NITS (the boots shift 1 px in wind2 / follow / recover and 2 in atk_mid, the allowed
# near-pin). Review 1 (ITERATE) found cape cracks: the torso mask now makes cape, arms and coat one piece.
# Kept distinct from vampire_lord (crouch with the claw drawn up, rotated arm moves): here the whole figure rises
# and leans back before the swoop and settles forward after it.
