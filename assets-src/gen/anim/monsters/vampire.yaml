sprite: vampire
# EF-H (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/vampire/monster_large.png, backend: user;
# 128x128 cells, the idle 90 px tall). The pass-V rig is archived as anim/monsters/_retired/vampire_v2.yaml.
# dark_wizard's recipe: the cape and coat are the torso with the hip where the legs leave them, the arms ride the
# torso (arm parts removed; the cape wraps them), so every in-between is a rigid lean of its source key's upper body
# about the hip, written as tweaks under `moves: []`.
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [70, 34]
    neck: [70, 46]
    chest: [68, 58]
    hip: [66, 105]
    sh_n: [80, 55]
    el_n: [84, 70]
    hand_n: [88, 82]
    sh_f: [52, 58]
    el_f: [50, 72]
    hand_f: [52, 84]
    hip_n: [72, 106]
    knee_n: [76, 111]
    foot_n: [78, 117]
    toe_n: [83, 121]
    hip_f: [60, 106]
    knee_f: [58, 111]
    foot_f: [58, 117]
    toe_f: [55, 121]
  attack:
    crown: [62, 36]
    neck: [63, 50]
    chest: [64, 60]
    hip: [62, 103]
    sh_n: [74, 54]
    el_n: [86, 52]
    hand_n: [96, 46]
    sh_f: [52, 58]
    el_f: [42, 62]
    hand_f: [30, 68]
    hip_n: [70, 104]
    knee_n: [76, 107]
    foot_n: [80, 117]
    toe_n: [86, 121]
    hip_f: [56, 104]
    knee_f: [48, 110]
    foot_f: [40, 117]
    toe_f: [36, 121]
  hurt:
    crown: [40, 45]
    neck: [48, 56]
    chest: [56, 64]
    hip: [64, 105]
    sh_n: [72, 64]
    el_n: [80, 66]
    hand_n: [88, 62]
    sh_f: [48, 66]
    el_f: [44, 76]
    hand_f: [50, 80]
    hip_n: [70, 106]
    knee_n: [76, 111]
    foot_n: [80, 117]
    toe_n: [85, 121]
    hip_f: [52, 106]
    knee_f: [46, 111]
    foot_f: [42, 117]
    toe_f: [38, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}       # the arms ride the torso and head under the cape (every move is a rigid lean of the
  farm_n: {remove: true}       # whole upper body)
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 12.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:                        # every in-between: its source key's upper body leaned rigidly about the hip (each
                               # upper joint rotated about `hip`, rounded to whole px), knees and feet pinned; the attack frames also shift
                               # the upper body sideways (the lunge key's cape mass sits far left of the idle's: centroid cap)
  atk_wind1:                  # draw back 2 deg, the upper body 4 px back, 1 px up (the cape hem off the feet row)
    moves: []
    t: -0.05
    dy: -1
    tweaks: {crown: [-6, 0], neck: [-6, 0], chest: [-6, 0], sh_n: [-6, 0], el_n: [-5, -1], hand_n: [-5, -1], sh_f: [-6, 1], el_f: [-5, 1], hand_f: [-5, 1]}
  atk_wind2:                  # draw back 4 deg, 8 px back, 2 px up: toward the lunge key's cape mass
    moves: []
    t: -0.1
    dy: -2
    tweaks: {crown: [-13, 0], neck: [-12, 0], chest: [-11, 0], sh_n: [-12, -1], el_n: [-10, -1], hand_n: [-10, -1], sh_f: [-11, 1], el_f: [-10, 1], hand_f: [-9, 1]}
  atk_mid:                    # the lunge key, the upper body 5 px forward (toward the wind)
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [5, 0], neck: [5, 0], chest: [5, 0], sh_n: [5, 0], el_n: [5, 0], hand_n: [5, 0], sh_f: [5, 0], el_f: [5, 0], hand_f: [5, 0]}
  atk_follow:                 # settle: 6 px forward
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [6, 0], neck: [6, 0], chest: [6, 0], sh_n: [6, 0], el_n: [6, 0], hand_n: [6, 0], sh_f: [6, 0], el_f: [6, 0], hand_f: [6, 0]}
  atk_recover:                # back to the idle through the draw-back (as wind1)
    moves: []
    t: -0.1
    dy: -1
    tweaks: {crown: [-6, 0], neck: [-6, 0], chest: [-6, 0], sh_n: [-6, 0], el_n: [-5, -1], hand_n: [-5, -1], sh_f: [-6, 1], el_f: [-5, 1], hand_f: [-5, 1]}
  hurt_in1:                   # flinch: the idle thrown back 3.5 deg
    moves: []
    tweaks: {crown: [-4, 0], neck: [-4, 0], chest: [-3, 0], sh_n: [-3, -1], el_n: [-2, -1], hand_n: [-1, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-1, 1]}
  hurt_in2:                   # the hurt key 5 deg less thrown back, on the way to the idle
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [5, -2], neck: [4, -1], chest: [4, -1], sh_n: [4, 1], el_n: [3, 2], hand_n: [4, 2], sh_f: [3, -1], el_f: [3, -2], hand_f: [2, -1]}
  daze:                       # slump toward the hurt: the idle 2 deg back
    moves: []
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-1, -1], hand_n: [-1, -1], sh_f: [-2, 1], el_f: [-1, 1], hand_f: [-1, 1]}
  daze_b:                     # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-2, 1], neck: [-2, 1], chest: [-2, 0], sh_n: [-2, 0], el_n: [-1, -1], hand_n: [-1, -1], sh_f: [-2, 1], el_f: [-1, 1], hand_f: [-1, 1]}
masks: {}
holds: []
paint:                         # 1 px cracks between the leaning upper body and the pinned legs, closed with ink
  - {frame: atk_wind1, xy: [[53, 107]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[75, 101]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[53, 107]], rgb: [6, 4, 10]}
  - {frame: atk_mid, xy: [[63, 99]], rgb: [6, 4, 10]}
  - {frame: atk_mid, xy: [[44, 101]], rgb: [6, 4, 10]}
  - {frame: atk_follow, xy: [[68, 98]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[53, 107]], rgb: [6, 4, 10]}
# pass KT: the approved kneel key (approved/vampire/kneel.png, the user sheet's 4th pose) and the bridge frames
# (kneel_bridge.py)
kneel:
  source: ai
  bridge: {keep_top: 0.1, keep_bot: 0.3}   # the default band opened a second hole in kneel_in2 (the cape fold); the stretch keeps the head band
