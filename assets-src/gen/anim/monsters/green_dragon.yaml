  - {frame: kneel_in2, xy: [[72, 110], [72, 111], [72, 112], [73, 112], [73, 113]], rgb: [66, 99, 66]}
  - {frame: kneel_in2, xy: [[113, 123], [114, 123], [115, 123], [116, 123], [113, 124]], rgb: null}
  - {frame: kneel_in1, xy: [[61, 100], [62, 100], [60, 101], [61, 101], [62, 101], [63, 101], [60, 102], [61, 102], [59, 103], [60, 103], [73, 106], [72, 107], [73, 107], [72, 108], [73, 108], [72, 109], [72, 110], [90, 109], [91, 109], [92, 109], [93, 109], [94, 109], [90, 110], [91, 110], [92, 110], [93, 110], [94, 110], [95, 110], [92, 111], [93, 111], [94, 111], [95, 111], [96, 111], [92, 112], [93, 112], [94, 112], [95, 112], [96, 112], [97, 112], [94, 113], [95, 113], [96, 113]], rgb: [66, 99, 66]}
  - {frame: kneel_in1, xy: [[107, 123]], rgb: null}
# pass K (docs/KNEEL_PLAN.md K2-0, iteration 2: the winged probe): lying sphinx-like like blue_dragon, the folded
# wing drooping back down along the body toward the ground (variant winged)
kneel:
  variant: [crouch, sphinx, winged]
  samplers: {head: rotsprite}
  paint:
    # the outline the turned head, lowered chest and flat forelegs thinned, thickened inward; a 1 px crack closed
