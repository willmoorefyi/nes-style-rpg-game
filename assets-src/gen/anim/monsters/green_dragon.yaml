sprite: green_dragon
body: quadruped
facing: right
sampler: nearest
breath: true
# Heavy short-necked green dragon (pass R batch D, quadruped), the blue_dragon's sibling: where the blue one rears its
# long neck and whips, this one hunches: the wind-up sinks the bulk and pulls the frilled head in low, the bite is a
# heavy thrust. The small folded wing is one rigid part on its own root (wr -> wt) in every key. The spiral tail stays
# out of every move set (it rides the hip). No breath fx: the approved attack draws none.
