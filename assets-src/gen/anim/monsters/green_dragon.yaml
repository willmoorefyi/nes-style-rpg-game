frames:
  atk_wind1:                   # the hunch starts: bulk 1 down and 1 back, neck and head pulled in 3 and 2 low as one
    t: 0.0
    dy: 1
    moves: []
    tweaks: {neck: [-3, 2], head: [-3, 2], snout: [-3, 2], hip: [-1, 0], back: [-1, 0], chest: [-1, 0], wr: [-1, 0], wt: [-1, 0]}
  atk_wind2:                   # the coil: bulk 3 down and 2 back, neck and head tucked 7 back and 2 down as one, wing pressed flat
    t: 0.0
    dy: 3
    moves: []
    tweaks: {neck: [-7, 2], head: [-7, 2], snout: [-7, 2], hip: [-1, 0], back: [-3, 0], chest: [-3, 0], wr: [-3, 0], wt: [-3, 1]}
  atk_mid:                     # the thrust passing: attack pose, head and neck held 4 back and up
    t: 0.05
    moves: []
    pins: [foot_n, foot_f, paw_n, paw_f]
    tweaks: {chest: [-1, -1], neck: [-2, -2], head: [-3, -4], snout: [-3, -4]}
  atk_follow:                  # settle after the bite: head eases 2 up
    t: 0.9
    moves: []
    pins: [foot_n, foot_f, paw_n, paw_f]
    tweaks: {neck: [0, -1], head: [-1, -2], snout: [-1, -2]}
  atk_recover:                 # idle with the bulk still 2 low and 2-3 back, the head (and its sacs) 11 low
    t: 0.3
    dy: 2
    moves: []
    tweaks: {hip: [-1, 0], back: [-3, 1], chest: [-3, 2], neck: [0, 7], head: [0, 11], snout: [0, 11], wr: [-3, 0], wt: [-3, 0]}
  hurt_in1:                    # the flinch: head snaps back 5 and down 3 toward the hunch, bulk 1 down
    t: 0.1
    dy: 0
    moves: []
    tweaks: {neck: [-3, 1], head: [-5, 3], snout: [-5, 4], chest: [-1, 0], wr: [-1, 0], wt: [-2, 1]}
  hurt_in2:                    # easing out of the hunch: head and neck 3 back up toward idle
    t: 0.3
    moves: []
    tweaks: {neck: [1, -2], head: [2, -3], snout: [2, -3], chest: [0, -1]}
  daze:                        # sleep / stun: the heavy head sags 3, nose dipped
    t: 0.0
    dy: 0
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [0, 1], head: [1, 3], snout: [1, 4]}
  daze_b:                      # the sway's low point: body 1 px lower
    t: 0.0
    dy: 1
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [0, 1], head: [1, 3], snout: [1, 4]}
holds: []
paint:
  - {frame: atk_wind2, xy: [[61, 102], [62, 104]], rgb: [6, 4, 10]}   # 1 px crack, outline ink
  - {frame: hurt_in2, xy: [[85, 70], [85, 71], [85, 72], [84, 73], [85, 73], [85, 74], [85, 75], [85, 76], [85, 77], [85, 78], [85, 79]], rgb: [6, 4, 10]}   # 11 px pocket between parts filled
  - {frame: hurt_in2, xy: [[81, 60]], rgb: [6, 4, 10]}   # 1 px crack, outline ink

  # pass K: kneel_in1 / kneel_in2: pockets the folding forelegs close filled with their shade, cracks closed, the px under the feet row cleared
  - {frame: kneel_in2, xy: [[94, 58], [94, 59], [94, 63], [95, 63]], rgb: [6, 4, 10]}
  - {frame: kneel_in2, xy: [[95, 59], [94, 60], [95, 60], [94, 61], [95, 61], [96, 61], [94, 62], [95, 62], [96, 62], [96, 63]], rgb: [115, 107, 74]}
