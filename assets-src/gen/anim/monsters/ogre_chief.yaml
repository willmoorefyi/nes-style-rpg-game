frames:                        # moves: [] everywhere: rigid rotations about the hip / shoulders written as tweaks (/tmp/rA/tools/rot.py)
  atk_wind1:                   # coil forward (a lean-back loses the head overlap): lean in 3, the far hand comes 10 toward the grip
    moves: []
    sampler: rotsprite
    tweaks: {crown: [4, 0], neck: [2, 0], chest: [1, 0], sh_n: [2, 1], el_n: [1, 1], hand_n: [1, 2], sh_f: [2, -1], el_f: [5, -1], hand_f: [7, -1]}
  atk_wind2:                   # lean in 6, cleaver arm 8 forward, far arm 28 forward to the grip; body 2 lower (recipe dy)
    moves: []
    sampler: rotsprite
    tweaks: {crown: [7, 1], neck: [4, 0], chest: [3, 0], sh_n: [4, 2], el_n: [5, 1], hand_n: [5, 0], tip: [5, 0], sh_f: [5, -2], el_f: [13, -1], hand_f: [20, -4]}
  atk_mid:                     # the raise leaned back 4, both arms 6 lower, 2 lower; legs shifted ~1/3 toward idle
    moves: []
    dy: 2
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-5, -1], neck: [-2, -1], chest: [-2, 0], sh_n: [-3, -1], el_n: [-5, 0], hand_n: [-7, 3], tip: [-7, 11], sh_f: [-3, 1], el_f: [-5, 1], hand_f: [-7, 0], foot_f: [2, 0], foot_n: [-2, 0], knee_n: [-2, 0]}
  atk_follow:                  # the chop starts: a settle, upper body 6 forward and 1 lower
    t: 0.85
    moves: []
    dy: 1
    tweaks: {crown: [7, 2], neck: [3, 1], chest: [3, 1], sh_n: [4, 2], el_n: [6, 2], hand_n: [7, 0], tip: [8, -5], sh_f: [5, 0], el_f: [6, -1], hand_f: [7, 0]}
  atk_recover:                 # after the chop: leaning in 10, the far arm 8 forward
    moves: []
    sampler: rotsprite
    tweaks: {crown: [12, 1], neck: [6, 1], chest: [5, 0], sh_n: [7, 4], el_n: [4, 4], hand_n: [2, 5], tip: [2, -1], sh_f: [8, -3], el_f: [7, -3], hand_f: [7, -3]}
  hurt_in1:                    # recoil: lean back 6 with the arms (the cleaver must not leave the belly bare), head back 6 (translated)
    moves: []
    sampler: rotsprite
    tweaks: {crown: [-6, 0], neck: [-5, 0], chest: [-3, 0], sh_n: [-4, -2], el_n: [-3, -2], hand_n: [-1, -3], tip: [-1, 1], sh_f: [-5, 3], el_f: [-2, 3], hand_f: [0, 3]}
  hurt_in2:                    # the hurt key leaned 6 back toward upright, the flying helm with the head
    moves: []
    tweaks: {crown: [6, -2], neck: [4, -1], chest: [3, -1], helm_c: [6, -2], helm_r: [6, -2], sh_n: [3, 1], el_n: [2, 2], hand_n: [-1, 3], tip: [-2, -2], sh_f: [4, -3], el_f: [2, -3], hand_f: [0, -3]}
  daze:                        # slump, translated (no rotation: a turned chest opened a seam at the far pauldron): body 1
    moves: []                  # lower, the head 2 more and 1 forward (daze_b: body 2, head 1)
    dy: 1
    tweaks: {crown: [-2, 1], neck: [-2, 1]}
  daze_b:
    moves: []
    dy: 2
    tweaks: {crown: [-2, 1], neck: [-2, 1]}
