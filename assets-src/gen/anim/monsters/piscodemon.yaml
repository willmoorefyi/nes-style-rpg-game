# V8 redesign (R323, docs/REDESIGN_FIX_PLAN.md F2): a squat deep-sea horror, a dark ridged mantle head with two
# slanted yellow-orange eyes, six face tentacles. idle: hunched, the tentacles hanging, the near claw held in front;
# attack: a low lunge, the head pushed out, the tentacles fanned toward the heroes, the far leg stretched back; hurt:
# the head thrown back, the tentacles spread and curling, a claw up. The keys are far apart, so every in-between is a
# translation-only copy of its key (moves: []), head + tentacles and the near claw arm moved as rigid groups, feet
# pinned (structure of the archived piscodemon_v2 rig).
