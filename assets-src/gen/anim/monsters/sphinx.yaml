frames:
  atk_wind1:   # anticipation: head drawn back and up, spine 1 px back
    t: 0.0
    dy: 0
    moves: []
    tweaks: {head: [-2, -1], snout: [-2, -2], neck: [-1, 0], hip: [-1, 0], back: [-1, 0], chest: [-1, 0], tail0: [-1, 0], tail1: [-1, 0], tail2: [-1, 0], tail3: [-1, 0], tail_tip: [-1, 0]}
  atk_wind2:   # coil: head reared back, spine 2 px back and 1 down
    t: 0.0
    dy: 1
    moves: []
    tweaks: {neck: [-2, -1], head: [-4, -2], snout: [-4, -4], hip: [-2, 0], back: [-2, 0], chest: [-2, 0], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail3: [-2, 0], tail_tip: [-2, 0]}
  atk_mid:   # the pass: far forepaw and hind feet planted; the stretched near hind leg 3 px toward idle
    t: 0.35
    moves: [back, chest, neck, head, snout]
    tweaks: {tail2: [0, 1], tail3: [0, 2], foot_n: [3, 0], toe_n: [3, 0], knee_n: [3, 0], hip_n: [3, 0]}
    pins: [paw_f, foot_n, foot_f]
  atk_follow:   # the settle (t 0.75), spine only: the raised swiping arm rides the chest (pinned in the air it cracked)
    t: 0.75
    moves: [back, chest]
    tweaks: {tail2: [0, 1], tail3: [0, 2]}
    pins: [paw_f, foot_n, foot_f, el_f]
  atk_recover:   # 30% toward the swipe
    t: 0.2
    moves: [back, chest]
  hurt_in1:   # the flinch starts: spine, neck and head 20% toward hurt, head jerks back and up (the hip stays: moving it tore the far hind leg); feet and elbows planted
    t: 0.2
    moves: [back, chest, neck, head, snout]
    tweaks: {head: [-2, -2], snout: [-2, -2]}
    pins: [paw_n, paw_f, foot_n, foot_f, el_n, el_f]
  hurt_in2:   # 30% back toward idle; legs, elbows and the far shoulder planted
    t: 0.3
    moves: [back, chest, neck, head, snout]
    tweaks: {tail2: [0, 2], tail3: [0, 4], tail_tip: [12, 12]}
    pins: [paw_n, paw_f, foot_n, foot_f, el_f, sh_f]
  daze:   # head and snout hang (the neck stays put)
    t: 0.0
    dy: 0
    moves: [back, chest, head, snout]
    tweaks: {head: [-1, -1], snout: [-1, 0]}
  daze_b:
    t: 0.0
    dy: 0
    moves: [back, chest, head, snout]
    tweaks: {head: [-1, -1], snout: [-1, 1]}
holds: []
paint:
  - {frame: atk_mid, xy: [[22, 123], [23, 123]], rgb: null}
  - {frame: atk_wind2, xy: [[60, 107]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[75, 67], [74, 68], [75, 68], [74, 69], [51, 69]], rgb: [6, 4, 10]}
  - {frame: daze, xy: [[88, 49], [87, 50], [88, 50], [85, 51], [86, 51], [87, 51], [84, 52]], rgb: [107, 66, 49]}
  - {frame: daze_b, xy: [[88, 49], [87, 50], [88, 50], [85, 51], [86, 51], [87, 51], [84, 52], [85, 52], [84, 53]], rgb: [107, 66, 49]}
  - {frame: daze, xy: [[82, 53], [83, 53], [80, 54], [81, 54], [79, 55], [80, 55]], rgb: [107, 66, 49]}
