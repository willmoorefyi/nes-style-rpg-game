  fwing_n: {remove: true}
  uwing_f: {remove: true}
  fwing_f: {remove: true}
  wing_i: {bone: [chest, wtip_i], radius: 8.0, in: [idle]}
  wing_n: {bone: [wr_n, wt_n], radius: 8.0, in: [attack, hurt]}
  wing_f: {bone: [wr_f, wt_f], radius: 8.0, in: [attack, hurt]}
  tail: {chain: [tail0, tail1, tail2, tail_tip], in: [idle, attack]}
  body: {width: auto}
