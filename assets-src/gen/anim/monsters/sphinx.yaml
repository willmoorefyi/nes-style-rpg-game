sprite: sphinx
body: quadruped
facing: right
sampler: nearest
breath: true
# Winged sphinx: lion body, eagle wings, striped headdress. The dragon's winged recipe: the folded-up idle wings (both,
# near and far) are one rigid part (wing_i) on the withers; the raised attack wings and the hurt wings sit on their own
# root joints (wr_n / wr_f), so idle-sourced frames keep the idle wings and attack- / hurt-sourced frames keep theirs.
# The tail is hidden in the hurt key, so its part exists only in idle and attack. In the attack the near forepaw is
# raised (a swipe), so atk_mid plants only the far forepaw and both hind feet.
