frames:                        # rigid leans about the hip and translations, written as tweaks (moves [])
  atk_wind1:                   # upper body 2 back (translated), head 1 more, axe hands 2 up
    moves: []
    t: -0.05
    tweaks: {crown: [-3, 0], neck: [-3, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, -2], hand_n: [-2, -2], tip: [-2, -2], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
  atk_wind2:                   # coil: lean back 10, axe hands 4 up, body 2 lower
    moves: []
    t: -0.1
    dy: 2
    tweaks: {crown: [-10, -1], neck: [-7, 0], chest: [-5, 1], sh_n: [-7, -1], el_n: [-5, -6], hand_n: [-6, -6], tip: [-6, -10], sh_f: [-6, 3], el_f: [-4, 5], hand_f: [-3, 3]}
  atk_mid:                     # the downswing: the attack upper body (axe included) leaned back 9 about the hip; the back leg 3 in
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    sampler: rotsprite
    tweaks: {crown: [-8, -2], neck: [-5, -1], chest: [-5, 0], sh_n: [-5, -1], el_n: [-3, -2], hand_n: [-2, -2], tip: [2, -4], sh_f: [-6, 2], el_f: [-4, 3], hand_f: [-2, -1], knee_f: [3, 0], foot_f: [3, 0]}
  atk_follow:                  # settle: the attack upper body 3 back about the hip
    moves: []
    t: 0.8
    tweaks: {crown: [-3, -1], neck: [-2, -1], chest: [-2, 0], sh_n: [-2, -1], el_n: [-1, -1], hand_n: [-1, -1], tip: [1, -1], sh_f: [-2, 1], el_f: [-1, 1], hand_f: [-1, -1]}
  atk_recover:                 # upper body and axe 2 forward and 2 lower (translated)
    moves: []
    dy: 2
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], tip: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0]}
  hurt_in1:                    # recoil 1, lean back 7, head 10 further back
    moves: []
    tweaks: {crown: [-11, -1], neck: [-6, 0], chest: [-5, 0], sh_n: [-6, -1], el_n: [-4, -1], hand_n: [-5, -2], tip: [-5, -4], sh_f: [-6, 2], el_f: [-4, 4], hand_f: [-3, 2]}
  hurt_in2:                    # the hurt pose leaned in 7, head 5 forward
    moves: []
    tweaks: {crown: [10, -3], neck: [6, -1], chest: [4, -1], sh_n: [5, 0], el_n: [3, 1], hand_n: [2, 2], tip: [0, 4], sh_f: [5, -3], el_f: [4, -2], hand_f: [3, 0]}
  daze:                        # slump: the upper body 1 forward and 1 lower (translated), the head 1 more
    moves: []
    dy: 1
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], tip: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
