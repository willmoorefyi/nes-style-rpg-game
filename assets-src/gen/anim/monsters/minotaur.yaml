    moves: []
    t: 0.8
    tweaks: {crown: [-3, -1], neck: [-2, -1], chest: [-2, 0], sh_n: [-2, -1], el_n: [-1, -1], hand_n: [-1, -1], tip: [1, -1], sh_f: [-2, 1], el_f: [-1, 1], hand_f: [-1, -1]}
  atk_recover:                 # upper body and axe 2 forward and 2 lower (translated)
    moves: []
    dy: 2
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], tip: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0]}
  hurt_in1:                    # recoil 1, lean back 7, head 10 further back
    moves: []
    tweaks: {crown: [-11, -1], neck: [-6, 0], chest: [-5, 0], sh_n: [-6, -1], el_n: [-4, -1], hand_n: [-5, -2], tip: [-5, -4], sh_f: [-6, 2], el_f: [-4, 4], hand_f: [-3, 2]}
