frames:                        # rigid leans about the hip and translations, written as tweaks (moves [])
  atk_wind1:                   # upper body 2 back (translated), head 1 more, axe hands 2 up
    moves: []
    t: -0.05
    tweaks: {crown: [-3, 0], neck: [-3, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, -2], hand_n: [-2, -2], tip: [-2, -2], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
  atk_wind2:                   # coil: lean back 10, axe hands 4 up, body 2 lower
    moves: []
    t: -0.1
    dy: 2
    tweaks: {crown: [-10, -1], neck: [-7, 0], chest: [-5, 1], sh_n: [-7, -1], el_n: [-5, -6], hand_n: [-6, -6], tip: [-6, -10], sh_f: [-6, 3], el_f: [-4, 5], hand_f: [-3, 3]}
  atk_mid:                     # the downswing: the attack upper body (axe included) leaned back 9 about the hip; the back leg 3 in
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    sampler: rotsprite
    tweaks: {crown: [-8, -2], neck: [-5, -1], chest: [-5, 0], sh_n: [-5, -1], el_n: [-3, -2], hand_n: [-2, -2], tip: [2, -4], sh_f: [-6, 2], el_f: [-4, 3], hand_f: [-2, -1], knee_f: [3, 0], foot_f: [3, 0]}
