frames:
  atk_wind1:                   # anticipation: head drawn back and down, wings start to lift, stinger cocks back
    t: 0.0
    dy: 0
    moves: []
    tweaks: {neck: [-1, 1], head: [-2, 1], snout: [-2, 1], wt: [2, -4], tail3: [-1, 0], tail_tip: [-1, -1]}
  atk_wind2:                   # coil: body 1 px down, head low and back, wings lifted, stinger cocked over the back
    t: 0.0
    dy: 1
    moves: []
    tweaks: {neck: [-3, 1], head: [-4, 1], snout: [-4, 1], wt: [3, -9], tail2: [-1, 0], tail3: [-2, -1], tail_tip: [-3, -2]}
  atk_mid:                     # the pass: spine and tail 35% back toward the coil, head translated with them; the near foreleg
    pins: [foot_n, foot_f, knee_f, knee_n]   # keeps its attack reach (out of moves: idle->attack turns it 110 deg)
    moves: [back, chest, tail0, tail1, tail2, tail3, tail_tip, sh_f, el_f, paw_f, ftoe_f]
    tweaks: {wr: [1, -1], wt: [1, -1], knee_n: [3, 0], foot_n: [3, 0], foot_f: [3, 0], knee_f: [2, 0]}
  atk_follow:                  # follow-through: head and mane carry 2 px on past the bite, wings beat down, stinger whips
    t: 1.10
    moves: [back, chest, tail0, tail1, tail2, tail3, tail_tip]
    tweaks: {neck: [1, 0], head: [2, 1], snout: [2, 1], wr: [2, 1], wt: [0, 4], tail3: [-1, 0], tail_tip: [-2, 1]}
  atk_recover:                 # settle: head and tail ease back, the body and legs stay on idle
    t: 0.35
    moves: [neck, head, snout, tail0, tail1, tail2, tail3, tail_tip, wr, wt]
  hurt_in1:                    # the flinch starts: head snaps back, tail and wings 32% toward the hurt key (wings flung up); body and legs hold
    t: 0.32
    dy: 0
    pins: [foot_n, foot_f, paw_n, paw_f, knee_n, knee_f, el_n, el_f]
    moves: [neck, head, snout, tail0, tail1, tail2, tail3, tail_tip, wr, wt]
    tweaks: {neck: [-1, 0], head: [-2, -1], snout: [-2, -1], wt: [2, -4]}
  hurt_in2:                    # easing out: head, tail and wings 25% back toward idle; body and legs hold the hurt crouch
    t: 0.25
    pins: [foot_n, foot_f, paw_n, paw_f, knee_n, knee_f, el_n, el_f]
    moves: [neck, head, snout, tail0, tail1, tail2, tail3, tail_tip, wt]   # wr held: a 1 px wing lift bared its lower ink on the back
  daze:                        # sleep / stun: body 1 px lower, head and mane 1 px lower still (no forward slide:
    t: 0.0                     # the mane must stay against the far wing), nose dipped, tail and wings ride the spine
    dy: 1                      # (the recipe's 2 / 4 px at this cell squashed the pinned legs and cracked the ankles)
    moves: [back, chest, neck, head, snout, tail0, tail1, tail2, tail3, tail_tip, wr, wt]
    tweaks: {head: [-2, -1], snout: [-2, 0]}
  daze_b:                      # the sway's low point: everything 1 px lower
    t: 0.0
    dy: 2
    moves: [back, chest, neck, head, snout, tail0, tail1, tail2, tail3, tail_tip, wr, wt]
    tweaks: {head: [-2, -1], snout: [-2, 0]}
holds: []
paint:                         # hurt_in2: the turned far wing's root left a 1 px ink line on the mane; the hurt key's reds back
  - {frame: hurt_in2, xy: [[86, 72], [80, 78], [81, 78], [82, 78]], rgb: [82, 33, 41]}
  - {frame: hurt_in2, xy: [[85, 74], [84, 75], [83, 77]], rgb: [132, 33, 49]}
  # daze_b: a 2 px ink crease across the near forearm (the lowered shoulder) and a 1 px spur on the near hock
  - {frame: daze_b, xy: [[68, 106]], rgb: [198, 123, 74]}
  - {frame: daze_b, xy: [[69, 106]], rgb: [214, 140, 82]}
  - {frame: daze_b, xy: [[18, 113]], rgb: null}
