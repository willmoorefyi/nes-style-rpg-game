frames:
  atk_wind1:                   # crouch starts: spine tips nose-down, head sinks (the tail rides the body: its keys are far apart)
    moves: [back, chest]
    tweaks: {neck: [0, 1], head: [0, 1], snout: [0, 1]}
  atk_wind2:                   # coil: chest and head low, head pulled back
    dy: 1
    moves: [back, chest]
    tweaks: {neck: [-1, 1], head: [-1, 1], snout: [-1, 1]}
  atk_mid:                     # the lunge drawn back 3 and down 2 toward the coil; the far foreleg, hind legs and tail ride the
    t: 0.31                    # body (their keys are far apart)
    pins: []
    dx: -3
    dy: 2
    moves: [hip, back, chest, neck, head, snout, sh_n, el_n, paw_n, ftoe_n, sh_f]
    tweaks: {el_n: [-1, -1], paw_n: [-2, -2], ftoe_n: [-2, -3], tail0: [2, 0], tail1: [3, 0], tail2: [3, 0], tail_tip: [3, 0]}
  atk_follow:                  # a settle: the hind legs swing down toward the stance, body 2 back; head and forelegs keep the bite
    t: 0.80
    pins: [paw_n]
    dx: -2
    moves: [hip, back, chest, hip_n, knee_n, foot_n, toe_n, hip_f, knee_f, foot_f, toe_f]
  atk_recover:                 # landing: all four paws planted, body lifted, head level
    t: 0.35
    moves: [back, chest, neck, sh_n, sh_f]
    tweaks: {chest: [0, -1], neck: [0, -1], head: [0, -1], snout: [0, -1]}
  hurt_in1:
    t: 0.32
    pins: [foot_n, foot_f, paw_n, paw_f]
    moves: [hip, back, chest, neck, head, snout, hip_n, knee_n, hip_f, knee_f, sh_n, el_n, sh_f, el_f]
  hurt_in2:
    t: 0.25
    pins: [foot_n, foot_f, paw_n, paw_f]
    moves: [back, chest, neck, head, snout, sh_n, el_n, sh_f, el_f, knee_n, knee_f]
  daze:
    t: 0.0
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [1, 1], head: [0, 1], snout: [0, 3]}
  daze_b:
    t: 0.0
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [1, 1], head: [0, 1], snout: [0, 4]}
masks:
  head:                        # the open jaw and the whole muzzle are head (not the forelegs under them)
    idle: [[74, 32], [95, 38], [95, 56], [74, 56]]
    attack: [[79, 38], [99, 40], [99, 63], [79, 63]]
    hurt: [[68, 26], [90, 34], [90, 52], [68, 52]]
holds: []
paint:                         # the 1 px channel between the forelegs (open to the ground in idle) kept open; seams closed with ink
  - {frame: hurt_in1, xy: [[65, 71]], rgb: null}
  - {frame: daze, xy: [[64, 70]], rgb: null}
  - {frame: atk_wind2, xy: [[58, 62], [59, 62]], rgb: [6, 4, 10]}
