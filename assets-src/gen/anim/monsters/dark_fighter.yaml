sprite: dark_fighter
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/dark_fighter/monster_large.png,
# backend: user; 128x128 cells, the idle 74 px tall). The old rig is archived as anim/monsters/_retired/dark_fighter_v1.yaml.
# The pirate's recipe: the plate and tabard torso with the hip where the legs leave the tabard, the arms, the sword and
# the shield ride the torso (arm and weapon parts removed), so every in-between is a rigid lean of its source key's
# upper body about the hip (tweaks under `moves: []`: each upper joint rotated about `hip`, rounded to whole px).
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [62, 52]
    neck: [63, 66]
    chest: [62, 74]
    hip: [62, 98]
    sh_n: [72, 70]
    el_n: [76, 78]
    hand_n: [76, 84]
    sh_f: [52, 70]
    el_f: [50, 82]
    hand_f: [54, 92]
    hip_n: [68, 100]
    knee_n: [68, 110]
    foot_n: [70, 117]
    toe_n: [74, 121]
    hip_f: [56, 100]
    knee_f: [52, 110]
    foot_f: [50, 117]
    toe_f: [48, 121]
  attack:
    crown: [70, 52]
    neck: [70, 64]
    chest: [66, 74]
    hip: [62, 96]
    sh_n: [72, 70]
    el_n: [74, 80]
    hand_n: [76, 90]
    sh_f: [58, 70]
    el_f: [62, 84]
    hand_f: [72, 92]
    hip_n: [70, 100]
    knee_n: [74, 108]
    foot_n: [76, 117]
    toe_n: [82, 121]
    hip_f: [54, 100]
    knee_f: [44, 108]
    foot_f: [38, 117]
    toe_f: [36, 121]
  hurt:
    crown: [40, 56]
    neck: [44, 66]
    chest: [50, 76]
    hip: [56, 96]
    sh_n: [58, 70]
    el_n: [64, 68]
    hand_n: [70, 70]
    sh_f: [40, 72]
    el_f: [36, 86]
    hand_f: [28, 96]
    hip_n: [64, 100]
    knee_n: [72, 110]
    foot_n: [76, 117]
    toe_n: [84, 121]
    hip_f: [50, 100]
    knee_f: [44, 108]
    foot_f: [40, 117]
    toe_f: [36, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}
  farm_n: {remove: true}
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 14.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                  # draw back 2 deg, the upper body 1 px back
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-3, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-1, 0]}
  atk_wind2:                  # draw back 4 deg, 1 px back, the sword cocked
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, -1], el_n: [-2, -1], hand_n: [-2, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-1, 1]}
  atk_mid:                  # the thrust key 4 deg and 4 px short of it (the keys sit far apart: a bridge)
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-7, 0], neck: [-6, 0], chest: [-6, 0], sh_n: [-6, -1], el_n: [-5, -1], hand_n: [-4, -1], sh_f: [-6, 0], el_f: [-5, 0], hand_f: [-4, -1]}
  atk_follow:                  # the thrust key, 1 px short
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-1, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  atk_recover:                  # the idle leaned 3 deg and 3 px toward the thrust, on the way back
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [5, 0], neck: [5, 0], chest: [4, 0], sh_n: [4, 1], el_n: [4, 1], hand_n: [4, 1], sh_f: [4, -1], el_f: [4, -1], hand_f: [3, -1]}
  hurt_in1:                  # flinch: the idle thrown back 5 deg, 2 px back
    moves: []
    tweaks: {crown: [-6, 0], neck: [-5, 0], chest: [-4, 0], sh_n: [-4, -1], el_n: [-4, -1], hand_n: [-3, -1], sh_f: [-4, 1], el_f: [-3, 1], hand_f: [-2, 1]}
  hurt_in2:                  # the hurt key 6 deg less thrown back, 2 px forward, on the way to the idle
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [6, -1], neck: [5, -1], chest: [4, -1], sh_n: [5, 0], el_n: [5, 1], hand_n: [5, 2], sh_f: [5, -2], el_f: [3, -2], hand_f: [2, -3]}
  daze:                  # slump: the idle 2 deg back
    moves: []
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0]}
  daze_b:                  # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-2, 1], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0]}
masks: {}
holds: []
paint:
  - {frame: atk_wind2, xy: [[74, 101]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[78, 68]], rgb: [6, 4, 10]}
# pass KT: the approved kneel key (approved/dark_fighter/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
