sprite: death_knight
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/death_knight/monster_large.png,
# backend: user; 128x128 cells, the idle 98 px tall). The old rig is archived as anim/monsters/_retired/death_knight_v1.yaml.
# The black_knight's recipe: the plate torso with the hip at the faulds, the arms, the sword and the cloak ride the
# torso (arm and weapon parts removed), so every in-between is a rigid lean of its source key's upper body about the
# hip (tweaks under `moves: []`: each upper joint rotated about `hip`, rounded to whole px).
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [66, 30]
    neck: [66, 46]
    chest: [64, 60]
    hip: [62, 86]
    sh_n: [78, 52]
    el_n: [78, 70]
    hand_n: [74, 80]
    sh_f: [48, 52]
    el_f: [48, 70]
    hand_f: [58, 76]
    hip_n: [72, 88]
    knee_n: [80, 100]
    foot_n: [86, 116]
    toe_n: [92, 121]
    hip_f: [52, 88]
    knee_f: [44, 100]
    foot_f: [38, 116]
    toe_f: [34, 121]
  attack:
    crown: [70, 30]
    neck: [70, 46]
    chest: [66, 60]
    hip: [60, 86]
    sh_n: [80, 52]
    el_n: [80, 70]
    hand_n: [80, 82]
    sh_f: [50, 52]
    el_f: [52, 70]
    hand_f: [64, 80]
    hip_n: [70, 90]
    knee_n: [80, 102]
    foot_n: [86, 116]
    toe_n: [92, 121]
    hip_f: [50, 90]
    knee_f: [38, 102]
    foot_f: [30, 116]
    toe_f: [26, 121]
  hurt:
    crown: [40, 32]
    neck: [42, 48]
    chest: [50, 62]
    hip: [58, 88]
    sh_n: [62, 56]
    el_n: [70, 66]
    hand_n: [74, 62]
    sh_f: [30, 60]
    el_f: [24, 72]
    hand_f: [22, 82]
    hip_n: [68, 92]
    knee_n: [78, 104]
    foot_n: [86, 116]
    toe_n: [92, 121]
    hip_f: [48, 92]
    knee_f: [40, 104]
    foot_f: [34, 116]
    toe_f: [30, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}
  farm_n: {remove: true}
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 14.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                  # draw back 5 deg, the upper body 1 px back
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-6, 0], neck: [-5, 0], chest: [-3, 0], sh_n: [-4, -1], el_n: [-2, -1], hand_n: [-2, -1], sh_f: [-4, 1], el_f: [-2, 1], hand_f: [-2, 0]}
  atk_wind2:                  # draw back 10 deg, 2 px back, the weapon cocked
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-12, 0], neck: [-9, 0], chest: [-7, 0], sh_n: [-8, -2], el_n: [-5, -2], hand_n: [-3, -2], sh_f: [-8, 3], el_f: [-5, 3], hand_f: [-4, 1]}
  atk_mid:                  # the strike key leaned 2 deg on
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [2, 0], neck: [1, 0], chest: [1, 0], sh_n: [1, 1], el_n: [1, 1], hand_n: [0, 1], sh_f: [1, 0], el_f: [1, 0]}
  atk_follow:                  # settle: 1 deg on
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [1, 0], neck: [1, 0], sh_n: [1, 0], sh_f: [1, 0]}
  atk_recover:                  # back to the idle through the draw-back (as wind1)
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-6, 0], neck: [-4, 0], chest: [-3, 0], sh_n: [-4, -1], el_n: [-2, -1], hand_n: [-2, -1], sh_f: [-4, 1], el_f: [-2, 1], hand_f: [-2, 0]}
  hurt_in1:                  # flinch: the idle thrown back 5 deg, 1 px back
    moves: []
    tweaks: {crown: [-6, 0], neck: [-5, 0], chest: [-3, 0], sh_n: [-4, -1], el_n: [-2, -1], hand_n: [-2, -1], sh_f: [-4, 1], el_f: [-2, 1], hand_f: [-2, 0]}
  hurt_in2:                  # the hurt key 6 deg less thrown back, 1 px forward, on the way to the idle
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [7, -2], neck: [5, -1], chest: [4, -1], sh_n: [4, 1], el_n: [3, 1], hand_n: [4, 2], sh_f: [4, -3], el_f: [3, -3], hand_f: [2, -4]}
  daze:                  # slump: the idle 2 deg back
    moves: []
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, -1], el_n: [-1, -1], sh_f: [-1, 1], el_f: [-1, 0]}
  daze_b:                  # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-2, 1], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, -1], el_n: [-1, -1], sh_f: [-1, 1], el_f: [-1, 0]}
masks: {}
holds: []
paint:
  - {frame: atk_wind1, xy: [[82, 82]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[69, 100]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[82, 82]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[82, 82]], rgb: [6, 4, 10]}
  - {frame: hurt_in2, xy: [[26, 66], [27, 66], [26, 67], [27, 67], [28, 67], [27, 68]], rgb: [6, 4, 10]}
  - {frame: atk_wind1, xy: [[69, 99]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[69, 99]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[69, 99]], rgb: [6, 4, 10]}
  - {frame: atk_wind1, xy: [[52, 102]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[52, 102]], rgb: [6, 4, 10]}
  - {frame: hurt_in1, xy: [[52, 102]], rgb: [6, 4, 10]}
# pass KT: the approved kneel key (approved/death_knight/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
