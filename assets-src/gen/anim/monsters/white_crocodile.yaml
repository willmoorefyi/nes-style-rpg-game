parts:
  thigh_f: {remove: true}
  shin_f: {remove: true}
  hpaw_f: {remove: true}
  tail: {chain: [tail0, tail1, tail2, tail3, tail_tip]}
  body: {width: auto}
masks:
  head:
    idle: [[112, 66], [140, 66], [160, 70], [173, 76], [173, 92], [150, 94], [124, 94], [112, 92]]
    attack: [[112, 66], [140, 66], [158, 66], [172, 68], [172, 112], [150, 112], [130, 100], [114, 92]]
    hurt: [[110, 76], [140, 78], [162, 84], [162, 102], [140, 104], [112, 100]]
frames:
  atk_wind1:   # anticipation: head drawn back and up, body 1 px back
    t: 0.0
    dy: 0
    moves: []
    tweaks: {head: [-2, -1], snout: [-2, -2], neck: [-1, 0], hip: [-1, 0], back: [-1, 0], chest: [-1, 0], tail0: [-1, 0], tail1: [-1, 0], tail2: [-1, 0], tail3: [-1, 0], tail_tip: [-1, 0]}
  atk_wind2:   # coil: head reared back, body 2 px back and 1 down
    t: 0.0
    dy: 1
    moves: []
    tweaks: {neck: [-2, -1], head: [-4, -2], snout: [-4, -4], hip: [-2, 0], back: [-2, 0], chest: [-2, 0], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail3: [-2, 0], tail_tip: [-2, 0]}
  atk_mid:   # the pass: spine, neck and head 35% back; near forepaw and elbow planted
    t: 0.35
    moves: [back, chest, neck, head, snout]
    tweaks: {tail2: [0, 1], tail3: [0, 2]}
    pins: [paw_n, el_n, foot_n]
  atk_follow:   # a settle (t 0.75): the snap closes a little, all feet and the near elbow planted
    t: 0.75
    moves: [back, chest, neck, head, snout]
    tweaks: {tail2: [0, 1], tail3: [0, 2]}
    pins: [paw_n, el_n, paw_f, foot_n, foot_f]
  atk_recover:   # t 0.2: the idle tail stays folded, so a larger t overruns the bbox lerp
    t: 0.2
    moves: [back, chest, neck, head, snout]
  hurt_in1:   # the flinch starts: head jerks back and up (t 0.2 for the same tail reason)
    t: 0.2
    moves: [hip, back, chest, neck, head, snout]
    tweaks: {head: [-2, -2], snout: [-2, -2]}
  hurt_in2:   # 30% back toward idle; the flung tail lowered toward the fold (centroid cap)
    t: 0.3
    moves: [back, chest, neck, head, snout]
    tweaks: {tail2: [0, 2], tail3: [0, 4], tail_tip: [12, 12]}
    pins: [paw_n, paw_f, foot_n, foot_f, el_f, sh_f]
  daze:   # head and snout hang (the neck stays put: its warp pushed the snout onto the cell border)
    t: 0.0
    dy: 0
    moves: [back, chest, head, snout]
    tweaks: {head: [-1, 1], snout: [-2, 2]}
  daze_b:
    t: 0.0
    dy: 0
    moves: [back, chest, head, snout]
    tweaks: {head: [-1, 1], snout: [-2, 3]}
holds: []
paint:
  - {frame: atk_wind2, xy: [[125, 95], [126, 95], [127, 95], [128, 95]], rgb: [90, 57, 74]}
  - {frame: atk_mid, xy: [[116, 91], [117, 92], [118, 93]], rgb: [206, 181, 165]}
  - {frame: atk_mid, xy: [[123, 99]], rgb: [222, 198, 181]}
  - {frame: atk_follow, xy: [[116, 92], [117, 93], [118, 94]], rgb: [206, 181, 165]}
  - {frame: daze_b, xy: [[112, 69]], rgb: [214, 189, 173]}
  - {frame: daze_b, xy: [[114, 63], [114, 64]], rgb: [6, 4, 10]}
  - {frame: daze, xy: [[114, 63], [114, 64]], rgb: [6, 4, 10]}
  - {frame: hurt_in2, xy: [[112, 97], [117, 100], [118, 100], [119, 100], [119, 101], [120, 101], [121, 101], [122, 101], [123, 101]], rgb: [231, 222, 198]}
  - {frame: hurt_in2, xy: [[112, 98], [112, 99]], rgb: [239, 231, 206]}
  - {frame: hurt_in2, xy: [[112, 100]], rgb: [206, 181, 165]}
  - {frame: hurt_in2, xy: [[113, 100], [114, 100]], rgb: [222, 206, 189]}
  - {frame: hurt_in2, xy: [[115, 100], [116, 100]], rgb: [222, 198, 181]}
  - {frame: hurt_in2, xy: [[124, 100], [124, 101]], rgb: [231, 222, 198]}
