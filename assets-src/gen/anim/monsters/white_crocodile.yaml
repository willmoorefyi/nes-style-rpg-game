sprite: white_crocodile
body: quadruped
facing: right
sampler: nearest
breath: true
# The albino sibling of `crocodile`: larger and heavier, the tail folded over the back. Its tail keys differ a lot
# (folded in idle, a raised arch in attack, flung up in hurt), so it stays out of every `moves` set and rides the body
# (tweaks only: the arch top 1-2 px lower in mid / follow, the hurt tail lowered toward the fold in hurt_in2). The far
# hind leg is hidden behind the near one, so its parts are removed (its segment tore a hole under the belly).
keyframes:
  idle:
    hip: [35, 80]
    back: [65, 72]
    chest: [95, 78]
    neck: [114, 80]
    head: [124, 78]
    snout: [170, 80]
    tail0: [22, 78]
