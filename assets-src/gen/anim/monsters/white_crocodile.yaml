    sh_f: [120, 94]
    el_f: [132, 102]
    paw_f: [137, 107]
    ftoe_f: [144, 111]
    hip_n: [40, 88]
    knee_n: [38, 100]
    foot_n: [35, 108]
    toe_n: [32, 113]
    hip_f: [52, 88]
    knee_f: [55, 94]
    foot_f: [57, 98]
    toe_f: [60, 101]
  attack:
