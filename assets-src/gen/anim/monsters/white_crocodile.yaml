    toe_n: [20, 110]
    hip_f: [48, 86]
    knee_f: [52, 92]
    foot_f: [55, 96]
    toe_f: [58, 99]
  hurt:
    hip: [40, 85]
    back: [70, 72]
    chest: [100, 82]
