sprite: dark_wizard
# EF-H (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/dark_wizard/monster_large.png,
# backend: user; 170x128 cells). The star-robed rig is archived as anim/monsters/_retired/dark_wizard_v1.yaml.
# A robed caster: the robe is the torso with the hip at its hem (ogre_mage's recipe), the staff a prop; the three
# keys are far apart (the staff upright in idle, thrust level in the attack, diagonal in the hurt), so every
# in-between is a rigid lean / translation of its source key written as tweaks under `moves: []`.
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [66, 24]
    neck: [72, 45]
    chest: [68, 56]
    hip: [64, 108]
    sh_n: [78, 52]
    el_n: [85, 57]
    hand_n: [93, 57]
    sh_f: [58, 55]
    el_f: [52, 72]
    hand_f: [53, 85]
    s_top: [99, 12]
    s_bot: [93, 122]
    hip_n: [74, 108]
    knee_n: [77, 113]
    foot_n: [79, 118]
    toe_n: [84, 121]
    hip_f: [52, 108]
    knee_f: [49, 113]
    foot_f: [47, 118]
    toe_f: [45, 121]
  attack:
    crown: [92, 36]
    neck: [95, 55]
    chest: [88, 66]
    hip: [62, 106]
    sh_n: [100, 62]
    el_n: [112, 66]
    hand_n: [128, 64]
    sh_f: [85, 62]
    el_f: [80, 70]
    hand_f: [76, 71]
    s_top: [162, 56]
    s_bot: [74, 72]
    hip_n: [92, 106]
    knee_n: [99, 111]
    foot_n: [103, 118]
    toe_n: [108, 121]
    hip_f: [40, 106]
    knee_f: [25, 112]
    foot_f: [15, 118]
    toe_f: [11, 121]
  hurt:
    crown: [45, 33]
    neck: [55, 45]
    chest: [60, 56]
    hip: [65, 106]
    sh_n: [80, 52]
    el_n: [90, 49]
    hand_n: [97, 47]
    sh_f: [60, 52]
    el_f: [66, 47]
    hand_f: [70, 40]
    s_top: [75, 10]
    s_bot: [130, 101]
    hip_n: [80, 106]
    knee_n: [86, 111]
    foot_n: [91, 116]
    toe_n: [95, 120]
    hip_f: [50, 106]
    knee_f: [46, 112]
    foot_f: [44, 118]
    toe_f: [40, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}       # the arms are robe sleeves: with the arm parts the rigid leans opened gaps at the
  farm_n: {remove: true}       # sleeves, so the sleeves and hands ride the torso and head (every move here is a rigid
  uarm_f: {remove: true}       # lean of the whole upper body)
  farm_f: {remove: true}
  head: {radius: 13.0}
  staff:
    kind: prop
    bone: {idle: [s_top, s_bot], attack: [s_top, s_bot], hurt: [s_top, s_bot]}
    radius: 3.0
    in: [idle, attack, hurt]
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:                        # every in-between: its source key's upper body leaned rigidly about the hip at the robe
                               # hem (each joint rotated about `hip`, rounded to whole px), knees and feet pinned
  atk_wind1:                   # lean in toward the heroes 1.5 deg (half of wind2)
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [1, 0], sh_n: [1, 0], el_n: [1, 1], hand_n: [1, 1], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0], s_top: [3, 1], s_bot: [0, 1]}
  atk_wind2:                   # lean in 3 deg, the staff head tipping toward the heroes
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [4, 0], neck: [3, 1], chest: [3, 0], sh_n: [3, 1], el_n: [3, 1], hand_n: [3, 2], sh_f: [3, 0], el_f: [2, -1], hand_f: [1, -1], s_top: [5, 2], s_bot: [-1, 1]}
  atk_mid:                     # the thrust key 4 deg less extended (upper body back and up), feet on the attack stance
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-5, -2], neck: [-4, -2], chest: [-3, -2], sh_n: [-3, -3], el_n: [-3, -3], hand_n: [-3, -5], sh_f: [-3, -1], el_f: [-3, -1], hand_f: [-2, -1], s_top: [-4, -7], s_bot: [-2, -1]}
  atk_follow:                  # settle: the same 4 deg back
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-5, -2], neck: [-4, -2], chest: [-3, -2], sh_n: [-3, -3], el_n: [-3, -3], hand_n: [-3, -5], sh_f: [-3, -1], el_f: [-3, -1], hand_f: [-2, -1], s_top: [-4, -7], s_bot: [-2, -1]}
  atk_recover:                 # back to the idle through the lean-in
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [4, 0], neck: [3, 1], chest: [3, 0], sh_n: [3, 1], el_n: [3, 1], hand_n: [3, 2], sh_f: [3, 0], el_f: [2, -1], hand_f: [1, -1], s_top: [5, 2], s_bot: [-1, 1]}
  hurt_in1:                    # flinch: the idle thrown back 3 deg
    moves: []
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, -1], el_n: [-3, -1], hand_n: [-3, -1], sh_f: [-3, 0], el_f: [-2, 1], hand_f: [-1, 1], s_top: [-5, -2], s_bot: [1, -2]}
  hurt_in2:                    # the hurt key 4 deg less thrown back, on the way to the idle
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [5, -1], neck: [4, -1], chest: [4, 0], sh_n: [4, 1], el_n: [4, 2], hand_n: [4, 2], sh_f: [4, 0], el_f: [4, 0], hand_f: [5, 1], s_top: [7, 1], s_bot: [0, 5]}
  daze:                        # slump toward the hurt: the idle 2 deg back
    moves: []
    dy: 0
    tweaks: {crown: [-3, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, -1], hand_n: [-2, -1], sh_f: [-2, 0], el_f: [-1, 0], hand_f: [-1, 0], s_top: [-3, -1], s_bot: [0, -1]}
  daze_b:                      # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-3, 1], neck: [-2, 1], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, -1], hand_n: [-2, -1], sh_f: [-2, 0], el_f: [-1, 0], hand_f: [-1, 0], s_top: [-3, -1], s_bot: [0, -1]}
masks:
  staff:
    idle: [[86, 4], [113, 4], [113, 33], [97, 36], [97, 123], [89, 123], [90, 36], [86, 33]]
    attack: [[118, 47], [168, 47], [168, 70], [140, 68], [118, 68]]
    hurt: [[68, 4], [91, 4], [91, 28], [132, 100], [126, 104], [84, 34], [68, 30]]
holds: []
paint: []
# pass KT: the approved kneel key (approved/dark_wizard/kneel.png, the user sheet's 4th pose) and the bridge frames
# (kneel_bridge.py); its in1 -> in2 swap step takes kneel_checks.BRIDGE_SWAP_ALLOW (EF-H ruling: the upright staff
# keeps the key as tall as the idle, so the bridge cannot move the body's drop)
kneel:
  source: ai
