sprite: garland
# T6 boss rig (log: iterations in the T6 hand-off). Every in-between is moves: [] + hand-set tweaks (pose ops:
# rigid translations / rotations of joint groups). Idle-sourced frames translate the body block (no head/torso
# rotation), pin knees and feet, flare the idle cape as a cloth chain (top rides the body, hem moves). Attack-sourced
# frames rotate the whole figure, near leg included (its foot is lifted in attack), about the sword tip, the only
# pixels on the plain. The sword is its own part per keyframe (far hand in idle/attack/cast, near hand in hurt);
# capes are polygon masks on unjoined roots (their colours are also the armour accents). Glow = cast fx; cast_rise
# shows it one palette step dimmer and cast_gather an ember on the rising fist (paint), so the fx grows.
# Paint: outline-ink fills of slivers the cut-out uncovers (pixels the approved art never had) + the fx dimming.
