# Hollow Seraph (pass R G1, FW-1 prototype): a floating six-winged hollow armour with a fractured halo.
# body: floating (rig_floating.py): no feet, the float band judges every frame; the template drifts the whole figure
# back in the wind-up and pushes it back in hurt_in1. Coordinates are the 218 px boss cell (the idle, hurt, cast and
# raise keys are padded 9 px each side to the wide attack cell). The six wings are rigid parts on their own roots
# (the gold wing disks), marked in idle only, so idle-sourced frames keep the idle wings and turn them by tweaks; in
# the other keyframes the wings ride the body. The halo rides the helm (a rigid part, not fx).
sprite: hollow_seraph
body: floating
facing: right
sampler: nearest
breath: true
cast_hand: f
half_hand: [n, f]
keyframes:
  idle:
    core: [122, 112]
    base: [122, 188]
    neck: [122, 90]
    crown: [122, 58]
    halo: [121, 44]
    il1r: [82, 62]
    il1t: [35, 21]
    il2r: [68, 86]
    il2t: [19, 78]
    il3r: [71, 110]
    il3t: [37, 142]
    ir1r: [151, 64]
    ir1t: [189, 23]
    ir2r: [158, 86]
    ir2t: [199, 79]
    ir3r: [153, 108]
    ir3t: [186, 141]
  attack:
    core: [100, 110]
    base: [60, 178]
    neck: [108, 97]
    crown: [106, 63]
    halo: [113, 50]
    al_r: [138, 102]
    al_t: [210, 90]
    af_r: [103, 106]
    af_t: [183, 152]
  hurt:
    core: [122, 112]
    base: [118, 188]
    neck: [118, 92]
    crown: [113, 58]
    halo: [103, 52]
  cast:
    core: [122, 112]
    base: [100, 183]
    neck: [128, 86]
    crown: [130, 58]
    halo: [130, 44]
    sh_n: [148, 90]
    el_n: [168, 80]
    hand_n: [186, 62]
    sh_f: [138, 84]
    el_f: [152, 76]
    hand_f: [164, 60]
  attack_raise:
    core: [125, 112]
    base: [125, 190]
    neck: [138, 92]
    crown: [138, 58]
    halo: [140, 44]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}
  uarm_f: {remove: true}
  farm_n: {bone: [sh_n, el_n, hand_n], radius: 4.5}
  farm_f: {bone: [sh_f, el_f, hand_f], radius: 4.5}
  halo: {bone: [crown, halo], radius: 6.0}
  w_l1: {bone: {idle: [il1r, il1t]}, radius: 8.0}
  w_l2: {bone: {idle: [il2r, il2t]}, radius: 8.0}
  w_l3: {bone: {idle: [il3r, il3t]}, radius: 8.0}
  w_r1: {bone: {idle: [ir1r, ir1t]}, radius: 8.0}
  w_r2: {bone: {idle: [ir2r, ir2t]}, radius: 8.0}
  w_r3: {bone: {idle: [ir3r, ir3t]}, radius: 8.0}
  fan_l: {bone: {attack: [al_r, al_t]}, radius: 8.0}        # lower-right fan
  fan_f: {bone: {attack: [af_r, af_t]}, radius: 8.0}        # the forward fan across the body
masks:
  body:
    idle: [[0, 0], [217, 0], [217, 199], [0, 199]]
    attack: [[0, 0], [217, 0], [217, 199], [0, 199]]
    hurt: [[0, 0], [217, 0], [217, 199], [0, 199]]
    cast: [[0, 0], [217, 0], [217, 199], [0, 199]]
    attack_raise: [[0, 0], [217, 0], [217, 199], [0, 199]]
