  w_l2: {idle: [[10, 77], [80, 77], [87, 84], [97, 88], [97, 99], [80, 99], [70, 104], [40, 104], [12, 96]]}
  w_l3: {idle: [[28, 146], [52, 104], [70, 103], [96, 103], [96, 113], [86, 116], [82, 136], [62, 147]]}
  w_r1: {idle: [[139, 60], [150, 54], [186, 15], [196, 24], [186, 60], [176, 75], [151, 77], [147, 85], [139, 83]]}
  w_r2: {idle: [[147, 78], [161, 77], [202, 72], [202, 101], [176, 104], [160, 104], [151, 99], [147, 90]]}
  w_r3: {idle: [[148, 102], [162, 102], [177, 115], [194, 140], [186, 148], [161, 142], [151, 131], [149, 118]]}
