  - {frame: hurt, rgb: [222, 189, 115], xy: [[107, 105], [109, 108], [108, 112], [107, 113], [108, 113], [109, 113], [108, 114], [110, 114], [111, 114], [112, 114], [111, 115], [112, 115], [113, 115], [112, 116]]}
  - {frame: hurt, rgb: [198, 165, 99], xy: [[108, 106], [111, 106], [114, 106], [108, 107], [111, 107], [112, 107], [113, 107], [114, 107], [115, 107], [108, 108], [110, 108], [111, 108], [108, 109], [110, 109], [113, 109], [107, 110], [109, 110], [110, 110], [112, 110], [113, 111], [107, 112], [111, 112], [110, 113], [111, 113], [114, 113], [107, 114], [114, 114], [108, 115], [116, 115], [117, 115], [108, 116], [109, 116], [113, 116], [115, 116], [117, 116], [110, 117], [113, 117], [116, 117], [107, 118], [110, 118], [113, 118], [114, 118], [113, 119], [114, 119]]}
