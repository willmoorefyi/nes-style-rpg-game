    attack_raise: [[118, 54], [154, 54], [156, 76], [148, 94], [122, 94], [116, 74]]
  halo:
    idle: [[98, 33], [146, 33], [146, 53], [136, 54], [118, 56], [98, 56]]
    attack: [[86, 42], [142, 42], [142, 58], [126, 60], [100, 60], [86, 60]]
    hurt: [[86, 42], [120, 42], [120, 52], [106, 56], [96, 72], [86, 72]]
    cast: [[108, 34], [146, 34], [146, 52], [132, 54], [120, 56], [108, 56]]
    attack_raise: [[114, 34], [154, 34], [154, 52], [142, 54], [126, 56], [114, 56]]
z:
  idle: [w_r1, w_r2, w_r3, w_l1, w_l2, w_l3, body, head, halo]
# The keyframes differ hugely (idle-attack IoU 0.45, attack_raise-attack 0.33), so the in-betweens are mostly
# whole-figure moves (dx / dy, moves: []) placed where adjacent silhouettes overlap most; the wings turn on their
# disks by tweaks only. Before the dive she rises and draws back (wind), the dive overshoots down (follow) and she
# floats back up and in (recover).
frames:
  atk_wind1:                   # rise 1 and draw back 2; wings lift 4 deg on their disks, helm back 1
    moves: []
    dx: -2
    dy: -1
    tweaks: {crown: [-1, 0], il1t: [3, -3], il2t: [1, -3], il3t: [-2, -2], ir1t: [-3, -3], ir2t: [-1, -3], ir3t: [2, -2]}
  atk_wind2:                   # rise 2, back 6; the lower four wings lift 8 deg, the top pair 4 (bbox), helm back 2
    moves: []
    dx: -6
    dy: -2
    tweaks: {crown: [-2, 0], il1t: [3, -3], il2t: [1, -3], il3t: [-4, -5], ir1t: [-3, -3], ir2t: [-1, -6], ir3t: [4, -5]}
  atk_mid:                     # the dive arriving: the attack 4 px lower and 1 px back toward the wind-up overlap
    moves: []
    dx: 1
    dy: 4
  atk_follow:                  # the dive overshoots 3 px down
    moves: []
    dy: 3
  atk_recover:                 # floats back up and in: the idle 6 back, 3 up
    moves: []
    dx: -6
    dy: -3
  hurt_in1:                    # knocked back 2 and down 3, the helm snaps back
    moves: []
    dx: -2
    dy: 3
    tweaks: {crown: [-2, 0]}
  hurt_in2:                    # composure: the hurt pose 3 px high, settling into the key
    moves: []
    dy: -3
  cast_gather:                 # power gathers: the wings rise 4 deg, the helm lifts toward the cast, she leans in 2
    moves: [crown]
    dx: 2
    tweaks: {il1t: [3, -3], il2t: [1, -3], il3t: [-2, -2], ir1t: [-3, -3], ir2t: [-1, -3], ir3t: [2, -2]}
  cast_rise:                   # the cast pose 2 back and 1 low (the idle has no arm joints: the arms ride)
    moves: [crown]
    dx: -2
    dy: 1
  atk_raise_in:                # glides 7 forward into the raise
    moves: []
    dx: 7
  atk_swing:                   # the raise swept 14 back and 2 down: the swing starts
    t: 0.30
    moves: []
    dx: -14
    dy: 2
  atk_swing2:                  # the dive with its lower-right and forward fans still closed (25 deg); they snap
    t: 0.30                      # open at contact
    moves: []
    dy: 2
    tweaks: {af_t: [-27, 29]}
holds: []
