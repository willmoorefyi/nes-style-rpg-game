  - {frame: hurt, rgb: [132, 140, 140], xy: [[107, 85], [108, 85], [109, 85], [110, 85], [111, 85], [112, 85], [113, 85], [114, 85], [115, 85], [116, 85], [109, 86], [110, 86], [111, 86], [112, 86], [113, 86], [114, 86], [115, 86]]}
