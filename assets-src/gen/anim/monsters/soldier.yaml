frames:
  kneel_in2:
    tweaks: {el_f: [-5, 0], hand_f: [-8, -2], knee_f: [5, 2]}
  atk_wind1:                   # most of wind2 (translation first: the mechanical preset turns no bone past 15 deg)
    t: 0
    moves: []
    dy: 1
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-4, -1], hand_n: [-4, -1], sh_f: [-3, 0], el_f: [-2, -3], hand_f: [-2, -3], tip: [-2, -3]}
  atk_wind2:                   # coil: the hull 4 back and 2 down, the head 5, the claw pulled in 6; the blade arm draws
    t: 0                       # up 5 along its own line (the far shin is drawn only where the blade does not cover it,
    moves: []                  # so the blade cannot swing off it in an idle-sourced frame)
    dy: 2
    tweaks: {crown: [-5, 1], neck: [-4, 0], chest: [-4, 0], sh_n: [-4, 0], el_n: [-6, -2], hand_n: [-6, -2], sh_f: [-4, 0], el_f: [-3, -5], hand_f: [-3, -5], tip: [-3, -5]}
  atk_mid:                     # the strike a beat early (t 0.20): the hull and claw arm 3 back and up, the blade left on
    t: 0.20                    # the ground where the key draws it (it covers the near thigh, so it cannot move off it);
    moves: []                  # legs pinned at the lunge, the back foot 4 toward idle
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-3, -3], neck: [-3, -3], chest: [-3, -3], hip: [0, -2], sh_n: [-3, -3], el_n: [-3, -3], hand_n: [-3, -3], sh_f: [-3, -3], el_f: [-3, -3], knee_f: [3, 0], foot_f: [4, 0]}
  atk_follow:                  # a settle: the hull and blade 2 back (the tip stays on the ground), the head 3
    t: 0.80
    moves: []
    tweaks: {crown: [-3, -1], neck: [-3, -1], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0], tip: [-2, 0]}
  atk_recover:                 # the hull and claw 2 forward, the blade 1 down its line toward the strike
    moves: []
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], sh_f: [2, 0], el_f: [1, 1], hand_f: [1, 1], tip: [1, 1]}
  hurt_in1:                    # recoil: the hull 3 back, the head 4, the claw thrown up 5, the blade arm jerked up 5
    moves: []                  # along its own line
    tweaks: {crown: [-4, 0], neck: [-4, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-4, -5], hand_n: [-4, -5], sh_f: [-3, 0], el_f: [-3, -5], hand_f: [-3, -5], tip: [-3, -5]}
  hurt_in2:                    # from hurt: the hull, both arms and the raised blade 3 toward idle and 1-2 down (the blade
    moves: []                  # keeps its angle: turning it bared the chest drawn under it); the head 4
    tweaks: {crown: [4, 1], neck: [4, 1], chest: [3, 1], sh_n: [3, 1], el_n: [3, 2], hand_n: [3, 2], sh_f: [3, 1], el_f: [3, 2], hand_f: [3, 2], tip: [3, 2]}
  daze:                        # slump: the head-helm and hull sag, the claw hangs (no limb turns: mechanical); the blade
                               # sinks only 1 px (it would cut into the far foot)
    moves: []
    dy: 2
    tweaks: {crown: [1, 2], neck: [1, 1], el_n: [0, 2], hand_n: [0, 3], el_f: [0, -1], hand_f: [0, -1], tip: [0, -1]}
  daze_b:
    moves: []
    dy: 3
    tweaks: {crown: [1, 2], neck: [1, 1], el_n: [0, 3], hand_n: [0, 4], el_f: [0, -2], hand_f: [0, -2], tip: [0, -2]}
