    tweaks: {crown: [-11, -3], neck: [-9, -2], chest: [-6, -1], sh_n: [-6, -2], el_n: [-6, -2], hand_n: [-6, -2], sh_f: [-6, -2], el_f: [-6, -2], hand_f: [-6, -2], knee_f: [4, 0], foot_f: [4, 0], hip_f: [2, 0], knee_n: [2, 0], foot_n: [2, 0], hip_n: [1, 0]}
