parts:
  weapon: {remove: true}
  head: {radius: 14.0}
  cleaver:                     # the approved cleaver changes hands between the keys (the image-left hand in idle, the
                               # forward hand in attack and hurt): it swaps only where the pixel source switches
    kind: prop
    bone: {idle: [hand_f, tip], attack: [hand_n, tip], hurt: [hand_n, tip]}
    radius: 4.0
    in: [idle, attack, hurt]
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:                        # rigid leans about the hip and translations, written as tweaks (moves [])
  atk_wind1:                   # lean back 3, both clawed hands 3 back and 2 up
    moves: []
    t: -0.05
    dy: 1
    tweaks: {crown: [-5, 0], neck: [-4, 0], chest: [-3, 0], sh_n: [-4, -1], el_n: [-3, -1], hand_n: [-1, -1], sh_f: [-4, -1], el_f: [-4, -2], hand_f: [-4, -3], tip: [-4, -3]}
  atk_wind2:                   # coil: lean back 5, both clawed hands 5 back and 5 up, head 3 more, body 2 lower
    moves: []
    t: -0.1
    dy: 2
    tweaks: {crown: [-10, -1], neck: [-8, -1], chest: [-5, 0], sh_n: [-7, -2], el_n: [-5, -3], hand_n: [-2, -3], sh_f: [-6, -1], el_f: [-6, -3], hand_f: [-6, -5], tip: [-6, -5]}
  atk_mid:                     # the rake comes in: the attack upper body leaned back about the hip
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-11, -3], neck: [-9, -2], chest: [-6, -1], sh_n: [-6, -2], el_n: [-6, -2], hand_n: [-6, -2], sh_f: [-6, -2], el_f: [-6, -2], hand_f: [-6, -2], knee_f: [4, 0], foot_f: [4, 0], hip_f: [2, 0], knee_n: [2, 0], foot_n: [2, 0], hip_n: [1, 0]}
  atk_follow:                  # settle: the attack upper body 3 back about the hip
    moves: []
    t: 0.8
    tweaks: {crown: [-3, -1], neck: [-2, -1], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
  atk_recover:                 # upper body 2 forward and 2 lower (translated)
    moves: []
    dy: 2
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0]}
  hurt_in1:                    # recoil: lean back 5, head 3 further back, hands 4 up
    moves: []
    tweaks: {crown: [-9, -1], neck: [-7, -1], chest: [-5, 0], sh_n: [-5, -2], el_n: [-5, -3], hand_n: [-5, -4], sh_f: [-5, -2], el_f: [-5, -3], hand_f: [-5, -4], tip: [-5, -4]}
  hurt_in2:                    # the hurt pose 4 forward (translated), the head 2 more
    moves: []
    tweaks: {crown: [5, 0], neck: [5, 0], chest: [4, 0], sh_n: [4, 0], el_n: [4, 0], hand_n: [4, 0], sh_f: [4, 0], el_f: [4, 0], hand_f: [4, 0], tip: [4, 0]}
  daze:                        # slump: the upper body 1 forward and 2 lower, the head 1 forward and 1 lower more
    moves: []
    dy: 1
    tweaks: {crown: [1, 1], neck: [1, 1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
  daze_b:
    moves: []
    dy: 2
    tweaks: {crown: [1, 0], neck: [1, 0], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
masks:
