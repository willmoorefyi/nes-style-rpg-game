# Chaos (pass V redesign, R299-R308; C2 per D-V6: the normal 200 px boss cell, shown at display scale 3). A frontal
# overlord: a void-black robe pooled on the ground hides the legs, a black-and-gold armoured upper body, exactly two
# gauntleted arms (D-V10), a crown of living flame for a head, four orbs in the Fiends' lights around it.
# Robed recipe (FW-5, drowned_sovereign): the hem pool is the ground contact, so foot_n / foot_f are the hem's two ends
# and the whole skirt is one rigid part on them, pinned in every frame (the hem never moves). The template legs are
# removed. The orbs ride the head (head mask), so they keep their ring around the flame. Every in-between is a
# translation of its source key (moves: []): the upper body moves as a group by tweaks, the striking arm a little more.
sprite: chaos
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_n
# V8 F5 (REDESIGN_FIX_PLAN, FW-R): the approved attack_raise key (doubled arms, the flame head sunk into the chest) is
# dropped; the heavy attack winds up wind1 -> wind2 -> mid -> attack and its glint tip comes from atk_wind2. The
# approved PNG stays on disk (unused); the cell is kept.
