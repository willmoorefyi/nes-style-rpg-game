# EF-D (docs/ENEMY_FEEDBACK_PLAN.md, monster_orbit.py): the four element orbs orbit the flaming head in the idle
# (idle_o<k> / idle_b_o<k>, the runtime's idleOrbit). The orbs are cut out of the idle key (the pale one touches the
# flame, so only its own colours), each keeps its pixels and moves by whole px on a flat ellipse round the head; on
# the far (upper) half it passes behind the head part (the flame), on the near half in front. Evenly spaced (90 deg);
# 16 steps, one every 6 frames (96 frames a turn). Attack, cast, hurt and kneel keep the keys' orbs (accepted pop).
orbit:
  steps: 16
  centre: [100, 27]
  rx: 30
  ry: 9
  behind: [head]
  parts:
    white: {at: [72.5, 40.5], r: 8.5, a0: 180}
    pale: {at: [100, 13], r: 8, a0: 270, colors: [[6, 4, 10], [66, 132, 148], [231, 239, 222]]}
    teal: {at: [120.5, 21], r: 8.5, a0: 0}
    ember: {at: [127.5, 40.5], r: 8.5, a0: 90}
