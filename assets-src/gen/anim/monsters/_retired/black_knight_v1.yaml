# Black Knight (roster T-K, ROSTER_FIX_PLAN_2.md 5): a dark plate knight with a two-handed greatsword, keyframe-only
# until now. The attack key overlaps the idle best at (+4, -1) (IoU 0.588, centroid 5.7 vs cap 6.0), so the attack
# in-betweens are translation-only: the upper body and hips move as one piece, the knees by half and the feet by
# at most 1 px (feet anchored +-1; a whole-figure shift slid the feet), toes untweaked (they follow the pinned foot).
# fixmeasure.py switch --rig (real numbers, need / cap 0.462 / 6.0 attack, 0.521 / 6.0 hurt):
#   attack: idle->wind1 0.886/0.95, wind1->wind2 0.807/1.48, wind2->mid 0.527/4.00, mid->attack 0.743/2.00,
#           attack->follow 0.834/1.11, follow->recover 0.524/5.29, recover->idle 0.750/1.82
#   hurt:   idle->hurt_in1 0.745/1.68, hurt_in1->hurt_in2 0.584/1.92, hurt_in2->hurt 0.823/0.96 (no FW-Q alias needed)
#   daze:   idle->daze 0.911/1.43, daze->daze_b 0.940/0.80
# Review (2 iterations, fresh image-only reviewers): SHIP WITH NITS. Recorded nits: atk_wind1/2 anticipation is small at
# 1x (translation-only; a bigger lean costs the 0.3 px wind2->mid / follow->recover margin); daze/daze_b left pauldron
# 1 px nub and speckled highlight at 4x (helm part over the shoulder); overall darkness accepted (D-R6).
