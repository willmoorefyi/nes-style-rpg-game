# Hydra (roster T-K, ROSTER_FIX_PLAN_2.md 5): a green three-headed hydra on four thick legs, keyframe-only until now.
# body: quadruped + heads 2 and 3 (FW-5 multi-head prototype). Head 1 = the right head in idle (the middle one in the
# attack), head 2 = the top head, head 3 = the left head in idle, which swaps to the bottom right in the attack key.
# Every in-between is translation-only (`moves: []`, `dy: 0`): the three heads and their necks move as one group by
# tweaks, the body and legs stay put (moving the body over pinned legs rotated the short shins past the caps), feet
# 1 px only in atk_mid. Masks: the tail (its tip sits next to the left neck; the gap between them must stay open,
# and the mask follows that gap so no neck pixel rides with the tail) and each head per key, so the jaws travel
# whole. The tail tip follows the heads where the left neck passes over it (winds, recover, hurt_in2, daze). The
# plan's whole-figure table missed by 0.002; with the heads translated back and down (wind1 -3/+1, wind2 and the
# attack-sourced mid/follow -6/+3, recover -4/+2) the switch bridges without the FW-Q alias.
# fixmeasure.py switch --rig (IoU / centroid step; need 0.550, cap 9.6):
#   attack: idle->wind1 0.811/1.4, wind1->wind2 0.798/1.9, wind2->mid 0.597/6.7, mid->attack 0.740/3.1,
#           attack->follow 0.750/3.0, follow->recover 0.582/6.1, recover->idle 0.747/2.3
#   hurt:   idle->hurt_in1 0.839/1.3, hurt_in1->hurt_in2 0.660/1.4, hurt_in2->hurt 0.833/1.6
#   daze:   idle->daze 0.843/1.8, daze->daze_b 0.938/0.6 (heads 2 / 3 down)
# Review (2 iterations, fresh image-only reviewers): iteration 1 ITERATE (a neck shard in hurt_in1: the tail mask
# took the left neck's edge; weak wind-up); iteration 2 SHIP WITH NITS. Fixed: the atk_wind1 chin line and a stale
# 1 px paint. Recorded nits: the feet jump at the idle/attack key switches (front foot about 7 px, from the approved
# keys); 1-2 px foot drift attack-sourced mid vs the key (feet tweak -1, the atk_mid check); the hurt key itself
# sits forward of the idle (approved art); the daze slump is gentle (heads 2 / 3 px; deeper closed the tail gap).
