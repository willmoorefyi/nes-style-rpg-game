# Pass V redesign (R291): a squat, hunched young deep-sea horror. idle: crouched, the bulbous mantle head over the six
# hanging face tentacles, the dark near arm reaching forward to a webbed claw, the plated far arm hanging at the back;
# attack: the same crouch lunged a little, the tentacles lashing forward, the claw raking low; hurt: head thrown back to
# the left, tentacles curling, the dark claw thrown up beside the face. The keys are close in attack (switch IoU 0.74),
# so every in-between is a translation-only copy of its key (moves: []), head + tentacles and the claw arm moved as
# rigid groups, feet pinned.
