# idle: tall, the spiked crown-collar behind the white-haired head, both pale claws hanging at the coat's sides;
# attack: a deep lunge, the near claw reaching up toward the heroes with the bat-wing cape spread under it; hurt:
# recoiling, the white hair streaming back, both claws raised (the crown-collar shrinks to a small collar in the
# approved hurt key). The coat is drawn almost entirely in the outline ink (very dark, 6-9 colours).
keyframes:
