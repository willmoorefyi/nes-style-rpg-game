# The big dark stone parts lose their outline ring when they turn, so the in-betweens are translation-first: the
# arms move by tweaks (moves lists keep the upper arms out where they swing 60-120 deg between the keys).
frames:
  atk_wind1:                   # the striking right pair draws back 3, the head 1
    moves: []
    tweaks: {crown: [-1, 0], el_n: [-2, 0], hand_n: [-3, 0]}
  atk_wind2:
    moves: []
    tweaks: {crown: [-2, 0], neck: [-1, 0], sh_n: [-1, 0], el_n: [-4, 0], hand_n: [-6, 0]}
  atk_mid:                     # the claws arriving: the attack arms 4 back, the planted foot 1/3 toward the idle
    moves: [knee_f, foot_f, toe_f]
    tweaks: {el_n: [-2, 0], hand_n: [-4, 0], el_n2: [-2, 0], hand_n2: [-4, 0], foot_f: [1, 0], toe_f: [1, 0]}
  atk_recover:                 # the idle arms still reaching: the right pair 4-7 px toward the attack
    moves: []
    tweaks: {el_n: [1, -4], hand_n: [1, -7], el_n2: [3, -3], hand_n2: [4, -6]}
  hurt_in1:                    # flinch: head back 2, the upper hands up 3
    moves: [crown, neck, chest]
    tweaks: {crown: [-2, 0], hand_n: [0, -3], el_n: [0, -1], hand_f: [0, -3], el_f: [0, -1], hand_f2: [-1, -2]}
  hurt_in2:
    moves: [crown, neck, chest]
  cast_gather:                 # the upper hands lift toward the cast, the lower pair spreads 25 %
    moves: [crown]
    tweaks: {el_n: [0, -3], hand_n: [0, -6], el_f: [0, -3], hand_f: [0, -6], el_n2: [2, -4], hand_n2: [4, -8],
             el_f2: [-4, -5], hand_f2: [-8, -10]}
  cast_rise:                   # the cast easing: lower pair and left arm 35 % back, the right upper hand 4 down
    moves: [crown, chest, sh_n2, el_n2, hand_n2, sh_f2, el_f2, hand_f2]
    tweaks: {hand_n: [0, 4], el_n: [0, 2]}
  cast_release:                # the cast held, the upper hands 2 higher
    moves: []
    tweaks: {hand_n: [0, -2]}
  atk_raise_in:                # the upper fists climb 14 toward the raise, the head sinks 3
    moves: [sh_f2, el_f2, hand_f2]
    tweaks: {crown: [0, 3], neck: [0, 2], el_n: [-1, -6], hand_n: [-4, -9], el_f: [3, -10], hand_f: [8, -14],
             el_n2: [1, -3], hand_n2: [2, -6]}
  atk_swing:                   # the raise breaking: the fists 6 forward and down
    moves: [sh_n2, el_n2, hand_n2, sh_f2, el_f2, hand_f2]
    tweaks: {el_n: [3, 3], hand_n: [6, 6], el_f: [-1, 3], hand_f: [-2, 6]}
  atk_swing2:                  # the attack with the right fists 5 back and up (still swinging in)
    moves: [sh_n2, el_n2, hand_n2, sh_f2, el_f2, hand_f2, knee_f, foot_f, toe_f]
    tweaks: {el_n: [-2, -3], hand_n: [-5, -5], knee_f: [2, 0], foot_f: [2, 0], toe_f: [5, 0]}
  daze:                        # the head slumps 1 (the shared 3 px slump tore the horned crown off the neck)
    tweaks: {crown: [-2, -2], neck: [-2, -2]}
  daze_b:
    tweaks: {crown: [-2, -2], neck: [-2, -2]}
