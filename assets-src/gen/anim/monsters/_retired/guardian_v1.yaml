    paw_n: [80, 112]
    ftoe_n: [88, 120]
    sh_f: [100, 65]
    el_f: [105, 90]
    paw_f: [110, 112]
    ftoe_f: [118, 120]
    ash_n: [78, 76]
    sp_n: [140, 82]
    ash_f: [88, 80]
