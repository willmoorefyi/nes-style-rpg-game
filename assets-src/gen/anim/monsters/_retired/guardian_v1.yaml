parts:
  body: {bone: [hip, chest], kind: torso, radius: 12.0}
  neck: {remove: true}
  tail: {remove: true}
  head: {bone: [head, snout], radius: 10.0}
  uarm_n: {bone: [chest, ash_n], radius: 0.01}
  spear_n: {bone: [ash_n, sp_n], radius: 3.0}
  uarm_f: {bone: [chest, ash_f], radius: 0.01}
  spear_f: {bone: [ash_f, sp_f], radius: 3.0}
masks:   # the two level spears in idle, whole (the forelegs' radii took the shafts: a notched blade when they moved)
  spear_n:
    idle: [[78, 76], [120, 75], [143, 80], [143, 87], [119, 87], [119, 83], [78, 82]]
  spear_f:
    idle: [[78, 82], [119, 82], [121, 91], [96, 91], [78, 86]]
frames:   # translation-first (preset mechanical): hull, head and spear arms shifted as one unit, the legs planted
  atk_wind1:   # the hull sinks and draws back, the head ducks
    moves: []
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    t: 0.0
    tweaks: {hip: [-2, 1], back: [-2, 1], chest: [-2, 1], neck: [-2, 1], head: [-2, 2], snout: [-2, 2], hip_n: [-2, 1], hip_f: [-2, 1], sh_n: [-2, 1], sh_f: [-2, 1], ash_n: [-3, 1], sp_n: [-3, 1], ash_f: [-3, 1], sp_f: [-3, 1]}
  atk_wind2:   # coil: the hull 4 px back and 2 down, the head ducked
    moves: []
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    t: 0.0
    tweaks: {hip: [-4, 2], back: [-4, 2], chest: [-4, 2], neck: [-4, 2], head: [-4, 3], snout: [-4, 3], hip_n: [-4, 2], hip_f: [-4, 2], sh_n: [-4, 2], sh_f: [-4, 2], ash_n: [-6, 2], sp_n: [-6, 2], ash_f: [-6, 2], sp_f: [-6, 2]}
  atk_mid:   # the stab passes: from the attack, the hull 2 px back toward the coil
    moves: []
    pins: [foot_n, foot_f]
    t: 0.0
    tweaks: {hip: [-2, 0], back: [-2, 0], chest: [-2, 0], neck: [-2, 0], head: [-2, 0], snout: [-2, 0], hip_n: [-2, 0], hip_f: [-2, 0], sh_n: [-2, 0], sh_f: [-2, 0], ash_n: [-2, 0], sp_n: [-2, 0], ash_f: [-2, 0], sp_f: [-2, 0]}
  atk_follow:   # the spears drive 1 px further, the hull leans in
    moves: []
    pins: [foot_n, foot_f]
    t: 1.0
    tweaks: {hip: [1, 0], back: [1, 0], chest: [1, 0], neck: [1, 0], head: [1, 0], snout: [1, 0], hip_n: [1, 0], hip_f: [1, 0], sh_n: [1, 0], sh_f: [1, 0], ash_n: [1, 0], sp_n: [1, 0], ash_f: [1, 0], sp_f: [1, 0]}
  atk_recover:   # back on the idle, the hull still 1 px forward, the head low
    moves: []
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    t: 0.0
    tweaks: {hip: [1, 0], back: [1, 0], chest: [1, 0], neck: [1, 0], head: [1, 1], snout: [1, 1], hip_n: [1, 0], hip_f: [1, 0], sh_n: [1, 0], sh_f: [1, 0], ash_n: [1, 0], sp_n: [1, 0], ash_f: [1, 0], sp_f: [1, 0]}
  hurt_in1:   # the hit: the hull knocked down and back toward the hunch, the head ducked
    moves: []
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    t: 0.0
    tweaks: {hip: [-2, 6], back: [-2, 6], chest: [-2, 6], neck: [-2, 6], head: [-2, 7], snout: [-2, 7], hip_n: [-2, 6], hip_f: [-2, 6], sh_n: [-2, 6], sh_f: [-2, 6], ash_n: [-2, 6], sp_n: [-2, 6], ash_f: [-2, 6], sp_f: [-2, 6]}
  hurt_in2:   # from the hunch: the hull eases back up toward the idle
    moves: []
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    t: 0.0
    tweaks: {hip: [0, -2], back: [0, -2], chest: [0, -2], neck: [0, -2], head: [0, -2], snout: [0, -2], hip_n: [0, -2], hip_f: [0, -2], sh_n: [0, -2], sh_f: [0, -2], ash_n: [0, -2], sp_n: [0, -2], ash_f: [0, -2], sp_f: [0, -2]}
  daze:   # the head and lens sag
    moves: []
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    t: 0.0
    tweaks: {hip: [0, 1], back: [0, 1], chest: [0, 1], neck: [0, 1], head: [0, 2], snout: [0, 2], hip_n: [0, 1], hip_f: [0, 1], sh_n: [0, 1], sh_f: [0, 1], ash_n: [0, 1], sp_n: [0, 1], ash_f: [0, 1], sp_f: [0, 1]}
  daze_b:
    moves: []
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    t: 0.0
    tweaks: {hip: [0, 2], back: [0, 2], chest: [0, 2], neck: [0, 2], head: [0, 3], snout: [0, 3], hip_n: [0, 2], hip_f: [0, 2], sh_n: [0, 2], sh_f: [0, 2], ash_n: [0, 2], sp_n: [0, 2], ash_f: [0, 2], sp_f: [0, 2]}
holds: []
paint:   # 1 px slits between the hull and the thighs the shifted hull opens, in the neighbouring fills / outline ink
  - {frame: atk_wind2, rgb: [33, 16, 24], xy: [[36, 74], [36, 77]]}
  - {frame: atk_wind2, rgb: [57, 33, 41], xy: [[36, 75], [36, 76], [96, 85], [97, 85]]}
  - {frame: atk_wind2, rgb: [82, 49, 41], xy: [[96, 84]]}
  - {frame: hurt_in1, rgb: [57, 33, 41], xy: [[98, 87], [99, 87], [100, 87]]}
  - {frame: hurt_in1, rgb: [82, 49, 41], xy: [[98, 86]]}
