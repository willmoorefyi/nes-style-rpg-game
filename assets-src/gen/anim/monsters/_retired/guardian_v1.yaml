sprite: guardian
body: quadruped
preset: mechanical
facing: right
sampler: nearest
breath: true
# Weathered bronze four-legged automaton (guardian) with a red lens eye and two spear arms. Idle holds the spears
# level in front; the attack stabs both down to the ground; the hurt drops into a low hunch. Preset mechanical: the
# hull is one torso, the head one rigid piece, no tail; every in-between is a translation of the hull, head and spear
# arms as one unit over planted legs.
keyframes:
  idle:
    hip: [40, 55]
    back: [65, 45]
    chest: [90, 50]
    neck: [95, 45]
    head: [100, 40]
    snout: [122, 50]
    hip_n: [35, 60]
    knee_n: [15, 90]
