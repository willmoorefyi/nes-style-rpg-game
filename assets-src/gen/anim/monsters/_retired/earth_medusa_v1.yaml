  # P2-8 (ROSTER_FIX_PLAN_2): FW-P on idle: the approved ink-outlined pale block on the chest (ink x 35-40, y 31-36,
  # 19 px, none on the silhouette edge) is recoloured ring by ring to the 4-neighbour mode of the torso around it
  - {frame: idle, xy: [[36, 31], [37, 31], [38, 31], [39, 31], [40, 31], [35, 32], [40, 32], [35, 33], [35, 34]], rgb: [206, 198, 189]}
  - {frame: idle, xy: [[40, 33]], rgb: [82, 90, 90]}
  - {frame: idle, xy: [[40, 34], [37, 36], [38, 36]], rgb: [140, 140, 132]}
  - {frame: idle, xy: [[35, 35], [36, 36], [39, 36], [40, 36]], rgb: [165, 165, 156]}
  - {frame: idle, xy: [[40, 35]], rgb: [115, 115, 107]}
  - {frame: idle, xy: [[35, 36]], rgb: [66, 66, 74]}
  # P2-8c (ROSTER_FIX_PLAN_2): hurt_in1's far-arm and hip join left ink spurs and unlined edges (spurs 6, edge gaps 4
  # vs idle 1 / 0): the spurs are nulled, the opened and unlined edge px inked
  - {frame: hurt_in1, xy: [[21, 25], [22, 26], [45, 37], [46, 37], [29, 38], [26, 40], [29, 42]], rgb: null}
  - {frame: hurt_in1, xy: [[22, 25], [28, 38], [43, 39], [31, 41], [31, 42], [29, 54]], rgb: [6, 4, 10]}
