frames:
  # Every head and the neck move as one group (translation only): moving the lion against the goat and dragon behind
  # it opened ink lines along the mask edges in the mane; the withers stay put in the wind (moving them dragged the near
  # foreleg over the belly crease).
  atk_wind1:                   # anticipation: the heads 3 back as one, bulk 1 down, wings start to lift
    t: 0.0
    dy: 1
    moves: []
    tweaks: {neck: [-3, 0], head: [-3, 0], snout: [-3, 0], h2: [-3, 0], s2: [-3, 0], h3: [-3, 0], s3: [-3, 0], wr: [-2, 0], wt: [0, -3]}
  atk_wind2:                   # the coil: the heads pulled 6 back and 1 down as one, bulk 2 down, wings raised
    t: 0.0
    dy: 2
    moves: []
    tweaks: {neck: [-6, 1], head: [-6, 1], snout: [-6, 1], h2: [-6, 1], s2: [-6, 1], h3: [-6, 1], s3: [-6, 1], wr: [-4, 0], wt: [0, -6]}
  atk_mid:                     # the lunge passing: the attack pose with the front still 1 back
    t: 0.0
    moves: []
    tweaks: {neck: [-1, 0], head: [-1, 0], snout: [-1, 0], h2: [-1, 0], s2: [-1, 0], h3: [-1, 0], s3: [-1, 0]}
  atk_follow:                  # follow-through: the wings 1 further toward the heroes (a front move pushes the lion and jaw out of the erase gate's masks)
    t: 1.1
    moves: []
    tweaks: {neck: [0, 0], head: [0, 0], snout: [0, 0], h2: [0, 0], s2: [0, 0], h3: [0, 0], s3: [0, 0], wr: [1, 0], wt: [1, 0]}
  atk_recover:                 # recoil: the heads 6 back as one, the wings 2 back
    t: 0.3
    moves: []
    tweaks: {neck: [-6, 0], head: [-6, 0], snout: [-6, 0], h2: [-6, 0], s2: [-6, 0], h3: [-6, 0], s3: [-6, 0], wr: [-2, 0], wt: [-2, 0]}
  daze:                        # sleep / stun: the heads sag 3 as one over the planted body (a body dy, or a head moved
    t: 0.0                     # against the mane, opened ink wedges along the mane)
    dy: 0
    moves: []
    tweaks: {neck: [0, 3], head: [-2, 1], snout: [-2, 1], h2: [0, 3], s2: [0, 3], h3: [0, 3], s3: [0, 3]}   # the recipe adds [2, 2] to the lion head
  daze_b:                      # the sway's low point: the heads 4 down
    t: 0.0
    dy: 0
    moves: []
    tweaks: {neck: [0, 4], head: [-2, 2], snout: [-2, 2], h2: [0, 4], s2: [0, 4], h3: [0, 4], s3: [0, 4]}
