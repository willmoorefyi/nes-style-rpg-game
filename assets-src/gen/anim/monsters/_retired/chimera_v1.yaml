sprite: chimera
body: quadruped
facing: right
sampler: nearest
breath: true
alias: [hurt]                  # FW-Q (FWQ_ALLOW chimera/hurt): hurt_in1 / hurt_in2 are the keys
# Chimera (pass R batch D, quadruped, three heads): a tawny lion body with the maned lion head in front (the template's
# `head`, it leads), a grey goat head on the back (h2), a green dragon head above the shoulders (h3), two bat wings
# (one rigid part on its own root, wr -> wt) and a green snake tail. The approved attack and hurt keys draw a second
# dragon head (ROSTER_LOG R250; ROSTER_FIX_PLAN_2 1, D-R1). Attack (B): keyframe paint erases it (757 px nulled: every
# opaque px of the fixture's dragon2@attack polygon outside the head and dragon masks, plus the lion's top-right corner
# and the jaw tip below the polygon; 30 px re-inked on the new edge of the lion and the upper dragon's jaw; 787 distinct
# px <= the 800 cap; |F| = 0: no dragon green lies inside the kept lion contour). Hurt (B, round 2): the extra head lies
# right of the lion's own outline (x 126) and above its mane top (y 66), so the erase is a null too (711 px: every
# dragon2 px right of the lion contour, its neck above the mane, its horn under the upper dragon's jaw) plus 8 px
# re-inked (the mane's top-right corner, the goat-neck edge, the upper dragon's short fang closed like the idle's);
# 719 distinct px <= the 720 cap; |F| = 0: the green px inside the head polygon are all outside the lion contour. The
# hurt sequence is aliased (FW-Q): hurt_in1 / hurt_in2 resolve to the keys, so no 3-to-4-head or centroid jump. Without
# the extra head the attack key's centroid sits 4 px further back, so the attack in-betweens moved (atk_mid front 1
# back, atk_follow front held, atk_recover heads 6 back) to keep the key-switch centroid steps <= 9.6. The stacked
# heads hang from pixel-less anchors on the withers and move by translation only (the rhyos recipe); the tail stays
# out of every move set. No breath fx.
