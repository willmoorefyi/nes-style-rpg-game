holds: []
paint:                         # 1 px notches the moved head opens over the near shoulder, outline ink (the coat colour)
  - {frame: hurt_in1, xy: [[47, 28], [47, 29]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[46, 28]], rgb: [6, 4, 10]}
  - {frame: atk_mid, xy: [[32, 41], [32, 42], [32, 43], [32, 44], [32, 45]], rgb: [6, 4, 10]}   # the 1 px slit the shifted hip opens in the coat
  # pass K (K2-B): kneel frames: the eye glow dimmed in steps (kneel_in1, kneel_in2, then the key), cracks and pockets closed in the body colour, pixels below the feet row cleared
  - {frame: kneel_in1, xy: [[36, 19], [36, 20], [37, 22], [37, 23], [44, 23], [45, 23], [51, 24], [51, 25], [38, 26], [38, 27], [44, 27]], rgb: [49, 8, 49]}
