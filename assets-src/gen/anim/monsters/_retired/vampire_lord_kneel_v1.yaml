  - {frame: kneel_in1, xy: [[47, 47], [48, 49]], rgb: [90, 33, 49]}
  - {frame: kneel_in2, xy: [[44, 52], [43, 54], [44, 54], [43, 55], [44, 55], [47, 59], [48, 59], [47, 60], [45, 62], [46, 62], [49, 62], [33, 63], [36, 63], [35, 64], [34, 65], [35, 65], [33, 67]], rgb: [6, 4, 10]}
  - {frame: kneel_in2, xy: [[47, 61], [48, 62], [48, 63]], rgb: [148, 156, 156]}
  - {frame: kneel_in2, xy: [[48, 61], [47, 62], [47, 63], [30, 64], [47, 64]], rgb: [41, 41, 49]}
  - {frame: kneel_b, xy: [[42, 59], [49, 61], [45, 66], [30, 69], [31, 69], [29, 71], [25, 74], [26, 74], [27, 74]], rgb: [6, 4, 10]}
  - {frame: kneel_b, xy: [[26, 77], [27, 77], [28, 77], [29, 77], [30, 77]], rgb: null}
