parts:
  weapon: {remove: true}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                   # half of wind2: the crouch starts (coil forward), knees give, the near claw drawn back
    t: 0.15
    dy: 2
    pins: [foot_n, foot_f, toe_n, toe_f, knee_f, knee_n]
    moves: [crown, neck, chest, hip, hip_n, hip_f]
    tweaks: {crown: [-3, 0], neck: [-2, 0], chest: [-1, 0], sh_n: [-2, -1], el_n: [-3, -2], hand_n: [-4, -3], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  atk_wind2:                   # coil forward (t +0.35): crouched 3 on bent knees, head back, the near claw drawn back and up
    t: 0.35
    dy: 3
    pins: [foot_n, foot_f, toe_n, toe_f, knee_f, knee_n]
    moves: [crown, neck, chest, hip, hip_n, hip_f]
    tweaks: {crown: [-6, 0], neck: [-5, 0], chest: [-3, 0], sh_n: [-4, -1], el_n: [-6, -4], hand_n: [-8, -6], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
  atk_mid:
    pins: [knee_n, foot_n, knee_f, foot_f, toe_n, toe_f]
    tweaks: {knee_f: [3, 0], foot_f: [4, 0], toe_f: [4, 0], knee_n: [1, 0], foot_n: [1, 0], toe_n: [1, 0]}
    moves: [crown, neck, chest, hip, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f, toe_n, toe_f]
  atk_follow:                  # overshoot: the claw drives on past the contact
    t: 1.10
    moves: [crown, neck, chest, sh_n, el_n, hand_n]
    tweaks: {hand_n: [3, -1], el_n: [1, 0]}
  atk_recover:
    t: 0.35
    moves: [crown, neck, hip]
  hurt_in1:                    # flinch: head knocked back (translated), the claws jerk up
    moves: []
    tweaks: {crown: [-4, 0], neck: [-2, 0], chest: [-1, 0], el_n: [0, -2], hand_n: [0, -4], el_f: [0, -2], hand_f: [0, -4]}
  hurt_in2:
    moves: [crown, neck, chest]
  daze:                        # slump: head dropped forward, both claws hang lower
    moves: [crown, neck, chest]
    tweaks: {crown: [2, 1], neck: [1, 1], el_n: [0, 1], hand_n: [0, 2], el_f: [0, 1], hand_f: [0, 2]}
  daze_b:
    moves: [crown, neck, chest]
    dy: 2
    tweaks: {crown: [2, 1], neck: [1, 1], el_n: [0, 1], hand_n: [0, 2], el_f: [0, 1], hand_f: [0, 2]}
masks:
  torso:
    attack: [[45, 27], [52, 25], [64, 27], [64, 43], [45, 43]]
    hurt: [[40, 31], [57, 31], [57, 44], [40, 44]]
  ft_n:
