    dy: 0
    t: 0.0
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    tweaks: {hip: [-2, 0], back: [-2, 0], chest: [-2, 0], neck: [-2, -1], head: [-2, -2], snout: [-2, -2], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail_tip: [-2, 0], sh_n: [-2, 0], sh_f: [-2, 0], hip_n: [-2, 0], hip_f: [-2, 0]}
