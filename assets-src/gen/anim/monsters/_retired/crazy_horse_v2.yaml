    moves: []
    dy: 0
    t: 0.0
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    tweaks: {hip: [-2, 2], back: [-2, 2], chest: [-2, 2], neck: [-4, 3], head: [-5, 3], snout: [-5, 3], tail0: [-2, 2], tail1: [-2, 2], tail2: [-2, 2], tail_tip: [-2, 2], sh_n: [-2, 2], sh_f: [-2, 2], hip_n: [-2, 2], hip_f: [-2, 2]}
  atk_mid:   # the lunge arriving: the attack key 1 px up and back
