    dy: 0
    t: 0.0
    pins: [foot_n, foot_f, knee_n, knee_f, paw_n, el_n]
    tweaks: {hip: [1, -1], back: [1, -1], chest: [1, -1], neck: [1, -1], head: [1, -1], snout: [1, -1], tail0: [1, -1], tail1: [1, -1], tail2: [1, -1], tail_tip: [1, -1], sh_n: [1, -1], sh_f: [1, -1], hip_n: [1, -1], hip_f: [1, -1], el_f: [1, -1], paw_f: [1, -1], ftoe_f: [1, -1]}
  atk_follow:   # the lunge settles: the attack key lifted 1 px
    moves: []
    dy: 0
    t: 1.0
    pins: [foot_n, foot_f, knee_n, knee_f, paw_n, el_n]
    tweaks: {hip: [1, -1], back: [1, -1], chest: [1, -1], neck: [1, -1], head: [1, -1], snout: [1, -1], tail0: [1, -1], tail1: [1, -1], tail2: [1, -1], tail_tip: [1, -1], sh_n: [1, -1], sh_f: [1, -1], hip_n: [1, -1], hip_f: [1, -1], el_f: [1, -1], paw_f: [1, -1], ftoe_f: [1, -1]}
  atk_recover:   # back toward idle: the idle key 2 px low and back
