frames:
  atk_wind1:   # anticipation: the body 2 px back and 1 down, the head dipped and drawn back; hooves planted
    moves: []
    dy: 0
    t: 0.0
    pins: [el_n, paw_n, el_f, paw_f, knee_n, foot_n, knee_f, foot_f]
    tweaks: {hip: [-2, 1], back: [-2, 1], chest: [-2, 1], neck: [-3, 2], head: [-3, 2], snout: [-3, 2], tail0: [-2, 1], tail1: [-2, 1], tail2: [-2, 1], tail_tip: [-2, 1], sh_n: [-2, 1], sh_f: [-2, 1], hip_n: [-2, 1], hip_f: [-2, 1]}
