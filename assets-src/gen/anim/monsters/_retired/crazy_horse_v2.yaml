sprite: crazy_horse
body: quadruped
facing: right
sampler: nearest
breath: true
# Pass V redesign (R290): a gaunt ash-grey otherworldly horse with a bone-spine ridge, yellow-green glowing cracks, a
# long skull-like head and a black smoke mane and tail. The attack is a long low lunge with the jaw open (69 px); the
# hurt is a half rear with the head tossed up and the cracks flaring (the forelegs lifted). Every in-between is a
# translation-only copy of its source key (moves: []), every leg tip pinned; the key switches carry the pose change.
