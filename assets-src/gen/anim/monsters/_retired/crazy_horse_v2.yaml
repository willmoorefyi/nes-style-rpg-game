    t: 0.0
    pins: [foot_n, foot_f, knee_n, knee_f]
    tweaks: {hip: [1, -1], back: [1, -1], chest: [1, -1], neck: [1, -1], head: [1, -1], snout: [1, -1], tail0: [1, -1], tail1: [1, -1], tail2: [1, -1], tail_tip: [1, -1], sh_n: [1, -1], sh_f: [1, -1], hip_n: [1, -1], hip_f: [1, -1], el_n: [1, -1], paw_n: [1, -1], ftoe_n: [1, -1], el_f: [1, -1], paw_f: [1, -1], ftoe_f: [1, -1]}
