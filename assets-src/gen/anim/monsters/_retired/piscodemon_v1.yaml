frames:
  atk_wind1:                   # half of wind2: claw arm starting back, head leaning back
    tweaks: {crown: [-1, 0], sh_n: [-1, 0], el_n: [-2, 0], hand_n: [-4, 0]}
  atk_wind2:                   # coil: raking arm pulled back behind the body, head and torso lean back
    tweaks: {crown: [-2, 0], neck: [-1, 0], sh_n: [-3, -1], el_n: [-5, -1], hand_n: [-9, -1]}
  atk_mid:                     # a third of the way back to the coil: body 1 px back, the raised far claw lowered toward
    t: 0.35                    # its idle hang (wind2->mid IoU), legs pinned and shifted toward idle (not rotated)
    pins: [knee_n, foot_n, knee_f, foot_f]
    moves: [chest, hip, sh_n, el_n, sh_f, el_f, hand_f, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f, toe_n, toe_f]
    tweaks: {crown: [1, 0], neck: [1, 0], chest: [1, 0], hip: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0],
             sh_f: [1, 0], el_f: [2, 2], hand_f: [3, 5], hip_n: [1, 0], hip_f: [1, 0],
             knee_n: [3, 0], foot_n: [3, 0], knee_f: [5, 0], foot_f: [5, 0]}
  atk_follow:                  # a settle (idle/attack IoU 0.49 is too low for an overshoot); the far claw drops with it
    t: 0.72
    moves: [crown, chest, sh_n, el_n, hand_n, sh_f, el_f, hand_f]
    tweaks: {el_f: [1, 1], hand_f: [3, 4]}
  atk_recover:                 # idle claw and forearm kept (only the upper arm reaches forward)
    t: 0.30
    moves: [crown, chest, sh_n, el_n]
  hurt_in1:                    # flinch: head back, claws jerk up (forearms translated, not swung through 180 deg)
    moves: [crown, neck, chest, hip, sh_n, sh_f, el_f, hip_n, knee_n, hip_f, knee_f]
    tweaks: {crown: [-4, 0], neck: [-1, 0], el_n: [0, -3], hand_n: [-1, -5], el_f: [0, -2], hand_f: [0, -4]}
  hurt_in2:
    moves: [crown, neck, chest, hip, sh_n, sh_f, el_f, hip_n, knee_n, hip_f, knee_f]
  daze:                        # the claw arm drops loose instead of lifting toward the hurt guard
    tweaks: {el_n: [0, 1], hand_n: [-1, 3]}
  daze_b:
    tweaks: {el_n: [0, 1], hand_n: [-1, 3]}
z:
