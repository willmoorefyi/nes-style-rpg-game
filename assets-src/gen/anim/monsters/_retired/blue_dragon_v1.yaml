# Long wingless blue dragon (pass R batch D, quadruped): the white_dragon recipe without wings. The tail is a loop in
# idle, a low sweep in the attack and a tight spiral in the hurt: it stays out of every move set (it rides the hip),
# so each frame keeps its source key's tail. The head carries the forked horns (head mask per key). No breath fx: the
# approved attack draws none.
