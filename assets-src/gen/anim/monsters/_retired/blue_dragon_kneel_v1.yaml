  tail: {chain: [tail0, tail1, tail2, tail3, tail_tip]}
  body: {width: 24}
masks:
  head:                        # the head with both forked horns and the jaw
    idle: [[80, 26], [110, 26], [122, 52], [122, 66], [108, 68], [98, 64], [90, 58], [84, 44]]
    attack: [[84, 66], [114, 66], [122, 96], [127, 104], [127, 118], [110, 118], [100, 112], [96, 102], [86, 92]]
    hurt: [[64, 42], [100, 40], [120, 54], [120, 68], [104, 72], [92, 66], [84, 56], [70, 50]]
frames:
  atk_wind1:                   # anticipation: body sinks 1 and shifts 1 back, neck and head drawn back and low as one
    t: 0.0
    dy: 1
    moves: []
    tweaks: {neck: [-3, 2], head: [-3, 2], snout: [-3, 2], hip: [-1, 0], back: [-1, 0], chest: [-1, 0], tail0: [-1, 0], tail1: [-1, 0], tail2: [-1, 0], tail3: [-1, 0], tail_tip: [-1, 0]}
  atk_wind2:                   # coil: body 2 down and 2 back, neck and head pulled 6 back and 3 low as one, ready to lunge
    t: 0.0
    dy: 2
    moves: []
    tweaks: {neck: [-5, 3], head: [-5, 3], snout: [-5, 3], hip: [-2, 0], back: [-2, 0], chest: [-2, 0], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail3: [-2, 0], tail_tip: [-2, 0]}
  atk_mid:                     # the pass: the attack pose with the neck and head lifted 6-9 px back toward the coil
    t: 0.1                     # (chest only 2 px: a higher chest dragged the pinned legs)
    moves: []
    pins: [foot_n, foot_f, paw_n, paw_f]
    tweaks: {chest: [-1, -2], neck: [-3, -6], head: [-4, -9], snout: [-4, -9]}
  atk_follow:                  # settle after the bite: head and neck ease up 3-5 px
    t: 0.9
    moves: []
    pins: [foot_n, foot_f, paw_n, paw_f]
    tweaks: {neck: [0, -1], head: [-1, -2], snout: [-1, -2]}
  atk_recover:                 # idle with the body 1 lower and the head still low and forward
    t: 0.3
    dy: 1
    moves: []
    tweaks: {neck: [4, 7], head: [5, 13], snout: [5, 13], chest: [1, 2]}
  hurt_in1:                    # the flinch: head snaps 5 back and 4 down toward the hurt key, body 1 down
    t: 0.3
    dy: 1
    moves: []
    tweaks: {neck: [-3, 2], head: [-5, 4], snout: [-5, 5], chest: [-1, 0]}
  hurt_in2:                    # easing out of the recoil: head and neck 3 px back up toward idle
    t: 0.3
    moves: []
    tweaks: {neck: [1, -2], head: [2, -4], snout: [2, -4], chest: [0, -1]}
  daze:                        # sleep / stun: the neck sags, head hangs 4 px, nose dipped 6
    t: 0.0
    dy: 0
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [1, 2], head: [1, 4], snout: [0, 6]}
  daze_b:                      # the sway's low point: body 1 px lower
    t: 0.0
    dy: 1
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [1, 2], head: [1, 4], snout: [0, 6]}
holds: []
