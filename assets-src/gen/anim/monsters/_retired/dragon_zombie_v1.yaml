sprite: dragon_zombie
body: quadruped
facing: right
sampler: nearest
breath: true
# The dragon's winged recipe: the folded idle wings are one rigid part (wing_i) on the withers; the raised attack wings
# and the hunched hurt wing sit on their own root joints (wr_n / wr_f), so idle-sourced frames keep the idle wings and
# attack- / hurt-sourced frames keep theirs. Every wing move is an explicit tweak.
