parts:
  uwing_n: {remove: true}
  fwing_n: {remove: true}
  uwing_f: {remove: true}
  fwing_f: {remove: true}
  wing_i: {bone: [chest, wtip_i], radius: 8.0, in: [idle]}     # the folded idle wings ride the withers
  wing_n: {bone: [wr_n, wt_n], radius: 8.0}
  wing_f: {bone: [wr_f, wt_f], radius: 8.0}
  tail: {chain: [tail0, tail1, tail2, tail3, tail_tip]}
  body: {width: 16}
masks:
  wing_i:                      # the folded idle wings over the back, both membranes (left of the neck)
    idle: [[12, 72], [20, 61], [30, 54], [36, 49], [48, 46], [66, 46], [85, 49], [85, 57], [80, 64], [76, 74], [64, 79], [45, 80], [34, 77], [22, 79], [14, 78]]
  body:                        # the withers under the folded wing (the wing's bone crosses them)
    idle: [[46, 80], [64, 79], [76, 75], [80, 80], [79, 90], [60, 87]]
  wing_f:                      # the far (dark) raised wing
    attack: [[62, 27], [66, 23], [72, 28], [80, 36], [88, 46], [93, 58], [90, 66], [80, 68], [74, 72], [70, 78], [66, 78], [64, 62], [66, 50], [62, 40]]
  wing_n:                      # the near raised wing (attack); the hunched wing over the back (hurt)
    attack: [[24, 36], [45, 37], [56, 40], [62, 46], [68, 56], [70, 64], [66, 72], [62, 78], [52, 78], [46, 72], [36, 68], [30, 58], [26, 50], [30, 44]]
    hurt: [[14, 92], [20, 74], [30, 64], [40, 59], [50, 55], [64, 55], [66, 62], [62, 72], [56, 78], [50, 82], [40, 84], [30, 86], [22, 94]]
holds: []
frames:
  atk_wind1:                   # anticipation: head drawn back, body 1 px back (the folded wings and the tail ride the body:
    t: 0.0                     # a lifted idle wing opens the art gap over the back)
    dy: 0
    moves: []
    tweaks: {head: [-2, -1], snout: [-2, -1], hip: [-1, 0], back: [-1, 0], chest: [-1, 0], neck: [-1, 0], tail0: [-1, 0], tail1: [-1, 0], tail2: [-1, 0], tail3: [-1, 0], tail_tip: [-1, 0]}
  atk_wind2:                   # coil: head reared back, body 2 px back
    t: 0.1
    dy: 0
    moves: []
    tweaks: {neck: [-3, -1], head: [-4, -2], snout: [-4, -2], hip: [-2, 0], back: [-2, 0], chest: [-2, 0], tail0: [-2, 0], tail1: [-2, 0], tail2: [-2, 0], tail3: [-2, 0], tail_tip: [-2, 0]}
  atk_mid:                     # the pass: spine a third back, neck and head kept at the bite angle (a raised neck closed a
    t: 0.35                    # hole under the far wing), both wings beat down (far 18 deg, near 14 deg), all four paws planted
    moves: [back, chest]
    pins: [paw_n, paw_f, foot_n, foot_f]
    tweaks: {wt_n: [-4, 8], wt_f: [16, 5]}
  atk_follow:                  # a settle after the bite: the wings beat down further
    t: 0.68
    moves: [back, chest, neck, head, snout]
    tweaks: {wt_n: [-4, 8], wt_f: [16, 5]}
  atk_recover:                 # settle: spine 30% toward the lunge, the folded wing lifted 3 px
    t: 0.3
    moves: [back, chest, neck, head, snout]
    tweaks: {wtip_i: [3, -5]}
  hurt_in1:                    # the flinch: spine and head toward the hunched hurt pose, hind legs stepping back with it
    pins: [paw_n, paw_f]
    moves: [hip, back, chest, neck, head, snout, hip_n, knee_n, foot_n, toe_n, hip_f, knee_f, foot_f, toe_f]
    tweaks: {neck: [-2, -1], head: [-4, -3], snout: [-4, -3]}    # review 1: the head jerks back and up (a visible flinch)
  hurt_in2:                    # spine 35% back toward idle; neck, head and legs keep the hurt pose (a turned neck closed a
    moves: [back, chest]       # hole under the far wing arm; free knees dropped a paw 1 px under the plain)
    pins: [paw_n, paw_f, foot_n, foot_f, knee_n, knee_f, el_n, el_f]
  daze:                        # neck and head slump, no body drop
    t: 0.05
    dy: 0
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [0, 1], head: [0, 2], snout: [0, 3]}
  daze_b:
    t: 0.05
    dy: 0
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [0, 2], head: [0, 3], snout: [0, 4]}
paint:                         # 1-2 px notches between parts, closed with outline ink
  - {frame: atk_wind2, xy: [[35, 75]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[39, 73], [37, 73], [76, 73]], rgb: [6, 4, 10]}
  - {frame: daze, xy: [[92, 84]], rgb: [6, 4, 10]}
# pass KT (docs/KNEEL_TWEEN_PLAN.md): the approved AI kneel key (approved/<id>/kneel.png) and the bridge
# frames (kneel_bridge.py); no derived kneel block to retire (it was the D-K7 alias)
kneel:
  source: ai
  # KT3: KT2-C best iteration (in1 hole and swap step 14.2 at defaults; 12.4 here, under the 0.65 bridge-swap cap)
  bridge: {keep_top: 0.49, keep_bot: 0.0, width: false}
