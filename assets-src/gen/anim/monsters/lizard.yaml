sprite: lizard
body: quadruped
facing: right
sampler: nearest
breath: true
# low sprawl: the tail lies on the ground (idle curls it under the body, hurt curls it up); its keys are far apart, so
# it is never in `moves` and rides the hip
keyframes:
  idle:
    hip: [42, 55]
    back: [58, 48]
    chest: [72, 48]
    neck: [80, 42]
    head: [88, 36]
    snout: [105, 38]
    tail0: [35, 58]
    tail1: [18, 62]
    tail2: [20, 70]
    tail_tip: [45, 73]
    sh_n: [72, 58]
    el_n: [72, 66]
    paw_n: [76, 72]
    ftoe_n: [82, 75]
    sh_f: [85, 58]
    el_f: [90, 64]
    paw_f: [92, 68]
    ftoe_f: [98, 71]
    hip_n: [45, 58]
    knee_n: [52, 64]
    foot_n: [48, 70]
    toe_n: [52, 74]
    hip_f: [40, 57]
    knee_f: [38, 64]
    foot_f: [36, 70]
    toe_f: [40, 74]
  attack:
    hip: [32, 58]
    back: [50, 50]
    chest: [70, 50]
    neck: [80, 46]
    head: [90, 40]
    snout: [107, 40]
    tail0: [25, 60]
