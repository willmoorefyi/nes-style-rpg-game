    tail2: [7, 62]
    tail_tip: [2, 66]
    sh_n: [65, 58]
    el_n: [68, 66]
    paw_n: [72, 72]
    ftoe_n: [78, 75]
    sh_f: [85, 60]
    el_f: [95, 64]
    paw_f: [100, 68]
    ftoe_f: [106, 71]
    hip_n: [32, 62]
    knee_n: [28, 67]
    foot_n: [26, 72]
    toe_n: [32, 75]
    hip_f: [27, 61]
    knee_f: [22, 66]
    foot_f: [20, 71]
    toe_f: [22, 74]
  hurt:
    hip: [40, 58]
    back: [55, 48]
    chest: [70, 47]
    neck: [78, 44]
    head: [85, 40]
    snout: [102, 44]
    tail0: [32, 60]
    tail1: [15, 58]
    tail2: [12, 47]
