frames:
  atk_wind1:                   # the head draws back and dips
    moves: [back, chest]
    tweaks: {neck: [-1, 1], head: [-1, 1], snout: [-1, 1]}
  atk_wind2:                   # coil: chest low, head pulled back
    dy: 1
    moves: [back, chest]
    tweaks: {neck: [-2, 1], head: [-2, 1], snout: [-2, 1]}
  atk_mid:                     # the near fore paw ~1/3 back toward the coil (feet lerp)
    tweaks: {paw_n: [2, 0], ftoe_n: [2, 0]}
    moves: [hip, back, chest, neck, head, snout, sh_n, el_n, paw_n, ftoe_n, sh_f, el_f, paw_f, ftoe_f, hip_n, knee_n, foot_n, toe_n, hip_f, knee_f, foot_f, toe_f]
  atk_follow:
    t: 1.10
    moves: [back, chest]
  atk_recover:
    t: 0.35
    moves: [back, chest, neck, sh_n, sh_f]
  hurt_in1:                    # flinch: body pulled back, head jerked back and up (the far hind leg rides: cap)
    t: 0.30
    moves: [hip, back, chest, neck, head, snout, sh_n, sh_f, hip_n]
    tweaks: {neck: [-1, -1], head: [-2, -1], snout: [-2, -1]}
  hurt_in2:                    # the near shoulder rides (cap)
    moves: [hip, back, chest, neck, head, snout, sh_f, hip_n, hip_f]
  daze:
    t: 0.0
    moves: [back, chest, neck, head, snout]
    tweaks: {neck: [0, 1], head: [0, 1], snout: [0, 3]}
  daze_b:
    t: 0.0
    moves: [back, chest, neck, head, snout]
    dy: 1                      # the grounded tail would sink at the recipe's 2
    tweaks: {neck: [0, 1], head: [0, 1], snout: [0, 4]}
masks:
  head:                        # the open jaw is head
    idle: [[80, 22], [110, 30], [110, 50], [84, 50], [80, 40]]
    attack: [[84, 24], [112, 30], [112, 62], [88, 62], [84, 44]]
    hurt: [[78, 30], [108, 34], [108, 56], [80, 56], [78, 44]]
holds: []
paint:                         # 1 px knee crack the breath drop opens, outline ink
  - {frame: atk_wind1, xy: [[51, 67]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[51, 67]], rgb: [6, 4, 10]}
  - {frame: daze, xy: [[51, 67]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[51, 67]], rgb: [6, 4, 10]}
