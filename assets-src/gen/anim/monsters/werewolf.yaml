    attack: [[10, 70], [23, 70], [23, 78], [10, 78]]
    hurt: [[22, 70], [34, 70], [34, 78], [22, 78]]
holds: []
paint:                         # 1 px crotch seam the shifted legs open, outline ink
  - {frame: atk_mid, xy: [[37, 53]], rgb: [6, 4, 10]}
  # pass K (K2-B): the trailing far toe below the feet row cleared (kneel_in1, kneel_in2); the knee crack closed with outline ink (kneel_in2)
  - {frame: kneel_in1, xy: [[21, 77]], rgb: null}
  - {frame: kneel_in2, xy: [[19, 71], [21, 71]], rgb: [6, 4, 10]}
  - {frame: kneel_in2, xy: [[12, 77], [13, 77]], rgb: null}
# pass K (K2-B): biped template, long legs (knee_forward, short_legs); the far knee and shin flat on the ground row, the foot drawn in off the cell edge; shoulders slumped
kneel:
  variant: [knee_forward, short_legs]
  tweaks: {knee_f: [0, 2], foot_f: [3, 4], toe_f: [3, 2], tail_tip: [4, 1], sh_n: [0, 2], sh_f: [0, 2]}
  paint:
    - {xy: [[23, 37], [26, 37], [25, 38], [26, 38], [27, 38], [42, 44], [45, 46], [23, 56], [21, 48], [22, 48], [22, 50], [23, 50], [22, 52]], rgb: [6, 4, 10]}
