parts:
  weapon: {remove: true}
  tail: {bone: [hip, tail_tip], radius: 3.5}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  kneel_in1:
    tweaks: {toe_f: [0, -1]}
  kneel_in2:
    tweaks: {knee_f: [0, 1], foot_f: [0, 1]}
  atk_wind1:                   # half of wind2
    moves: [crown, neck, chest]
    tweaks: {crown: [-1, 0], neck: [-1, 0], sh_f: [-1, 0], el_f: [-1, -1], hand_f: [-1, -1], el_n: [-1, 0], hand_n: [-2, 0]}
  atk_wind2:                   # body sinks 2 (recipe dy), head and both arms drawn back (translated: the claws stay crisp)
    moves: [crown, neck, chest]
    tweaks: {crown: [-3, 0], neck: [-2, 0], chest: [-1, 0], sh_f: [-2, -1], el_f: [-3, -2], hand_f: [-3, -2], sh_n: [-1, 0], el_n: [-3, 0], hand_n: [-4, 0]}
  atk_mid:                     # attack arms kept; legs shifted ~1/3 back toward idle, not rotated
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {knee_f: [2, 0], foot_f: [3, 0]}
    moves: [crown, neck, chest, hip, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f, toe_n, toe_f]
  atk_follow:
    t: 0.80
    moves: [crown, neck, chest]
  atk_recover:
    t: 0.25
    moves: [crown, neck, chest]
  hurt_in1:                    # flinch: head snapped back (translated), claws jerk up
    moves: [chest, hip, hip_n, knee_n, hip_f, knee_f]
    tweaks: {crown: [-4, 1], neck: [-3, 1], el_n: [0, -3], hand_n: [0, -4], el_f: [0, -3], hand_f: [0, -3]}
  hurt_in2:
    moves: [crown, neck, chest, hip, hip_n, knee_n, hip_f, knee_f]
  daze:
    moves: [crown, neck, chest]
  daze_b:
    moves: [crown, neck, chest]
z:
  idle: [tail, uarm_f, farm_f, thigh_f, shin_f, ft_f, torso, thigh_n, shin_n, ft_n, head, uarm_n, farm_n]
