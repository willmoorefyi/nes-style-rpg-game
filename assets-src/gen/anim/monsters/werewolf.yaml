  tail:
    idle: [[14, 44], [30, 44], [31, 53], [14, 53]]
    attack: [[10, 45], [27, 45], [29, 52], [10, 52]]
    hurt: [[16, 44], [30, 44], [31, 53], [16, 53]]
  ft_n:
