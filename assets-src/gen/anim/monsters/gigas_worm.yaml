facing: right
sampler: nearest
breath: true
keyframes:
  idle:   {c_f: [48, 121], c_n: [86, 121], body0: [80, 90], body1: [55, 62], neck: [46, 38], head: [64, 22], snout: [98, 33]}
  attack: {c_f: [32, 121], c_n: [78, 121], body0: [75, 92], body1: [52, 72], neck: [34, 46], head: [55, 30], snout: [115, 60]}
  hurt:   {c_f: [46, 121], c_n: [84, 121], body0: [85, 95], body1: [60, 68], neck: [45, 45], head: [60, 26], snout: [95, 50]}
masks:
