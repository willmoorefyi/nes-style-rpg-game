    idle: [[54, 10], [104, 10], [104, 50], [62, 50], [54, 36]]
    attack: [[40, 20], [122, 20], [122, 80], [86, 80], [62, 47], [40, 46]]
    hurt: [[50, 18], [100, 18], [100, 62], [70, 62], [56, 44], [50, 42]]
