# Gigas Worm (pass R, serpent): a huge pink-grey segmented earthworm reared up in an S, ringed maw of teeth. body:
# serpent (rig_serpent.py): the bottom curl is the pinned coil, the S rises from body0; the head is rigid from the
# S's top bend to the maw (the anaconda layout).
sprite: gigas_worm
