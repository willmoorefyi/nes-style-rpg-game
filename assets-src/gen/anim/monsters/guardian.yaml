# Guardian (pass V redesign R295, docs/REDESIGN_PLAN.md 3.1): a four-legged hunter-killer war machine with two scythe
# arms, gunmetal plates and a row of three red sensor eyes. Preset mechanical, translation-only (guide 2.5 "hard
# sheets"): in every in-between the hull, head and both scythes move as one rigid unit (`moves: []`, the same tweak
# on every hull joint) over planted legs (knees, elbows and feet pinned; only the thighs and upper forelegs turn a
# few degrees to reach them). The strike lives in the idle -> attack key switch. The far foreleg is not drawn: its
# parts are pixel-less anchors (pinned like the others). In the attack key the right-hand element is the second
# scythe, its tip on the ground (masked onto spear_f); the hurt key shows only one scythe clearly (approved art,
# ROSTER_LOG pass V nit), so spear_f rides the head plate there.
# `fixmeasure.py switch guardian <seq> --rig` (IoU / step vs need 0.550 / cap 9.6); pre-check without a rig: attack
# d (3, -1) IoU 0.566, hurt d (2, -2) IoU 0.706:
#   attack: idle->wind1 0.915 / 1.3, wind1->wind2 0.852 / 2.3, wind2->mid 0.590 / 4.5, mid->attack 0.926 / 0.7,
#           attack->follow 0.896 / 1.0, follow->recover 0.551 / 7.3, recover->idle 0.900 / 1.7
#   hurt:   idle->in1 0.883 / 1.8, in1->in2 0.665 / 0.9, in2->hurt 0.941 / 0.9;  daze: 0.851 / 2.2, 0.863 / 2.0
# Image review (V5, 1 iteration): SHIP WITH NITS. Recorded nits: the wind-up is small (wind2 -4 px is the most the 15 deg
# mechanical cap allows on the far thigh: -5 gives 16.3 deg), atk_mid is close to the attack key and atk_recover close
# to the idle (follow->recover sits at the 0.55 continuity floor), hurt_in1 is a 2 px jolt before the key switch, the
# daze is a subtle bob; the hurt key shows one scythe (approved art).
