sprite: hellhound
body: quadruped
facing: right
sampler: nearest
breath: true
# Two heads on the quadruped template (no multi-head framework): the near head is the template's rigid `head`
# (head -> snout); the far head is its own rigid part `head2` (h2 -> s2), hung from the near head by a pixel-less
# anchor (head -> h2), so it rides the near head but turns on its own (in the hurt key it rears far higher).
# The flame mane and the flame tail tip are art pixels on the neck / head / tail parts (no fx part).
# The far hind leg is hidden in idle: its joints are marked only in attack and hurt.
