  head2:                       # the far head (eye, fangs, jaw)
    idle: [[86, 52], [100, 52], [105, 62], [106, 72], [104, 78], [96, 80], [88, 76], [86, 64]]
    attack: [[86, 72], [108, 70], [110, 84], [110, 96], [100, 100], [88, 96], [86, 84]]
    hurt: [[80, 30], [92, 26], [110, 26], [110, 40], [100, 46], [88, 48], [80, 42]]
  head:                        # the near head with its flame crest
    idle: [[104, 40], [116, 44], [124, 50], [130, 58], [134, 70], [132, 82], [118, 86], [106, 82], [104, 70]]
    attack: [[110, 62], [124, 62], [138, 68], [140, 82], [134, 94], [118, 96], [110, 90]]
    hurt: [[98, 48], [112, 50], [124, 54], [134, 58], [132, 70], [116, 74], [104, 72], [100, 62]]
frames:
  atk_wind1:                   # crouch starts: body 1 px down, both heads drawn back 2 px and sinking, tail sinks
    dy: 1
    moves: [back, chest, tail0, tail1, tail2, tail3, tail_tip]
    tweaks: {neck: [-1, 1], head: [-2, 1], snout: [-2, 1], h2: [-2, 1], s2: [-2, 1], tail3: [0, 1], tail_tip: [0, 1]}
  atk_wind2:                   # coil: body 2 px down, both heads pulled back 4 px, far shoulder back 1, tail down
    dy: 2
    moves: [back, chest, tail0, tail1, tail2, tail3, tail_tip]
    tweaks: {chest: [-1, 0], neck: [-3, 1], head: [-4, 1], snout: [-4, 1], h2: [-4, 1], s2: [-4, 1], sh_f: [-1, 0], tail3: [0, 1], tail_tip: [0, 2]}
  atk_mid:                     # the pass: forelegs keep the reach (no shin rotation), body and heads ease back
    t: 0.25
    pins: [foot_n, foot_f, knee_n, knee_f, el_n, paw_n]
    moves: [back, chest, tail0, tail1, tail2, tail3, tail_tip]
    tweaks: {el_n: [-6, 0], paw_n: [-6, 0]}
  atk_follow:                  # follow-through: spine and tail overshoot the leap (heads and forelegs keep the bite)
    t: 1.10
    moves: [back, chest, tail0, tail1, tail2, tail3, tail_tip]
  atk_recover:                 # landing: paws planted, spine and shoulders 35 % toward the leap, heads ride the neck
    t: 0.35
    moves: [back, chest, neck, tail0, tail1, tail2, tail3, tail_tip, sh_n, sh_f]
  hurt_in1:                    # flinch: spine 32 % toward the hurt rise, both heads thrown up and back 3-5 px as one
    t: 0.32                    # (interpolating the neck toward the reared hurt neck tore the mane apart at the withers)
    moves: [back, chest, tail0, tail1, tail2, tail3, tail_tip]
    tweaks: {neck: [-1, -2], head: [-2, -3], snout: [-2, -3], h2: [-2, -4], s2: [-2, -5]}
  hurt_in2:                    # settling back toward idle, paws planted
    t: 0.25
    moves: [back, chest, neck, head, snout, h2, s2, sh_f]
  daze:                        # both heads hang, tail lowered, forelegs planted
    t: 0.0
    moves: [back, chest, neck, head, snout, tail0, tail1, tail2, tail3, tail_tip]
    tweaks: {neck: [1, 1], head: [0, 1], snout: [0, 3], h2: [0, 1], s2: [0, 3], tail2: [0, 1], tail3: [0, 2], tail_tip: [1, 2]}
  daze_b:                      # the sway's low point: heads 1 px lower
    t: 0.0
    moves: [back, chest, neck, head, snout, tail0, tail1, tail2, tail3, tail_tip]
    tweaks: {neck: [1, 1], head: [0, 2], snout: [0, 4], h2: [0, 2], s2: [0, 4], tail2: [0, 1], tail3: [0, 2], tail_tip: [1, 2]}
holds: []
paint:                         # hurt_in1 joint cracks closed with outline ink: under the tail root (2 px), the near
  # jaw over the far shoulder (2 px), the near hock (1 px)
  - {frame: hurt_in1, xy: [[28, 72], [30, 72], [107, 75], [108, 75], [30, 94]], rgb: [6, 4, 10]}
