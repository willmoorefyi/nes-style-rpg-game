    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [0, -1], hip: [0, -1], sh_n: [0, -1], el_n: [0, -2], hand_n: [0, 0], cry: [0, -2], sh_f: [0, -1], el_f: [0, -1], hand_f: [0, -1], st: [0, -1], hip_n: [0, -1], hip_f: [0, -1], cs_0: [0, -1], cs_1: [2, -4], cs_2: [4, -7]}
