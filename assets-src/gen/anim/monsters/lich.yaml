frames:                        # translation-led in-betweens (no head / torso rotation); tuned with check-only sweeps
  atk_wind1:                   # coil starts: body 1 px down, upper body 1 px forward, head pushed 3 px forward (pure translation)
    dy: 1
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [4, 0], neck: [4, 0], chest: [1, 0], hip: [1, 0], hip_n: [1, 0], hip_f: [1, 0], gh: [1, 0], gt: [1, 0], cv_0: [1, 0], cv_1: [1, 0], cv_2: [1, 0], cv_3: [1, 0]}
  atk_wind2:                   # coil: body 3 px down, head 6 px forward (the frame before the leap; the runtime pulls the sprite back); t -0.25 (G1: pure translation, the lerp target follows the fx-excluded attack)
    t: -0.25
    dy: 3
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [8, 0], neck: [8, 0], chest: [2, 0], hip: [2, 0], hip_n: [2, 0], hip_f: [2, 0], gh: [2, 0], gt: [2, 0], cv_0: [2, 0], cv_1: [2, 0], cv_2: [2, 0], cv_3: [2, 0]}
  atk_mid:                     # the pass: attack pose with the body 8 px higher, far foot 17 px toward idle (lerp), mantle 10 deg higher
    moves: []
    pins: [foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [0, -8], neck: [0, -8], chest: [0, -8], hip: [0, -8], sh_n: [0, -8], el_n: [0, -8], hand_n: [0, -8], hip_n: [0, -8], hip_f: [8, -8], gh: [0, -8], gt: [0, -8], tra: [0, -8], ca_0: [0, -8], ca_1: [1, -1], ca_2: [6, 7], foot_f: [17, 0], toe_f: [17, 0], knee_f: [16, 0], foot_n: [1, 0], toe_n: [1, 0]}
  atk_follow:                  # follow-through: trail (the whole frost arc) gone, glaive 4 deg further down, fist arm 15 deg down, body 2 px up
    dy: -2
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    drop: [trail]
    tweaks: {el_n: [-2, 3], hand_n: [-3, 8], gt: [-3, 4], tra: [4, 4]}
  atk_recover:                 # settle: idle crouched 8 px, head 4 px forward and down (still leaning into the strike)
    dy: 8
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [4, 4], neck: [4, 4]}
  hurt_in1:                    # flinch: idle upper body knocked 4 px back and 10 px down, head 2 px forward and 3 down
    dy: 10
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [-2, 3], neck: [-2, 3], chest: [-4, 0], hip: [-4, 0], hip_n: [-4, 0], hip_f: [-4, 0], gh: [-4, 0], gt: [-4, 0], cv_0: [-4, 0], cv_1: [-4, 0], cv_2: [-4, 0], cv_3: [-4, 0]}
  hurt_in2:                    # nearly recoiled: hurt upper body 4 px forward, head 3 px up
    dy: 0
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [4, -3], neck: [4, -3], chest: [4, 0], hip: [4, 0], hip_n: [4, 0], hip_f: [4, 0], gh: [4, 0], gt: [4, 0], ch_0: [4, 0], ch_1: [4, 0], ch_2: [4, 0]}
