    scale: {crystal: 0.55}
    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], hip: [-2, 0], sh_n: [-2, 0], el_n: [0, 1], hand_n: [1, 1], cry: [1, 1], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0], st: [-2, 0], hip_n: [-2, 0], hip_f: [-2, 0], cs_0: [-2, 0], cs_1: [6, -10], cs_2: [14, -20]}
