    moves: []
    pins: [knee_n, foot_n, toe_n, knee_f, foot_f, toe_f]
    tweaks: {crown: [7, 3], neck: [5, 1], chest: [4, 0], hip: [4, 0], hip_n: [4, 0], hip_f: [4, 0], gh: [4, 0], gt: [4, 0], cv_0: [4, 0], cv_1: [-3, -5], cv_2: [-11, -9], cv_3: [-18, -11]}
