frames:
  # The trident flips ~130 deg between idle (upright) and attack (thrust down-forward), over the 30 deg cap, so it never
  # turns: idle-sourced frames keep it upright, attack-sourced ones keep the thrust angle, and it only translates with the
  # fist. The 2-3 px channel between the near leg and the shaft is open in idle: the shaft never moves left or down in
  # idle-sourced frames (any closure is a new enclosed hole).
  atk_wind1:                   # half of wind2: head back, trident fist hoisted 3 px
    moves: [crown, neck, chest]
    tweaks: {crown: [-2, 0], neck: [-1, 0], el_n: [0, -2], hand_n: [0, -3]}
  atk_wind2:                   # the swing starts (t +0.30 toward the strike, skeleton recipe: idle/attack IoU 0.42 cannot
    t: 0.30                    # meet wind2->mid from a pull-back): far arm swings up, trident hoisted 4 px
    moves: [crown, neck, chest, hip, sh_f, el_f, hand_f]
    tweaks: {sh_n: [0, -1], el_n: [1, -2], hand_n: [1, -4]}
  atk_mid:                     # both arms and the trident keep the attack grip (the far fist holds the shaft butt); legs
    t: 0.35                    # pinned and shifted toward idle, not rotated
    pins: [knee_n, foot_n, knee_f, foot_f]
    moves: [crown, neck, chest, hip, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f, toe_n, toe_f]
    tweaks: {knee_f: [5, 0], foot_f: [6, 0]}
  atk_follow:                  # a settle (t 0.65); the two-handed grip rides the chest as one piece, head 2 px back
    t: 0.65
    moves: [crown, neck, chest, hip, hip_n, knee_n, hip_f, knee_f]
    tweaks: {crown: [-2, 0], neck: [-2, 0]}
  atk_recover:                 # still leaning in (follow->recover IoU): body and far arm toward the strike, head 1 px,
    t: 0.35                    # far knee free; the upright trident pushed forward clear of the snout and the leg
    moves: [crown, neck, chest, hip, sh_f, el_f, hand_f, hip_n, hip_f, knee_f]
    pins: [foot_n, foot_f, knee_n]
    tweaks: {crown: [-1, 1], neck: [1, 1], chest: [1, 1], el_n: [3, -1], hand_n: [5, -2]}
  hurt_in1:                    # flinch: head snaps back, fists jerk up (the trident up and forward, off the leg channel)
    moves: [crown, neck, chest, sh_n, el_n, hand_n, sh_f, el_f, hand_f]
    tweaks: {crown: [-3, 0], neck: [-1, 0], el_n: [1, -2], hand_n: [2, -3], el_f: [0, -2], hand_f: [0, -3]}
  hurt_in2:
    moves: [crown, neck, chest, hip, sh_n, el_n, hand_n, sh_f, el_f, hand_f, hip_n, knee_n, hip_f, knee_f]
  daze:                        # the trident fist holds its height while the body slumps (leg channel stays open)
    tweaks: {hand_n: [0, -1]}
  daze_b:
    tweaks: {hand_n: [0, -2]}
