frames:                        # rigid leans about the hip and translations, written as tweaks (moves [])
  atk_wind1:                   # lean back 4, the near (punching) arm 3 back
    moves: []
    t: -0.05
    tweaks: {crown: [-5, -1], neck: [-4, -1], chest: [-3, 0], sh_n: [-6, -3], el_n: [-5, -3], hand_n: [-5, -4], sh_f: [-4, 1], el_f: [-2, 2], hand_f: [-2, 1]}
  atk_wind2:                   # coil: lean back 6, the near (punching) arm 6 back, body 3 lower
    moves: []
    t: -0.1
    dy: 3
    tweaks: {crown: [-8, -1], neck: [-5, -1], chest: [-4, 0], sh_n: [-11, -3], el_n: [-10, -3], hand_n: [-9, -4], sh_f: [-6, 2], el_f: [-3, 3], hand_f: [-3, 1]}
  atk_mid:                     # the punch comes in: the attack upper body leaned back 7 about the hip, the punching arm 15 higher with its fist still on the ground; the near foot 7 back toward the idle stance
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-8, -3], neck: [-5, -2], chest: [-4, 0], sh_n: [-4, -3], el_n: [-6, -1], hand_n: [-9, 0], sh_f: [-8, 1], el_f: [-9, 3], hand_f: [-7, 4], hip_n: [6, 0], knee_n: [7, 0], foot_n: [7, 0]}
  atk_follow:                  # settle: the attack upper body 3 back about the hip, the punching arm 12 higher
    moves: []
    t: 0.8
    tweaks: {crown: [-3, -1], neck: [-2, -1], chest: [-2, 0], sh_n: [-2, -1], el_n: [-4, -1], hand_n: [-7, 0], sh_f: [-3, 0], el_f: [-4, 1], hand_f: [-3, 1]}
  atk_recover:                 # upper body 2 forward and 3 lower (translated), the punching arm 20 lower, the far arm 20 higher
    moves: []
    dy: 3
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [-3, 1], hand_n: [-5, 4], sh_f: [2, 0], el_f: [12, 4], hand_f: [13, -4]}
  hurt_in1:                    # recoil 1, lean back 6, head 1 further back, the near fist 3 up
    moves: []
    tweaks: {crown: [-10, -1], neck: [-7, -1], chest: [-5, 0], sh_n: [-6, -3], el_n: [-5, -6], hand_n: [-4, -7], sh_f: [-7, 2], el_f: [-4, 3], hand_f: [-4, 1]}
  hurt_in2:                    # the hurt pose 4 forward (translated), the head 2 more
    moves: []
    tweaks: {crown: [6, 0], neck: [6, 0], chest: [4, 0], sh_n: [4, 0], el_n: [4, 0], hand_n: [4, 0], sh_f: [4, 0], el_f: [4, 0], hand_f: [4, 0]}
  daze:                        # slump: the upper body 1 forward and 1 lower (translated), the head 1 more
    moves: []
    dy: 1
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
  daze_b:                      
    moves: []
    dy: 2
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
