  - {frame: hurt_in2, xy: [[112, 95]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[114, 92]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[81, 112]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[84, 115]], rgb: [6, 4, 10]}
