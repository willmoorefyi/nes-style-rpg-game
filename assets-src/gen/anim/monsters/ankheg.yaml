parts:
  thorax: {radius: 18.0}
  abdomen: {radius: 14.0}
  fangs: {remove: true}           # the mandibles stay on the rigid thorax (as own parts they tore from the head)
masks:
  leg1_n:                       # the thin front legs under the reared thorax hold with the planted leg
    idle: [[104, 96], [124, 96], [124, 122], [104, 122]]
frames:                         # legs out of every interpolation: the body moves, the tips hold, the IK bends the knees
  atk_wind1:                    # the reared front half draws back (a small turn about the body joint)
    moves: []
    pins: [tip1_n, tip1_f, tip2_n, tip2_f, tip3_n, tip3_f, tip4_n, tip4_f]
    tweaks: {head: [-4, 1], fang: [-4, 1]}
  atk_wind2:
    moves: []
    pins: [tip1_n, tip1_f, tip2_n, tip2_f, tip3_n, tip3_f, tip4_n, tip4_f]
    tweaks: {head: [-8, 2], fang: [-8, 2]}
  atk_mid:
    t: 0.25
    moves: [head]
    pins: [tip2_n, tip2_f, tip3_n, tip3_f, tip4_n, tip4_f]
    tweaks: {tip2_n: [2, 1], tip2_f: [3, 0], tip3_n: [3, 0], tip3_f: [3, 0], tip4_n: [3, 0], tip4_f: [3, -1]}
  atk_follow:
    t: 0.9
    moves: [head]
    pins: [tip2_n, tip2_f, tip3_n, tip3_f, tip4_n, tip4_f]
  atk_recover:
    t: 0.3
    moves: [body, head, abd, abd_end]
    pins: [tip1_n, tip1_f, tip2_n, tip2_f, tip3_n, tip3_f, tip4_n, tip4_f]
  hurt_in1:
    moves: [body, head, fang, abd, abd_end]
    pins: [tip1_n, tip1_f, tip2_n, tip2_f, tip3_n, tip3_f, tip4_n, tip4_f]
  hurt_in2:
    moves: [body, head, fang, abd, abd_end]
    pins: [tip1_n, tip1_f, tip2_n, tip2_f, tip3_n, tip3_f, tip4_n, tip4_f]
  daze: {moves: [], dy: 0, tweaks: {head: [1, 1]}}
  daze_b: {moves: [], dy: 1}
holds: []
paint:                          # 4-5 px pockets that close between bent legs: inked shut (the tarantula recipe)
  - {frame: atk_wind1, xy: [[50, 115], [50, 116], [51, 113], [51, 114], [51, 115]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[50, 115], [50, 116], [51, 113], [51, 114], [51, 115]], rgb: [6, 4, 10]}
  - {frame: atk_recover, xy: [[82, 115]], rgb: [6, 4, 10]}
