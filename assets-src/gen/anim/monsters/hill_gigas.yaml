    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-9, 1], neck: [-5, 1], chest: [-4, 2], sh_n: [-5, 0], el_n: [-3, 0], sh_f: [-6, 4], el_f: [-3, 2], hand_f: [0, 1], knee_f: [6, 0], foot_f: [6, 0]}
