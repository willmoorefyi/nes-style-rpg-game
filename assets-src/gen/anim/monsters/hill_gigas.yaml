    t: -0.1
    dy: 3
    tweaks: {crown: [-7, 0], neck: [-5, 0], chest: [-3, 0], sh_n: [-4, -1], el_n: [-2, -4], hand_n: [-4, -5], tip: [-7, 0], sh_f: [-4, 2], el_f: [-2, 3], hand_f: [-2, 0]}
