    tweaks: {crown: [-5, 0], neck: [-3, 0], chest: [-2, 0], sh_n: [-3, -1], el_n: [-1, -3], hand_n: [-3, -3], tip: [-5, 0], sh_f: [-3, 2], el_f: [-2, 2], hand_f: [-2, 0]}
