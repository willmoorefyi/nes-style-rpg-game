frames:                        # rigid rotations about the hip / the club hand, written as tweaks (moves [])
  atk_wind1:                   # lean back 5 (club rigid with the upper body), club hand 1 up
    moves: []
    t: -0.05
    tweaks: {crown: [-5, 0], neck: [-3, 0], chest: [-2, 0], sh_n: [-3, -1], el_n: [-1, -3], hand_n: [-3, -3], tip: [-5, 0], sh_f: [-3, 0], el_f: [-2, 1], hand_f: [-2, 0]}
  atk_wind2:                   # coil: lean back 7 (the club head drops behind the back with it), club hand 2 up, body 3 lower
    moves: []
    t: -0.1
    dy: 3
    tweaks: {crown: [-7, 0], neck: [-5, 0], chest: [-3, 0], sh_n: [-4, -1], el_n: [-2, -4], hand_n: [-4, -5], tip: [-7, 0], sh_f: [-4, 0], el_f: [-2, 1], hand_f: [-2, 0]}
  atk_mid:                     # the club lands: the attack upper body leaned back 8 rigidly about the fists (hands and club stay on the ground)
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-9, 1], neck: [-5, 1], chest: [-4, 2], sh_n: [-5, 0], el_n: [-3, 0], sh_f: [-6, 4], el_f: [-3, 2], hand_f: [0, 1], knee_f: [6, 0], foot_f: [6, 0]}
  atk_follow:                  # settle: the upper body 4 back about the fists
    moves: []
    t: 0.8
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-2, 1], sh_n: [-2, 0], el_n: [-1, 0], sh_f: [-3, 2], el_f: [-2, 1]}
  atk_recover:                 # upper body and club 2 forward and 2 lower (translated)
    moves: []
    dy: 2
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 0], hand_n: [2, 0], tip: [2, 0], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0]}
  hurt_in1:                    # recoil 1, lean back 6, head 12 further back
    moves: []
    tweaks: {crown: [-11, 0], neck: [-5, 0], chest: [-4, 0], sh_n: [-4, -1], el_n: [-3, -2], hand_n: [-4, -2], tip: [-7, 2], sh_f: [-5, 2], el_f: [-3, 3], hand_f: [-3, 0]}
  hurt_in2:                    # the hurt pose leaned in 6, head 5 forward, club 8 back
    moves: []
    tweaks: {crown: [8, -4], neck: [5, -1], chest: [4, -1], sh_n: [6, 0], el_n: [4, 1], hand_n: [4, 2], tip: [3, 2], sh_f: [4, -3], el_f: [3, 0], hand_f: [3, 2]}
  daze:                        # slump: the upper body (club included) 1 forward and 1 lower (translated), the head 1 more (the recipe head tweak less 1)
    moves: []
    dy: 1
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], tip: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
  daze_b:                      
    moves: []
    dy: 2
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], tip: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
