  fpaw_f: {in: [idle, hurt]}
masks:
  body:                        # the pale belly over the far hind leg (thigh_f's radius took it: a crease in hurt_in1)
    idle: [[38, 55], [84, 55], [84, 78], [38, 78]]
    hurt: [[38, 50], [84, 50], [84, 83], [38, 83]]
  head:                       # the whole head with the open jaw and sabre fangs (not the far foreleg under it)
    idle: [[128, 36], [140, 31], [162, 30], [173, 50], [174, 68], [168, 82], [160, 86], [147, 85], [140, 76], [130, 70]]
    attack: [[130, 42], [165, 40], [179, 55], [179, 70], [168, 86], [158, 94], [142, 94], [139, 80], [131, 70], [128, 60]]
    hurt: [[125, 48], [145, 44], [162, 47], [169, 60], [171, 80], [166, 96], [158, 101], [148, 99], [140, 88], [125, 75]]
  neck:                        # the attack's throat ruff above the foreleg: the neck warp bridges head and leg in follow
    attack: [[118, 52], [133, 48], [139, 80], [133, 81], [125, 78], [118, 70]]
    idle: [[112, 28], [126, 27], [128, 36], [130, 70], [114, 72]]   # the nape: the neck follows the head down in daze (no notch)
  shin_n:                      # the near hind shin below the hock (the thigh's wide radius took it)
    idle: [[12, 99], [29, 99], [29, 111], [12, 111]]
    attack: [[3, 100], [24, 100], [24, 110], [3, 110]]
    hurt: [[8, 98], [28, 98], [28, 110], [8, 110]]
