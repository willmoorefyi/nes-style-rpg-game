sprite: rakshasa
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/rakshasa/monster_large.png,
# backend: user; 128x128 cells, the idle 93 px tall). The old rig is archived as anim/monsters/_retired/rakshasa_v1.yaml.
# The pirate's recipe: the long robe is the torso with the hip low on it, the arms and claws ride the torso (arm parts
# removed), so every in-between is a rigid lean or shift of its source key's upper body about the hip (tweaks under
# `moves: []`: each upper joint rotated about `hip`, rounded to whole px).
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [64, 32]
    neck: [64, 48]
    chest: [62, 58]
    hip: [60, 98]
    sh_n: [74, 56]
    el_n: [78, 62]
    hand_n: [80, 52]
    sh_f: [50, 56]
    el_f: [46, 70]
    hand_f: [58, 64]
    hip_n: [68, 100]
    knee_n: [74, 108]
    foot_n: [76, 116]
    toe_n: [80, 121]
    hip_f: [54, 100]
    knee_f: [48, 108]
    foot_f: [44, 116]
    toe_f: [40, 121]
  attack:
    crown: [82, 42]
    neck: [80, 56]
    chest: [76, 64]
    hip: [72, 96]
    sh_n: [88, 60]
    el_n: [104, 58]
    hand_n: [116, 52]
    sh_f: [70, 62]
    el_f: [80, 72]
    hand_f: [92, 72]
    hip_n: [80, 100]
    knee_n: [88, 108]
    foot_n: [92, 116]
    toe_n: [96, 121]
    hip_f: [60, 100]
    knee_f: [44, 108]
    foot_f: [34, 116]
    toe_f: [28, 121]
  hurt:
    crown: [38, 36]
    neck: [42, 52]
    chest: [50, 62]
    hip: [58, 94]
    sh_n: [70, 56]
    el_n: [76, 48]
    hand_n: [80, 40]
    sh_f: [36, 62]
    el_f: [24, 70]
    hand_f: [16, 66]
    hip_n: [70, 100]
    knee_n: [78, 108]
    foot_n: [84, 116]
    toe_n: [90, 121]
    hip_f: [46, 100]
    knee_f: [38, 108]
    foot_f: [32, 116]
    toe_f: [28, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}
  farm_n: {remove: true}
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 14.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                  # draw back 3 deg, the upper body 2 px back
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-5, 0], neck: [-5, 0], chest: [-4, 0], sh_n: [-4, -1], el_n: [-4, -1], hand_n: [-4, -1], sh_f: [-4, 1], el_f: [-3, 1], hand_f: [-4, 0]}
  atk_wind2:                  # gather: 2 deg and 2 px forward, 1 down, into the spring (the keys sit far apart)
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [4, 1], neck: [4, 1], chest: [3, 1], sh_n: [3, 2], el_n: [3, 2], hand_n: [4, 2], sh_f: [4, 1], el_f: [3, 0], hand_f: [3, 1]}
  atk_mid:                  # the lunge key 5 deg and 7 px short of it (a bridge from the gather)
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-12, -1], neck: [-11, -1], chest: [-10, 0], sh_n: [-10, -1], el_n: [-10, -3], hand_n: [-11, -4], sh_f: [-10, 0], el_f: [-9, -1], hand_f: [-9, -2]}
  atk_follow:                  # the lunge key, 2 px short
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-2, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], sh_f: [-2, 0], el_f: [-2, 0], hand_f: [-2, 0]}
  atk_recover:                  # the idle leaned 4 deg and 6 px toward the lunge, on the way back
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [11, 0], neck: [10, 0], chest: [9, 0], sh_n: [9, 1], el_n: [8, 1], hand_n: [9, 1], sh_f: [9, -1], el_f: [8, -1], hand_f: [8, 0]}
  hurt_in1:                  # flinch: the idle thrown back 5 deg, 2 px back
    moves: []
    tweaks: {crown: [-8, 0], neck: [-6, 0], chest: [-5, 0], sh_n: [-6, -1], el_n: [-5, -1], hand_n: [-6, -2], sh_f: [-6, 1], el_f: [-4, 1], hand_f: [-5, 0]}
  hurt_in2:                  # the hurt key 6 deg less thrown back, 2 px forward, on the way to the idle
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [8, -2], neck: [6, -1], chest: [5, -1], sh_n: [6, 1], el_n: [7, 2], hand_n: [8, 3], sh_f: [5, -2], el_f: [5, -3], hand_f: [5, -4]}
  daze:                  # slump: the idle's upper body 1 px back
    moves: []
    dy: 0
    tweaks: {crown: [-1, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  daze_b:                  # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-1, 1], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
masks: {}
holds: []
paint: []
