parts:
  weapon: {remove: true}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  kneel_in1:
    tweaks: {foot_f: [0, 2], toe_f: [0, 2]}
  kneel_in2:
    tweaks: {knee_f: [0, 1], foot_f: [0, 1]}
  atk_wind1:                   # half of wind2: the crouch starts (coil forward), knees give, claw drawn back
    t: 0.15
    dy: 2
    pins: [foot_n, foot_f, toe_n, toe_f, knee_f]
    moves: [crown, neck, chest, hip, hip_n, knee_n, hip_f]
    tweaks: {crown: [-2, 0], neck: [-1, 0], sh_n: [-1, -1], el_n: [-3, -2], hand_n: [-4, -3]}
  atk_wind2:                   # coil forward (t +0.35, IoU to mid): crouched 4 on bent knees, upper body leaning back, claw drawn back
    t: 0.35
    dy: 4
    pins: [foot_n, foot_f, toe_n, toe_f, knee_f, knee_n]
    moves: [crown, neck, chest, hip, hip_n, hip_f]
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-2, 0], sh_n: [-3, -1], el_n: [-6, -4], hand_n: [-9, -6]}
  atk_mid:
    pins: [knee_n, foot_n, knee_f, foot_f, toe_n, toe_f]
    tweaks: {knee_f: [3, 0], foot_f: [4, 0], toe_f: [4, 0], knee_n: [1, 0], foot_n: [1, 0], toe_n: [1, 0], el_n: [-1, -2], hand_n: [-2, -4]}
    moves: [crown, neck, hip, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f, toe_n, toe_f]
  atk_follow:                  # overshoot: the claw and head drive on past the contact
    t: 1.10
    moves: [crown, neck, chest, sh_n, el_n, hand_n]
    tweaks: {crown: [1, 0], sh_n: [1, 0], hand_n: [4, 1], el_n: [2, 0]}
  atk_recover:
    t: 0.35
    dy: 2
    moves: [crown, neck, chest, hip]
  hurt_in1:                    # flinch: head knocked back (translated), both hands jerk up
    moves: []
    tweaks: {crown: [-5, 0], neck: [-3, 0], chest: [-1, 0], sh_n: [0, -1], el_n: [1, -3], hand_n: [2, -7]}
  hurt_in2:
    moves: [crown, neck, chest]
  daze:                        # head droops, both hands sink
    moves: [crown, neck, chest]
    dy: 1
    tweaks: {crown: [2, 1], neck: [1, 1], el_f: [0, 2], hand_f: [0, 3]}
  daze_b:
    moves: [crown, neck, chest]
    dy: 2
    tweaks: {crown: [2, 1], neck: [1, 1], el_f: [0, 2], hand_f: [0, 3]}
