parts:
  weapon: {remove: true}
  dagger:
    kind: prop
    bone: {idle: [hip_f, dag], attack: [hand_n, tip], hurt: [hip, dag_h]}
    radius: 2.0
    in: [idle, attack]
    carry_to: dag_h
    carry_mode: behind
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                   # half of wind2: arm starting back, head leaning back
    tweaks: {crown: [-1, 0], sh_n: [-1, 0], el_n: [-2, 0], hand_n: [-3, 0]}
  atk_wind2:                   # striking arm pulled back behind the body (z idle: near arm behind torso), head and torso lean back
    tweaks: {crown: [-2, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-3, -1], el_n: [-4, -1], hand_n: [-6, -1]}
  atk_mid:                     # both feet must travel ~1/3 of the way back (feet lerp check): legs shifted, not rotated;
    t: 0.32                    # head and forearm keep their attack angles (no rotation stair-steps / forearm stretch)
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {knee_n: [2, 0], foot_n: [2, 0], knee_f: [5, 0], foot_f: [5, 0]}
    moves: [neck, chest, hip, sh_n, el_n, sh_f, el_f, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f, toe_n, toe_f]
  atk_follow: {t: 1.10, tweaks: {hand_n: [-2, 1], tip: [-2, 1]}}
  atk_recover:                 # idle fist and forearm kept (only the upper arm reaches forward)
    t: 0.22
    moves: [crown, chest, sh_n, el_n]
  hurt_in1:                    # flinch: head and torso tilt back, guard arms start to lift
    moves: [crown, neck, chest, hip, sh_n, el_n, hand_n, sh_f, hip_n, knee_n, hip_f, knee_f]
    tweaks: {crown: [-3, 1], neck: [-1, 1], chest: [-1, 1], el_n: [0, -1], hand_n: [-1, -3], el_f: [0, -3], hand_f: [0, -3]}
  hurt_in2:                    # thrown arm at shoulder height
    moves: [crown, neck, chest, hip, sh_f, el_f, hip_n, knee_n, hip_f, knee_f]
    tweaks: {el_f: [0, 1], hand_f: [1, 4]}
  daze:                        # review fix: the boxing guard drops (near fist 6 px down, hanging loose), head 3 px down
    tweaks: {crown: [0, 1], neck: [0, 1], el_n: [0, 1], hand_n: [-1, 6]}
  daze_b:                      # the sway's low point: the torso 1 px lower (recipe dy), the head kept at daze height
    tweaks: {crown: [0, 1], el_n: [0, 1], hand_n: [-1, 6]}
z:
  idle: [uarm_f, farm_f, thigh_f, shin_f, uarm_n, farm_n, torso, thigh_n, shin_n, head, dagger, ft_n, ft_f]
masks:
  head:
    hurt: [[15, 12], [42, 12], [42, 22], [31, 22], [24, 21], [16, 20]]
  dagger:
    idle: [[13, 60], [16, 62], [21, 61], [28, 53], [28, 48], [25, 47]]
