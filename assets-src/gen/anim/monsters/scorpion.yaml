breath: true
attack_hand: [n, f]
# A desert scorpion: thorax (body -> head), abdomen under the tail root, the arched tail tl0..sting, one raised claw
# (f) in idle and hurt, both claws in the attack (the near claw n lies low in front, hidden in idle), seven visible
# legs (leg2_f is hidden in the attack-side hurt). Every in-between is a pure translation of the upper body (legs held
# whole: coxa, knee and tip pinned), by the ROSTER_FIX_PLAN_2 5 key-switch table.
# fixmeasure.py switch --rig (weakest pairs, IoU / step vs need / cap): attack wind2->mid 0.661 / 0.7 vs 0.550 / 6.0,
# follow->recover 0.644 / 1.1; hurt in1->in2 0.317 / 4.1 vs 0.313 / 6.0 (the rear-up switch, bridged without the FW-Q
# alias: hurt_in1 lifts the front 3 px and the abdomen 1 px, hurt_in2 lowers the rear-up 2 px with the tail 2 px right);
# daze idle->daze 0.911 / 0.7, daze->daze_b 0.917 / 0.6. The wind-up cocks the tail 1 px up (bbox height vs the lerp).
