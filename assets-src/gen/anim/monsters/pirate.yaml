frames:
  atk_wind1:                   # fist and cutlass translated back and up as one piece (no rotation: crisp fist), head back,
    moves: [crown, neck]       # far arm back; the torso only drops (no rotation: the coat details stay clean)
    tweaks: {crown: [-2, 0], neck: [-2, 0], el_n: [-2, -1], hand_n: [-2, -1], tip: [-2, -1], el_f: [-2, -1], hand_f: [-4, -1]}
  atk_wind2:                   # coil: fist pulled back and up, blade tipped back 16 deg, head leans back, far arm swings back 14 deg, torso down 2
    moves: [crown, neck]
    tweaks: {crown: [-5, 0], neck: [-3, 0], el_n: [-2, -3], hand_n: [-2, -3], tip: [-9, -4], el_f: [-2, -1], hand_f: [-4, -1]}
  atk_mid:                     # legs shifted (not rotated) a third of the way back; far arm and blade keep their attack
                               # angles (the crescent stays one piece); head and fist group 3 px back
    t: 0.35
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {knee_n: [1, 0], foot_n: [1, 0], knee_f: [5, 0], foot_f: [5, 0], crown: [-3, 2], neck: [-3, 2], el_n: [-3, -3], hand_n: [-3, -3], tip: [-3, -3]}
    moves: [neck, chest, hip, sh_n, el_n, hand_n, sh_f, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f]
  atk_follow:                  # a settle (28% back toward idle, far arm 25 deg lower) rather than an overshoot: an overshoot
    t: 0.72                    # cannot reach follow->recover IoU 0.55 (idle/attack keyframe IoU is 0.495)
    moves: [chest, hip, sh_n, el_n, hand_n, tip, sh_f, knee_n, knee_f]
    tweaks: {crown: [-2, -2], neck: [-2, -2], el_f: [-2, 4], hand_f: [-3, 8]}
  atk_recover:                 # idle fist and cutlass translated (not rotated) toward the strike; far arm still raised a little
    t: 0.35
    moves: [crown, neck, sh_f]
    tweaks: {el_n: [1, 2], hand_n: [1, 2], tip: [1, 2], el_f: [-3, -2], hand_f: [-6, -2]}
  hurt_in1:                    # flinch: head snaps back and tilts, torso tilts, fist and cutlass jerk up (translated: crisp fist), far arm swings in
    moves: [chest]
    tweaks: {crown: [-4, -1], neck: [-2, -1], chest: [-1, 0], el_n: [-3, -3], hand_n: [-3, -3], tip: [-3, -3], el_f: [2, 1], hand_f: [4, 0]}
  hurt_in2:                    # arms keep their hurt angles (blade 4 deg lower); head settles toward the body; lifted near foot swings back
    moves: [chest]
    pins: [foot_f, knee_f]
    tweaks: {crown: [2, 3], neck: [2, 3], chest: [-1, 0], hand_n: [-1, 0], tip: [-2, 0], foot_n: [-4, 1], toe_n: [-4, 1], knee_n: [-2, 0]}
masks:
