sprite: pirate
# EF-H (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/pirate/monster_large.png, backend: user;
# 128x128 cells, the idle 81 px tall). The old rig is archived as anim/monsters/_retired/pirate_v1.yaml.
# dark_wizard's recipe: the long coat is the torso with the hip where the legs leave it, the arms ride the torso
# (arm parts removed) and so does the cutlass (it never reaches the legs), so every in-between is a rigid lean of its
# source key's upper body about the hip, written as tweaks under `moves: []`.
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [63, 44]
    neck: [63, 60]
    chest: [62, 70]
    hip: [62, 98]
    sh_n: [70, 64]
    el_n: [78, 76]
    hand_n: [82, 86]
    sh_f: [52, 66]
    el_f: [46, 76]
    hand_f: [52, 83]
    hip_n: [70, 100]
    knee_n: [73, 109]
    foot_n: [76, 117]
    toe_n: [81, 121]
    hip_f: [54, 100]
    knee_f: [48, 109]
    foot_f: [46, 117]
    toe_f: [42, 121]
  attack:
    crown: [53, 44]
    neck: [55, 60]
    chest: [55, 70]
    hip: [57, 96]
    sh_n: [62, 63]
    el_n: [72, 64]
    hand_n: [82, 66]
    sh_f: [48, 66]
    el_f: [38, 74]
    hand_f: [28, 80]
    hip_n: [62, 98]
    knee_n: [70, 107]
    foot_n: [80, 117]
    toe_n: [86, 121]
    hip_f: [50, 98]
    knee_f: [42, 107]
    foot_f: [34, 117]
    toe_f: [30, 121]
  hurt:
    crown: [45, 47]
    neck: [50, 62]
    chest: [56, 72]
    hip: [62, 98]
    sh_n: [68, 68]
    el_n: [80, 78]
    hand_n: [90, 75]
    sh_f: [50, 68]
    el_f: [44, 78]
    hand_f: [48, 85]
    hip_n: [70, 100]
    knee_n: [76, 109]
    foot_n: [80, 117]
    toe_n: [84, 121]
    hip_f: [54, 100]
    knee_f: [48, 109]
    foot_f: [45, 117]
    toe_f: [41, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}       # the arms are coat sleeves and ride the torso and head (every move is a rigid lean of
  farm_n: {remove: true}       # the whole upper body, the cutlass included)
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 14.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:                        # every in-between: its source key's upper body leaned rigidly about the hip (each
                               # upper joint rotated about `hip`, rounded to whole px), knees and feet pinned
  atk_wind1:                  # draw back 3.5 deg, the upper body 1 px back
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-2, -1], hand_n: [-2, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-2, 1]}
  atk_wind2:                  # draw back 7 deg, 2 px back, the cutlass cocked
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-9, 0], neck: [-7, 0], chest: [-5, 0], sh_n: [-6, -1], el_n: [-5, -2], hand_n: [-4, -2], sh_f: [-6, 1], el_f: [-5, 2], hand_f: [-4, 1]}
  atk_mid:                    # the lunge key leaned 2 deg on (toward the wind), feet on the attack stance
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [2, 0], neck: [1, 0], chest: [1, 0], sh_n: [1, 0], el_n: [1, 1], hand_n: [1, 1], sh_f: [1, 0], el_f: [1, -1], hand_f: [1, -1]}
  atk_follow:                 # settle: 1 deg on
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [1, 0], neck: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], sh_f: [1, 0], hand_f: [0, -1]}
  atk_recover:                # back to the idle through the draw-back (as wind1)
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-2, -1], hand_n: [-2, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-2, 1]}
  hurt_in1:                   # flinch: the idle thrown back 3 deg
    moves: []
    tweaks: {crown: [-3, 0], neck: [-2, 0], chest: [-1, 0], sh_n: [-2, 0], el_n: [-1, -1], hand_n: [-1, -1], sh_f: [-2, 1], el_f: [-1, 1], hand_f: [-1, 1]}
  hurt_in2:                   # the hurt key 4 deg less thrown back, on the way to the idle
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [4, -1], neck: [3, -1], chest: [2, 0], sh_n: [2, 0], el_n: [1, 1], hand_n: [2, 2], sh_f: [2, -1], el_f: [1, -1], hand_f: [1, -1]}
  daze:                       # slump toward the hurt: the idle 2 deg back
    moves: []
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, -1], hand_n: [0, -1], sh_f: [-1, 0], el_f: [-1, 1], hand_f: [-1, 0]}
  daze_b:                     # the same, the head 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-2, 1], neck: [-1, 1], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, -1], hand_n: [0, -1], sh_f: [-1, 0], el_f: [-1, 1], hand_f: [-1, 0]}
masks: {}
holds: []
paint: []
# pass KT: the approved kneel key (approved/pirate/kneel.png, the user sheet's 4th pose) and the bridge frames
