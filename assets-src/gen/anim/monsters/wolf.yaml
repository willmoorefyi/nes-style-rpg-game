frames:
  atk_wind1:                   # crouch starts: spine tips nose-down (extrapolated away from the leap), head and tail sink
    moves: [back, chest, tail0, tail1, tail2, tail_tip]
    tweaks: {neck: [0, 1], head: [0, 1], snout: [0, 1], tail_tip: [0, 1]}
  atk_wind2:                   # coil: chest and head low, head pulled back, tail down
    dy: 1
    moves: [back, chest, tail0, tail1, tail2, tail_tip]
    tweaks: {neck: [-1, 1], head: [-1, 1], snout: [-1, 1], tail2: [0, 1], tail_tip: [0, 2]}
  atk_mid:                     # the pass: near hind paw pushing off part-way back, far hind shin carried forward, head low
    pins: [foot_n, foot_f, knee_f]
    tweaks: {foot_n: [5, 0], knee_f: [5, 2], foot_f: [7, 2], paw_n: [0, -3], ftoe_n: [0, -3], head: [-2, 2], snout: [-2, 2], neck: [-1, 1]}
  atk_follow:                  # follow-through: spine and tail overshoot the leap (head and forelegs keep the bite)
    t: 1.10
    moves: [back, chest, tail0, tail1, tail2, tail_tip]
  atk_recover:                 # landing: all four paws planted (forepaws on idle, F5), body and shoulders lifted, head kept level
    t: 0.35
    moves: [back, chest, neck, tail0, tail1, tail2, tail_tip, sh_n, sh_f]
    tweaks: {chest: [0, -1], neck: [0, -1], head: [0, -1], snout: [0, -1]}
  hurt_in1:                    # rear starts: spine pitched up, hip toward the hurt hip, forepaws freed; hocks pinned so the haunch stays whole
    t: 0.32
    pins: [foot_n, foot_f, knee_n, knee_f]
    moves: [hip, back, chest, neck, head, snout, tail0, tail1, tail2, tail_tip, sh_n, el_n, paw_n, ftoe_n, sh_f, el_f, paw_f, ftoe_f]
  hurt_in2:                    # the rear pitched back down about the hind hip, hind paws planted, tail kept low
    t: 0.25
    pins: [foot_n, foot_f]
    moves: [back, chest, neck, head, snout, sh_n, el_n, paw_n, ftoe_n, sh_f, el_f, paw_f, ftoe_f, knee_n, knee_f]
  daze:                        # pass F 5a (+ review fix): head and neck hang 3-4 px with the nose dipped, tail lowered;
    t: 0.0                     # the forelegs stay planted, the neck follows the head (no mane notch behind the ears);
                               # review 2: tail tip only 2 px down (was 5), so it keeps a 3 px upturn
    moves: [back, chest, neck, head, snout, tail0, tail1, tail2, tail_tip]
    tweaks: {neck: [1, 1], head: [0, 1], snout: [0, 3], tail1: [0, 1], tail2: [0, 3], tail_tip: [1, 2]}
  daze_b:                      # the sway's low point: back 1 px lower, head 4 px down
    t: 0.0
    moves: [back, chest, neck, head, snout, tail0, tail1, tail2, tail_tip]
    tweaks: {neck: [1, 1], head: [0, 1], snout: [0, 4], tail1: [0, 1], tail2: [0, 3], tail_tip: [1, 2]}
masks:
  neck:                        # body/neck boundary off the withers: the neck warp sampled body pixels (E8 crease)
    idle: [[68, 25], [73, 25], [77, 28], [81, 29], [81, 38], [68, 38]]
  head:                        # the open lower jaw is head, not the far foreleg under it
    attack: [[87, 30], [100, 30], [100, 41], [87, 41]]
