sprite: desert_baretta
body: quadruped
facing: right
sampler: nearest
breath: true
# Sand-coloured armoured ankylosaur (desert_baretta), four-square stance. The club tail swings far between the keys
# (raised behind the shell in idle, lifted overhead in attack, dropped onto the ground in hurt) and stays out of every
# `moves` set: it rides the body, so the swing happens at the keyframe boundaries. The far hind leg hides behind the
# near one (its parts are removed); the far foreleg under the jaw is masked off the head.
keyframes:
  attack:
    back: [62, 72]
    chest: [82, 82]
    el_f: [95, 108]
    el_n: [72, 108]
    foot_f: [46, 112]
    foot_n: [38, 114]
    ftoe_f: [105, 120]
    ftoe_n: [80, 121]
