  - {frame: daze_b, xy: [[94, 72]], rgb: [198, 156, 107]}
  - {frame: daze_b, xy: [[94, 73]], rgb: [181, 148, 99]}
  - {frame: daze_b, xy: [[93, 74], [93, 75]], rgb: [206, 165, 115]}
  - {frame: daze_b, xy: [[94, 74]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[93, 76]], rgb: [115, 82, 66]}
  - {frame: daze, xy: [[96, 69]], rgb: [115, 82, 66]}
  - {frame: daze, xy: [[95, 71]], rgb: [206, 165, 115]}
  - {frame: daze, xy: [[97, 67]], rgb: [132, 90, 74]}
  - {frame: daze_b, xy: [[96, 69]], rgb: [115, 82, 66]}
  - {frame: daze_b, xy: [[95, 71], [94, 74]], rgb: [206, 165, 115]}
  - {frame: daze_b, xy: [[97, 67]], rgb: [132, 90, 74]}
  - {frame: daze_b, xy: [[98, 67]], rgb: [6, 4, 10]}
# pass KT (docs/KNEEL_TWEEN_PLAN.md): the approved AI kneel key (approved/<id>/kneel.png) and the bridge
# frames (kneel_bridge.py)
kneel:
  source: ai
  # check: the in1 -> in2 centroid step 10.1 > 9.6; the head half kept whole and the base band free carry the mass
  bridge: {keep_top: 0.49, keep_bot: 0.0}
