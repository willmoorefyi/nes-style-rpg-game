# Horned Devil (T-K, docs/ROSTER_FIX_PLAN_2.md section 5): a red winged devil with a trident, keyframe-only until now.
# body: biped; every in-between is a translation of its own key (moves: [], the upper body tweaked as one piece,
# knees half, feet and toes pinned), so the strike and the flinch live in the key switch and no part crease appears.
# The wings, horns and tail ride the torso, head and far arm and move with them; the trident head is masked to the
# weapon and the hurt's far wing is its own part (fwing_f), so the cell edges (trident x 81 in idle, wing x 2 in hurt)
# bound the shifts: the trident and the far wing move less than the body where a full shift would touch the border.
# fixmeasure.py switch horned_devil <seq> --rig (2026-11-15; replaces the plan's pre-measure, d attack (-5, 3) /
# hurt (-6, 1), which assumed a whole-figure shift with the feet moving):
#   attack: wind1 (1, -1), wind2 / recover (1, -2), mid / follow (-3, 0); weakest wind2->mid and follow->recover
#           IoU 0.439 / step 4.0 vs need 0.428 / cap 6.0; idle->wind1 0.842, mid->attack 0.689, recover->idle 0.760
#   hurt:   in1 (3, 1) (near hand and trident +1, tip -1), in2 (-2, 2) (far wing -1); in1->in2 IoU 0.419 / step 4.1
#           vs need 0.413 / cap 6.0; idle->in1 0.683, in2->hurt 0.689
#   daze:   the recipe slump as a translation (moves: []); idle->daze 0.824, daze->daze_b 0.881
# Image review (fresh image-only reviewer): SHIP WITH NITS: wind1 is a 1 px lift (the wind can only lean toward
# the attack key's mass, right and up); hurt_in1 jolts 3 px right before the hurt key throws the body left (the
# key switch needs the idle mass moved toward the hurt key's); 2-3 px jumps at the key switches.
