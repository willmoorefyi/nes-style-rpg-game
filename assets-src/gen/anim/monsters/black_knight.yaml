# Black Knight v2 (pass V R293, docs/REDESIGN_PLAN.md 3.1): a horned gunmetal plate knight with a notched two-handed
# greatsword. The keys are far apart (the attack is a downward cut, the hurt a stagger), so every in-between is a
# translation-only copy of its source key (moves: []): the upper body, sword and hips move as one piece, the knees by
# about half and the feet by at most 1 px (2 in atk_mid); the motion lives in the key switch.
# fixmeasure.py switch (no rig): attack need 0.550 cap 6.0 d (5, 0), IoU 0.695; hurt d (0, 1), IoU 0.784.
# Keyframe paint (FW-P, V8 F3, docs/REDESIGN_FIX_PLAN.md): the closed ram curls read as round ears at 1x, so on each
# key the lower curl is erased or inked and each horn sweeps out and up to a 1 px tip (bull horns, the sprite's own
# ash greys and outline ink); the visor is a T-shaped slit (a 6 px bar over a 2 px stem) in the sprite's crimson
# (148, 24, 82) and dark (74, 0, 66). Paint: idle 93 px, attack 85, hurt 75 (cap 100 per key).
