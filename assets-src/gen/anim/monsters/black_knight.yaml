sprite: black_knight
# EF-H batch 2 (docs/ENEMY_FEEDBACK_PLAN.md EF-H): the user-rendered sheet (approved/black_knight/monster_large.png,
# backend: user; 128x128 cells, the idle 94 px tall). The old rig is archived as anim/monsters/_retired/black_knight_v2.yaml.
# The pirate's recipe: the plate torso with the hip at the faulds, the arms and the greatsword ride the torso (arm and
# weapon parts removed), so every in-between is a rigid lean of its source key's upper body about the hip (tweaks
# under `moves: []`: each upper joint rotated about `hip`, rounded to whole px).
body: biped
facing: right
sampler: nearest
breath: true
planted: foot_f
keyframes:
  idle:
    crown: [62, 37]
    neck: [62, 58]
    chest: [60, 68]
    hip: [60, 97]
    sh_n: [70, 64]
    el_n: [75, 72]
    hand_n: [77, 78]
    sh_f: [52, 64]
    el_f: [50, 74]
    hand_f: [62, 80]
    hip_n: [68, 100]
    knee_n: [74, 108]
    foot_n: [75, 117]
    toe_n: [80, 121]
    hip_f: [52, 100]
    knee_f: [44, 109]
    foot_f: [36, 117]
    toe_f: [32, 121]
  attack:
    crown: [66, 39]
    neck: [64, 62]
    chest: [62, 72]
    hip: [58, 96]
    sh_n: [70, 64]
    el_n: [72, 75]
    hand_n: [70, 84]
    sh_f: [54, 64]
    el_f: [54, 76]
    hand_f: [64, 84]
    hip_n: [66, 99]
    knee_n: [72, 108]
    foot_n: [76, 117]
    toe_n: [82, 121]
    hip_f: [50, 99]
    knee_f: [38, 108]
    foot_f: [28, 117]
    toe_f: [24, 121]
  hurt:
    crown: [40, 36]
    neck: [46, 58]
    chest: [52, 70]
    hip: [58, 96]
    sh_n: [60, 62]
    el_n: [66, 66]
    hand_n: [70, 62]
    sh_f: [44, 64]
    el_f: [46, 72]
    hand_f: [62, 66]
    hip_n: [66, 99]
    knee_n: [75, 106]
    foot_n: [75, 117]
    toe_n: [80, 121]
    hip_f: [50, 99]
    knee_f: [42, 108]
    foot_f: [36, 117]
    toe_f: [32, 121]
parts:
  weapon: {remove: true}
  uarm_n: {remove: true}
  farm_n: {remove: true}
  uarm_f: {remove: true}
  farm_f: {remove: true}
  head: {radius: 14.0}
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                  # draw back 5 deg, 1 px back
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-6, 0], neck: [-4, 0], chest: [-4, 0], sh_n: [-4, -1], el_n: [-3, -1], hand_n: [-3, -1], sh_f: [-4, 1], el_f: [-3, 1], hand_f: [-2, 0]}
  atk_wind2:                  # draw back 10 deg, 3 px back, the greatsword cocked
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-13, 1], neck: [-10, 0], chest: [-8, 0], sh_n: [-9, -1], el_n: [-8, -2], hand_n: [-7, -3], sh_f: [-9, 2], el_f: [-7, 2], hand_f: [-6, 0]}
  atk_mid:                  # the cut key leaned 2 deg on
    moves: []
    t: 0.05
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [2, 0], neck: [1, 0], chest: [1, 0], sh_n: [1, 0], el_n: [1, 1], sh_f: [1, 0], el_f: [1, 0]}
  atk_follow:                  # settle: 1 deg on
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [1, 0], neck: [1, 0], sh_n: [1, 0], sh_f: [1, 0]}
  atk_recover:                  # back through the draw-back
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-5, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, -1], el_n: [-3, -1], hand_n: [-2, -1], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-2, 0]}
  hurt_in1:                  # flinch: the idle thrown back 3 deg
    moves: []
    tweaks: {crown: [-3, 0], neck: [-2, 0], chest: [-2, 0], sh_n: [-2, 0], el_n: [-1, -1], hand_n: [-1, -1], sh_f: [-2, 0], el_f: [-1, 1], hand_f: [-1, 0]}
  hurt_in2:                  # the hurt key 4 deg less thrown back
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [4, -1], neck: [3, -1], chest: [2, 0], sh_n: [2, 0], el_n: [2, 1], hand_n: [2, 1], sh_f: [2, -1], el_f: [2, -1], hand_f: [2, 0]}
  daze:                  # slump: the idle 2 deg back
    moves: []
    dy: 0
    tweaks: {crown: [-2, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, -1], hand_n: [-1, -1], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
  daze_b:                  # the same, the helm 1 px lower
    moves: []
    dy: 0
    tweaks: {crown: [-2, 1], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, -1], hand_n: [-1, -1], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0]}
masks: {}
holds: []
paint:                         # 1 px cracks the leans open (seam gaps), inked
  - {frame: daze, xy: [[36, 55]], rgb: [6, 4, 10]}
  - {frame: daze_b, xy: [[36, 55]], rgb: [6, 4, 10]}
  - {frame: atk_wind1, xy: [[80, 98]], rgb: [6, 4, 10]}
  - {frame: atk_wind1, xy: [[62, 99]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[41, 46], [42, 46], [43, 46], [40, 47], [41, 47], [42, 47], [43, 47], [40, 48], [41, 48], [43, 48], [40, 49]], rgb: [6, 4, 10]}
  - {frame: atk_wind2, xy: [[25, 57]], rgb: [6, 4, 10]}
# pass KT: the approved kneel key (approved/black_knight/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
