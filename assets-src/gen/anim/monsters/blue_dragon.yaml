# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H amendment A): the user-rendered sheet (approved/blue_dragon/
# monster_large.png, backend: user, the tall frame: 236x200 cells, feet row 192, the idle 144 rows with the neck
# raised, the attack a 74-row low lunge). The old rig is archived as anim/monsters/_retired/blue_dragon_v1.yaml.
# Translation-first (NEW_MONSTER_GUIDE.md hard sheets: the idle -> attack height swing is too far for rotations):
# every in-between is its source key with the neck and head moved as one group by whole-px tweaks (`moves: []`);
# body, tail and legs stay put, feet pinned; the large swing is bridged by the head dipping in the wind-up and
# rising after the strike (each step under the 200-row cell's centroid cap) and a 6 px body sink (`dy`).
