parts:
  blade_f:                     # the far blade: drawn in idle and attack only (the hurt key drops it); carried behind the ribcage
    kind: prop
    bone: {idle: [hand_f, ftip], attack: [hand_f, ftip], hurt: [hip, fb_h]}
    radius: 2.0
    in: [idle, attack]
    carry_to: fb_h
    carry_mode: behind
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:
  atk_wind1:                   # half of wind2: skull back, blade arm lifting
    moves: [crown, neck]
    tweaks: {crown: [-1, 0], neck: [-1, 0], sh_n: [0, -1], el_n: [0, -2], hand_n: [-1, -2], tip: [-2, -3]}
  atk_wind2:                   # the swing starts toward the strike (the near blade turns ~120 deg between idle and attack,
    t: 0.25                    # so a pull-back cannot meet wind2->mid): blade arm lifted 4 px (translated, under the cap),
    dy: 0                      # skull back; no body drop (the attack key is taller: bbox lerp)
    moves: [crown, neck, chest]
    tweaks: {crown: [-2, 0], neck: [-1, 0], sh_n: [0, -1], el_n: [-1, -3], hand_n: [-2, -4], tip: [-5, -4]}
  atk_mid:                     # skull 2 px back; legs pinned at the attack and shifted toward idle (not rotated)
    t: 0.35
    pins: [knee_n, foot_n, knee_f, foot_f]
    moves: [neck, crown, sh_n]
    tweaks: {knee_f: [1, 0], foot_f: [2, 0], crown: [-2, 0], neck: [-2, 0]}
  atk_follow:                  # a settle: the raised arm keeps its attack angle (rigid; a turn tears it from the skull) and
    moves: [knee_n, knee_f]    # drops 1 px with the skull
    tweaks: {crown: [-2, 1], neck: [-2, 1], sh_n: [-1, 1], el_n: [-1, 1], hand_n: [-1, 1], tip: [-1, 1]}
  atk_recover:                 # t 0.20: the skull sinks less (the attack key is taller, bbox lerp)
    t: 0.20
    moves: [crown, neck, chest, hip, sh_f]
    tweaks: {el_n: [-1, -1], hand_n: [-2, -2], tip: [-3, -1]}
  hurt_in1:                    # flinch: skull snaps back 6, near blade arm jerks up 3, far arm thrown out (translated)
    moves: [chest, hip, hip_n, hip_f, knee_n, knee_f]
    tweaks: {crown: [-6, 0], neck: [-3, 0], chest: [-1, -1], el_n: [0, -3], hand_n: [0, -3], tip: [0, -3], el_f: [-3, -2], hand_f: [-3, -2], ftip: [-3, -2]}
  hurt_in2:                    # skull settles 2 px; the far blade is carried behind the ribcage
    moves: [chest]
    tweaks: {crown: [2, 0], neck: [1, 0]}
  daze:
    moves: [crown, neck, chest]
  daze_b:
    moves: [crown, neck, chest]
