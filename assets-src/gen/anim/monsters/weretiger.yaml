    tweaks: {crown: [-4, -1], neck: [-3, 0], chest: [-1, 0], sh_n: [-1, -1], el_n: [-1, -3], hand_n: [-1, -5], sh_f: [-1, 0], el_f: [-2, -1], hand_f: [-2, -2]}
