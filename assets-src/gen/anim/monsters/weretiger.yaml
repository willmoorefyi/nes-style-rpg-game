    dy: 3
    moves: [crown, neck, chest, hip]
    tweaks: {sh_n: [-2, -1], el_n: [-5, -4], hand_n: [-7, -6]}
  atk_mid:                     # attack arms kept; legs shifted ~1/3 back toward idle, not rotated
    pins: [knee_n, foot_n, knee_f, foot_f, toe_n, toe_f]
    tweaks: {knee_f: [3, 0], foot_f: [3, 0], toe_f: [3, 0]}
    moves: [chest, hip, hip_n, knee_n, foot_n, hip_f, knee_f, foot_f, toe_n, toe_f]
