frames:
  atk_wind1:                  # the three heads and necks draw back 4 and lift 1 as one group
    moves: []
    dy: 0
    tweaks: {neck: [-4, -1], head: [-4, -1], snout: [-4, -1], neck2: [-4, -1], head2: [-4, -1], snout2: [-4, -1], neck3: [-4, -1], head3: [-4, -1], snout3: [-4, -1]}
  atk_wind2:                  # back 7, down 1 (the strike key cocked)
    moves: []
    dy: 0
    tweaks: {neck: [-7, 1], head: [-7, 1], snout: [-7, 1], neck2: [-7, 1], head2: [-7, 1], snout2: [-7, 1], neck3: [-7, 1], head3: [-7, 1], snout3: [-7, 1]}
  atk_mid:                  # the strike key, the heads 3 short of it
    moves: []
    dy: 0
    t: 0.0
    tweaks: {neck: [-3, 0], head: [-3, 0], snout: [-3, 0], neck2: [-3, 0], head2: [-3, 0], snout2: [-3, 0], neck3: [-3, 0], head3: [-3, 0], snout3: [-3, 0]}
  atk_follow:                  # the strike key, 1 past
    moves: []
    dy: 0
    tweaks: {neck: [1, 0], head: [1, 0], snout: [1, 0], neck2: [1, 0], head2: [1, 0], snout2: [1, 0], neck3: [1, 0], head3: [1, 0], snout3: [1, 0]}
  atk_recover:                  # the idle, the heads 2 back (as wind1)
    moves: []
    dy: 0
    tweaks: {neck: [-2, 0], head: [-2, 0], snout: [-2, 0], neck2: [-2, 0], head2: [-2, 0], snout2: [-2, 0], neck3: [-2, 0], head3: [-2, 0], snout3: [-2, 0]}
  hurt_in1:                  # flinch: the idle's heads 3 back, 2 up
    moves: []
    dy: 0
    tweaks: {neck: [-3, -2], head: [-3, -2], snout: [-3, -2], neck2: [-3, -2], head2: [-3, -2], snout2: [-3, -2], neck3: [-3, -2], head3: [-3, -2], snout3: [-3, -2]}
  hurt_in2:                  # the hurt key, the heads 3 forward and 2 down on the way back
    moves: []
    dy: 0
    tweaks: {neck: [3, 2], head: [3, 2], snout: [3, 2], neck2: [3, 2], head2: [3, 2], snout2: [3, 2], neck3: [3, 2], head3: [3, 2], snout3: [3, 2]}
  daze:                  # slump: the recipe drops the heads (x3 at the 200-row cell); 2 back up keeps them in the large tier
    moves: []
    dy: 0
    tweaks: {neck: [0, -2], head: [0, -2], snout: [0, -2], neck2: [0, -2], head2: [0, -2], snout2: [0, -2], neck3: [0, -2], head3: [0, -2], snout3: [0, -2]}
  daze_b:                  # 1 lower than daze
    moves: []
    dy: 0
    tweaks: {neck: [0, -1], head: [0, -1], snout: [0, -1], neck2: [0, -1], head2: [0, -1], snout2: [0, -1], neck3: [0, -1], head3: [0, -1], snout3: [0, -1]}
