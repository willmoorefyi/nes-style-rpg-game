sprite: fire_hydra
# EF-H batch 2 (docs/ENEMY_FEEDBACK_PLAN.md EF-H amendment A): the user-rendered sheet (approved/fire_hydra/
# monster_large.png, backend: user, the tall frame: 224x200 cells, feet row 192, the idle 120 rows). The old rig
# is archived as anim/monsters/_retired/fire_hydra_v1.yaml. A three-head multi-head quadruped (FW-5: neck<i> ->
# head<i> -> snout<i>, i = 2, 3; head 1 = the low right head, the lead). Translation-first (NEW_MONSTER_GUIDE.md:
# intertwined necks tear when they turn): every in-between is its source key with the three heads and necks moved
# as one group by whole-px tweaks (`moves: []`); body, tail and legs stay put.
