frames:
  # disguise: settles 1 px, head 2 back, sceptre arm drawn 2 back
  atk_wind1:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 1
    tweaks: {crown: [-2, 0], neck: [-2, 0], sh_n: [-2, 0], el_n: [-2, 0], hand_n: [-2, 0], tip: [-2, 0], sb: [-2, 0]}
  # disguise: coiled 2 px lower, head 3 back, sceptre arm 4 back and 1 up
  atk_wind2:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 2
    tweaks: {crown: [-3, 0], neck: [-3, 0], sh_n: [-4, -1], el_n: [-4, -1], hand_n: [-4, -1], tip: [-4, -1], sb: [-4, -1]}
  # the reveal (wind2 -> mid): attack pose 2 px low, tentacles 4 px still inside the robe
  atk_mid:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 2
    tweaks: {crown: [-1, 0], neck: [-1, 0], ta_0: [-4, 0], ta_1: [-4, 0]}
    t: 0.1
  # settle: tentacles slide 3 px back under the robe, body 1 px down
  atk_follow:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 1
    tweaks: {crown: [1, 0], neck: [1, 0], ta_0: [-3, 0], ta_1: [-3, 0]}
  # disguise restored, still leaning in
  atk_recover:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 1
    tweaks: {crown: [1, 0], neck: [1, 0]}
  # disguise flinch: body 2 down, head back 4, sceptre arm up 3
  hurt_in1:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 2
    tweaks: {crown: [-4, 1], neck: [-4, 1], sh_n: [0, -3], el_n: [0, -3], hand_n: [0, -3], tip: [0, -3], sb: [0, -3]}
  # tentacles erupt: hurt pose 1 px toward idle (a 2 px shift jogs the sash at the hem line; a drop closes a 224 px hole)
  hurt_in2:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [1, 0], hip: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], tip: [1, 0], sb: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0], hip_n: [1, 0], hip_f: [1, 0], th_0: [1, 0], th_1: [1, 0]}
  # disguise: bows, sceptre lifts
  cast_gather:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 2
    tweaks: {crown: [1, 1], sh_n: [0, -2], el_n: [0, -2], hand_n: [0, -2], tip: [0, -2], sb: [0, -2]}
  # tentacles still drawing out of the robe
  cast_rise:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 2
    tweaks: {tl_0: [4, 2], tl_1: [4, 2], tr_0: [-3, 1], tr_1: [-3, 1], hand_n: [0, 1], tip: [0, 1], sb: [0, 1]}
  # release: sceptre fist 2 px higher (recipe), tentacles held
  cast_release:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {tip: [0, -2], sb: [0, -2]}
  daze:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
  daze_b:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
  # the heavy swing begins: head bows 2, tentacle mass 3 px down
  atk_swing:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 2
    tweaks: {crown: [0, 2], neck: [0, 2], tm_0: [0, 3], tm_1: [0, 3]}
  # heavy mid: tentacles 4 px still inside the robe
  atk_swing2:
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    dy: 2
    tweaks: {crown: [1, 0], neck: [1, 0], ta_0: [-4, 0], ta_1: [-4, 0]}
    t: 0.0
