parts:
  head: {radius: 9.0}
  torso: {radius: 7.0}
  altar: {bone: [c_n, alt], radius: 4.0}                       # the altar is part of the body: static on the coil
  # the sun disc is in the upper far hand except in the attack (upper near hand): own joint names per hand, so no
  # frame interpolates it across the body
  orb: {bone: {idle: [hand_f, orb], attack: [hand_n, orb_a], cast: [hand_f, orb], hurt: [hand_f, orb]}, radius: 3.0}
  # censer, chain and smoke ride the lowest near hand (the attack draws only the cup)
  censer: {bone: {idle: [hand_n3, cen], attack: [hand_n3, cen_a], cast: [hand_n3, cen], hurt: [hand_n3, cen]}, radius: 3.0}
  # the hurt key's pale streak under the censer (approved nit): its own part riding the hand unturned (turning with the
  # censer it came loose)
  streak: {bone: {hurt: [hand_n3, stk]}, radius: 1.0, in: [hurt]}
frames:
  # The head rides the chest in every cut but the hurt flinch (it is not in `moves`, so it keeps its source angle):
  # turning it opened the crown rays' contacts with the shoulders (seams, enclosed holes).
  # wind-up: the near set draws back with the torso, the open hand and the blade follow at half t; the orb arm only
  # rides the chest, shifted left with the lean (turning it closed the gap to the crown rays); the free tail curls back
  atk_wind1:
    half: [f2, f3]
    moves: &wind [chest, hip, s1, sh_n, el_n, hand_n, sh_n2, el_n2, hand_n2, sh_n3, el_n3, hand_n3, sh_f2, el_f2, hand_f2,
                  sh_f3, el_f3, hand_f3, tip, tail1, tail2, tail_tip]
    tweaks: {tail2: [-1, 1], tail_tip: [-2, 2], el_f: [-1, 0], hand_f: [-1, 0], orb: [-1, 0]}
  atk_wind2:
    half: [f2, f3]
    moves: *wind
    tweaks: {tail2: [-2, 1], tail_tip: [-4, 3], el_f: [-2, 0], hand_f: [-2, 0], orb: [-2, 0]}
  atk_mid:                     # the arms and the serpent body toward the wind-up; the torso and head keep the attack lean
    moves: [s1, hip, sh_n, el_n, hand_n, sh_f, el_f, hand_f, sh_n2, el_n2, hand_n2, sh_f2, el_f2, hand_f2,
            sh_n3, el_n3, hand_n3, sh_f3, el_f3, hand_f3, tip, tail1, tail2, tail_tip]
    tweaks: {tail_tip: [-2, 1]}
  # the tail lashes out after the strike, then settles
  atk_follow:
    moves: &follow [chest, hip, s1, sh_n, el_n, hand_n, sh_n2, el_n2, hand_n2, sh_n3, el_n3, hand_n3, sh_f, el_f, hand_f,
                    sh_f2, el_f2, hand_f2, sh_f3, el_f3, hand_f3, tip, tail1, tail2, tail_tip]
    tweaks: {tail2: [2, -2], tail_tip: [5, -5]}
  atk_recover:
    moves: *follow
    tweaks: {tail_tip: [2, -2]}
  hurt_in1:                    # the flinch: every arm at full t, the orb arm kept clear of the tilting crown; the
    half: []                   # free tail starts its lash (12g: rises toward the hurt lash; more closes an 1800 px
                               # loop with the censer smoke)
    tweaks: {el_f: [-5, 0], hand_f: [-5, 0], orb: [-5, 0], tail1: [1, -2], tail2: [2, -6], tail_tip: [3, -10]}
  hurt_in2:                    # the censer keeps its swing (moving it back toward idle closed a 2000 px loop between
                               # body, smoke and tail); 12g: the tail lash lowered toward the hurt_in1 tail (translated
                               # down, not swung back), so its centroid steps 4.0 px hurt_in1->hurt_in2 (body 2.6)
    half: []
    tweaks: {tail1: [-1, 3], tail2: [-2, 8], tail_tip: [-4, 14]}
    moves: [s1, hip, chest, neck, crown, sh_n, el_n, hand_n, sh_f, el_f, hand_f, orb, sh_n2, el_n2, hand_n2, sh_f2,
            el_f2, hand_f2, sh_n3, el_n3, hand_n3, sh_f3, el_f3, hand_f3, tip]
  daze:                        # the shared slump, the crown only drooping 1 px against the lowered body
    tweaks: {crown: [-2, -2], neck: [-3, -3]}
  daze_b:
    tweaks: {crown: [-2, -2], neck: [-3, -3]}
  # cast: the six hands gather toward the body, the raised pair lifts, then all are flung up and out
  cast_gather:
    moves: &cast [chest, hip, s1, sh_n, el_n, hand_n, sh_f, el_f, hand_f, sh_n2, el_n2, hand_n2, sh_f2, el_f2, hand_f2,
                  sh_n3, el_n3, hand_n3, sh_f3, el_f3, hand_f3, tail1, tail2, tail_tip]
    tweaks: {hand_f: [0, 2], orb: [0, 2], hand_n: [-2, 2], hand_n2: [-3, 1], hand_f2: [3, 1],
             hand_n3: [-2, 0], cen: [-2, 0], hand_f3: [2, 0], tip: [2, 0]}
  cast_rise:
    moves: *cast
    tweaks: {el_f: [0, -1], hand_f: [0, -3], orb: [0, -3], el_n: [0, -1], hand_n: [0, -3]}
  cast_release:
    tweaks: {orb: [0, -2], hand_n2: [3, -2], hand_f2: [-3, -2], el_n2: [1, -1], el_f2: [-1, -1]}
