parts:
  weapon: {remove: true}
  head: {radius: 13.0}
  staff_r:                     # the staff on the near side (idle, hurt)
    kind: prop
    bone: {idle: [s_top, s_bot], hurt: [s_top, s_bot]}
    radius: 3.0
    in: [idle, hurt]
  staff_l:                     # the staff in the far hand (attack): the hands swap at the wind2 -> mid step
    kind: prop
    bone: {attack: [s_top, s_bot]}
    radius: 3.0
    in: [attack]
  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:                        # rigid leans and translations, written as tweaks (moves []); the robe is torso, the hip sits at its hem
  atk_wind1:                   # draw back: the upper body (staff included) 1 back
    moves: []
    t: -0.05
    dy: 0
    tweaks: {crown: [-1, 0], neck: [-1, 0], chest: [-1, 0], sh_n: [-1, 0], el_n: [-1, 0], hand_n: [-1, 0], sh_f: [-1, 0], el_f: [-1, 0], hand_f: [-1, 0], s_top: [-1, 0], s_bot: [-1, 0]}
  atk_wind2:                   # coil: the upper body (staff included) 3 back toward the lunge side, the staff foot stays (the staff tilts)
    moves: []
    t: -0.1
    dy: 0
    tweaks: {crown: [-3, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-3, 0], hand_n: [-3, 0], sh_f: [-3, 0], el_f: [-3, 0], hand_f: [-3, 0], s_top: [-3, 0]}
  atk_mid:                     # the lunge lands: the attack upper body 3 lower (it drops into the lunge); the back leg and the staff foot 5, the lifted front foot 2 / 4 toward the idle stance
    moves: []
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [0, 3], neck: [0, 3], chest: [0, 3], sh_n: [0, 3], el_n: [0, 3], hand_n: [0, 3], sh_f: [0, 3], el_f: [0, 3], hand_f: [0, 3], s_top: [0, 3], s_bot: [5, 3], hip_f: [3, 0], knee_f: [5, 0], foot_f: [5, 0], knee_n: [2, 4], foot_n: [2, 4]}
  atk_follow:                  # settle: the attack upper body 2 lower
    moves: []
    t: 0.8
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [0, 2], neck: [0, 2], chest: [0, 2], sh_n: [0, 2], el_n: [0, 2], hand_n: [0, 2], sh_f: [0, 2], el_f: [0, 2], hand_f: [0, 2], s_top: [0, 2], s_bot: [0, 2], knee_f: [1, 0], foot_f: [1, 0], knee_n: [2, 4], foot_n: [2, 4]}
  atk_recover:                 # lean back 2 and 1 back, still on the lunge side
    moves: []
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-3, 0], sh_n: [-3, -1], el_n: [-3, -1], hand_n: [-3, -1], sh_f: [-3, 1], el_f: [-3, 1], hand_f: [-2, 1], s_top: [-4, -1], s_bot: [-1, -1]}
  hurt_in1:                    # recoil: lean back 8, head 2 further back
    moves: []
    tweaks: {crown: [-16, 1], neck: [-12, 0], chest: [-8, 1], sh_n: [-10, -2], el_n: [-8, -3], hand_n: [-8, -4], sh_f: [-10, 3], el_f: [-8, 4], hand_f: [-5, 3], s_top: [-14, -4], s_bot: [0, -4]}
  hurt_in2:                    # the hurt pose leaned in 8 and 2 forward
    moves: []
    tweaks: {crown: [13, -3], neck: [11, -1], chest: [8, 0], sh_n: [10, 1], el_n: [12, 1], hand_n: [13, 1], sh_f: [9, -1], el_f: [9, 2], hand_f: [8, 5], s_top: [13, 5], s_bot: [0, 4]}
  daze:                        # slump: the body 1 forward and 1 lower and the head 2 lower (the staff stays planted)
    moves: []
    dy: 0
    tweaks: {crown: [-1, 0], neck: [-1, 0], chest: [1, 1], sh_n: [1, 1], el_n: [1, 1], hand_n: [1, 1], sh_f: [1, 1], el_f: [1, 1], hand_f: [1, 1]}
  daze_b:                      
    moves: []
    dy: 0
    tweaks: {crown: [-1, 1], neck: [-1, 1], chest: [1, 2], sh_n: [1, 2], el_n: [1, 2], hand_n: [1, 2], sh_f: [1, 2], el_f: [1, 2], hand_f: [1, 2]}
