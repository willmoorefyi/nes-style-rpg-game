  atk_recover: {moves: [body, head, fang, abd, abd_end], pins: [tip1_n, tip1_f, tip2_n, tip2_f, tip3_n, tip3_f, tip4_n, tip4_f, knee1_n, knee1_f, knee2_n, knee2_f, knee3_n, knee3_f, knee4_n, knee4_f], t: 0.0, tweaks: {abd: [-2, 0], abd_end: [-2, 0], body: [-2, 0], coxa1_n: [-2, 0], fang: [-2, 0], head: [-2, 0], knee1_n: [-2, 0], tip1_n: [-2, 0]}}
