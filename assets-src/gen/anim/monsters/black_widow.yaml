sprite: black_widow
body: arthropod
facing: right
sampler: nearest
breath: true
alias: [hurt]
# A black widow: the round abdomen with the red hourglass at the back, the small cephalothorax and red eyes in front,
# the front leg (leg1_n) raised in idle and attack, seven drawn legs (leg4_f undrawn; every tip is still pinned, so
# the feet check stays out of its rearing mode). The approved attack is a pounce drawn about 10 px higher with the legs
# lifted. In-betweens: the upper body (body, head, fang, abd, abd_end) translates by tweaks with every knee and tip
# pinned; the raised front leg (coxa1_n, knee1_n, tip1_n) translates with the body in the idle-sourced frames.
# winds dx -1 / -2 (t 0), atk_mid t 0.25 toward wind2 + (3, 3), atk_follow a settle t 0.75 + (2, 2), atk_recover
# dx -2 (t 0); daze / daze_b dx -1 / -2 over the recipe's 1 / 2 px sink. Hurt is a rear-up (guide 2.2, plan 5: no
# translation within the cap): FW-Q alias [hurt].
# fixmeasure.py switch --rig (IoU / step vs need / cap): attack idle->wind1 0.918 / 0.6, wind1->wind2 0.910 / 0.8,
# wind2->mid 0.492 / 5.5 vs 0.435 / 6.0 (weakest), mid->attack 0.740 / 4.8, attack->follow 0.784 / 3.6,
# follow->recover 0.493 / 5.3, recover->idle 0.879 / 0.7; daze idle->daze 0.909 / 0.6, daze->daze_b 0.908 / 0.8
# vs 0.299 / 7.9; hurt aliased (no generated pairs).
keyframes:
  idle:   {body: [62, 56], head: [70, 55], fang: [66, 63], abd: [52, 50], abd_end: [28, 40],
           coxa1_n: [70, 50], knee1_n: [80, 37], tip1_n: [89, 49],
           coxa2_n: [72, 54], knee2_n: [80, 50], tip2_n: [89, 76],
           coxa1_f: [68, 60], knee1_f: [74, 60], tip1_f: [79, 76],
           coxa2_f: [62, 62], knee2_f: [66, 66], tip2_f: [70, 76],
           coxa3_n: [42, 58], knee3_n: [36, 66], tip3_n: [33, 76],
           coxa3_f: [36, 56], knee3_f: [28, 62], tip3_f: [22, 76],
