  attack: {body: [58, 46], head: [66, 46], fang: [63, 55], abd: [47, 43], abd_end: [22, 30],
           coxa1_n: [66, 42], knee1_n: [78, 35], tip1_n: [97, 48],
           coxa2_n: [68, 48], knee2_n: [78, 50], tip2_n: [89, 69],
           coxa1_f: [56, 52], knee1_f: [64, 64], tip1_f: [76, 76],
           coxa2_f: [46, 52], knee2_f: [43, 60], tip2_f: [41, 67],
           coxa3_n: [36, 50], knee3_n: [30, 60], tip3_n: [26, 72],
           coxa3_f: [30, 46], knee3_f: [22, 57], tip3_f: [16, 69],
           coxa4_n: [24, 42], knee4_n: [12, 52], tip4_n: [3, 69]}
  hurt:   {body: [52, 40], head: [57, 38], fang: [54, 48], abd: [44, 33], abd_end: [18, 15],
           coxa1_n: [58, 30], knee1_n: [65, 12], tip1_n: [85, 18],
           coxa2_n: [60, 48], knee2_n: [75, 52], tip2_n: [74, 72],
           coxa1_f: [55, 50], knee1_f: [62, 62], tip1_f: [65, 75],
           coxa2_f: [48, 50], knee2_f: [45, 62], tip2_f: [58, 76],
           coxa3_n: [40, 50], knee3_n: [28, 56], tip3_n: [29, 76],
           coxa3_f: [38, 48], knee3_f: [22, 52], tip3_f: [20, 72],
           coxa4_n: [36, 46], knee4_n: [16, 58], tip4_n: [17, 70]}
parts:
