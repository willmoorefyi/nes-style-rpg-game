  ft_n: {bone: [foot_n, toe_n], radius: 4.0}
  ft_f: {bone: [foot_f, toe_f], radius: 4.0}
frames:                        # rigid leans about the hip (marked at the loincloth hem) and translations, written as tweaks (moves [])
  atk_wind1:                   # lean back 3, the axe arm drawn 4 back (a sweep, not a chop), body 2 lower
    moves: []
    t: 0.0
    dy: 2
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-2, 0], sh_n: [-7, -1], el_n: [-7, -1], hand_n: [-7, -1], tip: [-7, -2], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-1, 0]}
  atk_wind2:                   # coil: lean back 3, the axe arm drawn 6 back and 2 down, crouched 6 lower
    moves: []
    t: 0.0
    dy: 6
    tweaks: {crown: [-4, 0], neck: [-3, 0], chest: [-2, 0], sh_n: [-9, 1], el_n: [-9, 1], hand_n: [-9, 1], tip: [-9, 0], sh_f: [-3, 1], el_f: [-2, 1], hand_f: [-1, 0]}
  atk_mid:                     # the sweep comes in: the attack upper body leaned back 6 about the axe hand and 3 higher, the axe stays down (the boot behind it has no pixels); the back leg 8 in
    moves: []
    dy: -3
    pins: [knee_n, foot_n, knee_f, foot_f]
    sampler: rotsprite
    tweaks: {crown: [-7, 1], neck: [-5, 1], chest: [-4, 2], sh_n: [-5, 0], el_n: [-2, 0], sh_f: [-6, 3], el_f: [-3, 3], hand_f: [0, 1], knee_f: [8, 0], foot_f: [8, 0], knee_n: [1, 0], foot_n: [1, 0], hand_n: [0, 3], tip: [0, 3]}
  atk_follow:                  # settle: the attack upper body 3 back about the axe hand and 3 higher, the axe stays down
    moves: []
    t: 0.8
    dy: -3
    pins: [knee_n, foot_n, knee_f, foot_f]
    tweaks: {crown: [-3, 0], neck: [-2, 0], chest: [-2, 1], sh_n: [-2, 0], el_n: [-1, 0], sh_f: [-3, 2], el_f: [-2, 1], hand_n: [0, 3], tip: [0, 3]}
  atk_recover:                 # upper body and axe 2 forward and 7 lower (translated, still crouched from the sweep), the axe arm 4 lower
    moves: []
    dy: 7
    tweaks: {crown: [2, 0], neck: [2, 0], chest: [2, 0], sh_n: [2, 0], el_n: [2, 4], hand_n: [2, 4], tip: [2, 4], sh_f: [2, 0], el_f: [2, 0], hand_f: [2, 0]}
  hurt_in1:                    # recoil: upper body 3 back (translated), head 2 more, the axe arm 3 up
    moves: []
    tweaks: {crown: [-5, 0], neck: [-5, 0], chest: [-3, 0], sh_n: [-3, 0], el_n: [-3, -3], hand_n: [-3, -3], tip: [-3, -3], sh_f: [-3, 0], el_f: [-3, 0], hand_f: [-3, 0]}
  hurt_in2:                    # the hurt pose 4 back toward idle (translated)
    moves: []
    tweaks: {crown: [-4, 0], neck: [-4, 0], chest: [-4, 0], sh_n: [-4, 0], el_n: [-4, 0], hand_n: [-4, 0], tip: [-4, 0], sh_f: [-4, 0], el_f: [-4, 0], hand_f: [-4, 0]}
  daze:                        # slump: the upper body 1 forward and 1 lower (translated), the head 1 more
    moves: []
    dy: 1
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], tip: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
  daze_b:                      
    moves: []
    dy: 2
    tweaks: {crown: [0, -1], neck: [0, -1], chest: [1, 0], sh_n: [1, 0], el_n: [1, 0], hand_n: [1, 0], tip: [1, 0], sh_f: [1, 0], el_f: [1, 0], hand_f: [1, 0]}
masks:
  shin_f:                      # the fur cuffs and boots ride the planted legs (else a cuff tears when the body lifts or sinks)
    idle: [[27, 94], [51, 94], [51, 113], [27, 113]]
