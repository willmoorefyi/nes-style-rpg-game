    dy: 3
    tweaks: {hip: [-3, 0], chest: [-3, 0], neck: [-3, 0], crown: [-3, 0], sh_n: [-3, 0], el_n: [-3, 0], hand_n: [-3, 0], tip: [-3, 0], sh_f: [-3, 0], el_f: [-3, 0], hand_f: [-3, 0]}
