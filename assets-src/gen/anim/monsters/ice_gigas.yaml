    moves: []
    t: 0.15
    dy: 8
    tweaks: {hip: [-5, 0], chest: [-5, 0], neck: [-5, 0], crown: [-5, 0], sh_n: [-5, 0], el_n: [-5, 0], hand_n: [-5, 0], tip: [-5, 0], sh_f: [-5, 0], el_f: [-5, 0], hand_f: [-5, 0]}
