sprite: white_dragon
body: quadruped
facing: right
sampler: nearest
breath: true
# Sleek white frost dragon: the dragon / dragon_zombie winged recipe. The folded-up idle wings (near and far) are one
# rigid part (wing_i) on the withers; the raised attack wings and the flung-up hurt wings sit on their own root joints
# (wr_n / wr_f), so idle-sourced frames keep the idle wings and attack- / hurt-sourced frames keep theirs. The curled
# tail is hidden behind the haunch in the hurt key, so its part exists only in idle and attack. In the attack the near
# forepaw is lifted and the far one reaches forward to the ground, so atk_mid plants the hind feet and the far forepaw.
# No breath fx: the approved attack draws none (no fx part, no allowlist edit).
