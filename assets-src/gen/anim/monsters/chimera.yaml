sprite: chimera
body: quadruped
facing: right
sampler: nearest
breath: true
# Chimera (pass R batch D, quadruped, three heads): a tawny lion body with the maned lion head in front (the template's
# `head`, it leads), a grey goat head on the back (h2), a green dragon head above the shoulders (h3), two bat wings
# (one rigid part on its own root, wr -> wt) and a green snake tail. The approved attack and hurt keys draw a second
# dragon head (h4, a recorded fix-pass nit, ROSTER_LOG R250): its part exists only in those keys, so it appears at the
# idle -> attack / hurt key switch and never mid-way. The stacked heads hang from pixel-less anchors on the withers and
# move by translation only (the rhyos recipe); the tail stays out of every move set. No breath fx.
