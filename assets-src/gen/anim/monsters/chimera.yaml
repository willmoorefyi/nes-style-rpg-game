frames:
  atk_wind1:                  # the three heads and necks draw back 4 and lift 1 as one group
    moves: []
    t: 0.0
    dy: 0
    tweaks: {neck: [-4, -1], head: [-4, -1], snout: [-4, -1], neck2: [-4, -1], head2: [-4, -1], snout2: [-4, -1], neck3: [-4, -1], head3: [-4, -1], snout3: [-4, -1]}
  atk_wind2:                  # back 7, up 1 (the strike key cocked; the lion's neck root 5 back: the rotation cap)
    moves: []
    t: 0.0
    dy: 0
    tweaks: {neck: [-5, 0], head: [-7, -1], snout: [-7, -1], neck2: [-7, -1], head2: [-7, -1], snout2: [-7, -1], neck3: [-7, -1], head3: [-7, -1], snout3: [-7, -1]}
  atk_mid:                  # the strike key, the heads 3 short of it
    moves: []
    t: 0.0
    dy: 0
    tweaks: {neck: [-3, 0], head: [-3, 0], snout: [-3, 0], neck2: [-3, 0], head2: [-3, 0], snout2: [-3, 0], neck3: [-3, 0], head3: [-3, 0], snout3: [-3, 0]}
  atk_follow:                  # the strike key, 1 past
    moves: []
    dy: 0
    tweaks: {neck: [1, 0], head: [1, 0], snout: [1, 0], neck2: [1, 0], head2: [1, 0], snout2: [1, 0], neck3: [1, 0], head3: [1, 0], snout3: [1, 0]}
  atk_recover:                  # the idle, the heads 2 back (as wind1)
    moves: []
    dy: 0
    tweaks: {neck: [-2, 0], head: [-2, 0], snout: [-2, 0], neck2: [-2, 0], head2: [-2, 0], snout2: [-2, 0], neck3: [-2, 0], head3: [-2, 0], snout3: [-2, 0]}
  hurt_in1:                  # flinch: the idle's heads 11 back, 5 up as one (the lion's neck root 4 back, 2 up: the rotation cap)
    moves: []
    dy: 0
    tweaks: {neck: [-4, -2], head: [-11, -5], snout: [-11, -5], neck2: [-11, -5], head2: [-11, -5], snout2: [-11, -5], neck3: [-11, -5], head3: [-11, -5], snout3: [-11, -5]}
  hurt_in2:                  # the hurt key, the heads 9 forward and 4 down on the way back (the neck root 3, 1)
    moves: []
    dy: 0
    tweaks: {neck: [3, 1], head: [9, 4], snout: [9, 4], neck2: [9, 4], head2: [9, 4], snout2: [9, 4], neck3: [9, 4], head3: [9, 4], snout3: [9, 4]}
  daze:                  # sleep / stun (a fallback only: the sheet has kneel cells): the recipe's +3 / +3 on every head and snout is cancelled, so the idle stands (a head moved against its neck closed the gap under the dragon's jaw)
    t: 0.0
    moves: []
    dy: 0
    tweaks: {neck: [0, 1], head: [-3, -2], snout: [-3, -2], neck2: [0, 1], head2: [-3, -2], snout2: [-3, -2], neck3: [0, 1], head3: [-3, -2], snout3: [-3, -2]}
  daze_b:                  # the three heads and necks 2 lower
    t: 0.0
    moves: []
    dy: 0
    tweaks: {neck: [0, 2], head: [-3, -1], snout: [-3, -1], neck2: [0, 2], head2: [-3, -1], snout2: [-3, -1], neck3: [0, 2], head3: [-3, -1], snout3: [-3, -1]}
holds: []
