sprite: chimera
# EF-H batch 3 (docs/ENEMY_FEEDBACK_PLAN.md EF-H amendment A): the user-rendered sheet (approved/chimera/
# monster_large.png, backend: user, the tall frame: 208x200 cells, feet row 192, the idle 122 rows), with exactly three
# heads in every pose, so no FW-Q alias any more. The old rig is archived as anim/monsters/_retired/chimera_v1.yaml.
# A three-head quadruped (FW-5: neck<i> -> head<i> -> snout<i>; head 1 = the maned lion head, the lead; head 2 = the
# grey goat on the back; head 3 = the green dragon above the shoulders). Translation-first (NEW_MONSTER_GUIDE.md hard
# sheets, fire_hydra's recipe): every in-between is its source key with the three heads and necks moved as one group
# by whole-px tweaks (`moves: []`); body, wings, snake tail and legs stay put.
