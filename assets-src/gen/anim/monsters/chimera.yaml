# pass KT: the approved kneel key (approved/chimera/kneel.png, the user sheet's 4th pose) and the bridge frames
kneel:
  source: ai
  bridge: {keep_top: 0.4, keep_bot: 0.3, shear: false}   # the heads and the feet kept row for row, no lean: the default squash and the row shear closed the gap between the goat's and the dragon's necks into a hole in kneel_in1
