# Fire Elemental (pass R, floating): a living pillar of flame with a molten core and a fierce face. body: floating
# (rig_floating.py), judged by the float band. The pillar is `body`, the face and its flame crest the `head`, the
# two flame arms `uarm_* / farm_*`.
sprite: fire_elemental
body: floating
facing: right
sampler: nearest
breath: true
keyframes:
  idle:   {core: [64, 70], base: [64, 118], neck: [70, 52], crown: [68, 18],
           sh_n: [82, 52], el_n: [88, 72], hand_n: [86, 88], sh_f: [50, 52], el_f: [42, 72], hand_f: [44, 90]}
  attack: {core: [62, 75], base: [45, 118], neck: [72, 60], crown: [72, 26],
           sh_n: [78, 62], el_n: [95, 68], hand_n: [110, 66], sh_f: [50, 55], el_f: [32, 58], hand_f: [18, 60]}
  hurt:   {core: [68, 75], base: [64, 118], neck: [74, 60], crown: [76, 28],
           sh_n: [84, 58], el_n: [100, 50], hand_n: [110, 42], sh_f: [52, 55], el_f: [38, 42], hand_f: [28, 32]}
parts:
  uarm_n: {radius: 6.0}
  farm_n: {radius: 7.0}
  uarm_f: {radius: 6.0}
  farm_f: {radius: 7.0}
masks:                          # the face and crest only; the flame arms stay off the head
  head:
    idle: [[56, 10], [88, 10], [88, 56], [56, 56]]
    attack: [[54, 18], [92, 18], [92, 63], [54, 63]]
    hurt: [[54, 18], [90, 18], [90, 63], [54, 63]]
# Without arm joints no in-between could bridge idle -> attack (IoU 0.53 < 0.54 at best, translation included): the
# flame arms swinging out are what the two keys don't share. The arm swings cap the t values (forearm 30 deg).
frames:
  atk_wind1: {t: -0.12, moves: [crown, neck]}   # drifts back and sinks, the face draws back; the arms ride (turned
  atk_wind2: {t: -0.25, moves: [crown, neck]}   # away from the attack they sliced the fists with outline cracks)
  atk_mid: {t: 0.20}            # 50 deg at 0.35
  atk_follow: {t: 1.0}          # holds the reach (the overshoot left recover at 0.54 < 0.54)
  atk_recover: {t: 0.25}
  hurt_in1: {moves: [crown, neck], dy: 1}         # the face snaps back; the arms (110-150 deg from the raised
  hurt_in2: {moves: [crown, neck], dx: -1, dy: -1}   # hurt arms) change at the keyframe boundary
  daze: {moves: [crown, neck]}  # the face droops, the flames sink
  daze_b: {moves: [crown, neck]}
holds: []
paint:                          # cracks where the dropped face meets the left flame tongue, the far upper arm's joint
  - {frame: daze, xy: [[53, 49], [54, 50], [55, 51], [55, 52], [55, 53], [56, 53], [56, 54], [56, 55], [56, 56], [56, 57]], rgb: [247, 107, 24]}
  - {frame: daze, xy: [[53, 42], [55, 42], [56, 44], [57, 45]], rgb: [156, 33, 33]}
  - {frame: daze_b, xy: [[53, 51], [54, 52], [55, 53], [55, 54], [55, 55], [56, 55], [56, 56], [56, 57], [56, 58], [56, 59]], rgb: [247, 107, 24]}
  - {frame: daze_b, xy: [[53, 44], [55, 44], [56, 46], [57, 47]], rgb: [156, 33, 33]}
  - {frame: hurt_in1, xy: [[42, 46]], rgb: [41, 0, 33]}
  - {frame: hurt_in1, xy: [[46, 45], [47, 46], [48, 46], [49, 46], [49, 47]], rgb: [247, 107, 24]}
  - {frame: hurt_in1, xy: [[43, 46], [44, 46]], rgb: [181, 41, 24]}
  - {frame: atk_mid, xy: [[41, 60], [42, 60], [43, 60], [44, 60], [45, 60], [46, 60], [47, 60], [48, 60], [49, 60]], rgb: [156, 33, 33]}
  # F3c (ROSTER_FIX_PLAN 12b): the elbow crack is closed in the flame ramp, not rose: the 7 px once painted (206, 16, 74)
  # and the 5 rendered rose px in x 40-49, y 60-62, by 4-neighbour mode among the flanking flame colours
  - {frame: atk_mid, xy: [[41, 61], [42, 61], [43, 61], [44, 61], [45, 61], [47, 61], [42, 62], [43, 62], [44, 62], [45, 62], [46, 62]], rgb: [156, 33, 33]}
  - {frame: atk_mid, xy: [[41, 62]], rgb: [41, 0, 33]}
  - {frame: hurt_in1, xy: [[50, 47], [51, 48], [52, 49], [53, 52]], rgb: [255, 156, 33]}
# pass KT (docs/KNEEL_TWEEN_PLAN.md): the approved AI kneel key (approved/<id>/kneel.png) and the bridge
# frames (kneel_bridge.py); no derived kneel block existed (the D-K7 alias), so nothing was retired
kneel:
  source: ai
  offset: [0, 1]                 # K-ground (floating): the key's base 1 px above the idle's lowest row
