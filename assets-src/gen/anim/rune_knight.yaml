# Puppet animation joints for the rune_knight (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/rune_knight/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the rune sword in the near hand (ready, attack; the attack's blue slash arc rides with it); the round rune shield on the near arm rides with the torso; in the cast key the sword stands upright in the far hand (rides with the torso) and the rune sigil and its streak ride with the raised near forearm. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
