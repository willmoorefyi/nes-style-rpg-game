# Puppet animation joints for the shaman (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/shaman/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the branch staff in the near hand (ready, attack); the cast key holds it upright in the far hand (no weapon part, it rides with the torso) and the ice shard rides with the raised forearm. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
