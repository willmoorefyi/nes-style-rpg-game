# limb, f = far limb). tip = the horned-skull staff in the near hand (ready, attack; the attack's green flame rides with it); the ready key's flame rides with the far forearm; in the cast key the staff and the two skeletal hands rising from the ground ride with the torso. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
