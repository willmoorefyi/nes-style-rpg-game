# Puppet animation joints for the ninja (assets-src/gen/puppet.py). Native px on approved/ninja/battle.png cells
# (80x80, figure faces left; n = near/viewer-side limb, f = far limb). tip = kunai tip, held in hand_<weapon_hand>.
robed: false
attack_hand: n
front_far_arm: {ready: true, attack: true, cast: false}
battle:
  ready:
    {neck: [43, 24], crown: [42, 4], chest: [42, 34], hip: [44, 46],
     sh_n: [34, 30], el_n: [27, 41], hand_n: [25, 31], sh_f: [52, 28], el_f: [57, 40], hand_f: [47, 37],
     hip_n: [36, 50], knee_n: [28, 58], foot_n: [28, 72], hip_f: [50, 50], knee_f: [55, 60], foot_f: [63, 74]}
  attack:
    {neck: [38, 26], crown: [37, 6], chest: [42, 36], hip: [44, 48],
     sh_n: [32, 31], el_n: [22, 31], hand_n: [13, 32], tip: [1, 32], weapon_hand: n,
     sh_f: [52, 30], el_f: [60, 37], hand_f: [51, 41],
     hip_n: [38, 52], knee_n: [30, 58], foot_n: [38, 72], hip_f: [52, 52], knee_f: [62, 62], foot_f: [72, 74]}
  cast:
    {neck: [43, 24], crown: [43, 4], chest: [42, 36], hip: [44, 47],
     sh_n: [35, 31], el_n: [28, 37], hand_n: [26, 43], tip: [14, 53], weapon_hand: n,
     sh_f: [49, 30], el_f: [58, 31], hand_f: [66, 26],
     hip_n: [36, 50], knee_n: [27, 60], foot_n: [22, 74], hip_f: [50, 50], knee_f: [54, 62], foot_f: [54, 74]}
# tweaks: in-between joint offsets. They keep the upper body rigid (or a keyframe's legs/torso exactly) so cut-out seams
# do not open, and move joints that would land exactly on half a pixel onto whole pixels (np.rint rounds .5 to even,
# which doubles/drops alternate columns of an unrotated part).
tweaks:
  idle_b: {hip_n: [0, -1], hip_f: [0, -1]}
  atk_wind1: {hip: [1, 0], hip_n: [1, 0], hip_f: [1, 0]}
  atk_mid: {neck: [-2.25, 0], crown: [-2.25, 0], el_f: [1.35, -2.25], hand_f: [1.8, 0.9]}
  atk_follow: {neck: [0, 0.5], crown: [0, 0.5], chest: [0, 0.5], hip: [0, 0.5], sh_n: [0.5, 0], sh_f: [0, 0.5], hip_n: [0.5, 0.5], hip_f: [0.5, 0.5]}
  cast_gather: {el_n: [-1, -2], el_f: [2, -2], hand_f: [3, -2], hip_n: [0, -1], hip_f: [0, -1]}
  cast_rise: {crown: [0.5, 0], chest: [0, 1], hip: [0, 0.5], sh_n: [0.5, 0.5], el_n: [0.5, -2], hand_n: [0.5, 6], sh_f: [-1.5, 1], knee_n: [-0.5, 1], knee_f: [-0.5, 1], foot_n: [-3, 1], foot_f: [-4.5, 0]}
