# Puppet animation joints for the samurai (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/samurai/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the katana in the near hand (ready, attack); in the cast key it is raised overhead by the far hand (rides with the far forearm) and the slash streaks float free. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
