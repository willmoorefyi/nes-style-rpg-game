# Puppet animation joints for the cleric (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/cleric/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the hammer in the near hand (ready, attack); the cast key holds it low in the other hand (no weapon part; the cast frames keep the key's body), and its sparkle rides with the raised forearm. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
