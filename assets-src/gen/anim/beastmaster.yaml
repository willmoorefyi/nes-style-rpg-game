# Puppet animation joints for the beastmaster (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/beastmaster/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). No weapon in the ready / cast keys (the whip is coiled at the hip there); tip = the whip in the near hand in the attack key (part_boxes keep its 1 px line with the hand). part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
