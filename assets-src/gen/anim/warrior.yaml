# Puppet animation joints for the warrior (assets-src/gen/puppet.py). Native px on approved/warrior/battle.png cells
# (80x80, figure faces left; n = near/viewer-side limb, f = far limb). tip = weapon tip, held in hand_<weapon_hand>.
robed: false
attack_hand: n
front_far_arm: {ready: true, attack: true, cast: true}
battle:
  ready:
    {neck: [40, 32], crown: [40, 10], chest: [41, 38], hip: [42, 52],
     sh_n: [33, 36], el_n: [28, 43], hand_n: [20, 40], sh_f: [49, 34], el_f: [53, 43], hand_f: [44, 42],
     hip_n: [35, 54], knee_n: [30, 60], foot_n: [28, 72], hip_f: [47, 54], knee_f: [50, 61], foot_f: [57, 72]}
  attack:
    {neck: [40, 32], crown: [40, 9], chest: [44, 40], hip: [46, 52],
     sh_n: [34, 34], el_n: [26, 34], hand_n: [18, 35], tip: [0, 34], weapon_hand: n,
