# tweaks generated: every in-between joint snapped to a whole pixel (half-pixel offsets resample a translated part
# with duplicated/dropped columns); far arm kept at its attack angles in atk_mid/atk_follow (the shield rim behind the
# far fist is cut with the far forearm); cast_rise = cast pose with the raised arm swung 20 deg lower.
tweaks:
  atk_mid: {neck: [0.1, 0.1], crown: [0.1, -0.35], chest: [0.45, 0], hip: [-0.1, 0.1], sh_n: [-0.45, 0.2], el_n: [0.25, 0.15], hand_n: [-0.1, 0.15], sh_f: [0, 0.2], el_f: [0.9, -0.25], hand_f: [5.85, 1.55], hip_n: [0.45, 0.1], knee_n: [-0.1, 0.1], foot_n: [0.35, 0], hip_f: [0.35, 0.1], knee_f: [0.05, -0.45], foot_f: [0.4, 0], tip: [-0.1, 0.15]}
  atk_follow: {crown: [0, -0.25], chest: [-0.25, 0.5], sh_n: [0.25, 0.5], sh_f: [0.5, 0.5], el_f: [1, 0.25], hand_f: [3.75, 1.25], hip_n: [-0.25, 0], knee_n: [0.5, 0], foot_n: [-0.25, 0], hip_f: [0.25, 0], knee_f: [0.5, 0.25]}
