# Puppet animation joints for the druid (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/druid/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the seed staff in the near hand (ready, attack; the attack's leaves ride with it); the cast key holds it upright in the far hand (it rides with the torso) and the floating leaves above ride with the raised forearm. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
