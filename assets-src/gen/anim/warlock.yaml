# Puppet animation joints for the warlock (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/warlock/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the curved dagger in the near hand (ready, attack; the attack's green arc rides with it); the fel-fire rides with the far forearm (ready) and the near one (cast); the cast's flame ribbon rides with the torso. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
