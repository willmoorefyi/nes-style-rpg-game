# Puppet animation joints for the summoner (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/summoner/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). No weapon part: the skull staff rides with the torso in the ready and cast keys (part_boxes) and is not in the attack key; the attack's blue streaks and the cast's spirit ride with the near forearm. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
# Marked on 10x gridded cells.
robed: false
attack_hand: n
cast_hand: n
keep_specks: true   # plan 13 (A3): the streaks and the spirit survive the cut
# plan 5 review fallback (image review round 3 still ITERATE on cast_gather: the raised hand parts from its forearm
# across the staff): cast_gather is left to the ready key
alias_frames: [cast_gather]
front_far_arm: {ready: true, attack: true, cast: true}
battle:
