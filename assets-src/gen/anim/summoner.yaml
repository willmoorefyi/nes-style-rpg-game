    {neck: [44, 26], crown: [44, 8], chest: [46, 36], hip: [46, 54], sh_n: [38, 32], el_n: [28, 36], hand_n: [16, 34], sh_f: [58, 32], el_f: [62, 42], hand_f: [62, 50], hip_n: [36, 58], knee_n: [32, 66], foot_n: [30, 75], hip_f: [54, 58], knee_f: [56, 66], foot_f: [56, 75], part_boxes: {torso: [[14, 1, 31, 30], [21, 30, 27, 38], [21, 38, 27, 77]]}}
