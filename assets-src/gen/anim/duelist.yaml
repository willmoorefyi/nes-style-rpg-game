# Puppet animation joints for the duelist (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/duelist/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). The rapier blade is a 1 px line (broken into segments in places) that a joint rotation would bend or split, so the in-betweens are the keys held or shifted whole; the joints only label the parts. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
# Marked on 10x gridded cells.
robed: false
attack_hand: n
cast_hand: n
keep_specks: true   # plan 13 (A3): the blade segments, the dagger glint and the dropped dagger survive the cut
fx_colours: [[214, 214, 222], [247, 239, 231]]   # plan 16 (A6): the 1 px rapier blade and the dagger glint, drawn without ink
front_far_arm: {ready: true, attack: true, cast: true}
battle:
  ready:
    {neck: [52, 28], crown: [54, 8], chest: [54, 38], hip: [54, 52], sh_n: [48, 32], el_n: [42, 34], hand_n: [36, 34], sh_f: [64, 32], el_f: [70, 36], hand_f: [74, 24], hip_n: [46, 56], knee_n: [42, 64], foot_n: [42, 75], hip_f: [62, 56], knee_f: [68, 64], foot_f: [72, 75]}
  attack:
    {neck: [50, 30], crown: [52, 12], chest: [52, 40], hip: [54, 54], sh_n: [46, 34], el_n: [38, 34], hand_n: [30, 34], sh_f: [62, 34], el_f: [68, 38], hand_f: [72, 30], hip_n: [44, 58], knee_n: [38, 66], foot_n: [34, 75], hip_f: [62, 58], knee_f: [68, 66], foot_f: [72, 75]}
  cast:
    {neck: [38, 26], crown: [38, 10], chest: [40, 38], hip: [40, 52], sh_n: [30, 32], el_n: [26, 34], hand_n: [24, 36], sh_f: [50, 30], el_f: [54, 26], hand_f: [56, 22], hip_n: [32, 58], knee_n: [30, 66], foot_n: [28, 75], hip_f: [46, 58], knee_f: [46, 66], foot_f: [44, 75]}
# tweaks (round 0, the hunter / legion lessons): the frames that blend two keys stay on one key with
# a small offset (key + delta - the generic target).
tweaks:
  idle_b: {neck: [0, -1], crown: [0, -1], chest: [0, -1], hip: [0, -1], sh_n: [0, -1], el_n: [0, -1], hand_n: [0, -1], sh_f: [0, -1], el_f: [0, -1], hand_f: [0, -1], hip_n: [0, -1], knee_n: [0, 0], foot_n: [0, 0], hip_f: [0, -1], knee_f: [0, 0], foot_f: [0, 0]}
  atk_wind1: {neck: [0, 0], crown: [0, 0], chest: [0, 0], hip: [1, 0], sh_n: [1, 0], el_n: [-9, -7], hand_n: [-10, -7], sh_f: [0, 0], el_f: [0, 0], hand_f: [0, 0], hip_n: [1, 0], knee_n: [1, 0], foot_n: [1, 0], hip_f: [1, 0], knee_f: [1, 0], foot_f: [1, 0]}
  atk_wind2: {neck: [0, -2], crown: [0, -2], chest: [0, -2], hip: [0, -2], sh_n: [0, -2], el_n: [-12, -9], hand_n: [-13, -10], sh_f: [0, -2], el_f: [0, -2], hand_f: [0, -2], hip_n: [0, -2], knee_n: [2, -2], foot_n: [2, 0], hip_f: [0, -2], knee_f: [1, -2], foot_f: [2, 0]}
