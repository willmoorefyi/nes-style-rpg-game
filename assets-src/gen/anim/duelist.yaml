# every in-between shows its key exactly: a shifted or re-rendered key gains outline specks at the hair and hilt tips,
# and the 1 px blade must stay unbroken (the fallback the user allowed for the thin blades)
alias_frames: [idle_b, atk_wind1, atk_wind2, atk_mid, atk_follow, cast_gather, cast_rise, cast_release]
kneel: {source: user, bridge: {keep_top: 0.42, keep_bot: 0.2}}
