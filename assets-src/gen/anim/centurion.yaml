# px on approved/centurion/battle.png cells (80x80, the user's render, every pose faces left; n = near/viewer-side limb, f =
# far limb). tip = the gladius in the near hand (behind the scutum in ready / attack), the vine staff in the cast key.
# part_boxes ([x0, y0, x1, y1), half-open): the scutum rides with the torso (the arm holding it is hidden behind it);
# in the cast key the vine staff. Marked on 10x gridded cells.
