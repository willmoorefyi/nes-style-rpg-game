# Puppet animation joints for the automaton (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-16).
# Native px on approved/automaton/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the brass spear upright in the near hand (ready); in the attack key the spear is levelled
# forward in the near hand; in the cast key the upright spear rides with the near forearm and the lime sparks with the
# raised far forearm. The wind-up key on the back (and the attack's steam puff) rides with the torso. part_boxes
# ([x0, y0, x1, y1), half-open): pixels that ride with one part. Marked on 10x gridded cells.
