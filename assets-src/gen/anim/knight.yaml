# Pass K kneel (docs/KNEEL_PLAN.md D-K4 variant A, R3 = A; puppet_kneel.py): re-posed from ready, chest lean and head
# bow in deg, the near fist lowered; the head 1 px lower (neck / crown tweak) so the plume stays inside the band. No
# chest lean: any lean pushes kneel_in2's outline ring past ready's + 0.08.
