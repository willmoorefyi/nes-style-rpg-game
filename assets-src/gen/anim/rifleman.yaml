# Puppet animation joints for the rifleman (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/rifleman/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the bayonet point (ready, attack; the attack's muzzle flash, smoke and tracer ride with it); in the cast key the rifle stands upright in the near hand (rides with the torso) and the steam puff rides with the raised far forearm. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
# Marked on 10x gridded cells.
robed: false
attack_hand: n
cast_hand: n
keep_specks: true   # plan 13 (A3): the muzzle flash, the smoke, the tracer and the steam puffs survive the cut
fx_colours: [[189, 132, 57], [247, 189, 82], [247, 231, 222], [206, 206, 206]]   # plan 16 (A6): the muzzle flash and the tracer (the flash gold is a strap colour too), drawn without ink
front_far_arm: {ready: true, attack: true, cast: true}
