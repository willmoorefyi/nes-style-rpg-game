# Puppet animation joints for the valkyrie (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/valkyrie/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the spear point in the near hand (ready, attack, cast). The wings overlap the spear and the body, so the in-betweens stay on their keys (tweaks with no joint motion but a head bob and whole-figure steps); the attack key is the airborne dive (plan 18: its lowest row is 73, so atk_mid / atk_follow are airborne too). part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
