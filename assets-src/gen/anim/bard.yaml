# Puppet animation joints for the bard (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/bard/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). The lute is held across the body by both hands, so the in-betweens stay on their keys (tweaks with no joint motion but a head bob and whole-figure steps); the floating music notes and the sound-wave arcs ride with their keys. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
