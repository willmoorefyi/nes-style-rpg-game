# Puppet animation joints for the android (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-16).
# Native px on approved/android/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the lime-bladed spear slanted forward in the near hand (ready; the far hand on the hip); in
# the attack key the spear is levelled forward in the near hand and the cape streams behind (rides with the torso); in
# the cast key the upright spear rides with the near forearm and the lime hexagon shield with the raised far forearm.
# part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part. Marked on 10x gridded cells.
