attack_hand: n
cast_hand: f
keep_specks: true   # plan 13 (A3): the lime sparks and the shield's loose cells survive the cut
fx_colours: [[165, 231, 0], [198, 247, 57]]   # plan 16 (A6): the lime blade, sparks and hexagon shield, drawn without ink (also the hood trim and the core)
front_far_arm: {ready: true, attack: true, cast: true}
