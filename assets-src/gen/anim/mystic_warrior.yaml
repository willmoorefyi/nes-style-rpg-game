# Puppet animation joints for the mystic_warrior (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/mystic_warrior/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the rune sword in the near hand (ready, attack; the attack's blue slash arc and sigils ride with it); the kite rune shield on the near arm and the cape ride with the torso; in the cast key the sword stands upright in the far hand (rides with the torso) and the four rune orbs ride with the raised near forearm. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
