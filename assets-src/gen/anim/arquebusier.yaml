# Puppet animation joints for the arquebusier (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/arquebusier/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). tip = the arquebus muzzle (ready, attack; the attack's muzzle flash and smoke puff ride with it); in the cast key the arquebus stands upright in the near hand and rides with the torso. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
