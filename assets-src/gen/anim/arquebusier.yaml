keep_specks: true   # plan 13 (A3): the muzzle flash, the smoke and the match glow survive the cut
fx_colours: [[214, 148, 41], [247, 198, 82]]   # plan 16 (A6): the muzzle flash (its gold is the doublet trim too), drawn without ink
