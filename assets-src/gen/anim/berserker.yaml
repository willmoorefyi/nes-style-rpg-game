# tweaks (review round 0): cast_gather keeps the far hand (and its axe) at its ready place, so the axe is not hidden
# behind the near arm; cast_rise lifts both arms most of the way to cast (the plain 0.5 lerp laid the near axe flat).
# round 1 (image review): cast_gather keeps the hips (no thigh seams, no wide X), atk_wind2 holds the near hand and
# axe off the far fist and the thigh, cast_release keeps the near elbow (the upper arm no longer crosses the face);
# round 2: cast_rise is the cast key's body and legs exactly (the 0.5 lerp cracked the thighs and doubled the chest
# outline) with both hands a few px below the key; the kneel bridge keeps the head and the hafts row for row (keep_top / keep_bot).
tweaks:
  cast_gather: {el_f: [2, -3], hand_f: [8, 3], hip: [0, -1], hip_n: [0, -1], hip_f: [0, -1]}
  atk_wind2: {el_n: [-3, 0], hand_n: [-4, -3], tip: [-4, -3]}
  cast_release: {el_n: [-1, 3]}
  cast_rise: {neck: [0, 2], crown: [0.5, 2], chest: [-1, 0], hip: [-1, -1.5], sh_n: [-0.5, -2], el_n: [-1.5, -6.5],
              hand_n: [-2, -8.5], tip: [-2, -8.5], sh_f: [-2, -1], el_f: [-4, -2.5], hand_f: [1.5, -6.5],
              hip_n: [-0.5, -1], knee_n: [0.5, 0], foot_n: [0.5, 0], hip_f: [-2, -1], knee_f: [-5, 0], foot_f: [-6, 0]}
# pass CB (docs/CLASS_BARBARIAN_PLAN.md 4): the user's KNEEL column as the key + the one-source bridge
kneel: {source: user, bridge: {keep_top: 0.42, keep_bot: 0.2}}
