# Puppet animation joints for the berserker (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5). Native px
# on approved/berserker/battle.png cells (80x80, the user's render, every pose faces left; n = near/viewer-side limb, f = far
# limb). part_boxes: the axe heads' boxes ([x0, y0, x1, y1), half-open), wider than a bone's reach. tip = the near hand's axe, tip_f = the far hand's axe (puppet.py weapon_f). Marked on 10x gridded cells.
robed: false
attack_hand: n
cast_hand: n
front_far_arm: {ready: true, attack: true, cast: true}
