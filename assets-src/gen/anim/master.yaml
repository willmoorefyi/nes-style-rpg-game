# Puppet animation joints for the master (assets-src/gen/puppet.py). Native px on approved/master/battle.png cells
# (80x80, figure faces left; n = near/viewer-side limb, f = far limb). Unarmed: strikes with the near fist.
robed: false
attack_hand: n
front_far_arm: {ready: true, attack: true, cast: false}
battle:
  ready:
    {neck: [40, 27], crown: [40, 6], chest: [42, 33], hip: [42, 48],
     sh_n: [34, 31], el_n: [28, 40], hand_n: [19, 36], sh_f: [51, 29], el_f: [59, 36], hand_f: [52, 41],
     hip_n: [37, 50], knee_n: [24, 60], foot_n: [22, 72], hip_f: [47, 50], knee_f: [58, 60], foot_f: [61, 73]}
  attack:
    {neck: [46, 29], crown: [46, 9], chest: [45, 34], hip: [44, 50],
     sh_n: [36, 33], el_n: [28, 36], hand_n: [16, 32], sh_f: [52, 31], el_f: [58, 36], hand_f: [48, 37],
     hip_n: [40, 52], knee_n: [26, 58], foot_n: [14, 72], hip_f: [50, 52], knee_f: [62, 56], foot_f: [60, 72]}
