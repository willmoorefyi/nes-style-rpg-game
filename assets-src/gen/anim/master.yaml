# tweaks: in-between joint offsets. Most keep the upper body rigid (torso, head and the arm that is not acting move
# together) so cut-out seams do not open; the .5 entries move joints that would land exactly on half a pixel onto whole
# pixels (np.rint rounds .5 to even, which doubles/drops alternate columns of an unrotated part).
tweaks:
  idle_b: {hip_n: [0, -1], hip_f: [0, -1]}
  atk_wind1: {hand_n: [-4, -4], hip: [1, 0], hip_n: [1, 0], hip_f: [1, 0]}
  atk_wind2: {hand_n: [-4, -5]}
  atk_mid: {sh_f: [-0.9, 0.45], el_f: [-1.8, -0.45], hand_f: [-3.15, -2.25], neck: [1.35, 0.45], crown: [1.35, 0.9]}
  atk_follow: {neck: [0.5, 0.5], crown: [0.5, 0.5], sh_n: [0.5, 0.5], sh_f: [0, 0.5], hip_n: [0, 0.5], hip_f: [0, 0.5]}
  cast_gather: {hip_n: [0, -1], hip_f: [0, -1], el_n: [-1, -2], hand_n: [-17, -3]}
  cast_rise: {neck: [0.5, 0.5], crown: [0.5, 0.5], chest: [0.5, 0], hip: [0.5, 0], sh_n: [0, -0.5], sh_f: [-0.5, 1],
              el_f: [-3, 1], hand_f: [3, 1], hip_n: [0, -1], hip_f: [0.5, -1], knee_n: [2, 0], knee_f: [-1.5, 0],
              foot_n: [1.5, 0.5], foot_f: [-2, -0.5]}
