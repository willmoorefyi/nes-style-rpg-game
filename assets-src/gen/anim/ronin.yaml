# Puppet animation joints for the ronin (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/ronin/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). The katana is sheathed in ready (no tip), drawn in the near hand in attack; in the cast key it is held upright by the other hand (no weapon part; it rides with the torso). part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
# Marked on 10x gridded cells.
robed: false
attack_hand: n
cast_hand: n
# round 1 (image review: the wind-ups drew a second, drawn katana while the ready key's stays sheathed): the katana is
# drawn in one stroke (iaido), so atk_wind1 / atk_wind2 are left to the ready key (the plan 5 alias)
alias_frames: [atk_wind1, atk_wind2]
front_far_arm: {ready: true, attack: true, cast: true}
