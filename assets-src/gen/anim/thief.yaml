# Puppet animation joints for the thief (assets-src/gen/puppet.py). Native px on approved/thief/battle.png cells
# (80x80, figure faces left; n = near/viewer-side limb, f = far limb). tip = weapon tip, held in hand_<weapon_hand>.
robed: false
attack_hand: n
front_far_arm: {ready: true, attack: true, cast: true}
battle:
  ready:
    {neck: [40, 28], crown: [39, 6], chest: [41, 34], hip: [43, 50],
     sh_n: [32, 31], el_n: [31, 39], hand_n: [23, 35], sh_f: [52, 31], el_f: [55, 41], hand_f: [44, 37],
     hip_n: [36, 52], knee_n: [29, 58], foot_n: [26, 72], hip_f: [48, 52], knee_f: [52, 60], foot_f: [59, 72]}
  attack:
    {neck: [38, 32], crown: [37, 10], chest: [43, 37], hip: [45, 50],
     sh_n: [31, 34], el_n: [23, 33], hand_n: [14, 33], tip: [1, 33], weapon_hand: n,
     sh_f: [50, 33], el_f: [59, 35], hand_f: [56, 41],
     hip_n: [38, 52], knee_n: [31, 58], foot_n: [31, 72], hip_f: [52, 54], knee_f: [60, 62], foot_f: [70, 72]}
  cast:
    {neck: [42, 29], crown: [42, 4], chest: [43, 35], hip: [44, 48],
     sh_n: [35, 30], el_n: [27, 24], hand_n: [20, 15], sh_f: [49, 33], el_f: [51, 41], hand_f: [57, 42],
     hip_n: [37, 52], knee_n: [33, 60], foot_n: [28, 72], hip_f: [50, 52], knee_f: [54, 60], foot_f: [56, 72]}
# tweaks generated: every in-between joint snapped to a whole pixel (half-pixel offsets resample a translated part
# with duplicated/dropped columns); atk_mid/atk_follow keep the attack pose (torso, head, far arm, legs) with only the
# dagger arm moving (atk_mid: attack arm + dagger swung 25 deg lower); wind-ups raise the dagger hand by the chin
# instead of crossing the chest; cast_rise = cast pose with the raised arm 18 deg lower.
tweaks:
  atk_wind1: {hip: [1, 0], el_n: [-5, -1], hand_n: [0, -8], hip_n: [1, 0], hip_f: [1, 0], tip: [0, -8]}
  atk_wind2: {el_n: [-7, -1], hand_n: [0, -10], tip: [0, -10]}
  atk_mid: {neck: [-1.8, 0.9], crown: [-1.8, 0.9], chest: [0, 0.45], hip: [0, -0.9], sh_n: [-1.35, 0.45], el_n: [-7.32, -0.58], hand_n: [-8.28, 2.77], sh_f: [-1.8, 0], el_f: [0.9, -3.6], hand_f: [4.5, 0.9], hip_n: [0, -0.9], knee_n: [0.9, -0.9], foot_n: [2.25, 0], hip_f: [0.9, 0], knee_f: [3.15, 0], foot_f: [4.95, 0], tip: [-7.06, 8.26]}
  atk_follow: {neck: [-0.5, 0], crown: [-0.5, 0], chest: [0.5, -0.25], hip: [0.5, -1], sh_n: [-0.25, -0.25], sh_f: [-0.5, -0.5], el_f: [1, -2.5], hand_f: [3, 0], hip_n: [0.5, -1], knee_n: [0.5, -1], foot_n: [1.25, -1], hip_f: [1, -0.5], knee_f: [2, -0.5], foot_f: [2.75, -1]}
  cast_rise: {neck: [0, 0.5], crown: [0.5, -1], chest: [0, 0.5], hip: [-0.5, -1], sh_n: [0.5, -0.5], el_n: [-4.46, -4.73], hand_n: [-6.4, -4.63], sh_f: [-2.5, 1], el_f: [-3, 0], hand_f: [5.5, 2.5], hip_n: [-0.5, 0], knee_n: [1, 1], foot_f: [-2.5, 0]}
# Pass K kneel (docs/KNEEL_PLAN.md D-K4 variant A, R3 = A; puppet_kneel.py), iteration 2: re-posed from ready,
# chest lean and head bow in deg; reoutline re-inks the 2 px outline (puppet_kneel_outline.py); labels / paint
# (puppet_kneel_paint.py, <= 160 px per frame, approved palette): the rear thigh (kneel, kneel_in2) filled with ready's dark-green trouser ramp inside its outline.
kneel:
  lean: 8
  bow: 12
  arms: [n]
  reoutline: true
  paint:
  - frame: kneel
    rect: [45, 68, 55, 71]
    rgb: [49, 74, 57]
  - frame: kneel
    rect: [46, 67, 53, 67]
    rgb: [90, 132, 82]
  - frame: kneel_in2
    rect: [49, 66, 54, 70]
    rgb: [49, 74, 57]
  - frame: kneel_in2
    rect: [48, 65, 53, 65]
    rgb: [90, 132, 82]
