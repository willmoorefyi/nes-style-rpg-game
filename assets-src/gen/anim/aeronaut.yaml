robed: false
attack_hand: n
cast_hand: n
keep_specks: true   # plan 13 (A3): the detached pieces of the render survive the cut
fx_colours: [[222, 90, 41], [255, 173, 66]]   # plan 16 (A6): the flare, drawn without ink
