# Puppet animation joints for the aeronaut (assets-src/gen/puppet.py; pass CB, docs/CLASS_BARBARIAN_PLAN.md 5, 11-13).
# Native px on approved/aeronaut/battle.png cells (80x80, the user's render, every pose faces left; n = near / viewer-side
# limb, f = far limb). The grappling-hook gun and the scarf overlap the body, so the in-betweens are the keys held or shifted whole; the joints only label the parts; the flare and the hook ride with their keys. part_boxes ([x0, y0, x1, y1), half-open): pixels that ride with one part.
