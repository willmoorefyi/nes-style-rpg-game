# Pass KA prompts, arm settings and per-sprite lists (docs/KNEEL_AI_PLAN.md 3 D-KA4, 5b, r3-3). Read by kneel_ai_req.py
# (prompts and request bodies) and kneel_ai_j1.py (weapons / heads). `sprites:` is written by `kneel_ai.py bodies
# --write` and reviewed (kneel_ai_bodies.REVIEWED holds the corrections); a sprite's `extra` / `negative_extra` change
# its prompt only for a reason a reviewer or a J0 / J1 check named (section 3).
style: >-
  16-bit SNES JRPG battle sprite of exactly this character, crisp pixel art, bold black outline between every part,
  flat cel shading with three tones per colour, the same limited palette as the reference, light from the upper left,
  {facing}, whole figure in frame, plain flat {bg} background
negative: >-
  standing upright, attacking, jumping, lying dead, knocked out, extra limbs, extra heads, extra hands, extra weapons,
  duplicate weapon, missing weapon, second character, different character, new colours, gradient, soft shading, blur,
  anti-aliasing, 3d render, photo, text, watermark, ground, floor, shadow on ground, scenery, cropped, {opposite},
  {not_bg}
white_negative: white outline glow, white halo
compact: in a compact pose, limbs drawn in close to the body, nothing stretched out
compact_negative: stretched out, sprawling
poses:
  biped:
    - kneeling on one knee, the far knee on the ground, the near foot planted, torso bent forward, head bowed low looking at the ground, arms hanging, the weapon held low with its tip toward the ground, exhausted
    - sitting, both knees up
  mechanical:
    - a heavy machine powered down, kneeling on one knee, armoured torso slumped forward, head lowered, arms hanging heavily, the same plating and joints
    - broken apart, sparks, smoke
  robed:
    - kneeling on one knee, the robe pooled on the ground around the legs, torso bent forward, head or hood bowed low, hands resting on the knee, staff or rod held low
    - legs showing through the robe
  quadruped:
    - lying down on its belly in a compact pose, forelegs tucked under the chest, hind legs folded under the body, head lowered to the ground in front of the chest, tail curled along the body, wings folded tight (if any), exhausted
    - standing on four legs, on its back, stretched out, legs extended forward, tail stretched out behind
  bird:
    - crouching low on the ground, legs folded, wings drooping to the ground, neck bent and head lowered, beak near the ground
    - flying, spread wings
  floating:
    - sagging lower in the air, the body drooping, head and eyes turned down, arms, tendrils or fins hanging limp
    - touching the ground
  swimmer:
    - listing nose-down and sinking, fins hanging limp, tail drooping
    - upside down
  serpent:
    - coiled low and flat on the ground, the coils pressed down, head lowered to rest on the coils, mouth closed
    - rearing up, striking
  naga:
    - slumped forward onto its coiled tail, upper body bent low, head bowed, arms hanging
    - rearing up
  arthropod:
    - body lowered onto the ground in a compact pose, legs bent and drawn in close under the body, head, pincers and stinger drooping down and tucked in
    - on its back, legs splayed wide, legs stretched out
  blob:
    - slumped and flattened into a wide low mound, sagging, eyes looking down
    - splitting into pieces
  rooted:
    - wilting, stalks and vines drooping toward the ground, head bowed, the root mass slightly sagged
    - uprooted
seeds: [1234, 1235, 1236]
# D-KA4 arm settings (all other parameters at the API defaults); the user may fix them at the pick (section 3)
arms:
  a: {model: sd35, image: derived, strength: 0.40}
  b: {model: style_transfer, init: sil, change_strength: 0.85, style_strength: 1.0, composition_fidelity: 0.5}
  b2: {model: style_transfer, init: sil, change_strength: 0.85, style_strength: 0.6, composition_fidelity: 0.5}
  c: {model: control_sketch, image: skel, control_strength: 0.7, style_preset: pixel-art,
      then: {model: style_transfer, change_strength: 0.4, composition_fidelity: 0.9}}
  d: {model: style_guide, fidelity: 0.7, style_preset: pixel-art}
# Pass KA-G (docs/KNEEL_AI_PLAN.md rev 7 sections 2-5): arm g, read by kneel_ai_gem.py and gemini_batch*.py.
# `poses` holds a round-1b revision of a failing body's pose text (section 4; default: the rev-4 text above);
# per sprite, tries 2-3 add `g_lines: {2: {extra, avoid}, 3: {...}}` and an R1 identity flag adds `refs: [idle, hurt]`.
gemini:
  model: gemini-nano-banana-2.1
  aspect_ratio: "1:1"
  image_size: 1K
  seed_base: 1234
  usd: {interactive: 0.0351, batch: 0.0176}
  usage_prompt_max: 1100
  key_hex: {magenta: "#FF00FF", white: "#FFFFFF"}
  ident: Image 1 shows one character.
  ident_hurt: Image 1 and image 3 show one character.
  template: >-
    {ident} Redraw this exact character in the pose of the grey silhouette in image 2: {pose}. Keep exactly the same
    design, colours, face, armour, clothing, {weapon} and proportions as image 1, with {heads}. Same 16-bit pixel-art
    style, same palette, bold outline, light from the upper left. Side view {facing}. Full body, centred on the
    silhouette, the same size as the silhouette. Plain flat {bg} background, no ground, no shadow, no text.
  negatives: "Do not add: {negatives}."
  poses: {}
  pilot: [goblin, wolf, warrior, white_mage, cobra, green_slime, blue_dragon, iron_golem, garland, rhyos]
  tranche_t: [water_naga, cockatrice, ochu, shark, chaos, hydra, ghost, scorpion, hollow_seraph, black_mage]
