# Pass F (docs/FEEDBACK_PLAN_2026-11-14.md §2 item 12): the f_* scenarios for the feedback tranches. This file is frozen
# after F0; later changes go through the orchestrator. Open with ?mute=1&scenario=<id> (add &battleStep=1 to step every
# battle system one frame per `.`). Kits: "400 G" is kits.yaml `start`; "lv2" is start + LIT for the B.MAG + 2 potions.
# Every white (black) spell does not fit one caster (3 per spell level), so f_spells_white / f_spells_black share them
# between two casters. f_heavy_*: the levels are tuned on the balance sim (4 knights, fists, chain mail, Fight only)
# so the boss acts at least 4 times in 400 of 400 seeds and the party survives his first 4 attacks (Garland: Lv 3, Lv 5
