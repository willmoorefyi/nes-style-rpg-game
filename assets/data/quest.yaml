    requires: {flags: [BRIDGE_BUILT], items: [], vehicles: []}
    grants: {flags: [], items: [], vehicles: []}
    boss: []
    # A1-O: low 2, not 3 (WORLD 3.2): the grove opens straight off the bridge (S1, band 2-3); a visit has no event
    # the curve model could walk to, so --stage S3 sees the S1 level
    band: [2, 6]
    kit: w_s3
    maps: [matoya-cave]
    zones: [overworld:a1_mainland]
    grind: 2.0
    walk: []
    entry: {map: overworld, x: 93, y: 92}
    basins: {}
    nonLoadBearing: []
    status: built
  - id: S7
