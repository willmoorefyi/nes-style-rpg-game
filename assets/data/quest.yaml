    walk: [western-keep-2f:npc:false_king, western-keep-2f:battle:ASTOS_DEFEATED]
    # INT-W2b: the ship moored at Elfheim's harbour (the `elf_port` dock), as the party came; without it the assumed
    # start parks S2's ship at Pravoka (its spawn), and the party on the moor is cut off from the mainland
    entry: {map: overworld, x: 60, y: 125, vehicles: [{type: ship, map: overworld, x: 84, y: 147}]}
    basins: {}
    nonLoadBearing:
      # GT-6 and the generic NPC elements at Astos's cell: MARSH_GUARD_DEFEATED is redundant with the crown, which only
      # the Marsh Cave guard's victory gives (D-W14); his hideIf only clears the beaten boss off the dais
      - {map: western-keep-2f, kind: npc, at: [14, 7], reason: "the crown, which Astos also requires, is given only by the guard's victory (D-W14); hideIf only clears the beaten boss off his dais"}
