# The declared progression DAG of pass W (docs/WORLD_PLAN.md 3.2-3.5; schema QUEST_PLAN 2.4 with WORLD 3.4's
# `optional`, `milestones` and `towns:`). The progression verifier (`npm run quest`) reads it; it is validated by
# src/core/schemaValidationQuest.ts (tests/data/questData.test.ts).
#
# Ownership: each tranche edits only between its own anchors, `# === <id> (pass W: owned by <id>) ===` and
# `# === end <id> ===` (its stages: `entry`, `walk`, `nonLoadBearing`, `milestones`, `status`), and between its
# `town` anchors in `towns:`. S0 (act 1, built) and the goal belong to the integrator.
# Stage fields: after (stage ids), requires / grants {flags, items, vehicles}, boss (enemy ids), band [low, high]
# (whole-party level), kit (a kits.yaml id; the `w_s<n>` and `w_<town>` kits are W1-F's), maps (map-id globs the
# stage owns), zones (`<map>:<zone id>`), grind (1.0-7.0, the curve model's fight multiplier; INT tunes it), walk
# (event ids), entry (the assume-mode start, set by the owner), basins ({}: the only basin seeds are
# world_api.BASIN_SEEDS, WORLD 3.4), nonLoadBearing ([{map, kind, at, reason}]), optional, milestones (an ordered
# list of the stage's own flags).
goal: CHAOS_DEFEATED
stages:
  # Act 1 (built; the integrator's)
  - id: S0
    title: "Act 1"
    tranche: "-"
    after: []
    requires: {flags: [], items: [], vehicles: []}
    grants: {flags: [GARLAND_DEFEATED, PRINCESS_RESCUED, INTRO_COMPLETE], items: [lute], vehicles: []}
    boss: [garland]
    band: [2, 3]
    kit: arrive
    maps: [cornelia, cornelia-*, temple-of-fiends]
    zones: [overworld:temple_approach, overworld:east_pocket]
    grind: 2.0
    walk: []
    basins: {}
    nonLoadBearing:
      # GT-1, D-W13: world cells (act-1 (29, 32) and (30, 32) at the A1 origin (64, 64))
      - {map: overworld, kind: gate, at: [93, 96], reason: "redundant with north_bridge; the gap is water without the flag"}
      - {map: overworld, kind: gate, at: [94, 96], reason: "redundant with north_bridge; the gap is water without the flag"}
      # the generic mutation list (QUEST 5.4: a boss NPC's hideIf), added by W1-I like QUEST 4.5's bridge entries
      - {map: temple-of-fiends, kind: npc, at: [11, 6], reason: "Garland's hideIf only clears the beaten boss off his dais, a dead end"}
      # INT: the three elements a `--stage S0` run can't see (the run checks only S0's own (b), and S0 has no
      # ancestors). The full run catches each (none is uncaught in the full `--mutate` run on 0e4007e1): the King's and
      # the princess's PRINCESS_RESCUED keep S0's lute and S1's order behind the rescue, and the temple's stair to the
      # past is S29's time gate (TIME_GATE_OPEN)
      - {map: cornelia-castle-2f, kind: npc, at: [21, 8], stage: S0, element: "cornelia-castle-2f npc king needs PRINCESS_RESCUED removed", reason: "stage scope: the King's line to the builders is S1's; the full run catches it"}
      - {map: cornelia-castle-2f, kind: npc, at: [22, 8], stage: S0, element: "cornelia-castle-2f npc princess needs PRINCESS_RESCUED removed", reason: "stage scope: the princess's gift waits for S0's own rescue; the full run catches it"}
      - {map: temple-of-fiends, kind: transition, at: [3, 4], stage: S0, element: "temple-of-fiends transition to past-temple-1 flags removed", reason: "stage scope: the stair to the past is S29's; the full run catches it"}
    status: built
  # === A1-O (pass W: owned by A1-O) ===
  - id: S1
    title: "The north bridge"
    tranche: A1-O
    after: [S0]
    requires: {flags: [INTRO_COMPLETE], items: [], vehicles: []}
    grants: {flags: [BRIDGE_BUILT], items: [], vehicles: []}
    boss: []
    band: [2, 3]
    kit: w_s1
    maps: []
    zones: []
    grind: 1.0
    walk: [overworld:npc:bridge_worker_w]
    basins: {}
    nonLoadBearing: []
    status: built
  - id: S3
