      # the generic mutation list (QUEST 5.4: a boss NPC's hideIf), as for Garland at S0
      - {map: pravoka, kind: npc, at: [40, 33], reason: "Bikke's hideIf only clears the beaten captain off the brig pier's end, a dead end"}
      # GT-4 in --stage S2 only: the full run catches the dock's removal as (c) SOFTLOCK (a caught row never reads this)
      - {map: overworld, kind: dock, at: [132, 102], reason: "stage scope: @S2 holds once the brig spawns, and boarding needs no dock (W1-A); the full run catches GT-4 as SOFTLOCK"}
    status: built
  # === end A1-T ===
  # === ELF-O (pass W: owned by ELF-O) ===
