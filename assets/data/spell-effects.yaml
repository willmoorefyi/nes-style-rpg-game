# Battle effects for spells, items and ranged enemy attacks (docs/FEEDBACK_PLAN_2026-11-14.md §3.4).
# Loaded by the battle fx engine (src/scenes/battle/fx/fxData.ts) through validateSpellEffects; bad entries are
# logged and dropped (src/core/schemaValidationFx.ts, fx/fxDefs.ts).
#
# effects:  id -> { kind, frames, impact, glyph, ramp, count?, accent?, accentRamp?, mark?, markRamp?, status?,
#                   label?, flash?, at?, scale? }
#   kind:    rise | fall | bolt | ring | orbit | burst | beam | cone | projectile | chevrons (fx/emitters.ts)
#   frames:  length at 60 fps; impact: the frame the number and the result line land on (0 <= impact < frames)
#   glyph:   the particle glyph and ramp: `<glyph>.<ramp>` in assets/sprites/battle-fx.json (assets-src/fx/)
#   accent:  a second glyph (heat shimmer over flames, the healing halo, a frost burst, feathers, sparkles)
#   mark:    a glyph popped over a target where `status` landed (inflict_*); label: a word floated at impact (DEF+)
#   flash:   screen tints (3 frames each) per cast, at most 2; at: where a burst centres (top | head | center | feet)
# spells:   spell id (spells.yaml) -> effect id; every spell has one (tests/data/spellEffects.test.ts)
# items:    battle item id (items.yaml) -> effect id
# attacks:  an enemy's attackEffect (enemies.yaml, attack: ranged) -> effect id
# byEffect: a spell's `effect` (or `effect.element`) -> effect id, for spells added without their own entry
effects:
  fire: { kind: rise, frames: 30, impact: 18, glyph: flame, ramp: fire, count: 8, accent: shimmer, scale: 2 }
  fire_all: { kind: rise, frames: 30, impact: 18, glyph: flame, ramp: fire, count: 6, accent: shimmer, scale: 2 }
  ice: { kind: fall, frames: 32, impact: 20, glyph: shard, ramp: ice, count: 5, accent: burst, scale: 2 }
  ice_all: { kind: fall, frames: 32, impact: 20, glyph: shard, ramp: ice, count: 4, accent: burst, scale: 2 }
  lightning: { kind: bolt, frames: 24, impact: 10, glyph: bolt, ramp: bolt, accent: spark, count: 4, flash: 1 }
  lit_all: { kind: bolt, frames: 24, impact: 10, glyph: bolt, ramp: bolt, accent: spark, count: 3, flash: 1 }
  holy: { kind: ring, frames: 30, impact: 16, glyph: ring, ramp: holy, count: 3, accent: sparkle }
  heal: { kind: rise, frames: 32, impact: 20, glyph: sparkle, ramp: heal, count: 7, accent: glow }
  heal_all: { kind: rise, frames: 32, impact: 20, glyph: sparkle, ramp: heal, count: 6, accent: glow }
  revive: { kind: beam, frames: 44, impact: 30, glyph: beam, ramp: gold, count: 4, accent: feather }
  buff_def: { kind: chevrons, frames: 28, impact: 14, glyph: chevron_up, ramp: def, count: 3, label: DEF+ }
  buff_evade: { kind: chevrons, frames: 28, impact: 14, glyph: chevron_up, ramp: evade, count: 3, label: EVA+ }
  buff_atk: { kind: chevrons, frames: 28, impact: 14, glyph: chevron_up, ramp: atk, count: 3, label: ATK+ }
  buff_speed: { kind: chevrons, frames: 28, impact: 14, glyph: chevron_up, ramp: speed, count: 3, label: SPD+ }
  debuff_evade: { kind: chevrons, frames: 28, impact: 14, glyph: chevron_down, ramp: curse, count: 3, label: EVA- }
  debuff_speed: { kind: chevrons, frames: 28, impact: 14, glyph: chevron_down, ramp: curse, count: 3, label: SPD- }
  debuff_morale: { kind: chevrons, frames: 28, impact: 14, glyph: skull, ramp: fear, count: 3 }
  resist_fire: { kind: burst, frames: 30, impact: 16, glyph: shield, ramp: fire, count: 6, accent: sparkle, at: center, hold: 1 }
  resist_ice: { kind: burst, frames: 30, impact: 16, glyph: shield, ramp: ice, count: 6, accent: sparkle, at: center, hold: 1 }
  resist_lightning: { kind: burst, frames: 30, impact: 16, glyph: shield, ramp: bolt, count: 6, accent: sparkle, at: center, hold: 1 }
  inflict_sleep: { kind: burst, frames: 26, impact: 14, glyph: burst, ramp: sleep, count: 6, accent: sparkle, mark: z, status: sleep }
  inflict_stun: { kind: burst, frames: 26, impact: 14, glyph: burst, ramp: stun, count: 6, accent: spark, mark: star, status: stun }
  inflict_blind: { kind: burst, frames: 26, impact: 14, glyph: burst, ramp: blind, count: 5, accent: ink, mark: icon_blind, status: blind }
  inflict_silence: { kind: burst, frames: 26, impact: 14, glyph: burst, ramp: silence, count: 6, accent: spark, mark: ellipsis, status: silence }
  inflict_poison: { kind: burst, frames: 26, impact: 14, glyph: burst, ramp: poison, count: 5, accent: bubble, mark: bubble, status: poison }
  cleanse_poison: { kind: rise, frames: 26, impact: 14, glyph: sparkle, ramp: poison, count: 6 }
  cleanse_blind: { kind: rise, frames: 26, impact: 14, glyph: sparkle, ramp: holy, count: 6 }
  cleanse_silence: { kind: rise, frames: 26, impact: 14, glyph: sparkle, ramp: silence, count: 6 }
  cleanse_stone: { kind: rise, frames: 26, impact: 14, glyph: sparkle, ramp: stone, count: 6 }
  ether: { kind: rise, frames: 26, impact: 14, glyph: sparkle, ramp: ether, count: 7 }
  drain: { kind: projectile, frames: 36, impact: 24, glyph: orb, ramp: curse, count: 5 }
  fire_breath: { kind: cone, frames: 28, impact: 16, glyph: fireball, ramp: fire, count: 12, accent: burst }
  glint: { kind: burst, frames: 8, impact: 0, glyph: glint, ramp: holy, count: 0, at: top }
  impact_dust: { kind: burst, frames: 14, impact: 0, glyph: dust, ramp: dust, count: 4, accent: dust, at: feet }
