    - type: dialog
      text: "The cube leaves the brass hands, and the automaton's lamp-eyes flicker."
    - type: dialog
      text: "\"We were cast as a pair. I was given a lantern and this door to keep. My twin was given a blade.\""
    - type: dialog
      text: "\"It was sent up to walk the halls of the castle in the sky. If it walks there still, it will not know you.\""
    - type: dialog
      text: "\"Do not wait for it to be patient. It was never made to be.\""
    - type: set_flag
