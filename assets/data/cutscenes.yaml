- id: ord_throne_wakes
  steps:
    - type: dialog
      text: "You lift the stone crown from the steward's hands. It is heavier than it looks. You set it on the empty seat."
    - type: dialog
      text: "For a moment the whole court seems to lean toward the throne, as if a king had just sat down."
