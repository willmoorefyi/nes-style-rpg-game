      x: 10
      y: 11
      facing: up
    - type: wait
      duration: 500
    - type: fade_in
      duration: 700
    - type: dialog
      text: "Water wells up over the spring-stone and spills into the basin. A cold gust rolls out of the hollow and down over Gaia."
    - type: dialog
      text: "Fairy: \"A whole year of glass walls and that trader's snoring! I thought I would be a lamp on a shelf forever.\""
    - type: dialog
      text: "Fairy: \"Here, a draught from the heart of the spring, the Oxyale. One sip and the deep water lets you breathe.\" Received the Oxyale."
    - type: dialog
      text: "Fairy: \"Something is choking the sea off Onrac, the way the glass choked me. Go down and see.\""
