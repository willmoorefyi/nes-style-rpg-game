    - type: take_item
      item: fairy_bottle
    - type: dialog
      text: "The stopper comes free. A bead of light no bigger than a thumbnail shoots out and dives into the dry sand."
    - type: fade_out
      duration: 600
    - type: set_flag
      flag: FAIRY_FREED
    - type: give_item
