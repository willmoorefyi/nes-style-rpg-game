  steps:
    - type: dialog
      text: "The elder lifts his staff. Around the ring the sages rise, one by one, until all twelve stand."
    - type: dialog
      text: "Elder: \"Two rivers leave this lake, and no road crosses the mountains that ring it. Our fathers kept a boat for the day the rivers would be needed.\""
    - type: dialog
      text: "Two novices carry a slim canoe of pale wood up from the islet's shore and lay it at your feet."
    - type: give_item
      item: canoe
    - type: set_flag
      flag: CANOE_GIVEN
    - type: dialog
      text: "You received the Canoe! Step onto a river or the lake and you will paddle."
