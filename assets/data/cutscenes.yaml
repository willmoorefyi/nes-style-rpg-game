      entrance: boss
      facing: up
    - type: fade_in
      duration: 500
    - type: dialog
      text: "The bones fall still. By the altar beside the throne, something pale is kneeling."
# S13: the shade at the altar (cavern-earth-b5, npc ert_d_altar_shade) gives the stolen warmth back to the crystal.
- id: ert_earth_crystal
  steps:
    - type: dialog
      text: "Shade: I bound the earth's life into this stone so that my walls would never fall. Take it back to the land."
    - type: fade_out
      duration: 400
    - type: set_flag
      flag: EARTH_CRYSTAL_LIT
    - type: heal_party
    - type: wait
      duration: 300
    - type: fade_in
      duration: 700
    - type: dialog
      text: "The grey crystal drinks the shade's light and blooms a deep, living brown. The cavern floor grows warm."
    - type: dialog
      text: "Far above, the rot in the soil begins to loosen its grip. The sages by the crescent lake will feel it."
# === end ERT-D ===
