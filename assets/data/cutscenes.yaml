    - type: fade_out
      duration: 700
    - type: set_flag
      flag: AIRSHIP_RAISED
    - type: set_vehicle
      vehicle: airship
      map: overworld
      x: 149
      y: 162
    - type: fade_in
      duration: 700
    - type: dialog
