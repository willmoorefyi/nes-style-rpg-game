# ═══ CUTSCENE SCRIPTS ═══
# Each cutscene is a sequence of steps executed by CutsceneManager.
# Step types: dialog, fade_out, fade_in, wait, set_flag, heal_party,
#   warp (map, and entrance or x and y; optional facing), backdrop (image: a background id, or null to clear;
#   optional dim: a brightness multiplier in (0, 1], default 1)
# Played after a boss battle (scriptedEncounters.postVictoryCutscene) or after talking to an NPC (npc.cutscene).

# The opening (N2): played by the party-creation scene after the names are chosen, over staged battle backgrounds
# (assets/backgrounds/<id>.webp). It ends on black, as the field fade-in expects.
- id: opening
  steps:
    - type: fade_out
      duration: 500
    - type: backdrop
      image: dark_forest
      # U16: the staged forest is sunny (mean luma 112); dimmed and cooled, it reads as a world veiled in darkness
      dim: 0.35
    - type: fade_in
      duration: 800
    - type: dialog
      text: "The world is veiled in darkness. The winds stop, the seas rage, and the earth decays."
    - type: dialog
      text: "Their only hope is a prophecy: \"When the world is in darkness, four Warriors of Light will come.\""
    - type: fade_out
      duration: 600
    - type: backdrop
      image: grassland
    - type: fade_in
      duration: 800
    - type: dialog
      text: "After a long journey, four young warriors reach the gates of Cornelia, each holding a darkened orb."
    - type: fade_out
      duration: 600
    - type: backdrop
      image: null

# T2: the princess speaks while she is still on the map (captive_princess hides once PRINCESS_RESCUED is set); the
# flag, the heal and the warp happen while the screen is black, and the party arrives in the throne room facing the
# King (cornelia-castle-2f entrance throne_return, just below him). Talking to him then plays act1_complete.
- id: garland_defeated
  steps:
    - type: dialog
      text: "Garland falls, and the princess is free!"
    - type: dialog
      text: "Princess Liora: Thank you, Warriors of Light! Please, take me home to my father."
    - type: fade_out
      duration: 600
    - type: set_flag
      flag: PRINCESS_RESCUED
    - type: heal_party
    - type: dialog
      text: "The party rests on the road home: HP and spell charges are restored, and the fallen are revived."
    - type: warp
      map: cornelia-castle-2f
      entrance: throne_return
      facing: up
    - type: fade_in
      duration: 600
    - type: dialog
      text: "Princess Liora is home at last. Speak to the King."

# ═══ PASS W ANCHORS (docs/WORLD_PLAN.md 5.1, 5.5) ═══
# Each tranche adds its records only between its own pair of lines, so the merges never conflict.
# === W1-B (pass W: owned by W1-B) ===
# === end W1-B ===
# === A1-O (pass W: owned by A1-O) ===
# The end of act 1 (rewritten by A1-O, WORLD_PLAN 4.1): played once when the King is told of the rescue. He orders the
# north bridge rebuilt, and ox-carts of stone set out over a fade (INTRO_COMPLETE). The builders lay the last span
# when the party reaches the strait (a1_bridge_finished).
- id: act1_complete
  steps:
    - type: dialog
      text: "King: Summon the masons! The north bridge shall stand again before these warriors need it."
    - type: fade_out
      duration: 800
    - type: dialog
      text: "Through the night, ox-carts of cut stone rumble down the north road toward the strait."
    - type: set_flag
      flag: INTRO_COMPLETE
    - type: fade_in
      duration: 800
    - type: dialog
      text: "King: Take what my daughter would give you, then go to the strait. My builders will be waiting."
# S1: the foreman at the south stub (overworld_consts.BRIDGE_WORKERS) lays the last span once the party carries the
# princess's lute: the hammers ring over a fade, then BRIDGE_BUILT (the patch north_bridge lays the deck over the gap).
- id: a1_bridge_finished
  steps:
    - type: dialog
      text: "Foreman: Right, lads, the King's warriors are here! Last span, and lively!"
    - type: fade_out
      duration: 600
    - type: dialog
      text: "Hammers ring out over the strait. Planks swing down on ropes, and the masons wedge the last stone home."
    - type: set_flag
      flag: BRIDGE_BUILT
    - type: wait
      duration: 300
    - type: fade_in
      duration: 600
    - type: dialog
      text: "Foreman: There she stands, shore to shore. Mind the fresh mortar on the north end."
# S7: Matoya sets the crystal back in its socket, sees her cave again, and pays for it with the herb that wakes the
# elf prince (matoya-cave; the NPC needs crystal_eye, this script takes it and gives the herb).
- id: a1_matoya_sight
  steps:
    - type: dialog
      text: "Matoya: Give it here, quick! ... Mm. Cold as a well-stone, and just as clear."
    - type: take_item
      item: crystal_eye
    - type: fade_out
      duration: 400
    - type: wait
      duration: 300
    - type: fade_in
      duration: 400
    - type: dialog
      text: "Matoya: Shelves! Jars! And the dust on them, shameful. Brooms, you heard nothing."
    - type: give_item
      item: herb
    - type: set_flag
      flag: A1_O_HERB_GIVEN
    - type: dialog
      text: "Matoya: Here, for your trouble: the Herb. Crush it under a sleeper's nose and no curse holds them. Received the Herb."
# === end A1-O ===
# === A1-T (pass W: owned by A1-T) ===
# S2 (WORLD_PLAN 4.1): Bikke's nine are beaten at the brig pier (pravoka, the scripted encounter on the captain). He
# hands over the brig, his crew rows away over a fade, and BIKKE_DEFEATED is set: the pirates leave the town, the
# dockhands come back, and the ship spawn at the a1_pravoka dock (the overworld quay) appears.
- id: a1_bikke_yields
  steps:
    - type: dialog
      text: "Bikke: Enough! Enough. I know when a wind has turned, and this one's blowing straight at me."
    - type: dialog
      text: "Bikke: The brig is yours. Fast, dry, and she answers the helm like a dog to a whistle. Treat her better than I did."
    - type: fade_out
      duration: 600
    - type: dialog
      text: "The pirates gather their bundles and slink off along the cliff path. Behind shutters all over town, people start to cheer."
    - type: set_flag
      flag: BIKKE_DEFEATED
    # the town reloads behind the fade: the crew is gone, the dockhands are back, and Bikke waits on the high street
    - type: warp
      map: pravoka
      x: 26
      y: 35
      facing: down
    - type: wait
      duration: 300
    - type: fade_in
      duration: 600
    - type: dialog
      text: "Bikke: She's moored at the quay outside the gate. Step aboard from the shore and the sea is yours."
# === end A1-T ===
# === ELF-O (pass W: owned by ELF-O) ===
# S6 (docs/WORLD_PLAN.md 4.2, D-W14): Astos's postVictoryCutscene on western-keep-2f. The battle's flag sets
# ASTOS_DEFEATED; the crystal eye comes only from here, and its last line points the party to Matoya (S7).
# S6: the false king takes the crown (western-keep-2f's `false_king`, behind the crown); ELF_O_CROWN_GIVEN hides him
# and shows Astos on the same cell (the warp reloads the floor so he stands there), whom the party then talks to.
- id: elf_o_crown_taken
  steps:
    - type: take_item
      item: crown
    - type: dialog
      text: "He sets the crown on his brow, and his smile grows too wide for his face."
    - type: dialog
      text: "King: Such service deserves a reward. Here, drink to your king."
    - type: give_item
      item: ether
    - type: set_flag
      flag: ELF_O_CROWN_GIVEN
    - type: fade_out
      duration: 500
    - type: warp
      map: western-keep-2f
      entrance: boss
      facing: up
    - type: fade_in
      duration: 500
    - type: dialog
      text: "The candles gutter. When they steady, the man on the throne is no longer quite a man."
- id: elf_astos_unmasked
  steps:
    - type: dialog
      text: "The false king's borrowed face slides off like a wet mask. Beneath it, a dark elf crumbles into ash."
    - type: dialog
      text: "The stone sentinels fall still, and the second throne's glass shows only an empty chair."
    - type: set_flag
      flag: ASTOS_DEFEATED
    - type: give_item
      item: crystal_eye
    - type: dialog
      text: "In the ash lies a crystal, cold and clear as an eye. Whoever it was stolen from must be blind without it."
    - type: dialog
      text: "A witch keeps a cave in the forests north of Cornelia's bridge. Her stolen sight may be what this is."
# === end ELF-O ===
# === ELF-T (pass W: owned by ELF-T) ===
# S8 (docs/WORLD_PLAN.md 4.2): the sleeping prince in elfheim-castle-chamber, behind `requiredItem: herb` (GT-9).
# Matoya's herb is taken, the prince wakes over a fade and gives the Mystic Key; PRINCE_AWAKE is the NPC's onceFlag.
- id: elf_prince_wakes
  steps:
    - type: dialog
      text: "You crush a leaf of Matoya's herb under the prince's nose. Its smell is sharp as a slap."
    - type: take_item
      item: herb
    - type: fade_out
      duration: 500
    - type: set_flag
      flag: PRINCE_AWAKE
    - type: give_item
      item: mystic_key
    # the warp reloads the chamber behind the fade, so the woken prince (showIf PRINCE_AWAKE) stands by his bier
    - type: warp
      map: elfheim-castle-chamber
      x: 7
      y: 5
      facing: up
    - type: wait
      duration: 400
    - type: fade_in
      duration: 500
    - type: dialog
      text: "Prince: ...That smell. Who has been burning nettles in my room? And why is everyone crying?"
    - type: dialog
      text: "Prince: A year? Astos's gift box, then. I remember the lid, and then nothing. You came all this way for me?"
    - type: dialog
      text: "Prince: Take my key. It opens the living gate to the vault below the hall. Received the Mystic Key."
# === end ELF-T ===
# === ELF-D (pass W: owned by ELF-D) ===
# S5: the postVictoryCutscene of the Marsh Cave guard (marsh-cave-b3, npc elf_d_bier, piscodemon x3); it gives the
# crown (D-W14) and points the party at the Western Keep on the arm.
- id: elf_d_crown
  steps:
    - type: dialog
      text: "The last keeper sinks back into the fog and does not rise. The braziers catch again, one by one."
    - type: set_flag
      flag: MARSH_GUARD_DEFEATED
    - type: give_item
      item: crown
    - type: dialog
      text: "The crown is light, cold, and furred with marsh-rot. Under the green, the silver is worked with reeds."
    - type: dialog
      text: "The bier's carving says it belongs to whoever rules the keep. The keep on the northern arm waits for one."
# === end ELF-D ===
# === ERT-O (pass W: owned by ERT-O) ===
# S10: Nerrick takes the TNT (dwarf-hall, npc ert_nerrick, requiredItem tnt) and blasts the isthmus saddle; the patch
# `canal` opens on CANAL_OPEN. There is no shake step, so the blast is a dialog line over a short black fade.
- id: ert_canal_blast
  steps:
    - type: dialog
      text: "Nerrick packs the elven powder into the bore holes with his own hands, humming an old digging song."
    - type: take_item
      item: tnt
    - type: dialog
      text: "Nerrick: \"Out of the saddle, all of you! Hands over your ears!\""
    - type: fade_out
      duration: 300
    - type: dialog
      text: "A roar rolls through the hall. Dust pours from every beam, and far off, water thunders."
    - type: set_flag
      flag: CANAL_OPEN
    - type: wait
      duration: 400
    - type: fade_in
      duration: 700
    - type: dialog
      text: "Nerrick: \"The sea is through! Sail west by the cut and you'll reach the open water, and Melmond past it.\""
# S12: the giant (giant-tunnel, npc ert_giant, requiredItem ruby, hideIf TITAN_FED) eats the ruby and clears the throat.
- id: ert_giant_feast
  steps:
    - type: dialog
      text: "You hold out the ruby. The giant pinches it from your palm, as delicately as a man taking a cherry."
    - type: take_item
      item: ruby
    - type: dialog
      text: "Crunch. A long, warm sigh fills the tunnel. \"Good. GOOD. Now sleep.\""
    - type: fade_out
      duration: 500
    - type: set_flag
      flag: TITAN_FED
    - type: wait
      duration: 400
    - type: fade_in
      duration: 600
    - type: dialog
      text: "The giant has squeezed himself into a niche in the wall, snoring. The way west is open."
# S12: Sarda (sage-cave, npc ert_sarda) gives the rod once VAMPIRE_DEFEATED is set.
- id: ert_sarda_rod
  steps:
    - type: dialog
      text: "Sarda lifts a rod of black, root-twisted wood down from its pegs above his reading floor."
    - type: dialog
      text: "Sarda: \"Deep in the Cavern of Earth a seal of stone bars the lower halls. This rod alone will break it.\""
    - type: give_item
      item: rod
    - type: set_flag
      flag: ERT_O_ROD_GIVEN
    - type: dialog
      text: "Sarda: \"Go down past the seal and end what waits in the cold. Then the land may heal.\""
# S31 (optional): Smyth (dwarf-hall, npc ert_smyth, requiredItem adamant) forges the sword from the sky ore.
- id: ert_smyth_forge
  steps:
    - type: dialog
      text: "Smyth weighs the ore in both hands, then feeds his forge until the hall glows white."
    - type: take_item
      item: adamant
    - type: fade_out
      duration: 600
    - type: dialog
      text: "All night the anvil rings. No dwarf in the hall sleeps, and none complains."
    - type: fade_in
      duration: 600
    - type: give_item
      item: excalibur
    - type: set_flag
      flag: ERT_O_SWORD_FORGED
    - type: dialog
      text: "Smyth: \"There. Swing it once and you'll know. I'll not make its like again.\""
# === end ERT-O ===
# === ERT-T (pass W: owned by ERT-T) ===
# S25: Dr. Unne (melmond-house-unne, npc ert_unne, requiredItem slab, onceFlag LUFENIAN_LEARNED) reads the slab back
# from the sea and teaches the party the Lufenians' letters. The slab is taken by the take_item step (an NPC takeItem
# would take it before the cutscene could check for it, as with ERT-O's Nerrick).
- id: ert_unne_lesson
  steps:
    - type: dialog
      text: "Dr. Unne lays the tablet on his reading table and brushes the sea-salt out of the letters with a feather."
    - type: take_item
      item: slab
    - type: dialog
      text: "Unne: \"Every stroke is still there. Sit, all of you. Today you learn to read like a Lufenian.\""
    - type: fade_out
      duration: 500
    - type: dialog
      text: "Hours go by. Unne traces each sign, sounds it out and makes you say it back until your tongues ache."
    - type: set_flag
      flag: LUFENIAN_LEARNED
    - type: wait
      duration: 400
    - type: fade_in
      duration: 600
    - type: dialog
      text: "Unne: \"There. You could read their elder's letters now, or argue with him. Mind you only read them.\""
    - type: dialog
      text: "Unne: \"Their village is on a mesa in the far north-east. Only something that flies will get you there.\""
# === end ERT-T ===
# === ERT-D (pass W: owned by ERT-D) ===
# S11 (docs/WORLD_PLAN.md 4.3, D-W14): the vampire's postVictoryCutscene on cavern-earth-b3. The battle's flag sets
