    - type: set_flag
      flag: VAMPIRE_DEFEATED
    - type: give_item
      item: ruby
    - type: dialog
      text: "Among the folds lies a stone as red as an ember. It is warm, and it beats faintly, like something alive."
    - type: dialog
      text: "Somewhere in the range west of Melmond, they say, a giant blocks the only road. Giants eat stones."
