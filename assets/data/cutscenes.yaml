# ═══ CUTSCENE SCRIPTS ═══
# Each cutscene is a sequence of steps executed by CutsceneManager.
# Step types: dialog, fade_out, fade_in, wait, set_flag, heal_party,
#   warp (map, and entrance or x and y; optional facing), backdrop (image: a background id, or null to clear;
#   optional dim: a brightness multiplier in (0, 1], default 1)
# Played after a boss battle (scriptedEncounters.postVictoryCutscene) or after talking to an NPC (npc.cutscene).

# The opening (N2): played by the party-creation scene after the names are chosen, over staged battle backgrounds
# (assets/backgrounds/<id>.webp). It ends on black, as the field fade-in expects.
- id: opening
  steps:
    - type: fade_out
      duration: 500
    - type: backdrop
      image: dark_forest
      # U16: the staged forest is sunny (mean luma 112); dimmed and cooled, it reads as a world veiled in darkness
      dim: 0.35
    - type: fade_in
      duration: 800
    - type: dialog
      text: "The world is veiled in darkness. The winds stop, the seas rage, and the earth decays."
    - type: dialog
      text: "Their only hope is a prophecy: \"When the world is in darkness, four Warriors of Light will come.\""
    - type: fade_out
      duration: 600
    - type: backdrop
      image: grassland
    - type: fade_in
      duration: 800
    - type: dialog
      text: "After a long journey, four young warriors reach the gates of Cornelia, each holding a darkened orb."
    - type: fade_out
      duration: 600
    - type: backdrop
      image: null

# T2: the princess speaks while she is still on the map (captive_princess hides once PRINCESS_RESCUED is set); the
# flag, the heal and the warp happen while the screen is black, and the party arrives in the throne room facing the
# King (cornelia-castle-2f entrance throne_return, just below him). Talking to him then plays act1_complete.
- id: garland_defeated
  steps:
    - type: dialog
      text: "Garland falls, and the princess is free!"
    - type: dialog
      text: "Princess Liora: Thank you, Warriors of Light! Please, take me home to my father."
    - type: fade_out
      duration: 600
    - type: set_flag
      flag: PRINCESS_RESCUED
    - type: heal_party
    - type: dialog
      text: "The party rests on the road home: HP and spell charges are restored, and the fallen are revived."
    - type: warp
      map: cornelia-castle-2f
      entrance: throne_return
      facing: up
    - type: fade_in
      duration: 600
    - type: dialog
      text: "Princess Liora is home at last. Speak to the King."

# ═══ PASS W ANCHORS (docs/WORLD_PLAN.md 5.1, 5.5) ═══
# Each tranche adds its records only between its own pair of lines, so the merges never conflict.
# === W1-B (pass W: owned by W1-B) ===
# === end W1-B ===
# === A1-O (pass W: owned by A1-O) ===
# The end of act 1 (rewritten by A1-O, WORLD_PLAN 4.1): played once when the King is told of the rescue. He orders the
# north bridge rebuilt, and ox-carts of stone set out over a fade (INTRO_COMPLETE). The builders lay the last span
# when the party reaches the strait (a1_bridge_finished).
- id: act1_complete
  steps:
    - type: dialog
      text: "King: Summon the masons! The north bridge shall stand again before these warriors need it."
    - type: fade_out
      duration: 800
    - type: dialog
      text: "Through the night, ox-carts of cut stone rumble down the north road toward the strait."
    - type: set_flag
      flag: INTRO_COMPLETE
    - type: fade_in
      duration: 800
    - type: dialog
      text: "King: Take what my daughter would give you, then go to the strait. My builders will be waiting."
# S1: the foreman at the south stub (overworld_consts.BRIDGE_WORKERS) lays the last span once the party carries the
# princess's lute: the hammers ring over a fade, then BRIDGE_BUILT (the patch north_bridge lays the deck over the gap).
- id: a1_bridge_finished
  steps:
    - type: dialog
      text: "Foreman: Right, lads, the King's warriors are here! Last span, and lively!"
    - type: fade_out
      duration: 600
    - type: dialog
      text: "Hammers ring out over the strait. Planks swing down on ropes, and the masons wedge the last stone home."
    - type: set_flag
      flag: BRIDGE_BUILT
    - type: wait
      duration: 300
    - type: fade_in
      duration: 600
    - type: dialog
      text: "Foreman: There she stands, shore to shore. Mind the fresh mortar on the north end."
# S7: Matoya sets the crystal back in its socket, sees her cave again, and pays for it with the herb that wakes the
# elf prince (matoya-cave; the NPC needs crystal_eye, this script takes it and gives the herb).
- id: a1_matoya_sight
  steps:
    - type: dialog
      text: "Matoya: Give it here, quick! ... Mm. Cold as a well-stone, and just as clear."
    - type: take_item
      item: crystal_eye
    - type: fade_out
      duration: 400
    - type: wait
      duration: 300
    - type: fade_in
      duration: 400
    - type: dialog
      text: "Matoya: Shelves! Jars! And the dust on them, shameful. Brooms, you heard nothing."
    - type: give_item
      item: herb
    - type: set_flag
      flag: A1_O_HERB_GIVEN
    - type: dialog
      text: "Matoya: Here, for your trouble: the Herb. Crush it under a sleeper's nose and no curse holds them. Received the Herb."
# === end A1-O ===
# === A1-T (pass W: owned by A1-T) ===
# === end A1-T ===
# === ELF-O (pass W: owned by ELF-O) ===
# S6 (docs/WORLD_PLAN.md 4.2, D-W14): Astos's postVictoryCutscene on western-keep-2f. The battle's flag sets
# ASTOS_DEFEATED; the crystal eye comes only from here, and its last line points the party to Matoya (S7).
# S6: the false king takes the crown (western-keep-2f's `false_king`, behind the crown); ELF_O_CROWN_GIVEN hides him
# and shows Astos on the same cell (the warp reloads the floor so he stands there), whom the party then talks to.
- id: elf_o_crown_taken
  steps:
    - type: take_item
      item: crown
    - type: dialog
      text: "He sets the crown on his brow, and his smile grows too wide for his face."
    - type: dialog
      text: "King: Such service deserves a reward. Here, drink to your king."
    - type: give_item
      item: ether
    - type: set_flag
      flag: ELF_O_CROWN_GIVEN
    - type: fade_out
      duration: 500
    - type: warp
      map: western-keep-2f
      entrance: boss
      facing: up
    - type: fade_in
      duration: 500
    - type: dialog
      text: "The candles gutter. When they steady, the man on the throne is no longer quite a man."
- id: elf_astos_unmasked
  steps:
    - type: dialog
      text: "The false king's borrowed face slides off like a wet mask. Beneath it, a dark elf crumbles into ash."
    - type: dialog
      text: "The stone sentinels fall still, and the second throne's glass shows only an empty chair."
    - type: set_flag
      flag: ASTOS_DEFEATED
    - type: give_item
      item: crystal_eye
    - type: dialog
      text: "In the ash lies a crystal, cold and clear as an eye. Whoever it was stolen from must be blind without it."
    - type: dialog
      text: "A witch keeps a cave in the forests north of Cornelia's bridge. Her stolen sight may be what this is."
# === end ELF-O ===
# === ELF-T (pass W: owned by ELF-T) ===
# === end ELF-T ===
# === ELF-D (pass W: owned by ELF-D) ===
# === end ELF-D ===
