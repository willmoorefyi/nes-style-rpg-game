# ═══ CUTSCENE SCRIPTS ═══
# Each cutscene is a sequence of steps executed by CutsceneManager.
# Step types: dialog, fade_out, fade_in, wait, set_flag, heal_party,
#   warp (map, and entrance or x and y; optional facing), backdrop (image: a background id, or null to clear;
#   optional dim: a brightness multiplier in (0, 1], default 1)
# Played after a boss battle (scriptedEncounters.postVictoryCutscene) or after talking to an NPC (npc.cutscene).

# The opening (N2): played by the party-creation scene after the names are chosen, over staged battle backgrounds
# (assets/backgrounds/<id>.webp). It ends on black, as the field fade-in expects.
- id: opening
  steps:
    - type: fade_out
      duration: 500
    - type: backdrop
      image: dark_forest
      # U16: the staged forest is sunny (mean luma 112); dimmed and cooled, it reads as a world veiled in darkness
      dim: 0.35
    - type: fade_in
      duration: 800
    - type: dialog
      text: "The world is veiled in darkness. The winds stop, the seas rage, and the earth decays."
    - type: dialog
      text: "Their only hope is a prophecy: \"When the world is in darkness, four Warriors of Light will come.\""
    - type: fade_out
      duration: 600
    - type: backdrop
      image: grassland
    - type: fade_in
      duration: 800
    - type: dialog
      text: "After a long journey, four young warriors reach the gates of Cornelia, each holding a darkened orb."
    - type: fade_out
      duration: 600
    - type: backdrop
      image: null

# T2: the princess speaks while she is still on the map (captive_princess hides once PRINCESS_RESCUED is set); the
# flag, the heal and the warp happen while the screen is black, and the party arrives in the throne room facing the
# King (cornelia-castle-2f entrance throne_return, just below him). Talking to him then plays act1_complete.
- id: garland_defeated
  steps:
    - type: dialog
      text: "Garland falls, and the princess is free!"
    - type: dialog
      text: "Princess Liora: Thank you, Warriors of Light! Please, take me home to my father."
    - type: fade_out
      duration: 600
    - type: set_flag
      flag: PRINCESS_RESCUED
    - type: heal_party
    - type: dialog
      text: "The party rests on the road home: HP and spell charges are restored, and the fallen are revived."
    - type: warp
      map: cornelia-castle-2f
      entrance: throne_return
      facing: up
    - type: fade_in
      duration: 600
    - type: dialog
      text: "Princess Liora is home at last. Speak to the King."

# The end of act 1: played once when the King is told of the rescue (BRIDGE_BUILT stays unset until the
# bridge-building scene exists).
- id: act1_complete
  steps:
    - type: fade_out
      duration: 800
    - type: dialog
      text: "The King's builders set to work on the bridge to the north."
    - type: dialog
      text: "Congratulations! You have completed the introduction."
    - type: dialog
      text: "Your journey will continue once the bridge to the north is rebuilt..."
    - type: set_flag
      flag: INTRO_COMPLETE
    - type: fade_in
      duration: 800

