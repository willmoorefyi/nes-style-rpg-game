  steps:
    - type: dialog
      text: "The Sovereign's crown cracks across. Frost pours off his plate like smoke and sinks into the floor."
    - type: set_flag
      flag: EARTH_CAVE_COMPLETE
    - type: dialog
      text: "Rime Sovereign: My kingdom... was it still there? I kept it so long that I forgot to look."
    - type: fade_out
      duration: 500
    - type: warp
