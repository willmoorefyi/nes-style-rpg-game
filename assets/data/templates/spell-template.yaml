# ═══ SPELL TEMPLATE ═══
# Copy this block to add a new spell.
# Add the spell ID to magic shop inventories in shops.yaml.
# Run `npm run validate` to check references.

# ── Damage spell ────────────────────────────────────────────
- id: fir3                   # Unique lowercase ID
  name: FIR3                 # Display name (FF1 uses 4-char abbreviations)
  level: 5                   # Spell level 1-8 (determines charge pool)
  type: black                # white | black
  effect: damage             # Effect type (see list below)
  targeting: all             # single | all | self
  description: Deal fire damage to all enemies
  power: 60                  # Damage/heal amount. 0 for buff/status spells.
  element: fire              # Element for damage calc. Valid: fire, ice, lightning,
                             # earth, holy, dark, water, wind, none

# ── Heal spell ──────────────────────────────────────────────
- id: cur3
  name: CUR3
  level: 5
  type: white
  effect: heal
  targeting: single
  description: Restore 120 HP to one ally
  power: 120
  element: none

# ── Status spell ────────────────────────────────────────────
- id: hold
  name: HOLD
  level: 2
  type: black
  effect: status_paralysis   # status_<name> — applies that status effect
  targeting: single
  description: Paralyze one enemy
  power: 0
  element: none

# ── Buff spell ──────────────────────────────────────────────
- id: fast
  name: FAST
  level: 3
  type: white
  effect: buff_speed         # buff_<stat> — raises that stat
  targeting: single
  description: Raise speed of one ally
  power: 0
  element: none

# ═══ EFFECT TYPES ═══
# damage         — deal elemental damage (uses power + element)
# damage_holy    — deal holy damage (for HARM-type spells)
# heal           — restore HP (uses power)
# revive         — revive fallen ally with 1 HP
# status_sleep   — inflict sleep
# status_blind   — inflict blindness
# status_silence — inflict silence
# status_death   — instant death
# status_poison  — inflict poison
# status_stun    — inflict stun
# buff_defense   — raise defense
# buff_evade     — raise evasion
# buff_attack    — raise attack
# buff_speed     — raise speed
# debuff_evade   — lower evasion
# debuff_speed   — lower speed
# cure_blind     — cure blindness
# resist_lightning — grant lightning resistance
