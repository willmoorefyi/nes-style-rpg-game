# The bestiary (docs/BESTIARY_PLAN.md 3.4). Stats come from enemies.yaml; this file holds the mode, the loop timing,
# the habitat scan, the backgrounds and every label and template the bestiary shows (ASCII only: the NES font).
mode: all                    # all | seen (seen: enemies not met yet list as "???")
order: data                  # data: by the spec number `num` (enemies.yaml order without one); hook for name | level later
listRows: 6
habitats:
  maps: [overworld, temple-of-fiends]     # compiled map ids scanned (every map with encounters must be listed)
  zones: {east_pocket: East pocket, temple_approach: Temple approach}
backgrounds:
  default: grassland
  enemies: {garland: temple, lich: shoreline, vampire: abandoned_castle, dragon: desert, pirate: shoreline, cockatrice: forest,
    # roster pass R (ROSTER_PLAN 7.3): by habitat, committed staged ids only; grassland ones use the default
    black_widow: forest, werewolf: dark_forest, zombie: evil_temple, ghoul: marsh, lizard: desert, sahagin: ocean,
    sahagin_chief: ocean, shark: ocean, bigeyes: ocean, red_piranha: ocean, white_shark: ocean, buccaneer: shoreline,
    tarantula: marsh, ghast: marsh,
    scorpion: desert, shadow: marsh, green_slime: marsh, crawler: marsh, gray_ooze: marsh, bloodbones: marsh,
    piscodemon: marsh, gargoyle: abandoned_castle, astos: abandoned_castle, wraith: cave, anaconda: swamp,
    lesser_tiger: forest, minotaur: cave, hill_gigas: cave, earth_elemental: cave, wight: cave, ochre_jelly: cave,
    ogre_mage: cave, sphinx: desert, ankheg: cave, crocodile: river, white_crocodile: river, ochu: swamp, neochu: swamp,
    horned_devil: cave, pyrolisk: cave, fire_elemental: cave, fire_hydra: cave, lava_worm: cave, hellhound: cave,
    fire_lizard: cave, fire_gigas: cave, ashen_queen: evil_temple, white_dragon: cave, winter_wolf: cave,
    mindflayer: cave, ice_gigas: cave, specter: cave, remorazz: cave, dark_wizard: cave, evil_eye: cave,
    desert_baretta: desert, sabertooth: forest, wyrm: cave, manticore: desert, dragon_zombie: abandoned_castle,
    drowned_sovereign: ocean, warmech: abandoned_castle, hollow_seraph: temple, death_eye: temple, chaos: evil_temple,
    baretta: desert, basilisk: cave, allosaurus: forest, weretiger: forest, sand_worm: desert, minotaur_zombie: cave,
    king_mummy: temple, medusa: ocean, rakshasa: cave, clay_golem: cave, nightmare: dark_forest,
    sahagin_prince: ocean, deepeyes: ocean, sea_snake: ocean, sea_scorpion: shoreline, sea_troll: shoreline,
    ghost: abandoned_castle, water_elemental: shoreline, water_naga: ocean, tyrannosaur: forest,
    black_knight: abandoned_castle, chimera: desert, guardian: temple, blue_dragon: temple, green_dragon: swamp,
    stone_golem: temple, air_elemental: temple, spirit_naga: temple, death_knight: evil_temple, earth_medusa: cave,
    black_flan: marsh, soldier: temple, vampire_lord: abandoned_castle, dark_fighter: evil_temple, rhyos: cave,
    purple_worm: cave, iron_golem: temple,
    lich_2: evil_temple, ashen_queen_2: evil_temple, drowned_sovereign_2: evil_temple, hollow_seraph_2: evil_temple}
