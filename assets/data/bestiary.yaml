  heat: Heat, blizzard: Blizzard Breath, frost: Frost, trance: Mind Blast, glance: Glance, stare: Stare,
  stinger: Poison Stinger, crack: Earthquake, thunder: Thunder Breath, poison: Poison Breath, nuclear: Nuclear,
  glare: Time Gaze, inferno: Inferno, swirl: Tsunami, tornado: Tornado, snorting: Snort, flash: Flash,
