# Party kits per class (docs/FIX_PLAN_PENINSULA.md T4 §1.5, §4; docs/FEEDBACK_PLAN_2026-11-14.md §3.2):
# kit -> class id -> { gear: [item ids], spells: [spell ids] }. Read by tests/helpers/balanceData.ts (balance tests)
# and, later, the debug sandbox. Potions are not part of a kit: the callers pass them (the balance tests use
# KIT_POTIONS in balanceData.ts; the sandbox levels have `items`).
#
# start:  the 400 G starting kit per base class. The Red Mage starts with no spell: with one, a party of the three
#         mages and a Warrior would pass 400 G.
# lv2:    what the pass-F gold buys by whole-party Lv 2 (§3.2): the start kit + LIT for the Black Mage (100 G);
#         the balance tests add 2 potions (120 G), 220 G of the median 246 G in hand.
# arrive: the lv2 kit + the temple chest's Cap on the warrior (`found`; the party arriving at Garland after the
#         temple run; + 2 potions). Pass EQ (R1): FF1 Cornelia sells no Wooden Shield and no Cap.
# full:   + chain mail, the temple Cap (warrior), LIT, SLEP, RUSE (the balance tests add 3 potions).
# `found` (pass EQ D-EQ11): chest gear equipped after `gear`, replacing its slot's item; never priced.
# naked:  no gear and no spells.
