# The macro-geography anchors of pass NW (docs/NATURAL_WORLD_PLAN.md 4.2, 2.2), re-fitted by NW-1 for the 256x256
# world. It replaces assets/data/world-anchors.yaml at the cutover (NW-5); until then the verifier reads it with
# `npm run quest -- --strict --maps <scratch compile> --anchors assets-src/maps-nw/world-anchors.yaml`.
#
# Targets: CORNELIA_NW (146, 155) + s* x ref for every anchor outside act 1 (s* = 0.86, worldgen/spec.target);
# act 1's four are its pins, today's cells + (54, 44) (spec.a1_pin). `ref` (classic tiles from Cornelia, east +x,
# south +y) is unchanged from pass W. A region tranche may move a pin inside the +-2 window only.
# At these targets the fitted s* = 0.847 (at NW-0's nudged pins 0.851); every pair is in
# its bands. 20,000 random +-2 placements of the 20 non-act-1 anchors (act 1's pins fixed): 0 fail (0.0 %);
# with act 1's four moved too: 11.125 % (cornelia-temple's bearing, as today's file at 8.2 %, and
# pravoka-matoya's distance). The full 31-pair table is in docs/NATURAL_WORLD_PLAN.md, "NW-1 result".
tolerance: 2
fit:
  scale: [0.75, 0.95]                   # s* = sum(d_w * d_r) / sum(d_r^2) over the pairs, distance-exempt pairs out
  longPair: 23                          # a pair is long when s* x d_r >= 23 world cells (20 x 0.86 / 0.735)
  ratio: {long: [0.70, 1.30], short: [0.55, 1.60]}       # r = d_w / (s* x d_r)
  bearing: {long: 40, short: 60}        # max error in compass degrees, min(|d|, 360 - |d|); every pair is checked
# NW2 (docs/NW2_EDITS_PLAN.md D-NW2-1, D-NW2-12): the one source of the hike bounds, read by the composer
# (world_specs/common.hike(): the `landings` and `hikes` checks) and the verifier (questLateData: T6's landingNear).
# floor K: no landing within K steps of a hike site (foot+canoe); cap U: a landing within U steps of every
# airship-only anchor, BFS in its mode (`sites`; an anchor not listed walks).
hike:
  floor: 25
  cap: 50
  sites: {wat_onrac: walking, wat_waterfall: canoe, wat_caravan: walking, wnd_mirage: walking, wnd_lufenia: walking}
anchors:
  - {name: cornelia, entrance: cornelia, place: "Cornelia, south-gate arrival", region: a1, owner: NW-3, built: true,
     ref: [0, 0], target: [146, 155], note: "CORNELIA_NW (2.2); act 1's pins are today's cells relative to it, delta (+54, +44)"}
  - {name: temple, entrance: temple, place: "Temple of Fiends door", region: a1, owner: NW-3, built: true,
     ref: [-20, -36], target: [133, 147], note: "act-1 pin; distance exempt (act-1 compression); bearing checked"}
  - {name: matoya, entrance: a1_matoya, place: "Matoya's cave", region: a1, owner: NW-3,
     ref: [-40, -36], target: [128, 120], note: "act-1 pin, north-north-west of the Temple as today"}
  - {name: pravoka, entrance: a1_pravoka, place: "Pravoka's land gate", region: a1, owner: NW-3,
     ref: [56, -12], target: [185, 145], note: "act-1 pin; pravoka-matoya r 0.742 at the targets (>= 0.72: no exemption, 4.2)"}
  - {name: dwarf, entrance: ert_dwarf, place: "Dwarf hall (Mount Duergar)", region: earth, owner: NW2-E,
     ref: [-54, -40], target: [100, 121], note: "NW2 ruling D-NW2-5 (docs/NW2_EDITS_PLAN.md 5): moved north of the canal into the mainland's west lobe; was ref [-56, -4], target [98, 152]"}
