npcs:
- id: ferryman_hint
  sprite: old_man
  x: 22
  y: 37
  dialog:
  - condition: CANOE_GIVEN
    text: ['The sages gave you their canoe? Then you''ll not need my ferry, nor the causeway, nor my advice.', 'Mind you, I''ll give the advice anyway: rivers bite. Paddle with your eyes open.']
  - condition: EARTH_CRYSTAL_LIT
    text: ['The sages have been on their feet all week, they say. Something stirred in their stones.', Walk the causeway south and ask them yourselves. They answer warriors before they answer me.]
  - text: ['Out on the islet sit the sages, twelve of them, in a ring of standing stones.', 'The causeway starts here. Walk it to the end and you''ll find them, if they let themselves be found.']
  tint: '#8ca0b4'
- id: geologist_hint
  sprite: black_wizard
  x: 46
  y: 18
  dialog:
  - condition: CANOE_GIVEN
    text: ['A canoe! Take it down the south river and you''ll reach the foot of Gurgu, the volcano.', 'Bring me back a cooled cinder if you can. Bring yourselves back, more to the point.']
  - condition: EARTH_CRYSTAL_LIT
    text: ['The volcano south of the ring has woken: Gurgu, the old fire mountain. I felt it through my boots.', 'No road crosses the ring. Only the rivers run through it, out of the lake.']
  - text: ['South of the mountain ring stands Gurgu, a volcano that has slept as long as this town has stood.', Lately its smoke leans the wrong way. I write it down. Writing it down is what we do here.]
- id: gate_warden
  sprite: guard
  x: 4
  y: 18
  dialog:
  - condition: CANOE_GIVEN
    text: ['Off on the water, are you? The town will miss its most interesting visitors in a decade.']
  - condition: EARTH_CRYSTAL_LIT
    text: ['The harbour boats say the earth stopped trembling under Melmond. Your doing? The sages will want you.']
  - text: ['Welcome to Crescent Lake. We''ve no wall: the terraces and the water keep us, and the scholars keep quiet.']
  tint: '#7890a8'
- id: fisher
  sprite: farmer
  x: 49
  y: 17
  dialog:
  - condition: CANOE_GIVEN
    text: ['Your canoe went out past the landing this morning. Light as a leaf, that boat. Sages build well.']
  - condition: EARTH_CRYSTAL_LIT
    text: [The lake's gone warm along the south shore. The fish swim north to get away from it.]
  - text: [The lake fish taste of iron this year. The sages say it's the earth rotting under the far country.]
- id: lens_grinder
  sprite: burgher
  x: 32
  y: 22
  dialog:
  - condition: CANOE_GIVEN
    text: [I ground a new lens for the observatory. Now it can watch you paddle all the way to the ring.]
  - condition: EARTH_CRYSTAL_LIT
    text: ['Hot winds off the south, cold ones off the hollow. My lenses fog both ways.']
  - text: ['Lenses, spectacles, burning glasses. A town of readers is a town of squinters.']
- id: apprentice
  sprite: mage
  x: 30
  y: 8
  dialog:
  - condition: CANOE_GIVEN
    text: [The master says your canoe's track on the lake is the brightest thing she saw all night. She was joking.]
  - condition: EARTH_CRYSTAL_LIT
    text: [We turned the big tube south last night. The volcano's glow lit the clouds from beneath.]
  - text: ['The astronomer charts the stars, and I chart the astronomer''s moods. Both turn slowly.']
  tint: '#b4a0c8'
- id: pupil_a
  sprite: villager
  x: 6
  y: 9
  dialog:
  - condition: CANOE_GIVEN
    text: ['Today''s lesson was rivers. I already knew: you just get in a canoe and go!']
  - condition: EARTH_CRYSTAL_LIT
    text: [The tutor gave us a test on the four crystals. I got the earth one right!]
  - text: [The tutor says the earth is sick. I asked if it needs soup. She said that's not funny.]
  wander: true
- id: pupil_b
  sprite: villager_f
  x: 18
  y: 9
  dialog:
  - condition: CANOE_GIVEN
    text: [I'm going to be a sage when I grow up. Then I'll build my own canoe.]
  - condition: EARTH_CRYSTAL_LIT
    text: [The tutor is cross because nobody can see the volcano from the classroom. We tried.]
  - text: [Shh. If you're loud on the Star Walk the archivist puts your name in a book.]
- id: night_watcher
  sprite: old_man
  x: 43
  y: 8
  dialog:
  - condition: CANOE_GIVEN
    text: [From up here I saw your canoe cross the whole lake. Like a needle through blue cloth.]
  - condition: EARTH_CRYSTAL_LIT
    text: ['Smoke by day in the south, a white mist in the hollow beside it. Two omens. The sages like omens in pairs.']
  - text: [I count the lights on the lake at night. Fewer every year. The world grows dim at the edges.]
- id: student_a
  sprite: villager
  x: 22
  y: 14
  dialog:
  - condition: CANOE_GIVEN
    text: ['They say the sages kept that canoe forty years for the right hands. Were they yours?']
  - condition: EARTH_CRYSTAL_LIT
    text: ['Ever since the earth crystal shone again, the sages argue about fire. Loudly. Sages are never loud.']
  - text: ['I came to study the stars. The sages make us study rot instead: rot in the roots, rot in the stone.']
- id: student_b
  sprite: villager_f
  x: 27
  y: 14
  dialog:
  - condition: CANOE_GIVEN
    text: [I copied the prophecy out twelve times for my exam. Now I've seen the people in it.]
  - condition: EARTH_CRYSTAL_LIT
    text: ['Fire beneath and frost beside it. I wrote that down from a sage, and now I can''t stop thinking it.']
  - text: [The well water tastes of earth this year. Not good earth. The sour kind.]
  wander: true
- id: gardener
  sprite: farmer
  x: 24
  y: 22
  dialog:
  - condition: CANOE_GIVEN
    text: ['Roses bloom on the terraces again. The canoe has nothing to do with it, but I''m happy anyway.']
  - condition: EARTH_CRYSTAL_LIT
    text: [My roses perked up the very day the earth crystal shone. I don't ask why. I water.]
  - text: [Half my roses died this spring. The soil's grey a hand down. I've never seen the like.]
- id: pilgrim_a
  sprite: monk
  x: 38
  y: 22
  dialog:
  - condition: CANOE_GIVEN
    text: [I walked here to see the Circle. I've stayed to see what the four of you do next.]
  - condition: EARTH_CRYSTAL_LIT
    text: [Pilgrims come from every coast to the hostel now. The sages say the world is turning.]
  - text: [I walked three months to sit by the Circle. They let me sit on the causeway. It's a start.]
  tint: '#c8b48c'
- id: pilgrim_b
  sprite: white_mage
  x: 42
  y: 21
  dialog:
  - condition: CANOE_GIVEN
    text: [Go well on the water. I'll pray for the rivers to be kind to your canoe.]
  - condition: EARTH_CRYSTAL_LIT
    text: ['I prayed at the stones for the earth, and the earth answered. Now I pray about the fire.']
  - text: ['I pray at the edge of the lake for the earth. The lake doesn''t answer, but it listens.']
  tint: '#d0c8b8'
- id: boat_girl
  sprite: villager_f
  x: 41
  y: 26
  dialog:
  - condition: CANOE_GIVEN
    text: ['Father helped tar your canoe''s seams. If it leaks, he says, blame the sages.']
  - condition: EARTH_CRYSTAL_LIT
    text: [Father's mending every hull in the boathouse. He says the lake folk will travel again soon.]
  - text: ['Father builds boats, but nobody buys. Where would they sail? The rivers run into the ring and stop.']
- id: old_scholar
  sprite: white_wizard
  x: 16
  y: 30
  dialog:
  - condition: CANOE_GIVEN
    text: [A canoe in the right hands opens half a continent. I'd write that down if I weren't so old.]
  - condition: EARTH_CRYSTAL_LIT
    text: ['Fire and frost, the sages say now. I liked it better when the trouble was a long way off.']
  - text: [Forty years I've sat on this bench thinking about the earth. It has never been this ill.]
- id: reader
  sprite: mage
  x: 25
  y: 29
  dialog:
  - condition: CANOE_GIVEN
    text: ['I''m reading about canoes. It''s the town''s favourite subject this week, thanks to you.']
  - condition: EARTH_CRYSTAL_LIT
    text: ['A history of the volcano, two hundred pages. It erupts on page four and never stops.']
  - text: [A book on the blight of the earth. It's very thorough. It ends badly.]
  wander: true
- id: child
  sprite: villager
  x: 12
  y: 28
  dialog:
  - condition: CANOE_GIVEN
    text: ['Can I sit in your canoe? Just once? I''ll be good!']
  - condition: EARTH_CRYSTAL_LIT
    text: ['The boatwright says one day there''ll be boats on every river. Can I have one?']
  - text: [I throw stones in the lake to see how far the ripples go. Far! Much farther than me.]
  wander: true
- id: novice
  sprite: mage
  x: 19
  y: 34
  dialog:
  - condition: CANOE_GIVEN
    text: [The elder rarely gives anything away. He gave you the canoe and smiled. I saw it.]
  - condition: EARTH_CRYSTAL_LIT
    text: [The Circle sits awake by night now. The novices bring them tea and say nothing. That is the rule.]
  - text: [The Circle is fasting for the sick earth. The novices fast too. I'm thinking about bread very hard.]
  tint: '#a0b4a0'
