npcs:
- id: castle_door_guard_w
  sprite: guard
  x: 28
  y: 19
  dialog: [The castle of Cornelia. The King receives travellers in the throne room upstairs.]
- id: castle_door_guard_e
  sprite: guard
  x: 32
  y: 19
  dialog:
  - condition: PRINCESS_RESCUED
    text: [Her Highness rode in through this very gate., I will tell my grandchildren I stood guard that day!]
  - text: ['I keep watch on the castle gate, day and night.', No one has crossed this bridge unseen since Garland rode out.]
- id: inner_gate_guard
  sprite: guard
  x: 28
  y: 33
  dialog: [Beyond this gate are the castle gardens. Mind the moat!]
- id: guard
  sprite: guard
  x: 33
  y: 50
  wander: true
  dialog:
  - condition: PRINCESS_RESCUED
    text: [The princess is safe., 'Thank you, Warriors of Light!']
  - text: [The princess has been kidnapped!, 'Garland took her to the Temple of Fiends, north-west of here.']
- id: south_gate_guard
  sprite: guard
  x: 28
  y: 66
  dialog: ['Welcome to Cornelia, the royal city.', The castle stands at the top of the high street.]
- id: old_man
  sprite: old_man
  x: 26
  y: 44
  wander: true
  dialog:
  - condition: INTRO_COMPLETE
    text: [They say the King's builders are mending the bridge to the north., Seek the four crystals across the land.]
  - text: [The four crystals have gone dark., Only the Warriors of Light can restore them.]
- id: villager
  sprite: villager
  x: 34
  y: 45
  wander: true
  dialog: [Buy spells early. Garland is no easy foe!]
- id: market_vendor_w
  sprite: merchant
  x: 24
  y: 41
  dialog: [Fresh apples from the royal orchard!, '...Sorry, these are not for adventurers.']
- id: market_vendor_e
  sprite: merchant
  x: 37
  y: 41
  dialog: ['Bread and cheese, the finest in Cornelia!']
- id: townswoman
  sprite: villager_f
  x: 44
  y: 49
  wander: true
  dialog: [The river runs right through the city., My grandmother says it once flooded the market square!]
- id: gardener
  sprite: villager
  x: 5
  y: 23
  wander: true
  dialog: [I tend the royal orchard., The princess loved to read under these trees.]
- id: mage_student
  sprite: mage
  x: 9
  y: 55
  wander: true
  dialog: ['White magic heals, black magic harms.', A wise party carries both.]
- id: fisher
  sprite: old_man
  x: 38
  y: 64
  dialog: [The fish bite best where the river bends.]
- id: east_gate_guard
  sprite: guard
  x: 56
  y: 46
  dialog: [The east road leads around the bay.]
- id: postern_guard
  sprite: guard
  x: 8
  y: 3
  dialog: [This postern lets the gardeners out to the fields., Watch for wolves past the orchard.]
- id: garden_maid
  sprite: villager_f
  x: 42
  y: 25
  wander: true
  dialog:
  - condition: PRINCESS_RESCUED
    text: [Her Highness is home at last! I will cut her the first roses.]
  - text: [I tend the roses for Her Highness., I hope she comes home before they fade.]
