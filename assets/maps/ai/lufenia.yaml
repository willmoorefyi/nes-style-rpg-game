npcs:
- id: lufenia_gatewarden
  sprite: guard
  x: 16
  y: 27
  dialog:
  - condition: LUFENIAN_LEARNED
    text: ['You read our letters now? Then the doctor in Melmond kept his word to us.', 'Be welcome on the mesa, travellers. Few climb up here who are not carried by the wind.']
  - text: ['Ae''lun soveth, ira tal''qessen.']
  tint: '#dfe6f5'
- id: lufenia_mirage_hint
  sprite: old_man
  x: 13
  y: 16
  dialog:
  - condition: CHIME_GIVEN
    text: [You carry the chime. Ring it before the Mirage's inner door and the tower will let you climb.]
  - condition: LUFENIAN_LEARNED
    text: ['North and west of the mesa, out in the sands, stands the Mirage Tower.', 'Its door has no lock and no handle. It answers to one note only, and our elder keeps the bell that sounds it.']
  - text: ['Hru omaine vey, sallatir. Ka''vel?']
  tint: '#dfe6f5'
- id: lufenia_cube_hint
  sprite: mage
  x: 21
  y: 16
  dialog:
  - condition: LUFENIAN_LEARNED
    text: [The top of the Mirage is not the end of the road. Our makers rode a beam of light from there to the sky., 'To ride it you need a warp cube. The makers built a keeper for theirs, behind a waterfall
        far to the west.']
  - text: ['Quessa lo, quessa lo! Nai thrim.']
  tint: '#dfe6f5'
- id: lufenia_orrery_tender
  sprite: luf_senator
  x: 18
  y: 13
  dialog:
  - condition: LUFENIAN_LEARNED
    text: [This orrery has followed the four lights for six hundred years without one error., This year the wind light stopped turning. We oil it every morning. It does not help.]
  - text: ['Iveth an-sorai, vel tunnemar.']
- id: lufenia_lens_grinder
  sprite: luf_citizen_m
  x: 10
  y: 14
  dialog:
  - condition: LUFENIAN_LEARNED
    text: [I grind lenses for the sky-glasses. Without them we would not have seen the castle at all., 'Some nights it hangs right over the mesa, black against the stars. It used to shine.']
  - text: ['Osk''ra paleth, marrun ei sedd.']
  wander: true
- id: lufenia_weaver
  sprite: luf_citizen_f
  x: 24
  y: 14
  dialog:
  - condition: LUFENIAN_LEARNED
    text: [We dress in white so the wind can find us. It has not come looking for a long time.]
  - text: ['Tiel vasso? Tiel vasso an''dur.']
  wander: true
- id: lufenia_child
  sprite: villager
  x: 15
  y: 22
  dialog:
  - condition: CHIME_GIVEN
    text: ['You''re going up there, aren''t you? Bring me back a feather from a sky bird!']
  - condition: LUFENIAN_LEARNED
    text: [Grandmother says our people came down from the sky in a boat made of light., 'I want to go back up. Will you take me? No? Then tell me what it looks like.']
  - text: ['Vaelin, vaelin... horu sae''qat.']
  tint: '#dfe6f5'
- id: lufenia_archivist
  sprite: luf_senator
  x: 8
  y: 17
  dialog:
  - condition: LUFENIAN_LEARNED
    text: ['Every word we write is copied twice, once in stone and once in the stars'' order.', 'When Melmond''s doctor came he copied our alphabet onto a stone slab. Was it you who brought it back?']
  - text: [Emmerai! Lun dosk paravi.]
- id: lufenia_shepherd
  sprite: farmer
  x: 27
  y: 16
  dialog:
  - condition: LUFENIAN_LEARNED
    text: [The mesa goats graze the moor below the domes. They do not like the silence any more than we do.]
  - text: ['Sorr tal''iquen, avesh mor.']
  tint: '#dfe6f5'
  wander: true
- id: lufenia_bellwright
  sprite: master
  x: 25
  y: 27
  dialog:
  - condition: CHIME_GIVEN
    text: [So the chime has gone with you. Mind it on the road. I am too old to cast another.]
  - condition: LUFENIAN_LEARNED
    text: ['I cast the elder''s chime anew every hundred years, from the same bronze.', 'It must never be rung in town. Here it only hums, as if it remembered the tower.']
  - text: ['Ka''thera ulun, si ven doloth.']
  tint: '#dfe6f5'
- id: lufenia_watcher
  sprite: luf_citizen_m
  x: 11
  y: 25
  dialog:
  - condition: LUFENIAN_LEARNED
    text: [I keep the tally of falling stars. Last month there were none. None at all., The sky is waiting for something. Perhaps for you.]
  - text: ['Pell''e an-myrr, sathi.']
- id: lufenia_gardener
  sprite: luf_citizen_f
  x: 28
  y: 25
  dialog:
  - condition: LUFENIAN_LEARNED
    text: [Moon-lilies only open in a breeze. Mine have been shut since spring.]
  - text: [Uvo... uvo restal ka'nem.]
  wander: true
