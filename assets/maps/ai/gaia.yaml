  text: ['The sign reads: "GAIA. Four terraces, one way up. Mind the bridges in a gust."', 'Below, in older paint: "Gate terrace: the Inn, items, arms, armour. Mill terrace: the magic shops. Loom terrace:
      the healer. Top: the spring."']
- x: 20
  y: 5
  text:
  - condition: FAIRY_FREED
    text: ['The wooden arrow spins on its spindle into the wind, then swings back the other way, as if it cannot decide where to point first.']
  - text: ['A tall post topped with a wooden arrow: the town''s weather vane. Its spindle is clean and oiled.', 'It points at nothing in particular, and it has pointed there for a year.']
- x: 30
  y: 18
  text: ['The tall house is shuttered. A slate hangs on the door, chalked in a careful hand:', '"Wind-reader''s house. No wind to read. Gone down the mountain to look for it. - Ilse"']
- x: 35
  y: 39
  text: ['A stone well-head on the lip of the gorge. Its windlass rope runs down to the torrent far below, and a dripping bucket hangs from it.', 'Somebody has scratched a tally on the post: one stroke
      for every bucket hauled since the spring went dry.']
