npcs:
- id: chest_grotto
  sprite: chest
  x: 15
  y: 45
  chestItem: diamond_armlet
  chestFlag: CHEST_ORD_O_GROTTO
  dialog: [You found a Diamond Armlet!]
- id: bahamut
  sprite: bahamut
  x: 54
  y: 7
  hideIf: CLASS_UPGRADED
  requiredItem: ordeal_seal
  cutscene: {id: ord_bahamut_trial, onceFlag: CLASS_UPGRADED}
  action: classUpgrade
  actionFlag: CLASS_UPGRADED
  dialog:
  - condition: item:ordeal_seal
    text: ['Bahamut: That seal is cut from the citadel''s own door. You climbed it, then. Lay it here.']
  - text: ['Bahamut: Little ones, in my hall, and empty-handed.', 'Bahamut: On the plateau to the west stands a citadel that tests whoever climbs it. Bring me its seal and I will name you as you deserve.']
- id: bahamut_after
  sprite: bahamut
  x: 54
  y: 7
  showIf: CLASS_UPGRADED
  dialog: ['Bahamut: Your new names fit you. Wear them where the light has gone out of the world.']
- id: dragon_ember
  sprite: dragon_guard
  x: 46
  y: 15
  dialog:
  - condition: CLASS_UPGRADED
    text: [I can smell the change on you from across the hall. You burn hotter now.]
  - text: [I keep the door of this hall. Stare at the horns if you must; every guest does. Mind the claws instead.]
- id: dragon_moss
  sprite: dragon_elder
  x: 50
  y: 11
  dialog:
  - condition: CLASS_UPGRADED
    text: ['You held it, and you let it go. That is the part the builders never understood.']
  - text: [The citadel was built by people who wanted proof of courage they could hold in a hand. Bahamut humours them.]
- id: ord_cd_herald
  sprite: dragon_guard
  x: 60
  y: 11
  dialog:
  - condition: CLASS_UPGRADED
    text: [The court has not rung with that much talk in a hundred years. You have given the old ones a season of it.]
  - text: [Bow or do not; he has outlived every bow. Speak plainly to him. He likes that better.]
- id: dragon_storm
  sprite: dragon_guard
  x: 21
  y: 11
  dialog:
  - condition: CLASS_UPGRADED
    text: ['Go well. When the four lights are lit again, come and tell us how the sky looks.']
  - text: [Hatchlings dream of flying through the clouds above the plateau. The old ones dream of quiet.]
- id: ord_cd_roostmaster
  sprite: dragon_guard
  x: 30
  y: 12
  dialog:
  - condition: CLASS_UPGRADED
    text: [You smell of the citadel's dust. The young ones will want to hear every stair of it.]
  - text: ['Every perch here is worn to the shape of one claw. When a dragon dies, nobody else sits there.']
- id: ord_cd_flier
  sprite: dragon_youth
  x: 16
  y: 13
  dialog: ['The north stair comes up under a ledge on the cold islet. We go out at dawn, before the gulls are awake.']
  wander: true
- id: ord_cd_steward
  sprite: dragon_elder
  x: 24
  y: 28
  dialog:
  - condition: CLASS_UPGRADED
    text: [Walk where you like. A named one is no guest here any longer.]
  - text: ['This is the Wyrmhall. Every road under the isles meets here: the roosts to the north, the court beyond the Processional, the hatchery east, the market south, the grotto and the vaults to the
        west.']
- id: ord_cd_mason
  sprite: dragon_youth
  x: 37
  y: 29
  dialog: ['I carve the scales on the walls, one a day. The elders say I may stop when the wall is finished. It is round.']
- id: ord_cd_hint_citadel
  sprite: dragon_guard
  x: 31
  y: 33
  dialog:
  - condition: CLASS_UPGRADED
    text: [The Citadel's guardian has finally been let rest. We felt it in the stone.]
  - text: ['The seal Bahamut asks for lies at the top of the Citadel of Trials, on the high plateau west of here. Fly; nothing walks there.']
- id: dragon_frost
  sprite: dragon_elder
  x: 5
  y: 24
  dialog:
  - condition: CLASS_UPGRADED
    text: ['If you brought down the old guardian, then it can rest. Thank you for that.']
  - text: [The guardian in the citadel was one of us once. It forgot when to stop guarding.]
- id: ord_cd_archivist
  sprite: dragon_sage
  x: 8
  y: 29
  dialog:
  - condition: CLASS_UPGRADED
    text: ['I will remember you. You are a short story, but a good one.']
  - text: [We keep no books. Each elder remembers one century and tells it to the next. I am the year of the first eclipse.]
- id: ord_cd_sleeper
  sprite: dragon_sage
  x: 3
  y: 31
  dialog: ['...He has been asleep since the sea was a hand''s breadth lower.']
- id: ord_cd_eggwarden
  sprite: dragon_matron
  x: 56
  y: 29
  dialog:
  - condition: CLASS_UPGRADED
    text: [One of the eggs turned toward you when you came in. They know a change when they feel one.]
  - text: ['Mind the channel. The rock under the isles is warm, and the eggs need every bit of it.']
- id: ord_cd_hatchling
  sprite: dragon_hatchling
  x: 63
  y: 30
  dialog: [I hatched in the spring! I can almost breathe a spark.]
  wander: true
- id: ord_cd_chick
  sprite: dragon_hatchling
  x: 55
  y: 35
  dialog: [My sister is still in her shell. She is slow. Do not knock; she bites.]
- id: ord_cd_pearl
  sprite: dragon_matron
  x: 23
  y: 42
  dialog: ['Pearls for scales, scales for fish. We trade among ourselves; your gold would only be something to sleep on.']
- id: ord_cd_baker
  sprite: dragon_matron
  x: 33
  y: 42
  dialog: ['Ember-bread, baked on the vent stones. You would break a tooth. Dragons are not built for crumbs.']
- id: ord_cd_gossip
  sprite: dragon_youth
  x: 28
  y: 46
  dialog:
  - condition: CLASS_UPGRADED
    text: [Tell Oddo the nets can wait. A named one's friend is a friend of the hall.]
  - text: [The hermit on the middle isle swears he owes us nothing. He owes us four nets and an anchor.]
  wander: true
- id: dragon_tide
  sprite: dragon_youth
  x: 9
  y: 45
  dialog:
  - condition: CLASS_UPGRADED
    text: [The tide will carry the news of you to every shore. That is how dragons gossip.]
  - text: [We came here when the sea still remembered the sky. Bahamut came first.]
- id: dragon_ash
  sprite: dragon_youth
  x: 6
  y: 54
  dialog:
  - condition: CLASS_UPGRADED
    text: ['Do not touch the gold. Now that you are named, I would have to argue.']
  - text: ['I sleep on the gold. Not for greed. It is warm, and it does not argue.']
- id: ord_cd_counter
  sprite: dragon_elder
  x: 9
  y: 55
  dialog: ['Four thousand and six crowns, one silver spoon. I count it each morning. It has never once changed.']
- id: ord_cd_gatewarden
  sprite: dragon_guard
  x: 45
  y: 44
  dialog:
  - condition: CLASS_UPGRADED
    text: ['Go up any stair you like. Your ship of the air will wait where you left it, mind.']
  - text: ['You came down the Sea Gate, from the king''s own isle. Every islet has its stair, and every stair ends here, under the one roof.']
- id: ord_cd_porter
  sprite: dragon_youth
  x: 48
  y: 41
  dialog:
  - condition: CLASS_UPGRADED
    text: [Named ones go up the stair first. Tradition again. I did not make it up.]
  - text: [I carry the salt up from the Sea Gate. Nobody asked for salt. I carry it anyway; it is tradition.]
