npcs:
- id: pirate_gate
  sprite: guard
  tint: '#c86450'
  x: 2
  y: 36
  hideIf: BIKKE_DEFEATED
  dialog: ['Pirate: Welcome to Pravoka, friends. Captain''s town now.', 'Pay at the shops, sleep at the inn, and don''t go near the brig. Simple rules.']
- id: pirate_quay_n
  sprite: villager
  tint: '#8c7a64'
  x: 29
  y: 18
  hideIf: BIKKE_DEFEATED
  dialog: ['Pirate: Those warehouses are the Captain''s strongroom now. Every crate in them is ours by right.', 'By right of being here first with cutlasses, that is.']
- id: pirate_quay_s
  sprite: guard
  tint: '#b4c8dc'
  x: 30
  y: 30
  hideIf: BIKKE_DEFEATED
  dialog: ['Pirate: No boat leaves this fjord without the Captain''s leave.', The fishers asked. You can see how far it got them.]
- id: pirate_den_a
  sprite: villager
  tint: '#c86450'
  x: 18
  y: 34
  hideIf: BIKKE_DEFEATED
  dialog: ['Pirate: That''s our den behind me. The door''s nailed shut because the last owner kept knocking.']
- id: pirate_den_b
  sprite: guard
  tint: '#8c7a64'
  x: 21
  y: 35
  hideIf: BIKKE_DEFEATED
  dialog: ['Pirate: Nine of us, the Captain counted. Nobody in this town is fool enough to count higher.']
- id: pirate_pier
  sprite: villager
  tint: '#b4c8dc'
  x: 33
  y: 33
  hideIf: BIKKE_DEFEATED
  dialog: ['Pirate: Off the pier, landlubber. The Captain''s at the end of it, and he''s in a mood.', 'Mind you, he''s always in a mood.']
- id: pirate_inn
  sprite: guard
  tint: '#c86450'
  x: 27
  y: 26
  hideIf: BIKKE_DEFEATED
  dialog: ['Pirate: The innkeeper gives us the best beds for nothing. Out of kindness, he says.']
  wander: true
- id: bikke
  sprite: warrior
  tint: '#a03c3c'
  x: 40
  y: 33
  hideIf: BIKKE_DEFEATED
  dialog: ['Bikke: So you''re the ones the town has been whispering about. Warriors, they say.', 'I took this harbour with eight blades, my own the ninth, and a fast hull. If you want it back, you''ll pay
      in blood.']
- id: bikke_after
  sprite: warrior
  x: 26
  y: 36
  dialog: ['Bikke: The brig is yours, and I keep my word. She''s tied at the quay outside the town.', 'Board her from the land and she''ll take you anywhere the sea goes. She won''t climb a mountain, mind.']
  tint: '#a03c3c'
  showIf: BIKKE_DEFEATED
- id: old_sailor_hint
  sprite: old_man
  x: 36
  y: 27
  dialog:
  - condition: BIKKE_DEFEATED
    text: ['Now there''s a ship free, you could sail to Elfheim, the elves'' city.', 'South down the channel, then west along the coast. The elves have a prince who will not wake, they say.']
  - text: ['I sailed to Elfheim forty times before these pirates came. I''ll not see it again, I think.', 'South down the channel, west along the coast. A week with a fair wind. If anyone held a ship.']
- id: herbwife_hint
  sprite: vendor_f
  x: 24
  y: 39
  dialog:
  - condition: BIKKE_DEFEATED
    text: [Matoya's broth is the only cure for what ails the deep sleepers. That's what my mother said., 'She lives in a cave in the woods, far to the north-west, over the pass. Blind as a stone, poor thing.']
  - text: ['Herbs, dried and fresh! Not much else to sell with the pirates eating everything.', 'If it''s a real cure you want, ask Matoya. She keeps a cave in the north-west woods, over the pass.']
- id: fishwife
  sprite: vendor_f
  x: 20
  y: 39
  dialog:
  - condition: BIKKE_DEFEATED
    text: [Fresh fish again! The boats went out this morning for the first time in a month.]
  - text: ['Fish? I''ve three herrings and a sorry crab. The boats can''t put out past the pier.']
  tint: '#a0c0d8'
- id: fisher
  sprite: villager
  x: 33
  y: 27
  dialog:
  - condition: BIKKE_DEFEATED
    text: ['Listen to that: oars! The whole fleet''s out. Pravoka breathes again.']
  - text: [The pirates let me fish off the pier. Generous. The fish off the pier are this long.]
- id: dockhand_a
  sprite: farmer
  x: 30
  y: 22
  dialog: ['Dockhand: Crates back where they belong, and wages paid in coin, not in threats. A good week.']
  showIf: BIKKE_DEFEATED
- id: dockhand_b
  sprite: burgher
  x: 38
  y: 20
  dialog: ['Dockhand: Old Hennick''s warehouse is open again. They hid half the town''s grain in there.']
  showIf: BIKKE_DEFEATED
- id: lamplighter
  sprite: villager
  x: 15
  y: 28
  dialog:
  - condition: BIKKE_DEFEATED
    text: ['Every lamp on Lantern Street lit, and nobody to blow them out for a laugh. Lovely.']
  - text: [I light the lamps at dusk. The pirates blow them out. I light them again. It passes the evening.]
  wander: true
- id: watchman
  sprite: guard
  x: 16
  y: 10
  dialog:
  - condition: BIKKE_DEFEATED
    text: ['Town watch! Er, we were biding our time. Waiting for the right moment. Which you found. Well done.']
  - text: [The town watch is on duty. Quietly. Out of sight of the quay.]
- id: girl
  sprite: villager_f
  x: 8
  y: 26
  dialog:
  - condition: BIKKE_DEFEATED
    text: [My father works the warehouse again. He brought me a sugared fig!]
  - text: [The pirate captain has a cutlass taller than me. I saw it. I'm not scared. Much.]
  wander: true
- id: old_man
  sprite: old_man
  x: 25
  y: 4
  dialog:
  - condition: BIKKE_DEFEATED
    text: ['Look there: the lighthouse will burn again tonight. Ships will find the fjord.']
  - text: [From this bench you can see the whole fjord. Not one sail on it. Not since the brig came.]
