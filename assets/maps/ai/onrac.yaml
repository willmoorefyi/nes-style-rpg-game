  y: 27
  requiredItem: oxyale
  permanent: false
  message:
  - condition: item:fairy_bottle
    text: ['The shipwright calls from the walkway: "That bottle! Something inside it is knocking to get out."', '"Take it to Gaia''s spring and open it there. Bring me back the air of the deep, and she
        sails."']
  - text: ['The shipwright bars the gangway: "Not without air for the deep, friend. My hull holds, your lungs won''t."', '"They say the fairies of Gaia''s spring breathe a living air, oxyale. Bring me that
        and we dive."']
