# ═══ NPCs (treasure chests) ═══
npcs:
  - id: chest_potion
    x: 3
    y: 6
    sprite: chest
    dialog: ["You found a Potion!"]
    chestItem: potion
    chestFlag: CHEST_TOF_POTION

  - id: chest_antidote
    x: 12
    y: 6
    sprite: chest
    dialog: ["You found an Antidote!"]
    chestItem: antidote
    chestFlag: CHEST_TOF_ANTIDOTE

  - id: chest_cap
    x: 1
    y: 11
    sprite: chest
    dialog: ["You found a Cap!"]
    chestItem: cap
    chestFlag: CHEST_TOF_CAP

  - id: chest_rapier
    x: 14
    y: 11
    sprite: chest
    dialog: ["You found a Rapier!"]
    chestItem: rapier
    chestFlag: CHEST_TOF_RAPIER

# ═══ MAP TRANSITIONS ═══
transitions:
  # Entrance back to overworld
  - x: 7
    y: 15
    targetMap: overworld
    targetX: 8
    targetY: 3
  - x: 8
    y: 15
    targetMap: overworld
    targetX: 9
    targetY: 3

# ═══ RANDOM ENCOUNTERS ═══
encounterRate:
  min: 8
  max: 15
encounters:
  - enemies: [skeleton]
    weight: 3
  - enemies: [goblin, goblin]
    weight: 3
  - enemies: [skeleton, goblin]
    weight: 2
  - enemies: [wolf, wolf]
    weight: 2
  - enemies: [pirate]
    weight: 1

# ═══ SCRIPTED ENCOUNTERS ═══
scriptedEncounters:
  - x: 7
    y: 1
    enemyIds: [garland]
    flag: GARLAND_DEFEATED
    isBoss: true
    message: "Garland: I, Garland, will knock you all down!"
    postVictoryCutscene: garland_defeated
